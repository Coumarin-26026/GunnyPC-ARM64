name: Build Gunny PC ARM64 + Ruffle - Intel Structure
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  APP_NAME: Gunny PC
  ELECTRON_VERSION: 43.2.0
  RUFFLE_VERSION: 0.4.1
  GUNNY_URL: https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b
jobs:
  build:
    name: Build ARM64 from Intel structure
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install tools
      shell: bash
      run: 'set -euo pipefail


        npm install --global @electron/asar


        node --version

        asar --version

        gh --version'
    - name: Prepare
      shell: bash
      run: 'set -euo pipefail


        rm -rf build release


        mkdir -p build release'
    - name: Download Gunny Intel
      shell: bash
      run: "set -euo pipefail\n\ncurl \\\n  --fail \\\n  --location \\\n  --retry\
        \ 10 \\\n  --retry-delay 5 \\\n  --connect-timeout 30 \\\n  --max-time 1800\
        \ \\\n  -A \"Mozilla/5.0\" \\\n  \"$GUNNY_URL\" \\\n  -o build/gunny-intel.zip\n\
        \nfile build/gunny-intel.zip\nls -lh build/gunny-intel.zip"
    - name: Extract Gunny
      shell: bash
      run: "set -euo pipefail\n\nmkdir -p build/original\n\nunzip \\\n  -q \\\n  -o\
        \ \\\n  build/gunny-intel.zip \\\n  -d build/original\n\nrm -rf build/original/__MACOSX\n\
        \nAPP=\"$(\n  find build/original \\\n    -type d \\\n    -name \"*.app\"\
        \ \\\n    -print \\\n    | head -n 1\n)\"\n\nif [ -z \"$APP\" ]; then\n  echo\
        \ \"ERROR: Gunny .app not found.\"\n  exit 1\nfi\n\nprintf '%s\\n' \"$APP\"\
        \ > build/original-app.txt\n\necho \"Original app:\"\ncat build/original-app.txt"
    - name: Inspect original Pepper Flash
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"$(cat build/original-app.txt)\"\n\nPEPPER=\"\
        $APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer\"\
        \n\nif [ -f \"$PEPPER\" ]; then\n  file \"$PEPPER\"\n  lipo -info \"$PEPPER\"\
        \ || true\nelse\n  echo \"WARNING: PepperFlashPlayer.plugin not found.\"\n\
        fi"
    - name: Extract app.asar
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"$(cat build/original-app.txt)\"\n\nrm -rf build/source\n\
        \nasar extract \\\n  \"$APP/Contents/Resources/app.asar\" \\\n  build/source"
    - name: Locate main.js
      shell: bash
      run: "set -euo pipefail\n\nMAIN=\"$(\n  find build/source \\\n    -type f \\\
        \n    -name \"main.js\" \\\n    -print \\\n    | while IFS= read -r FILE;\
        \ do\n        if grep -q \\\n          -E \\\n          \"findFlashPath|PepperFlashPlayer|function\
        \ createGameWindow|BrowserWindow\" \\\n          \"$FILE\" \\\n          2>/dev/null\n\
        \        then\n          echo \"$FILE\"\n          break\n        fi\n   \
        \   done\n)\"\n\nif [ -z \"$MAIN\" ]; then\n  echo \"ERROR: Gunny main.js\
        \ not found.\"\n  exit 1\nfi\n\nprintf '%s\\n' \"$MAIN\" > build/main-path.txt\n\
        \necho \"main.js:\"\ncat build/main-path.txt"
    - name: Locate original game preload
      shell: bash
      run: "set -euo pipefail\n\nMAIN=\"$(cat build/main-path.txt)\"\n\necho \"==========================================\"\
        \necho \"LOCATE ACTUAL GAME PRELOAD\"\necho \"==========================================\"\
        \n\necho\necho \"Preload references in main.js:\"\ngrep -niE \\\n  \"preload[[:space:]]*:\"\
        \ \\\n  \"$MAIN\" \\\n  | head -120 \\\n  || true\n\necho\necho \"createGameWindow\
        \ context:\"\nsed -n \\\n  '1000,1100p' \\\n  \"$MAIN\"\n\necho\necho \"Candidate\
        \ preload files:\"\n\nfind build/source \\\n  -type f \\\n  -name \"*.js\"\
        \ \\\n  -print \\\n  | while IFS= read -r FILE; do\n\n    case \"$FILE\" in\n\
        \      */main.js)\n        continue\n        ;;\n    esac\n\n    if grep -q\
        \ \\\n      -E \\\n      \"contextBridge|ipcRenderer|flash-ready|onContent|electronAPI\"\
        \ \\\n      \"$FILE\" \\\n      2>/dev/null\n    then\n      echo \"$FILE\"\
        \n    fi\n\n  done \\\n  | sort -u \\\n  | tee build/preload-candidates.txt\n\
        \necho\necho \"Resolving preload using Python parser...\"\n\nexport MAIN\n\
        \npython3 <<'PY'\nimport os\nimport re\nfrom pathlib import Path\n\nmain =\
        \ Path(\n    os.environ[\"MAIN\"]\n)\n\nsource = main.read_text(\n    encoding=\"\
        utf-8-sig\"\n)\n\ndef matching_brace(\n    text,\n    opening\n):\n    depth\
        \ = 0\n    quote = None\n    escape = False\n\n    for index in range(\n \
        \       opening,\n        len(text)\n    ):\n        char = text[index]\n\n\
        \        if quote:\n            if escape:\n                escape = False\n\
        \            elif char == \"\\\\\":\n                escape = True\n     \
        \       elif char == quote:\n                quote = None\n            continue\n\
        \n        if char in (\n            \"'\",\n            '\"',\n          \
        \  chr(96)\n        ):\n            quote = char\n            continue\n\n\
        \        if char == \"{\":\n            depth += 1\n\n        elif char ==\
        \ \"}\":\n            depth -= 1\n\n            if depth == 0:\n         \
        \       return index\n\n    return -1\n\n\nstart = source.find(\n    \"function\
        \ createGameWindow\"\n)\n\nif start < 0:\n    raise SystemExit(\n        \"\
        ERROR: createGameWindow() not found.\"\n    )\n\nopening = source.find(\n\
        \    \"{\",\n    start\n)\n\nif opening < 0:\n    raise SystemExit(\n    \
        \    \"ERROR: createGameWindow opening brace not found.\"\n    )\n\nclosing\
        \ = matching_brace(\n    source,\n    opening\n)\n\nif closing < 0:\n    raise\
        \ SystemExit(\n        \"ERROR: createGameWindow closing brace not found.\"\
        \n    )\n\ngame = source[\n    start:\n    closing + 1\n]\n\nmatch = re.search(\n\
        \    r\"\\bpreload\\s*:\\s*([\\s\\S]{0,3000})\",\n    game,\n    flags=re.IGNORECASE\n\
        )\n\nif not match:\n    raise SystemExit(\n        \"ERROR: preload property\
        \ not found inside createGameWindow().\"\n    )\n\nexpression = match.group(1)\n\
        \nexpression = re.split(\n    r\"\\n\\s*(?:nodeIntegration|contextIsolation|sandbox|plugins|devTools|webSecurity|backgroundThrottling)\\\
        s*:\",\n    expression,\n    maxsplit=1\n)[0]\n\nprint()\nprint(\n    \"Preload\
        \ expression:\"\n)\nprint(\n    expression[:3000]\n)\n\n# 1. Direct quoted\
        \ .js names.\nnames = re.findall(\n    r\"\"\"['\"]([^'\"]+\\.js)['\"]\"\"\
        \",\n    expression\n)\n\nprint()\nprint(\n    \"Quoted JS names:\",\n   \
        \ names\n)\n\n# 2. If preload points at a variable such as preloadPath,\n\
        #    resolve its assignment in the full source.\nvariables = re.findall(\n\
        \    r\"\\b([A-Za-z_$][A-Za-z0-9_$]*)\\b\",\n    expression\n)\n\ncandidate_names\
        \ = []\n\nfor variable in variables:\n    assignment = re.search(\n      \
        \  rf\"\\b(?:const|let|var)\\s+{re.escape(variable)}\\s*=\\s*([\\s\\S]{{0,1200}}?);\"\
        ,\n        source\n    )\n\n    if assignment:\n        candidate_names.extend(\n\
        \            re.findall(\n                r\"\"\"['\"]([^'\"]+\\.js)['\"]\"\
        \"\",\n                assignment.group(1)\n            )\n        )\n\n#\
        \ 3. If the expression contains app.isPackaged ternaries,\n#    scan quoted\
        \ JS names from the entire createGameWindow.\ncandidate_names.extend(\n  \
        \  re.findall(\n        r\"\"\"['\"]([^'\"]+\\.js)['\"]\"\"\",\n        game\n\
        \    )\n)\n\n# Unique, ordered.\nseen = set()\nordered = []\n\nfor name in\
        \ (\n    names +\n    candidate_names\n):\n    if name not in seen:\n    \
        \    seen.add(name)\n        ordered.append(name)\n\nroot = Path(\n    \"\
        build/source\"\n).resolve()\n\nselected = None\n\nfor name in ordered:\n \
        \   basename = Path(name).name\n\n    matches = list(\n        root.rglob(basename)\n\
        \    )\n\n    if matches:\n        # Prefer a file that is clearly a preload.\n\
        \        preload_matches = [\n            item\n            for item in matches\n\
        \            if \"preload\" in item.name.lower()\n        ]\n\n        selected\
        \ = (\n            preload_matches[0]\n            if preload_matches\n  \
        \          else matches[0]\n        )\n\n        break\n\n# 4. Fallback: inspect\
        \ candidates, but NEVER choose main.js.\nif selected is None:\n    candidate_file\
        \ = Path(\n        \"build/preload-candidates.txt\"\n    )\n\n    if candidate_file.exists():\n\
        \        for line in candidate_file.read_text(\n            encoding=\"utf-8\"\
        \n        ).splitlines():\n\n            item = Path(line.strip())\n\n   \
        \         if (\n                item.is_file() and\n                item.name\
        \ != \"main.js\"\n            ):\n                selected = item\n      \
        \          break\n\nif selected is None:\n    print()\n    print(\n      \
        \  \"ERROR: Could not resolve a separate preload file.\"\n    )\n    print()\n\
        \    print(\n        \"Full createGameWindow preload expression:\"\n    )\n\
        \    print(\n        expression\n    )\n\n    raise SystemExit(1)\n\nrelative\
        \ = selected.resolve().relative_to(\n    root\n).as_posix()\n\nPath(\n   \
        \ \"build/preload-relative.txt\"\n).write_text(\n    relative + \"\\n\",\n\
        \    encoding=\"utf-8\"\n)\n\nprint()\nprint(\n    \"Selected original game\
        \ preload:\"\n)\nprint(\n    relative\n)\nPY\n\nPRELOAD_REL=\"$(cat build/preload-relative.txt)\"\
        \n\nPRELOAD=\"$(\n  find build/source \\\n    -type f \\\n    -path \"*/$PRELOAD_REL\"\
        \ \\\n    -print \\\n    | head -n 1\n)\"\n\nif [ -z \"$PRELOAD\" ]; then\n\
        \  echo \"ERROR: selected preload file cannot be found.\"\n  exit 1\nfi\n\n\
        echo\necho \"Original game preload:\"\necho \"$PRELOAD\"\n\nnode \\\n  --check\
        \ \\\n  \"$PRELOAD\"\n\necho\necho \"Preload syntax: OK\"\n"
    - name: Inspect original Flash architecture
      shell: bash
      run: "set -euo pipefail\n\nMAIN=\"$(cat build/main-path.txt)\"\n\n{\n  echo\
        \ \"=== FLASH PATH ===\"\n\n  grep -niE \\\n    \"findFlashPath|PepperFlashPlayer|ppapi-flash-path|ppapi-flash-version|_deployFlashMmsCfg\"\
        \ \\\n    \"$MAIN\" \\\n    | head -300 \\\n    || true\n\n  echo\n  echo\
        \ \"=== GAME WINDOW ===\"\n\n  grep -n \\\n    -A100 \\\n    -B10 \\\n   \
        \ \"function createGameWindow\" \\\n    \"$MAIN\" \\\n    | head -180 \\\n\
        \    || true\n\n  echo\n  echo \"=== PRELOAD ===\"\n\n  PRELOAD_REL=\"$(cat\
        \ build/preload-relative.txt)\"\n\n  sed -n \\\n    '1,260p' \\\n    \"build/source/$PRELOAD_REL\"\
        \n\n} > build/original-flash-architecture.txt\n\ncat \\\n  build/original-flash-architecture.txt"
    - name: Download Ruffle self-hosted
      shell: bash
      run: "set -euo pipefail\n\nrm -rf build/ruffle\n\nmkdir -p build/ruffle\n\n\
        cd build/ruffle\n\ngh release download \\\n  \"v${RUFFLE_VERSION}\" \\\n \
        \ --repo ruffle-rs/ruffle \\\n  --pattern \"*web*selfhosted*.zip\" \\\n  --clobber\n\
        \nZIP=\"$(\n  find . \\\n    -maxdepth 1 \\\n    -type f \\\n    -name \"\
        *.zip\" \\\n    -print \\\n    | head -n 1\n)\"\n\nif [ -z \"$ZIP\" ]; then\n\
        \  echo \"ERROR: Ruffle web self-hosted asset not found.\"\n\n  gh release\
        \ view \\\n    \"v${RUFFLE_VERSION}\" \\\n    --repo ruffle-rs/ruffle \\\n\
        \    --json assets \\\n    --jq '.assets[].name'\n\n  exit 1\nfi\n\nmkdir\
        \ -p extracted\n\nunzip \\\n  -q \\\n  -o \\\n  \"$ZIP\" \\\n  -d extracted"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Validate Ruffle
      shell: bash
      run: "set -euo pipefail\n\nRUFFLE_JS=\"$(\n  find build/ruffle/extracted \\\n\
        \    -type f \\\n    -name \"ruffle.js\" \\\n    -print \\\n    | head -n\
        \ 1\n)\"\n\nif [ -z \"$RUFFLE_JS\" ]; then\n  echo \"ERROR: ruffle.js not\
        \ found.\"\n  find build/ruffle/extracted \\\n    -maxdepth 6 \\\n    -type\
        \ f \\\n    | sort \\\n    | head -300\n  exit 1\nfi\n\nRUFFLE_ROOT=\"$(dirname\
        \ \"$RUFFLE_JS\")\"\n\nprintf '%s\\n' \"$RUFFLE_ROOT\" > build/ruffle-root.txt\n\
        \nWASM=\"$(\n  find \"$RUFFLE_ROOT\" \\\n    -type f \\\n    -name \"*.wasm\"\
        \ \\\n    -print \\\n    | head -n 1\n)\"\n\nif [ -z \"$WASM\" ]; then\n \
        \ echo \"ERROR: Ruffle WASM not found.\"\n  exit 1\nfi\n\necho \"Ruffle root:\"\
        \ncat build/ruffle-root.txt\n\necho\necho \"ruffle.js:\"\nls -lh \"$RUFFLE_ROOT/ruffle.js\"\
        \n\necho\necho \"WASM:\"\nls -lh \"$WASM\""
    - name: Patch only game BrowserWindow
      shell: bash
      run: "set -euo pipefail\n\nMAIN=\"$(cat build/main-path.txt)\"\n\nexport MAIN\n\
        \npython3 <<'PY'\nimport os\nimport re\nfrom pathlib import Path\n\nmain =\
        \ Path(os.environ[\"MAIN\"])\n\nsource = main.read_text(\n    encoding=\"\
        utf-8-sig\"\n)\n\nstart = source.find(\n    \"function createGameWindow\"\n\
        )\n\nif start == -1:\n    raise SystemExit(\n        \"ERROR: createGameWindow()\
        \ not found.\"\n    )\n\n# Find the end of the function by balancing braces.\n\
        brace = source.find(\n    \"{\",\n    start\n)\n\nif brace == -1:\n    raise\
        \ SystemExit(\n        \"ERROR: createGameWindow opening brace not found.\"\
        \n    )\n\ndepth = 0\nquote = None\nescape = False\nend = -1\n\nfor index\
        \ in range(\n    brace,\n    len(source)\n):\n    char = source[index]\n\n\
        \    if quote:\n        if escape:\n            escape = False\n        elif\
        \ char == \"\\\\\":\n            escape = True\n        elif char == quote:\n\
        \            quote = None\n        continue\n\n    if char in (\"'\", '\"\
        ', \"`\"):\n        quote = char\n        continue\n\n    if char == \"{\"\
        :\n        depth += 1\n\n    elif char == \"}\":\n        depth -= 1\n\n \
        \       if depth == 0:\n            end = index + 1\n            break\n\n\
        if end == -1:\n    raise SystemExit(\n        \"ERROR: createGameWindow closing\
        \ brace not found.\"\n    )\n\ngame = source[start:end]\n\nif \"new BrowserWindow\"\
        \ not in game:\n    raise SystemExit(\n        \"ERROR: BrowserWindow not\
        \ found in createGameWindow().\"\n    )\n\n\n# ----------------------------------------------------------\n\
        # IMPORTANT:\n# Do NOT modify contextIsolation globally.\n#\n# Keep the original\
        \ Gunny isolation model.\n# Only force sandbox:false for the GAME window because\n\
        # the original preload and our Ruffle wrapper need Node APIs.\n# ----------------------------------------------------------\n\
        \nif re.search(\n    r\"\\bcontextIsolation\\s*:\",\n    game\n):\n    # Preserve\
        \ the original value.\n    pass\n\n\nif re.search(\n    r\"\\bsandbox\\s*:\\\
        s*true\",\n    game\n):\n    game = re.sub(\n        r\"(\\bsandbox\\s*:\\\
        s*)true\",\n        r\"\\1false\",\n        game,\n        count=1\n    )\n\
        \nelif not re.search(\n    r\"\\bsandbox\\s*:\",\n    game\n):\n    # Electron\
        \ >=20 otherwise sandboxes renderer preloads.\n    game, inserted = re.subn(\n\
        \        r\"(webPreferences\\s*:\\s*\\{)\",\n        r\"\\1\\n        sandbox:\
        \ false,\",\n        game,\n        count=1\n    )\n\n    if inserted != 1:\n\
        \        raise SystemExit(\n            \"ERROR: webPreferences block not\
        \ found.\"\n        )\n\n\n# The Intel game window used plugin support.\n\
        game = re.sub(\n    r\"(\\bplugins\\s*:\\s*)false\",\n    r\"\\1true\",\n\
        \    game,\n    count=1\n)\n\n\n# ----------------------------------------------------------\n\
        # Replace ONLY the game's preload expression.\n#\n# We keep every other BrowserWindow's\
        \ preload untouched.\n# ----------------------------------------------------------\n\
        \nold_preload = re.compile(\n    r\"\"\"\n    \\bpreload\\s*:\\s*\n    app\\\
        .isPackaged\n    \\s*\\?\\s*\n    path\\.join\\(\n        [\\s\\S]*?\n   \
        \ \\)\n    \\s*:\\s*\n    path\\.join\\(\n        [\\s\\S]*?\n    \\)\n  \
        \  \\s*,?\n    \"\"\",\n    re.IGNORECASE |\n    re.VERBOSE\n)\n\ngame, count\
        \ = old_preload.subn(\n    \"\"\"preload: path.join(\n        process.resourcesPath,\n\
        \        'preload-ruffle.js'\n      ),\"\"\",\n    game,\n    count=1\n)\n\
        \nif count != 1:\n    raise SystemExit(\n        \"ERROR: game preload expression\
        \ not found.\"\n    )\n\n\nsource = (\n    source[:start]\n    + game\n  \
        \  + source[end:]\n)\n\nmain.write_text(\n    source,\n    encoding=\"utf-8\"\
        \n)\n\nprint(\n    \"Game BrowserWindow patched successfully.\"\n)\nprint(\n\
        \    \"Preload replacements:\",\n    count\n)\nPY\n\nnode \\\n  --check \\\
        \n  \"$MAIN\"\n\necho\necho \"Patched createGameWindow:\"\ngrep -n \\\n  -A80\
        \ \\\n  -B10 \\\n  \"function createGameWindow\" \\\n  \"$MAIN\" \\\n  | head\
        \ -170"
    - name: Disable native PPAPI switches
      shell: bash
      run: "set -euo pipefail\n\nMAIN=\"$(cat build/main-path.txt)\"\nexport MAIN\n\
        \npython3 <<'PY'\nimport os\nimport re\nfrom pathlib import Path\n\nmain =\
        \ Path(os.environ[\"MAIN\"])\ns = main.read_text(encoding=\"utf-8-sig\")\n\
        \n# Disable direct PPAPI command-line switches only.\npatterns = [\n    r\"\
        \"\"\n    [A-Za-z0-9_$.\\[\\]]+\n    \\.appendSwitch\n    \\s*\\(\n    \\\
        s*['\"]ppapi-flash-path['\"]\n    \\s*,[\\s\\S]*?\n    \\)\n    \\s*;\n  \
        \  \"\"\",\n    r\"\"\"\n    [A-Za-z0-9_$.\\[\\]]+\n    \\.appendSwitch\n\
        \    \\s*\\(\n    \\s*['\"]ppapi-flash-version['\"]\n    \\s*,[\\s\\S]*?\n\
        \    \\)\n    \\s*;\n    \"\"\"\n]\n\nfor pattern in patterns:\n    s = re.sub(\n\
        \        pattern,\n        \"\",\n        s,\n        flags=re.IGNORECASE\
        \ | re.VERBOSE\n    )\n\n# Disable Flash-specific deployment call if present.\n\
        s = re.sub(\n    r\"(?m)^[ \\t]*_deployFlashMmsCfg\\s*\\([^;]*\\)\\s*;[^\\\
        n]*\\n?\",\n    \"\",\n    s\n)\n\n# Keep findFlashPath() source intact for\
        \ compatibility,\n# but make the selected native path null.\ns = re.sub(\n\
        \    r\"(\\bconst\\s+flashPath\\s*=\\s*)findFlashPath\\s*\\(\\s*\\)\\s*;\"\
        ,\n    r\"\\1null;\",\n    s,\n    count=1\n)\n\nmain.write_text(\n    s,\n\
        \    encoding=\"utf-8\"\n)\n\nprint(\n    \"Native PPAPI selection disabled.\"\
        \n)\nPY\n\nnode \\\n  --check \\\n  \"$MAIN\""
    - name: Rebuild patched app.asar
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"$(cat build/original-app.txt)\"\nASAR=\"$APP/Contents/Resources/app.asar\"\
        \n\nrm -f \"$ASAR\"\n\nasar pack \\\n  build/source \\\n  \"$ASAR\""
    - name: Download Electron ARM64
      shell: bash
      run: "set -euo pipefail\n\nURL=\"https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip\"\
        \n\ncurl \\\n  --fail \\\n  --location \\\n  --retry 10 \\\n  --retry-delay\
        \ 5 \\\n  --connect-timeout 30 \\\n  --max-time 1800 \\\n  -A \"Mozilla/5.0\"\
        \ \\\n  \"$URL\" \\\n  -o build/electron-arm64.zip\n\nmkdir -p build/electron\n\
        \nunzip \\\n  -q \\\n  -o \\\n  build/electron-arm64.zip \\\n  -d build/electron\n\
        \nELECTRON_APP=\"$(\n  find build/electron \\\n    -type d \\\n    -name \"\
        Electron.app\" \\\n    -print \\\n    | head -n 1\n)\"\n\nif [ -z \"$ELECTRON_APP\"\
        \ ]; then\n  echo \"ERROR: Electron.app not found.\"\n  exit 1\nfi\n\nprintf\
        \ '%s\\n' \"$ELECTRON_APP\" \\\n  > build/electron-app.txt\n\nBIN=\"$ELECTRON_APP/Contents/MacOS/Electron\"\
        \n\nfile \"$BIN\"\nlipo -info \"$BIN\"\n\nif ! file \"$BIN\" | grep -q \"\
        arm64\"; then\n  echo \"ERROR: Electron is not ARM64.\"\n  exit 1\nfi"
    - name: Assemble final ARM64 app
      shell: bash
      run: "set -euo pipefail\n\nORIGINAL=\"$(cat build/original-app.txt)\"\nELECTRON_APP=\"\
        $(cat build/electron-app.txt)\"\n\nFINAL=\"build/Gunny PC ARM64.app\"\n\n\
        rm -rf \"$FINAL\"\n\ncp -R \\\n  \"$ELECTRON_APP\" \\\n  \"$FINAL\"\n\nSRC=\"\
        $ORIGINAL/Contents/Resources\"\nDST=\"$FINAL/Contents/Resources\"\n\nrsync\
        \ \\\n  -a \\\n  --exclude=\"app.asar\" \\\n  \"$SRC/\" \\\n  \"$DST/\"\n\n\
        cp \\\n  \"$SRC/app.asar\" \\\n  \"$DST/app.asar\"\necho\necho \"Final app\
        \ assembled:\"\ntest -f \"$DST/app.asar\"\n\necho\necho \"Resources copied.\"\
        \n"
    - name: Install Ruffle and create preload wrapper in final app
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\nRES=\"$APP/Contents/Resources\"\
        \n\ntest -d \"$APP\"\ntest -f \"$RES/app.asar\"\n\nRUFFLE_ROOT=\"$(cat build/ruffle-root.txt)\"\
        \nPRELOAD_REL=\"$(cat build/preload-relative.txt)\"\n\nrm -rf \\\n  \"$RES/ruffle\"\
        \n\nmkdir -p \\\n  \"$RES/ruffle\"\n\ncp -R \\\n  \"$RUFFLE_ROOT\"/. \\\n\
        \  \"$RES/ruffle/\"\n\ntest -f \\\n  \"$RES/ruffle/ruffle.js\"\n\ncat > \"\
        $RES/preload-ruffle.js\" <<EOF\n'use strict';\n\nconst fs = require('fs');\n\
        const path = require('path');\n\nconst {\n  webFrame\n} = require('electron');\n\
        \nconst resources =\n  process.resourcesPath;\n\nconst ruffleDir =\n  path.join(\n\
        \    resources,\n    'ruffle'\n  );\n\nconst ruffleFile =\n  path.join(\n\
        \    ruffleDir,\n    'ruffle.js'\n  );\n\nconst originalPreload =\n  path.join(\n\
        \    resources,\n    'app.asar',\n    '$PRELOAD_REL'\n  );\n\nconsole.log(\n\
        \  '[Gunny ARM64] Ruffle wrapper starting'\n);\n\nif (!fs.existsSync(ruffleFile))\
        \ {\n  throw new Error(\n    'ruffle.js not found: ' +\n    ruffleFile\n \
        \ );\n}\n\nif (!fs.existsSync(originalPreload)) {\n  throw new Error(\n  \
        \  'Original Gunny preload not found: ' +\n    originalPreload\n  );\n}\n\n\
        const ruffleSource =\n  fs.readFileSync(\n    ruffleFile,\n    'utf8'\n  );\n\
        \nconst rufflePublicPath =\n  'file://' +\n  ruffleDir\n    .replace(\n  \
        \    /\\\\\\\\/g,\n      '/'\n    ) +\n  '/';\n\n\n/*\n * IMPORTANT:\n *\n\
        \ * The original Gunny page runs in the MAIN WORLD.\n *\n * Therefore Ruffle's\
        \ plugin polyfill must also run\n * in the MAIN WORLD.\n *\n * window.eval()\
        \ from an isolated preload was not enough\n * for our previous build.\n *\n\
        \ * webFrame.executeJavaScript() evaluates in the\n * renderer page world.\n\
        \ */\n\nconst bootstrap = [\n  '(function () {',\n  '  try {',\n\n  '    window.RufflePlayer\
        \ =',\n  '      window.RufflePlayer || {};',\n\n  '    window.RufflePlayer.config\
        \ =',\n  '      window.RufflePlayer.config || {};',\n\n  '    window.RufflePlayer.config.publicPath\
        \ = ' +\n    JSON.stringify(\n      rufflePublicPath\n    ) +\n    ';',\n\n\
        \  '    window.RufflePlayer.config.polyfills = true;',\n  '    window.RufflePlayer.config.favorFlash\
        \ = false;',\n  '    window.RufflePlayer.config.allowNetworking = \"all\"\
        ;',\n  '    window.RufflePlayer.config.allowScriptAccess = true;',\n\n  '\
        \    ' + ruffleSource,\n\n  '    const ruffle =',\n  '      window.RufflePlayer\
        \ &&',\n  '      typeof window.RufflePlayer.newest === \"function\"',\n  '\
        \        ? window.RufflePlayer.newest()',\n  '        : null;',\n\n  '   \
        \ if (!ruffle) {',\n  '      throw new Error(\"Ruffle newest() unavailable\"\
        );',\n  '    }',\n\n  '    if (typeof ruffle.pluginPolyfill !== \"function\"\
        ) {',\n  '      throw new Error(\"Ruffle pluginPolyfill() unavailable\");',\n\
        \  '    }',\n\n  '    ruffle.pluginPolyfill();',\n\n  '    if (typeof ruffle.polyfill\
        \ === \"function\") {',\n  '      ruffle.polyfill();',\n  '    }',\n\n  /*\n\
        \   * Gunny's remote page calls this function in the old\n   * Flash environment.\
        \ The Intel capture showed:\n   *\n   *   setFlashFocus is not defined\n \
        \  *\n   * Install a compatibility shim before page scripts run.\n   */\n\n\
        \  '    if (typeof window.setFlashFocus !== \"function\") {',\n  '      window.setFlashFocus\
        \ = function () {',\n  '        try {',\n  '          const embeds = document.querySelectorAll(\"\
        embed, object\");',\n  '          const target = embeds && embeds.length ?\
        \ embeds[0] : null;',\n  '          if (target && typeof target.focus ===\
        \ \"function\") {',\n  '            target.focus();',\n  '          }',\n\
        \  '        } catch (_) {}',\n  '        return true;',\n  '      };',\n \
        \ '    }',\n\n  '    console.log(\"[Gunny ARM64] Ruffle main-world polyfill\
        \ ready\");',\n  '    console.log(\"[Gunny ARM64] plugins:\", navigator.plugins.length);',\n\
        \  '    console.log(\"[Gunny ARM64] mimeTypes:\", navigator.mimeTypes.length);',\n\
        \n  '  } catch (error) {',\n  '    console.error(\"[Gunny ARM64] Ruffle main-world\
        \ init failed:\", error);',\n  '  }',\n  '})();'\n].join('\\\\n');\n\n\nwebFrame.executeJavaScript(\n\
        \  bootstrap,\n  false\n).then(\n  function () {\n    console.log(\n     \
        \ '[Gunny ARM64] Ruffle main-world initialization complete'\n    );\n  }\n\
        ).catch(\n  function (error) {\n    console.error(\n      '[Gunny ARM64] Ruffle\
        \ main-world initialization error:',\n      error\n    );\n  }\n);\n\n\n/*\n\
        \ * Keep the ORIGINAL Gunny preload.\n *\n * It supplies:\n *   - contextBridge\
        \ / IPC\n *   - flash-ready\n *   - original Gunny page integration\n *\n\
        \ * We do not replace it with our own implementation.\n */\n\ntry {\n  console.log(\n\
        \    '[Gunny ARM64] Loading original Gunny preload'\n  );\n\n  require(\n\
        \    originalPreload\n  );\n\n  console.log(\n    '[Gunny ARM64] Original\
        \ Gunny preload loaded'\n  );\n\n} catch (error) {\n  console.error(\n   \
        \ '[Gunny ARM64] Original Gunny preload error:',\n    error\n  );\n}\nEOF\n\
        \nnode \\\n  --check \\\n  \"$RES/preload-ruffle.js\"\n\necho\necho \"preload-ruffle.js\
        \ syntax: OK\"\n\necho\necho \"Original preload path:\"\necho \"$PRELOAD_REL\"\
        \n\necho\necho \"Ruffle:\"\nls -lh \\\n  \"$RES/ruffle/ruffle.js\"\n\necho\n\
        echo \"Wrapper:\"\nls -lh \\\n  \"$RES/preload-ruffle.js\""
    - name: Verify Ruffle resources in final app
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\nRES=\"$APP/Contents/Resources\"\
        \n\necho \"Ruffle:\"\ntest -f \"$RES/ruffle/ruffle.js\"\nls -lh \"$RES/ruffle/ruffle.js\"\
        \n\necho\necho \"WASM:\"\nWASM=\"$(\n  find \"$RES/ruffle\" \\\n    -type\
        \ f \\\n    -name \"*.wasm\" \\\n    -print \\\n    | head -n 1\n)\"\ntest\
        \ -n \"$WASM\"\nls -lh \"$WASM\"\n\necho\necho \"Preload wrapper:\"\ntest\
        \ -f \"$RES/preload-ruffle.js\"\nnode --check \"$RES/preload-ruffle.js\"\n\
        \necho\necho \"Wrapper syntax: OK\"\n"
    - name: Rename Electron and update Info.plist
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\nBIN=\"$APP/Contents/MacOS\"\
        \nPLIST=\"$APP/Contents/Info.plist\"\n\nif [ ! -f \"$BIN/Electron\" ]; then\n\
        \  echo \"ERROR: Electron executable not found.\"\n  exit 1\nfi\n\nmv \\\n\
        \  \"$BIN/Electron\" \\\n  \"$BIN/Gunny PC\"\n\nchmod +x \\\n  \"$BIN/Gunny\
        \ PC\"\n\n/usr/libexec/PlistBuddy \\\n  -c \"Set :CFBundleExecutable Gunny\
        \ PC\" \\\n  \"$PLIST\"\n\n/usr/libexec/PlistBuddy \\\n  -c \"Set :CFBundleName\
        \ Gunny PC\" \\\n  \"$PLIST\" \\\n  2>/dev/null \\\n  || true\n\n/usr/libexec/PlistBuddy\
        \ \\\n  -c \"Set :CFBundleDisplayName Gunny PC\" \\\n  \"$PLIST\" \\\n  2>/dev/null\
        \ \\\n  || true"
    - name: Verify final package
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\n\nMAIN=\"$APP/Contents/MacOS/Gunny\
        \ PC\"\nRES=\"$APP/Contents/Resources\"\n\necho \"=== MAIN ===\"\nfile \"\
        $MAIN\"\nlipo -info \"$MAIN\"\n\nif ! file \"$MAIN\" | grep -q \"arm64\";\
        \ then\n  echo \"ERROR: final executable is not ARM64.\"\n  exit 1\nfi\n\n\
        echo\necho \"=== RUFFLE ===\"\ntest -f \"$RES/ruffle/ruffle.js\"\n\necho\n\
        echo \"=== RUFFLE WRAPPER ===\"\ntest -f \"$RES/preload-ruffle.js\"\n\necho\n\
        echo \"=== ORIGINAL PEPPER FLASH ===\"\nif [ -f \\\n  \"$RES/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer\"\
        \n]; then\n  file \\\n    \"$RES/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer\"\
        \nfi\n\necho\necho \"=== APP.ASAR ===\"\n\nrm -rf build/final-source\n\nasar\
        \ extract \\\n  \"$RES/app.asar\" \\\n  build/final-source\n\nFINAL_MAIN=\"\
        $(\n  find build/final-source \\\n    -type f \\\n    -name \"main.js\" \\\
        \n    -print \\\n    | head -n 1\n)\"\n\nnode \\\n  --check \\\n  \"$FINAL_MAIN\"\
        \n\necho \"main.js: OK\"\n\necho\necho \"=== GAME WINDOW CONFIG ===\"\n\n\
        grep -n \\\n  -A70 \\\n  -B10 \\\n  \"function createGameWindow\" \\\n  \"\
        $FINAL_MAIN\" \\\n  | head -160 \\\n  || true\n\necho\necho \"=== RUFFLE PRELOAD\
        \ REFERENCE ===\"\n\ngrep -n \\\n  \"preload-ruffle.js\" \\\n  \"$FINAL_MAIN\"\
        \ \\\n  || true\n\necho\necho \"=== SETFLASHFOCUS ===\"\n\ngrep -Rni \\\n\
        \  \"setFlashFocus\" \\\n  build/final-source \\\n  2>/dev/null \\\n  | head\
        \ -100 \\\n  || true\n\necho\necho \"=== PPAPI SWITCHES ===\"\n\ngrep -RniE\
        \ \\\n  \"ppapi-flash-path|ppapi-flash-version\" \\\n  build/final-source\
        \ \\\n  2>/dev/null \\\n  | head -100 \\\n  || true"
    - name: Runtime smoke test
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\nBIN=\"$APP/Contents/MacOS/Gunny\
        \ PC\"\n\nLOG=\"build/runtime-smoke.log\"\n\nrm -f \"$LOG\"\n\necho \"==========================================\"\
        \necho \"RUNTIME SMOKE TEST\"\necho \"==========================================\"\
        \n\n\"$BIN\" \\\n  --enable-logging=stderr \\\n  --v=1 \\\n  > \"$LOG\" \\\
        \n  2>&1 &\n\nPID=$!\n\necho \"PID=$PID\"\n\nsleep 20\n\nif kill -0 \"$PID\"\
        \ 2>/dev/null; then\n  echo \"Gunny process is still running after 20 seconds.\"\
        \n  kill \"$PID\" 2>/dev/null || true\nelse\n  echo \"Gunny process exited\
        \ before 20 seconds.\"\nfi\n\nwait \"$PID\" 2>/dev/null || true\n\necho\n\
        echo \"==========================================\"\necho \"RUNTIME ERRORS\"\
        \necho \"==========================================\"\n\ngrep -niE \\\n  \"\
        Ruffle|pluginPolyfill|preload|contextBridge|module not found|Loading\\\\.swf|setFlashFocus|ReferenceError|TypeError|SyntaxError\"\
        \ \\\n  \"$LOG\" \\\n  | head -1000 \\\n  || true\n\necho\necho \"==========================================\"\
        \necho \"FLASH NETWORK\"\necho \"==========================================\"\
        \n\ngrep -niE \\\n  \"Loading\\\\.swf|config\\\\.xml|res[0-9]+\\\\.gn\\\\\
        .zing\\\\.vn|application/x-shockwave-flash\" \\\n  \"$LOG\" \\\n  | head -500\
        \ \\\n  || true\n\necho\necho \"==========================================\"\
        \necho \"RAW LOG\"\necho \"==========================================\"\n\n\
        tail -300 \"$LOG\" || true\n\nmkdir -p release\n\ncp \\\n  \"$LOG\" \\\n \
        \ release/runtime-smoke.log\n\necho\necho \"Runtime smoke log:\"\nls -lh release/runtime-smoke.log\n"
    - name: Remove quarantine and old signatures
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\n\nxattr -cr \\\n\
        \  \"$APP\" \\\n  || true\n\nrm -rf \\\n  \"$APP/Contents/_CodeSignature\"\
        \n\nfind \"$APP/Contents\" \\\n  -name \"_CodeSignature\" \\\n  -type d \\\
        \n  -prune \\\n  -exec rm -rf {} + \\\n  || true"
    - name: Ad-hoc sign
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\n\ncodesign \\\n\
        \  --deep \\\n  --force \\\n  --verbose \\\n  --sign - \\\n  \"$APP\"\n\n\
        codesign \\\n  --verify \\\n  --deep \\\n  --strict \\\n  --verbose=2 \\\n\
        \  \"$APP\""
    - name: Create ZIP and DMG
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\n\nditto \\\n  -c\
        \ \\\n  -k \\\n  --sequesterRsrc \\\n  --keepParent \\\n  \"$APP\" \\\n  release/Gunny-PC-ARM64-Ruffle-Intel-Structure.zip\n\
        \nrm -rf build/dmg\n\nmkdir -p build/dmg\n\ncp -R \\\n  \"$APP\" \\\n  build/dmg/\n\
        \nhdiutil create \\\n  -volname \"Gunny PC ARM64 Ruffle Intel Structure\"\
        \ \\\n  -srcfolder build/dmg \\\n  -ov \\\n  -format UDZO \\\n  release/Gunny-PC-ARM64-Ruffle-Intel-Structure.dmg\n\
        \nls -lh \\\n  release/Gunny-PC-ARM64-Ruffle-Intel-Structure.zip \\\n  release/Gunny-PC-ARM64-Ruffle-Intel-Structure.dmg"
    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Gunny-PC-ARM64-Ruffle-Intel-Structure-ZIP
        path: release/Gunny-PC-ARM64-Ruffle-Intel-Structure.zip
        if-no-files-found: error
        retention-days: 14
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: Gunny-PC-ARM64-Ruffle-Intel-Structure-DMG
        path: release/Gunny-PC-ARM64-Ruffle-Intel-Structure.dmg
        if-no-files-found: error
        retention-days: 14
    - name: Upload runtime log
      uses: actions/upload-artifact@v4
      with:
        name: Gunny-PC-ARM64-Ruffle-Runtime-Log
        path: release/runtime-smoke.log
        if-no-files-found: warn
        retention-days: 14
