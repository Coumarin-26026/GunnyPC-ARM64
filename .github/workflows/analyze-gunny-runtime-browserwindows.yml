name: Analyze Gunny Runtime BrowserWindows
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  GUNNY_URL: https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b
jobs:
  analyze-runtime:
    name: Capture Gunny game window and Flash runtime
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install tools
      shell: bash
      run: 'set -euo pipefail

        npm install --global @electron/asar

        node --version

        asar --version

        '
    - name: Prepare
      shell: bash
      run: 'set -euo pipefail

        rm -rf analysis runtime-capture

        mkdir -p analysis/original analysis/source analysis/results runtime-capture

        '
    - name: Download original Gunny Intel
      shell: bash
      run: 'set -euo pipefail

        curl --fail --location --retry 10 --retry-delay 5 --connect-timeout 30 --max-time
        1800 -A "Mozilla/5.0" "$GUNNY_URL" -o analysis/gunny-intel.zip

        file analysis/gunny-intel.zip

        '
    - name: Extract original Gunny
      shell: bash
      run: "set -euo pipefail\nunzip -q -o analysis/gunny-intel.zip -d analysis/original\n\
        rm -rf analysis/original/__MACOSX\nAPP=\"$(find analysis/original -type d\
        \ -name \"*.app\" -print | head -n 1)\"\nif [ -z \"$APP\" ]; then\n  echo\
        \ \"ERROR: Gunny .app not found.\"\n  exit 1\nfi\nprintf '%s\\n' \"$APP\"\
        \ > analysis/original/app.txt\ncat analysis/original/app.txt\n"
    - name: Extract app.asar
      shell: bash
      run: 'set -euo pipefail

        APP="$(cat analysis/original/app.txt)"

        rm -rf analysis/source/app

        mkdir -p analysis/source/app

        asar extract "$APP/Contents/Resources/app.asar" analysis/source/app

        '
    - name: Locate main.js
      shell: bash
      run: "set -euo pipefail\nMAIN=\"$(find analysis/source/app -type f -name \"\
        main.js\" -print | while IFS= read -r FILE; do\n  if grep -q -E \"BrowserWindow|findFlashPath|PepperFlashPlayer\"\
        \ \"$FILE\" 2>/dev/null; then\n    echo \"$FILE\"\n    break\n  fi\ndone)\"\
        \nif [ -z \"$MAIN\" ]; then\n  echo \"ERROR: Gunny main.js not found.\"\n\
        \  exit 1\nfi\nprintf '%s\\n' \"$MAIN\" > analysis/main.txt\ncat analysis/main.txt\n"
    - name: Install instrumentation helper
      shell: bash
      run: 'set -euo pipefail

        mkdir -p analysis/source/app/helper

        printf ''%s'' ""
        | base64 --decode > analysis/source/app/helper/runtime-capture.js

        node --check analysis/source/app/helper/runtime-capture.js

        echo "Helper syntax: OK"

        '
    - name: Patch main.js for instrumentation
      shell: bash
      run: 'set -euo pipefail

        MAIN="$(cat analysis/main.txt)"

        export MAIN

        printf ''%s'' ""
        | base64 --decode | python3

        node --check "$MAIN"

        echo "Instrumented main.js syntax: OK"

        '
    - name: Verify instrumentation
      shell: bash
      run: 'set -euo pipefail

        MAIN="$(cat analysis/main.txt)"

        grep -n -A25 -B5 "global instrumentation installed" "$MAIN" | head -120 ||
        true

        '
    - name: Rebuild app.asar
      shell: bash
      run: 'set -euo pipefail

        APP="$(cat analysis/original/app.txt)"

        ASAR="$APP/Contents/Resources/app.asar"

        rm -f "$ASAR"

        asar pack analysis/source/app "$ASAR"

        '
    - name: Launch original Intel Gunny
      shell: bash
      run: "set -euo pipefail\nAPP=\"$(cat analysis/original/app.txt)\"\nBIN=\"$APP/Contents/MacOS/Gunny\
        \ PC\"\nLOG=\"runtime-capture/gunny-runtime.log\"\nexport GUNNY_CAPTURE_DIR=\"\
        $(pwd)/runtime-capture\"\nrm -f \"$LOG\"\n\"$BIN\" --enable-logging=stderr\
        \ --v=1 > \"$LOG\" 2>&1 &\nPID=$!\nprintf '%s\\n' \"$PID\" > runtime-capture/pid.txt\n\
        echo \"PID=$PID\"\nfor SECOND in $(seq 1 90); do\n  sleep 1\n  if ! kill -0\
        \ \"$PID\" 2>/dev/null; then\n    echo \"Gunny exited at second $SECOND.\"\
        \n    break\n  fi\ndone\n"
    - name: Runtime summary
      shell: bash
      run: "set -euo pipefail\nPID=\"$(cat runtime-capture/pid.txt 2>/dev/null ||\
        \ true)\"\nif [ -n \"$PID\" ]; then\n  kill \"$PID\" 2>/dev/null || true\n\
        fi\nLOG=\"runtime-capture/gunny-runtime.log\"\necho \"=== WINDOWS ===\"\n\
        cat runtime-capture/windows.ndjson 2>/dev/null || true\necho\necho \"=== NAVIGATION\
        \ ===\"\ncat runtime-capture/navigation.ndjson 2>/dev/null || true\necho\n\
        echo \"=== EVENTS ===\"\ntail -1000 runtime-capture/events.ndjson 2>/dev/null\
        \ || true\necho\necho \"=== FLASH / GAME LOG ===\"\ngrep -niE \"game_window_opened|game_session_started|roadclient_received|login_return_observed|Loading\\\
        .swf|config\\.xml|setFlashFocus|Shockwave|Pepper|PPAPI|plugin|ReferenceError|TypeError|SyntaxError\"\
        \ \"$LOG\" | tail -1500 || true\necho\necho \"=== CAPTURE FILES ===\"\nfind\
        \ runtime-capture -maxdepth 2 -type f -print | sort\n"
    - name: Build analysis report
      shell: bash
      run: "set -euo pipefail\n{\n  echo \"# Gunny Runtime BrowserWindow Capture\"\
        \n  echo\n  echo \"Generated: $(date)\"\n  echo\n  echo \"## Windows\"\n \
        \ cat runtime-capture/windows.ndjson 2>/dev/null || true\n  echo\n  echo \"\
        ## Navigation\"\n  cat runtime-capture/navigation.ndjson 2>/dev/null || true\n\
        \  echo\n  echo \"## Flash log\"\n  grep -niE \"Loading\\.swf|config\\.xml|setFlashFocus|Shockwave|Pepper|PPAPI|plugin|ReferenceError|TypeError|SyntaxError\"\
        \ runtime-capture/gunny-runtime.log 2>/dev/null | tail -1000 || true\n} >\
        \ analysis/results/ANALYSIS-SUMMARY.md\ncat analysis/results/ANALYSIS-SUMMARY.md\n"
    - name: Package capture
      shell: bash
      run: 'set -euo pipefail

        cp -R runtime-capture analysis/results/runtime-capture

        cp analysis/main.txt analysis/results/main.txt

        cd analysis

        zip -qr ../gunny-runtime-browserwindow-capture.zip results

        cd ..

        ls -lh gunny-runtime-browserwindow-capture.zip

        '
    - name: Upload capture
      uses: actions/upload-artifact@v4
      with:
        name: Gunny-Runtime-BrowserWindow-Capture
        path: gunny-runtime-browserwindow-capture.zip
        if-no-files-found: error
        retention-days: 14
