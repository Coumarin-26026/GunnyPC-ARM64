name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Gunny PC"
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

jobs:
  build:
    name: Gunny PC ARM64 + Ruffle
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @electron/asar

          node --version
          asar --version
          gh --version

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build release
          mkdir -p build release

      - name: Download original Gunny Intel
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny-intel.zip

          file build/gunny-intel.zip
          ls -lh build/gunny-intel.zip

      - name: Extract original Gunny
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/original

          unzip \
            -q \
            -o \
            build/gunny-intel.zip \
            -d build/original

          rm -rf build/original/__MACOSX

          APP="$(
            find build/original \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny app not found."
            exit 1
          fi

          printf '%s\n' "$APP" > build/original-app.txt

          echo "Original app:"
          cat build/original-app.txt

      - name: Verify original Intel build
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          BIN="$APP/Contents/MacOS/Gunny PC"

          file "$BIN"
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "x86_64"; then
            echo "ERROR: Google Drive input is not the expected Intel build."
            exit 1
          fi

          echo "Original Intel input: OK"

      - name: Inspect original Flash plugin
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          PEPPER="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer"

          if [ ! -f "$PEPPER" ]; then
            echo "ERROR: bundled PepperFlashPlayer not found."
            exit 1
          fi

          file "$PEPPER"
          lipo -info "$PEPPER" || true

          echo
          echo "Pepper Flash is source-only and will not be placed in the ARM64 app."

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          rm -rf build/source
          asar extract "$ASAR" build/source

      - name: Locate real Gunny main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/source \
              -type f \
              -name "main.js" \
              -print \
              | while IFS= read -r f; do
                  if grep -q "findFlashPath" "$f" 2>/dev/null; then
                    echo "$f"
                    break
                  fi
                done
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: Gunny main.js with findFlashPath() not found."
            exit 1
          fi

          printf '%s\n' "$MAIN" > build/main-path.txt

          echo "Gunny main.js:"
          cat build/main-path.txt

      - name: Verify original Gunny preload
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          PRELOAD="$APP/Contents/Resources/preload.js"

          if [ ! -f "$PRELOAD" ]; then
            echo "ERROR: expected Gunny preload.js not found:"
            echo "$PRELOAD"
            exit 1
          fi

          printf '%s\n' "$PRELOAD" > build/original-preload.txt

          echo "Original Gunny preload:"
          cat build/original-preload.txt

          echo
          echo "Preload checks:"
          grep -niE \
            "contextBridge|ipcRenderer|document\.querySelector|embed|object" \
            "$PRELOAD" \
            | head -200 \
            || true

      - name: Inspect game window code
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"

          echo "=========================================="
          echo "createGameWindow"
          echo "=========================================="

          grep -n \
            -A90 \
            -B10 \
            "function createGameWindow" \
            "$MAIN" \
            | head -180

      - name: Download Ruffle self-hosted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf build/ruffle
          mkdir -p build/ruffle

          cd build/ruffle

          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*web*selfhosted*.zip" \
            --clobber

          ZIP="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Ruffle self-hosted asset not found."

            gh release view \
              "v${RUFFLE_VERSION}" \
              --repo ruffle-rs/ruffle \
              --json assets \
              --jq '.assets[].name'

            exit 1
          fi

          mkdir -p extracted

          unzip \
            -q \
            -o \
            "$ZIP" \
            -d extracted

      - name: Validate Ruffle
        shell: bash
        run: |
          set -euo pipefail

          RUFFLE_JS="$(
            find build/ruffle/extracted \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$RUFFLE_JS" ]; then
            echo "ERROR: ruffle.js not found."

            find build/ruffle/extracted \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          RUFFLE_ROOT="$(dirname "$RUFFLE_JS")"
          printf '%s\n' "$RUFFLE_ROOT" > build/ruffle-root.txt

          WASM="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then
            echo "ERROR: Ruffle WASM not found."
            exit 1
          fi

          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "ruffle.js:"
          ls -lh "$RUFFLE_JS"

          echo
          echo "WASM:"
          ls -lh "$WASM"

      - name: Patch Gunny main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"
          export MAIN

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["MAIN"])
          s = p.read_text(encoding="utf-8-sig")

          # Disable bundled Pepper Flash selection.
          s, flash_count = re.subn(
              r"(\bconst\s+flashPath\s*=\s*)findFlashPath\s*\(\s*\)\s*;",
              r"\1null;",
              s,
              count=1
          )

          if flash_count != 1:
              raise SystemExit(
                  "ERROR: const flashPath = findFlashPath(); not found."
              )

          # Remove native PPAPI switches.
          s = re.sub(
              r"""
              [A-Za-z0-9_$.\[\]]+
              \.appendSwitch
              \s*\(
              \s*['"]ppapi-flash-path['"]
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              s,
              flags=re.IGNORECASE | re.VERBOSE
          )

          s = re.sub(
              r"""
              [A-Za-z0-9_$.\[\]]+
              \.appendSwitch
              \s*\(
              \s*['"]ppapi-flash-version['"]
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              s,
              flags=re.IGNORECASE | re.VERBOSE
          )

          # Remove old Flash-specific deployment.
          s = re.sub(
              r"(?m)^[ \t]*_deployFlashMmsCfg\s*\([^;]*\)\s*;[^\n]*\n?",
              "",
              s
          )

          # Remove Flash-not-found telemetry.
          s = re.sub(
              r"(?m)^[^\n]*flash_not_found[^\n]*\n?",
              "",
              s
          )

          # --------------------------------------------------
          # Patch ONLY createGameWindow().
          # --------------------------------------------------

          start = s.find("function createGameWindow")

          if start == -1:
              raise SystemExit(
                  "ERROR: createGameWindow() not found."
              )

          next_function = re.search(
              r"(?m)^(?:function|async\s+function|const\s+\w+\s*=|let\s+\w+\s*=|var\s+\w+\s*=)",
              s[start + 20:]
          )

          if next_function:
              end = (
                  start
                  + 20
                  + next_function.start()
              )
          else:
              end = len(s)

          game = s[start:end]

          if "new BrowserWindow" not in game:
              raise SystemExit(
                  "ERROR: BrowserWindow not found inside createGameWindow()."
              )

          # Keep contextIsolation TRUE.
          # The original Gunny preload uses contextBridge.

          # Disable sandbox ONLY for game window.
          game, sandbox_count = re.subn(
              r"(\bsandbox\s*:\s*)true",
              r"\1false",
              game,
              count=1
          )

          if sandbox_count == 0:

              game, inserted = re.subn(
                  r"(webPreferences\s*:\s*\{)",
                  r"\1\n        sandbox: false,",
                  game,
                  count=1
              )

              if inserted != 1:
                  raise SystemExit(
                      "ERROR: game webPreferences block not found."
                  )

          # Keep Chromium plugins enabled.
          game = re.sub(
              r"(\bplugins\s*:\s*)false",
              r"\1true",
              game,
              count=1
          )

          # --------------------------------------------------
          # Replace Gunny's packaged/dev preload expression.
          #
          # Original:
          #
          # preload: app.isPackaged
          #   ? path.join(process.resourcesPath, 'preload.js')
          #   : path.join(__dirname, 'preload.js'),
          #
          # --------------------------------------------------

          preload_ternary = re.compile(
              r"""
              \bpreload\s*:\s*
              app\.isPackaged
              \s*\?\s*
              path\.join\(
                  [\s\S]*?
              \)
              \s*:\s*
              path\.join\(
                  [\s\S]*?
              \)
              \s*,?
              """,
              re.IGNORECASE | re.VERBOSE
          )

          game, preload_count = preload_ternary.subn(
              """preload: path.join(
                  process.resourcesPath,
                  'preload-ruffle.js'
                ),""",
              game,
              count=1
          )

          if preload_count != 1:
              raise SystemExit(
                  "ERROR: packaged/dev game preload ternary not found."
              )

          s = (
              s[:start]
              + game
              + s[end:]
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("main.js patched.")
          print(
              "flashPath replaced:",
              flash_count
          )
          print(
              "sandbox:true replaced/inserted:",
              sandbox_count
          )
          print(
              "game preload replaced:",
              preload_count
          )
          PY

          echo
          echo "Checking JavaScript syntax..."

          node \
            --check \
            "$MAIN"

          echo
          echo "Patched game window:"

          grep -n \
            -A35 \
            -B5 \
            "function createGameWindow" \
            "$MAIN" \
            | head -120

          echo
          echo "PPAPI switches remaining:"

          grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN" \
            || true

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          RES="$APP/Contents/Resources"
          ROOT="$(cat build/ruffle-root.txt)"

          rm -rf "$RES/ruffle"
          mkdir -p "$RES/ruffle"

          cp -R \
            "$ROOT"/. \
            "$RES/ruffle/"

          cat > "$RES/preload-ruffle.js" <<'EOF'
          'use strict';
          
          const fs = require('fs');
          const path = require('path');
          const { contextBridge } = require('electron');
          
          const resources = process.resourcesPath;
          
          const ruffleDir = path.join(
              resources,
              'ruffle'
          );
          
          const ruffleScript = path.join(
              ruffleDir,
              'ruffle.js'
          );
          
          console.log(
              '[Gunny ARM64] Ruffle preload starting'
          );
          
          if (!fs.existsSync(ruffleScript)) {
              throw new Error(
                  'ruffle.js not found: ' + ruffleScript
              );
          }
          
          const ruffleSource =
              fs.readFileSync(
                  ruffleScript,
                  'utf8'
              );
          
          const publicPath =
              'file://' +
              ruffleDir.replace(
                  /\\/g,
                  '/'
              ) +
              '/';
          
          /*
           * Execute Ruffle in the PAGE / MAIN WORLD.
           *
           * The actual Gunny preload stays isolated and continues to
           * use contextBridge normally.
           */
          contextBridge.executeInMainWorld({
              func: (source, publicPath) => {
                  try {
                      window.RufflePlayer =
                          window.RufflePlayer || {};
          
                      window.RufflePlayer.config =
                          window.RufflePlayer.config || {};
          
                      window.RufflePlayer.config.publicPath =
                          publicPath;
          
                      window.RufflePlayer.config.polyfills =
                          true;
          
                      window.RufflePlayer.config.favorFlash =
                          false;
          
                      window.RufflePlayer.config.allowNetworking =
                          'all';
          
                      window.eval(source);
          
                      const ruffle =
                          window.RufflePlayer &&
                          typeof window.RufflePlayer.newest ===
                          'function'
                              ? window.RufflePlayer.newest()
                              : null;
          
                      if (!ruffle) {
                          throw new Error(
                              'RufflePlayer.newest() unavailable'
                          );
                      }
          
                      if (
                          typeof ruffle.pluginPolyfill !==
                          'function'
                      ) {
                          throw new Error(
                              'pluginPolyfill() unavailable'
                          );
                      }
          
                      /*
                       * This must happen before Gunny's Flash detection.
                       */
                      ruffle.pluginPolyfill();
          
                      if (
                          typeof ruffle.polyfill ===
                          'function'
                      ) {
                          ruffle.polyfill();
                      }
          
                      console.log(
                          '[Gunny ARM64] Ruffle pluginPolyfill ENABLED'
                      );
          
                      console.log(
                          '[Gunny ARM64] plugins:',
                          navigator.plugins.length
                      );
          
                      console.log(
                          '[Gunny ARM64] mimeTypes:',
                          navigator.mimeTypes.length
                      );
          
                  } catch (error) {
                      console.error(
                          '[Gunny ARM64] Ruffle main-world initialization failed:',
                          error && error.stack
                              ? error.stack
                              : error
                      );
                  }
              },
              worldSafeExecuteJavaScript: true,
              args: [
                  ruffleSource,
                  publicPath
              ]
          });
          EOF

          node \
            --check \
            "$RES/preload-ruffle.js"

          echo "Ruffle preload syntax: OK"

      - name: Rebuild app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"

          rm -f "$ASAR"

          asar pack \
            build/source \
            "$ASAR"

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o build/electron-arm64.zip

          rm -rf build/electron
          mkdir -p build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          printf '%s\n' "$ELECTRON_APP" > build/electron-app.txt

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          file "$BIN"
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "arm64"; then
            echo "ERROR: Electron ARM64 binary not found."
            exit 1
          fi

      - name: Assemble final ARM64 app
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL="$(cat build/original-app.txt)"
          ELECTRON_APP="$(cat build/electron-app.txt)"

          rm -rf "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          SRC="$ORIGINAL/Contents/Resources"
          DST="build/Gunny PC ARM64.app/Contents/Resources"

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"

          # Install the patched app.asar from the original source tree.
          cp \
            "$ORIGINAL/Contents/Resources/app.asar" \
            "$DST/app.asar"

          # Install Ruffle files.
          ROOT="$(cat build/ruffle-root.txt)"

          rm -rf "$DST/ruffle"

          mkdir -p "$DST/ruffle"

          cp -R \
            "$ROOT"/. \
            "$DST/ruffle/"

          # Install the Ruffle preload generated above.
          cp \
            "$ORIGINAL/Contents/Resources/preload-ruffle.js" \
            "$DST/preload-ruffle.js"

      - name: Rename Electron executable and update Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          BIN="$APP/Contents/MacOS"
          PLIST="$APP/Contents/Info.plist"

          mv \
            "$BIN/Electron" \
            "$BIN/Gunny PC"

          chmod +x \
            "$BIN/Gunny PC"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

      - name: Verify final ARM64 app
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          MAIN="$APP/Contents/MacOS/Gunny PC"
          RES="$APP/Contents/Resources"

          echo "Main:"
          file "$MAIN"
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "arm64"; then
            echo "ERROR: final executable is not ARM64."
            exit 1
          fi

          echo
          echo "Ruffle:"
          test -f "$RES/ruffle/ruffle.js"
          test -f "$RES/preload-ruffle.js"

          echo
          echo "Pepper Flash:"
          if find "$APP" \
            \( \
              -iname "*PepperFlash*" \
              -o \
              -iname "*pepflash*" \
            \) \
            -print \
            | grep -q .
          then
            echo "ERROR: Pepper Flash remains."
            exit 1
          fi

          echo "Removed."

      - name: Verify no Intel Mach-O
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          find "$APP" \
            -type f \
            -exec sh -c '
              INFO="$(file "$1" 2>/dev/null || true)"

              case "$INFO" in
                *"Mach-O"*)
                  printf "%s\n" "$INFO"
                  ;;
              esac
            ' _ {} \; \
            > build/macho-report.txt

          if grep -Eiq \
            "x86_64|i386" \
            build/macho-report.txt
          then
            echo "ERROR: Intel Mach-O remains:"
            grep -Ei \
              "x86_64|i386" \
              build/macho-report.txt
            exit 1
          fi

          echo "No Intel Mach-O detected."

      - name: Verify final app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf build/final-source

          asar extract \
            "$ASAR" \
            build/final-source

          MAIN="$(
            find build/final-source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          node \
            --check \
            "$MAIN"

          echo "main.js syntax: OK"

          echo
          echo "Ruffle preload reference:"
          grep -Rni \
            "preload-ruffle.js" \
            build/final-source \
            | head -50

          echo
          echo "PPAPI:"
          grep -RniE \
            "ppapi-flash-path|ppapi-flash-version" \
            build/final-source \
            2>/dev/null \
            | head -50 \
            || true

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          BIN="$APP/Contents/MacOS/Gunny PC"
          LOG="build/runtime-smoke.log"

          rm -f "$LOG"

          "$BIN" \
            --enable-logging=stderr \
            --v=1 \
            > "$LOG" \
            2>&1 &

          PID=$!

          sleep 12

          kill "$PID" \
            2>/dev/null \
            || true

          echo "Critical startup messages:"

          grep -niE \
            "Unable to load preload|module not found|contextBridge|Ruffle|pluginPolyfill|SyntaxError|ReferenceError|TypeError" \
            "$LOG" \
            | head -200 \
            || true

      - name: Remove quarantine and sign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          xattr -cr "$APP" || true

          find "$APP/Contents" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + \
            || true

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "release/Gunny-PC-ARM64-Ruffle.zip"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/dmg
          mkdir -p build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "release/Gunny-PC-ARM64-Ruffle.dmg"

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          MAIN="$APP/Contents/MacOS/Gunny PC"

          {
            echo "Gunny PC ARM64 + Ruffle"
            echo
            echo "Electron: $ELECTRON_VERSION"
            echo "Ruffle: $RUFFLE_VERSION"
            echo
            echo "Architecture:"
            file "$MAIN"
            echo
            echo "Ruffle:"
            test -f "$APP/Contents/Resources/ruffle/ruffle.js" \
              && echo "ruffle.js OK"
            test -f "$APP/Contents/Resources/preload-ruffle.js" \
              && echo "preload-ruffle.js OK"
            echo
            echo "Pepper Flash:"
            if find "$APP" \
              \( -iname "*PepperFlash*" -o -iname "*pepflash*" \) \
              | grep -q .
            then
              echo "FOUND"
            else
              echo "REMOVED"
            fi
          } > release/build-report.txt

          cat release/build-report.txt

