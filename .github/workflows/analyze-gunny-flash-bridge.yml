name: Analyze Gunny Flash Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

jobs:
  analyze:
    name: Analyze Gunny Flash / SWF / JS Bridge
    runs-on: macos-14

    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @electron/asar

          node --version
          asar --version

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf analysis
          mkdir -p analysis

          mkdir -p \
            analysis/original \
            analysis/source \
            analysis/results \
            analysis/downloads

      - name: Download original Gunny Intel
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o analysis/downloads/gunny-intel.zip

          file analysis/downloads/gunny-intel.zip
          ls -lh analysis/downloads/gunny-intel.zip

      - name: Extract original Gunny
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/original/app

          unzip \
            -q \
            -o \
            analysis/downloads/gunny-intel.zip \
            -d analysis/original/app

          rm -rf \
            analysis/original/app/__MACOSX

          APP="$(
            find analysis/original/app \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny .app not found."
            exit 1
          fi

          printf '%s\n' "$APP" \
            > analysis/original-app.txt

          echo "Original app:"
          cat analysis/original-app.txt

      - name: Inspect architecture and Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat analysis/original-app.txt)"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          PEPPER="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer"

          echo "=========================================="
          echo "MAIN"
          echo "=========================================="

          file "$MAIN"
          lipo -info "$MAIN"

          echo
          echo "=========================================="
          echo "PEPPER FLASH"
          echo "=========================================="

          file "$PEPPER"
          lipo -info "$PEPPER" || true

          echo
          echo "Pepper Flash Info.plist:"

          if [ -f \
            "$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/Info.plist" \
          ]; then
            plutil -p \
              "$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/Info.plist"
          fi

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat analysis/original-app.txt)"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar missing."
            exit 1
          fi

          rm -rf analysis/source/app

          asar extract \
            "$ASAR" \
            analysis/source/app

          echo "Extracted source:"
          find analysis/source/app \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

      - name: Identify Electron entry points
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== package.json ==="
            if [ -f analysis/source/app/package.json ]; then
              cat analysis/source/app/package.json
            fi

            echo
            echo "=== main candidates ==="

            find analysis/source/app \
              -type f \
              \( \
                -name "main.js" \
                -o \
                -name "index.js" \
                -o \
                -name "*.js" \
              \) \
              -print \
              | sort \
              | head -500

          } > analysis/results/entry-points.txt

          cat analysis/results/entry-points.txt

      - name: Extract main.js Flash configuration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find analysis/source/app \
              -type f \
              -name "main.js" \
              -print \
              | while IFS= read -r f; do
                  if grep -q \
                    -E \
                    "findFlashPath|PepperFlashPlayer|BrowserWindow" \
                    "$f" \
                    2>/dev/null
                  then
                    echo "$f"
                    break
                  fi
                done
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: Gunny main.js not identified."
            exit 1
          fi

          printf '%s\n' "$MAIN" \
            > analysis/main-path.txt

          {
            echo "MAIN=$MAIN"
            echo
            echo "=== FLASH SEARCH ==="

            grep -niE \
              "findFlashPath|PepperFlashPlayer|ppapi-flash-path|ppapi-flash-version|flash_not_found|_deployFlashMmsCfg|flashPath|Flash" \
              "$MAIN" \
              || true

            echo
            echo "=== BROWSER WINDOWS ==="

            grep -niE \
              "BrowserWindow|webPreferences|contextIsolation|sandbox|plugins|preload" \
              "$MAIN" \
              | head -500 \
              || true

          } > analysis/results/main-flash-config.txt

          cat analysis/results/main-flash-config.txt

      - name: Search all source for Flash APIs
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="analysis/source/app"

          {
            echo "=== FLASH TERMS ==="

            grep -RniE \
              "Flash|flash|Shockwave|SWF|swf|PepperFlash|PepFlash|PPAPI|application/x-shockwave-flash" \
              "$SOURCE" \
              2>/dev/null \
              | head -5000 \
              || true

            echo
            echo "=== EMBED / OBJECT ==="

            grep -RniE \
              "<embed|<object|createElement\s*\(\s*['\"]embed|createElement\s*\(\s*['\"]object" \
              "$SOURCE" \
              2>/dev/null \
              | head -3000 \
              || true

            echo
            echo "=== FLASH JS INTERFACE ==="

            grep -RniE \
              "ExternalInterface|flashvars|SetVariable|GetVariable|fscommand|CallFunction|sendToActionScript|callFunction" \
              "$SOURCE" \
              2>/dev/null \
              | head -3000 \
              || true

            echo
            echo "=== PLUGIN DETECTION ==="

            grep -RniE \
              "navigator\.plugins|navigator\.mimeTypes|mimeTypes|plugins\.length|Shockwave Flash|application/x-shockwave-flash" \
              "$SOURCE" \
              2>/dev/null \
              | head -3000 \
              || true

            echo
            echo "=== FLASH READY / FOCUS ==="

            grep -RniE \
              "flash-ready|flashReady|flash_ready|setFlashFocus|flashFocus|FlashFocus|setFocus|flash.*focus" \
              "$SOURCE" \
              2>/dev/null \
              | head -3000 \
              || true

          } > analysis/results/source-flash-search.txt

          cat analysis/results/source-flash-search.txt

      - name: Search source for callback / bridge methods
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="analysis/source/app"

          {
            echo "=== CALLBACK-LIKE METHODS ==="

            grep -RniE \
              "window\.[A-Za-z0-9_$]*\s*=\s*function|window\.[A-Za-z0-9_$]*\s*=\s*\(|globalThis\.[A-Za-z0-9_$]*|document\.[A-Za-z0-9_$]*" \
              "$SOURCE" \
              2>/dev/null \
              | grep -Ei \
                "flash|swf|focus|game|load|ready|call|callback|external" \
              | head -3000 \
              || true

            echo
            echo "=== IPC BRIDGE ==="

            grep -RniE \
              "ipcMain|ipcRenderer|contextBridge|webContents\.executeJavaScript|executeJavaScript|postMessage|sendToFrame|send" \
              "$SOURCE" \
              2>/dev/null \
              | head -4000 \
              || true

          } > analysis/results/bridge-search.txt

          cat analysis/results/bridge-search.txt

      - name: Inspect preload files
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== PRELOAD FILES ==="

            find analysis/source/app \
              -type f \
              -name "*preload*.js" \
              -print \
              | sort

            echo
            echo "=== PRELOAD CONTENT ==="

            for FILE in $(
              find analysis/source/app \
                -type f \
                -name "*preload*.js" \
                -print \
                | sort
            ); do

              echo
              echo "##################################################"
              echo "FILE: $FILE"
              echo "##################################################"

              sed -n '1,500p' "$FILE"

            done

          } > analysis/results/preloads.txt

          cat analysis/results/preloads.txt

      - name: Find actual game page / URL construction
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="analysis/source/app"

          {
            echo "=== URLs ==="

            grep -RniE \
              "https?://|loadURL|loadFile|Default\.aspx|gn\.zing\.vn|res[0-9]+\.gn\.zing\.vn|config\.xml" \
              "$SOURCE" \
              2>/dev/null \
              | head -5000 \
              || true

            echo
            echo "=== SWF URL CONSTRUCTION ==="

            grep -RniE \
              "Loading\.swf|\.swf[\"' ?]|/flash/|flash/" \
              "$SOURCE" \
              2>/dev/null \
              | head -3000 \
              || true

          } > analysis/results/game-url-search.txt

          cat analysis/results/game-url-search.txt

      - name: Search all local strings for setFlashFocus
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== exact setFlashFocus ==="

            grep -Rni \
              "setFlashFocus" \
              analysis/source \
              2>/dev/null \
              || true

            echo
            echo "=== focus variants ==="

            grep -RniE \
              "FlashFocus|flashFocus|flash.focus|setFocus|focusFlash" \
              analysis/source \
              2>/dev/null \
              | head -1000 \
              || true

          } > analysis/results/setflashfocus-search.txt

          cat analysis/results/setflashfocus-search.txt

      - name: Locate candidate game page HTML
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== HTML FILES ==="

            find analysis/source/app \
              -type f \
              \( \
                -name "*.html" \
                -o \
                -name "*.htm" \
              \) \
              -print \
              | sort

            echo
            echo "=== HTML FLASH REFERENCES ==="

            grep -RniE \
              "Loading\.swf|application/x-shockwave-flash|setFlashFocus|Shockwave|<embed|<object" \
              analysis/source/app \
              2>/dev/null \
              | head -3000 \
              || true

          } > analysis/results/html-flash-search.txt

          cat analysis/results/html-flash-search.txt

      - name: Inspect package metadata and Chromium switches
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat analysis/original-app.txt)"

          {
            echo "=== APP PLIST ==="
            plutil -p \
              "$APP/Contents/Info.plist"

            echo
            echo "=== PACKAGE JSON ==="

            if [ -f analysis/source/app/package.json ]; then
              cat analysis/source/app/package.json
            fi

            echo
            echo "=== FLASH / PLUGIN SWITCHES ==="

            grep -RniE \
              "ppapi-flash|pepper-flash|flash-plugin|plugin" \
              analysis/source/app \
              2>/dev/null \
              | head -3000 \
              || true

          } > analysis/results/metadata.txt

          cat analysis/results/metadata.txt

      - name: Download SWF references if URLs are present
        shell: bash
        run: |
          set -euo pipefail

          URLS="$(
            grep -RhoE \
              'https?://[^"'\''[:space:]]+\.swf[^"'\''[:space:]]*' \
              analysis/source/app \
              2>/dev/null \
              | sort -u \
              | head -50
          )"

          if [ -z "$URLS" ]; then
            echo "No literal SWF URLs found in local source."

            touch \
              analysis/results/swf-downloads.txt

            exit 0
          fi

          : > analysis/results/swf-downloads.txt

          INDEX=0

          while IFS= read -r URL; do

            INDEX=$((INDEX + 1))

            SAFE="analysis/downloads/swf-${INDEX}.swf"

            echo "Downloading:"
            echo "$URL"

            if curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              "$URL" \
              -o "$SAFE"
            then

              FILETYPE="$(file "$SAFE")"

              printf '%s\n' \
                "[$INDEX] $URL -> $SAFE -> $FILETYPE" \
                | tee -a \
                  analysis/results/swf-downloads.txt

            else

              printf '%s\n' \
                "[$INDEX] FAILED $URL" \
                | tee -a \
                  analysis/results/swf-downloads.txt

              rm -f "$SAFE"

            fi

          done <<< "$URLS"

      - name: Analyze downloaded SWF files
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== SWF FILES ==="

            find analysis/downloads \
              -type f \
              -name "*.swf" \
              -exec file {} \;

            echo
            echo "=== SWF STRINGS ==="

            for SWF in $(
              find analysis/downloads \
                -type f \
                -name "*.swf" \
                -print
            ); do

              echo
              echo "##################################################"
              echo "SWF: $SWF"
              echo "##################################################"

              strings \
                "$SWF" \
                | grep -Ei \
                  "setFlashFocus|ExternalInterface|fscommand|flash|focus|ready|load|game|socket|http" \
                | head -1000 \
                || true

            done

          } > analysis/results/swf-analysis.txt

          cat analysis/results/swf-analysis.txt

      - name: Generate Ruffle mapping checklist
        shell: bash
        run: |
          set -euo pipefail

          cat > analysis/results/RUFFLE-MAPPING.md <<'EOF'
          # Gunny Flash -> Ruffle mapping

          ## 1. Flash loading

          [ ] `<embed>` / `<object>` detection
          [ ] `application/x-shockwave-flash`
          [ ] SWF URL
          [ ] FlashVars
          [ ] config.xml

          ## 2. Plugin detection

          [ ] navigator.plugins
          [ ] navigator.mimeTypes
          [ ] Shockwave Flash name/version

          ## 3. JavaScript -> Flash

          [ ] ExternalInterface
          [ ] CallFunction
          [ ] SetVariable
          [ ] fscommand

          ## 4. Flash -> JavaScript

          [ ] callbacks
          [ ] setFlashFocus
          [ ] flash-ready
          [ ] game-ready
          [ ] focus/blur

          ## 5. Electron bridge

          [ ] preload.js
          [ ] contextBridge
          [ ] ipcRenderer
          [ ] ipcMain
          [ ] webContents.executeJavaScript

          ## 6. Ruffle

          [ ] pluginPolyfill
          [ ] polyfill
          [ ] publicPath
          [ ] WASM
          [ ] networking
          [ ] same-origin behavior

          ## 7. Final requirement

          The final ARM64 build should reproduce every item above
          that the original Intel Gunny runtime actually uses.
          EOF

          cat analysis/results/RUFFLE-MAPPING.md

      - name: Build analysis summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Gunny Flash Analysis"
            echo
            echo "Generated: $(date)"
            echo
            echo "## Source"
            echo "- Original Intel Gunny"
            echo "- app.asar extracted"
            echo
            echo "## Files"
            echo

            find analysis/results \
              -maxdepth 1 \
              -type f \
              -print \
              | sort

            echo
            echo "## setFlashFocus"
            grep -Rni \
              "setFlashFocus" \
              analysis/results \
              2>/dev/null \
              | head -100 \
              || true

            echo
            echo "## Flash / SWF"
            grep -RniE \
              "Loading\.swf|Shockwave|ExternalInterface|navigator\.plugins|navigator\.mimeTypes" \
              analysis/results \
              2>/dev/null \
              | head -300 \
              || true

            echo
            echo "## Preload"
            grep -RniE \
              "contextBridge|ipcRenderer|flash-ready" \
              analysis/results/preloads.txt \
              2>/dev/null \
              | head -200 \
              || true

          } > analysis/results/ANALYSIS-SUMMARY.md

          cat analysis/results/ANALYSIS-SUMMARY.md

      - name: Package analysis
        shell: bash
        run: |
          set -euo pipefail

          cd analysis

          zip \
            -qr \
            ../gunny-flash-analysis.zip \
            results \
            main-path.txt \
            original-app.txt

          cd ..

          ls -lh \
            gunny-flash-analysis.zip

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-Flash-Analysis
          path: gunny-flash-analysis.zip
          if-no-files-found: error
          retention-days: 14
