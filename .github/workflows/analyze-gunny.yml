name: Download and Extract Gunny

on:
  workflow_dispatch:

jobs:
  download-extract:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install p7zip

      - name: Create directories
        run: |
          mkdir -p download
          mkdir -p extracted

      - name: Download Gunny
        run: |
          curl -L \
            "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b" \
            -o download/gunny_download

      - name: Identify downloaded file
        run: |
          echo "===== DOWNLOADED FILE ====="
          ls -lh download/gunny_download

          echo "===== FILE TYPE ====="
          file download/gunny_download

      - name: Extract archive
        shell: bash
        run: |
          FILE="download/gunny_download"

          echo "Detecting archive..."

          if file "$FILE" | grep -qi "Zip archive"; then
            echo "ZIP detected"
            unzip -o "$FILE" -d extracted

          elif file "$FILE" | grep -qiE "7-zip|7z archive"; then
            echo "7Z detected"
            7z x "$FILE" -oextracted

          elif file "$FILE" | grep -qi "gzip compressed"; then
            echo "GZIP detected"
            tar -xzf "$FILE" -C extracted

          elif file "$FILE" | grep -qi "Apple Disk Image"; then
            echo "DMG detected"

            mkdir -p /tmp/gunny-dmg

            hdiutil attach "$FILE" \
              -mountpoint /tmp/gunny-dmg \
              -nobrowse \
              -readonly

            cp -R /tmp/gunny-dmg/. extracted/

            hdiutil detach /tmp/gunny-dmg

          else
            echo "Unknown format"
            echo "Keeping original file."

            cp "$FILE" extracted/
          fi

      - name: Show extracted structure
        run: |
          echo "======================================"
          echo "EXTRACTED STRUCTURE"
          echo "======================================"

          find extracted -maxdepth 6 -print | sort

      - name: Find macOS applications
        run: |
          echo "======================================"
          echo "MACOS APPLICATIONS"
          echo "======================================"

          find extracted \
            -type d \
            -name "*.app" \
            -print

      - name: Analyze executable architectures
        run: |
          echo "======================================"
          echo "EXECUTABLE ARCHITECTURES"
          echo "======================================"

          find extracted \
            -type f \
            -perm -111 \
            -print0 |
          while IFS= read -r -d '' f; do
            echo
            echo "--------------------------------------"
            echo "$f"
            file "$f"
          done

      - name: Check Electron
        run: |
          echo "======================================"
          echo "ELECTRON CHECK"
          echo "======================================"

          find extracted \
            \( \
              -name "app.asar" \
              -o -name "Electron Framework.framework" \
              -o -name "Electron" \
            \) \
            -print

      - name: Find package.json
        run: |
          echo "======================================"
          echo "PACKAGE.JSON"
          echo "======================================"

          find extracted \
            -name "package.json" \
            -print

      - name: Save analysis
        run: |
          {
            echo "===== FILE TYPE ====="
            file download/gunny_download

            echo
            echo "===== APPLICATIONS ====="
            find extracted -type d -name "*.app"

            echo
            echo "===== ELECTRON ====="
            find extracted \
              \( \
                -name "app.asar" \
                -o -name "Electron Framework.framework" \
                -o -name "Electron" \
              \)

            echo
            echo "===== PACKAGE.JSON ====="
            find extracted -name "package.json"

            echo
            echo "===== EXECUTABLES ====="
            find extracted -type f -perm -111 -exec file {} \;

          } > download/analysis.txt

          cat download/analysis.txt

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: gunny-extracted
          path: extracted/

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: gunny-analysis
          path: download/
