name: Analyze Gunny Runtime Flash Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

jobs:
  runtime-analysis:
    name: Runtime capture of Gunny Flash bridge
    runs-on: macos-14

    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @electron/asar
          node --version
          asar --version

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          rm -rf analysis runtime-capture
          mkdir -p analysis/original analysis/source analysis/results runtime-capture

      - name: Download original Gunny
        shell: bash
        run: |
          set -euo pipefail
          curl             --fail             --location             --retry 10             --retry-delay 5             --connect-timeout 30             --max-time 1800             -A "Mozilla/5.0"             "$GUNNY_URL"             -o analysis/gunny-intel.zip
          file analysis/gunny-intel.zip

      - name: Extract original Gunny
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o analysis/gunny-intel.zip -d analysis/original
          rm -rf analysis/original/__MACOSX

          APP="$(
            find analysis/original               -type d               -name "*.app"               -print               | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny app not found."
            exit 1
          fi

          printf '%s\n' "$APP" > analysis/original/app.txt
          cat analysis/original/app.txt

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat analysis/original/app.txt)"

          rm -rf analysis/source/app
          mkdir -p analysis/source/app

          asar extract             "$APP/Contents/Resources/app.asar"             analysis/source/app

      - name: Locate main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find analysis/source/app               -type f               -name "main.js"               -print               | while IFS= read -r f; do
                  if grep -q -E "BrowserWindow|findFlashPath|PepperFlashPlayer" "$f" 2>/dev/null; then
                    echo "$f"
                    break
                  fi
                done
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.js not found."
            exit 1
          fi

          printf '%s\n' "$MAIN" > analysis/main.txt
          cat analysis/main.txt

      - name: Install runtime capture helper
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/source/app/helper

          printf '%s' ''             | base64 --decode             > analysis/source/app/helper/runtime-capture.js

          node             --check             analysis/source/app/helper/runtime-capture.js

      - name: Patch main.js for runtime capture
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat analysis/main.txt)"
          export MAIN

          printf '%s' ''             | base64 --decode             | python3

          node             --check             "$MAIN"

      - name: Rebuild app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat analysis/original/app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"

          rm -f "$ASAR"

          asar pack             analysis/source/app             "$ASAR"

          echo "Patched app.asar rebuilt."

      - name: Launch original Gunny and capture runtime
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat analysis/original/app.txt)"
          BIN="$APP/Contents/MacOS/Gunny PC"
          LOG="runtime-capture/gunny-runtime.log"

          export GUNNY_CAPTURE_DIR="$(pwd)/runtime-capture"

          rm -f "$LOG"

          "$BIN"             --enable-logging=stderr             --v=1             > "$LOG"             2>&1 &

          PID=$!

          printf '%s\n' "$PID"             > runtime-capture/pid.txt

          echo "Gunny PID: $PID"
          echo "Waiting 40 seconds for the runtime page..."
          sleep 40

      - name: Collect runtime evidence
        shell: bash
        run: |
          set -euo pipefail

          PID="$(cat runtime-capture/pid.txt 2>/dev/null || true)"

          if [ -n "$PID" ]; then
            kill "$PID" 2>/dev/null || true
          fi

          LOG="runtime-capture/gunny-runtime.log"

          echo "=========================================="
          echo "FLASH / PLUGIN / JS ERRORS"
          echo "=========================================="

          grep -niE             "pepper|ppapi|plugin|flash|Shockwave|Loading\.swf|setFlashFocus|ExternalInterface|ReferenceError|TypeError|SyntaxError"             "$LOG"             | tail -1200             || true

          echo
          echo "=========================================="
          echo "CAPTURE FILES"
          echo "=========================================="

          find runtime-capture             -maxdepth 2             -type f             -print             | sort

      - name: Package analysis
        shell: bash
        run: |
          set -euo pipefail

          cp -R             runtime-capture             analysis/results/runtime-capture

          cp             analysis/main.txt             analysis/results/main.txt

          cp             analysis/original/app.txt             analysis/results/original-app.txt

          cd analysis

          zip             -qr             ../gunny-runtime-flash-capture.zip             results

          cd ..

          ls -lh             gunny-runtime-flash-capture.zip

      - name: Upload runtime analysis
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-Runtime-Flash-Capture
          path: gunny-runtime-flash-capture.zip
          if-no-files-found: error
          retention-days: 14
