name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Gunny PC"
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

jobs:
  build:
    name: Gunny PC ARM64 + Ruffle
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @electron/asar

          echo "Node:"
          node --version

          echo "asar:"
          asar --version

          echo "gh:"
          gh --version

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build release
          mkdir -p build release

      - name: Download original Gunny Intel
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny-intel.zip

          file build/gunny-intel.zip
          ls -lh build/gunny-intel.zip

      - name: Extract original Gunny Intel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/original

          unzip \
            -q \
            -o \
            build/gunny-intel.zip \
            -d build/original

          rm -rf build/original/__MACOSX

          APP="$(
            find build/original \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny .app not found."
            exit 1
          fi

          printf '%s\n' "$APP" > build/original-app.txt

          echo "Original app:"
          cat build/original-app.txt

      - name: Verify original is Intel
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          MAIN="$APP/Contents/MacOS/Gunny PC"

          file "$MAIN"
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "x86_64"; then
            echo "ERROR: expected x86_64 Gunny input."
            exit 1
          fi

          echo "Original Intel input: OK"

      - name: Verify bundled Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          PLUGIN="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin"
          PLUGIN_BIN="$PLUGIN/Contents/MacOS/PepperFlashPlayer"

          if [ ! -f "$PLUGIN_BIN" ]; then
            echo "ERROR: bundled PepperFlashPlayer not found."
            exit 1
          fi

          echo "Bundled Pepper Flash:"
          file "$PLUGIN_BIN"
          lipo -info "$PLUGIN_BIN" || true

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          rm -rf build/source
          asar extract "$ASAR" build/source

      - name: Locate Gunny main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/source \
              -type f \
              -name "main.js" \
              -print \
              | while IFS= read -r f; do
                  if grep -q "findFlashPath" "$f" 2>/dev/null; then
                    echo "$f"
                    break
                  fi
                done
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.js with findFlashPath() not found."

            grep -RniE \
              "findFlashPath|ppapi-flash-path|PepperFlashPlayer" \
              build/source \
              2>/dev/null \
              | head -300 \
              || true

            exit 1
          fi

          printf '%s\n' "$MAIN" > build/main-path.txt

          echo "Gunny main.js:"
          cat build/main-path.txt

      - name: Locate original preload
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"

          # Prefer the preload referenced by the game window if possible.
          PRELOAD="$(
            grep -n \
              -B4 \
              -A4 \
              "preload.*preload.js" \
              "$MAIN" \
              | grep -oE \
                "(path\.join\([^)]*preload\.js\)|['\"][^'\"]*preload\.js['\"])" \
              | head -n 1 \
              || true
          )"

          # Fallback to the first preload.js inside app.asar.
          PRELOAD_FILE="$(
            find build/source \
              -type f \
              -name "preload.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$PRELOAD_FILE" ]; then
            echo "ERROR: preload.js not found."
            exit 1
          fi

          REL="$(
            python3 - "$PRELOAD_FILE" <<'PY'
          from pathlib import Path
          import sys
          
          root = Path("build/source")
          p = Path(sys.argv[1])
          
          print(p.relative_to(root).as_posix())
          PY
          )"

          printf '%s\n' "$REL" > build/preload-relative.txt

          echo "Game preload candidate:"
          cat build/preload-relative.txt

      - name: Inspect game window code
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"

          echo "=========================================="
          echo "createGameWindow"
          echo "=========================================="

          grep -n \
            -A90 \
            -B10 \
            "function createGameWindow" \
            "$MAIN" \
            | head -160

      - name: Download Ruffle self-hosted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf build/ruffle
          mkdir -p build/ruffle

          cd build/ruffle

          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*web*selfhosted*.zip" \
            --clobber

          ZIP="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Ruffle self-hosted asset not found."

            echo "Available assets:"
            gh release view \
              "v${RUFFLE_VERSION}" \
              --repo ruffle-rs/ruffle \
              --json assets \
              --jq '.assets[].name'

            exit 1
          fi

          mkdir -p extracted

          unzip \
            -q \
            -o \
            "$ZIP" \
            -d extracted

      - name: Validate Ruffle
        shell: bash
        run: |
          set -euo pipefail

          RUFFLE_JS="$(
            find build/ruffle/extracted \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$RUFFLE_JS" ]; then
            echo "ERROR: ruffle.js not found."
            find build/ruffle/extracted \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -300
            exit 1
          fi

          RUFFLE_ROOT="$(dirname "$RUFFLE_JS")"
          printf '%s\n' "$RUFFLE_ROOT" > build/ruffle-root.txt

          WASM="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then
            echo "ERROR: Ruffle WASM not found."
            exit 1
          fi

          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "Ruffle JS:"
          ls -lh "$RUFFLE_JS"

          echo
          echo "Ruffle WASM:"
          ls -lh "$WASM"

      - name: Patch Gunny main.js for Ruffle
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"
          export MAIN

          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          
          p = Path(os.environ["MAIN"])
          s = p.read_text(encoding="utf-8-sig")
          original = s
          
          # ----------------------------------------------------------
          # Disable native Pepper Flash selection.
          # Only replace the actual assignment; keep the original
          # findFlashPath() function intact for source compatibility.
          # ----------------------------------------------------------
          s, n = re.subn(
              r"(\bconst\s+flashPath\s*=\s*)findFlashPath\s*\(\s*\)\s*;",
              r"\1null;",
              s,
              count=1
          )
          
          if n != 1:
              raise SystemExit(
                  "ERROR: const flashPath = findFlashPath(); not found."
              )
          
          # Remove PPAPI command-line switches wherever they occur.
          s = re.sub(
              r"""
              [A-Za-z0-9_$.\[\]]+
              \.appendSwitch
              \s*\(
              \s*['"]ppapi-flash-path['"]
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              s,
              flags=re.IGNORECASE | re.VERBOSE
          )
          
          s = re.sub(
              r"""
              [A-Za-z0-9_$.\[\]]+
              \.appendSwitch
              \s*\(
              \s*['"]ppapi-flash-version['"]
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              s,
              flags=re.IGNORECASE | re.VERBOSE
          )
          
          # Disable old Flash mms.cfg deployment if present.
          s = re.sub(
              r"(?m)^[ \t]*_deployFlashMmsCfg\s*\([^;]*\)\s*;[^\n]*\n?",
              "",
              s
          )
          
          # Remove telemetry that only means "Pepper Flash missing".
          s = re.sub(
              r"(?m)^[^\n]*flash_not_found[^\n]*\n?",
              "",
              s
          )
          
          # ----------------------------------------------------------
          # Patch ONLY createGameWindow().
          #
          # We must not globally change contextIsolation because the
          # launcher/dialog/bottom-bar preloads use contextBridge.
          # ----------------------------------------------------------
          start = s.find("function createGameWindow")
          
          if start == -1:
              raise SystemExit(
                  "ERROR: createGameWindow() not found."
              )
          
          # Use the next top-level function/const marker as a boundary.
          boundary_matches = [
              m.start()
              for m in re.finditer(
                  r"(?m)^(?:function|async\s+function|const\s+\w+\s*=|let\s+\w+\s*=|var\s+\w+\s*=)",
                  s[start + 20:]
              )
          ]
          
          if boundary_matches:
              end = start + 20 + min(boundary_matches)
          else:
              end = len(s)
          
          game = s[start:end]
          
          if "new BrowserWindow" not in game:
              raise SystemExit(
                  "ERROR: BrowserWindow not found inside createGameWindow()."
              )
          
          # Change ONLY game window settings.
          game = re.sub(
              r"(\bcontextIsolation\s*:\s*)true",
              r"\1false",
              game,
              count=1
          )
          
          game = re.sub(
              r"(\bsandbox\s*:\s*)true",
              r"\1false",
              game,
              count=1
          )
          
          # Ensure plugins remain enabled.
          game = re.sub(
              r"(\bplugins\s*:\s*)false",
              r"\1true",
              game,
              count=1
          )
          
          # Replace only the game preload property.
          preload_pattern = re.compile(
              r"""
              \bpreload\s*:\s*
              (?:
                  path\.join\s*\([\s\S]*?\)
                  |
                  ['"][^'"]*preload\.js['"]
                  |
                  [^,\n]+
              )
              \s*,?
              """,
              re.IGNORECASE | re.VERBOSE
          )
          
          game, preload_count = preload_pattern.subn(
              """preload: path.join(
                  process.resourcesPath,
                  'preload-ruffle.js'
                ),""",
              game,
              count=1
          )
          
          if preload_count != 1:
              raise SystemExit(
                  "ERROR: game window preload property was not found."
              )
          
          s = s[:start] + game + s[end:]
          
          p.write_text(
              s,
              encoding="utf-8"
          )
          
          print("main.js patched.")
          print("flashPath replaced:", n)
          print("game preload replaced:", preload_count)
          print("original bytes:", len(original))
          print("patched bytes:", len(s))
          PY

          node --check "$MAIN"

          echo
          echo "PPAPI references remaining:"
          grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN" \
            || true

          echo
          echo "Game window settings:"
          grep -n \
            -A30 \
            -B5 \
            "function createGameWindow" \
            "$MAIN" \
            | head -100

      - name: Build Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          RES="$APP/Contents/Resources"
          ORIGINAL_PRELOAD="$(cat build/preload-relative.txt)"

          cat > "$RES/preload-ruffle.js" <<EOF
          'use strict';
          
          const fs = require('fs');
          const path = require('path');
          
          const resources = process.resourcesPath;
          
          const ruffleDir = path.join(
              resources,
              'ruffle'
          );
          
          const ruffleScript = path.join(
              ruffleDir,
              'ruffle.js'
          );
          
          const originalPreload = path.join(
              resources,
              'app.asar',
              '$ORIGINAL_PRELOAD'
          );
          
          console.log(
              '[Gunny ARM64] Ruffle preload starting'
          );
          
          try {
              if (!fs.existsSync(ruffleScript)) {
                  throw new Error(
                      'ruffle.js not found: ' +
                      ruffleScript
                  );
              }
          
              const source = fs.readFileSync(
                  ruffleScript,
                  'utf8'
              );
          
              window.RufflePlayer =
                  window.RufflePlayer || {};
          
              window.RufflePlayer.config =
                  window.RufflePlayer.config || {};
          
              window.RufflePlayer.config.publicPath =
                  'file://' +
                  ruffleDir.replace(
                      /\\\\/g,
                      '/'
                  ) +
                  '/';
          
              window.RufflePlayer.config.polyfills =
                  true;
          
              window.RufflePlayer.config.favorFlash =
                  false;
          
              window.RufflePlayer.config.allowNetworking =
                  'all';
          
              // Execute the self-hosted Ruffle bundle in the
              // game page's world. contextIsolation is disabled
              // ONLY for this game window.
              window.eval(source);
          
              const ruffle =
                  window.RufflePlayer &&
                  window.RufflePlayer.newest
                      ? window.RufflePlayer.newest()
                      : null;
          
              if (!ruffle) {
                  throw new Error(
                      'RufflePlayer.newest() unavailable'
                  );
              }
          
              if (
                  typeof ruffle.pluginPolyfill !==
                  'function'
              ) {
                  throw new Error(
                      'pluginPolyfill() unavailable'
                  );
              }
          
              // Must happen before Gunny's Flash/plugin detection.
              ruffle.pluginPolyfill();
          
              console.log(
                  '[Gunny ARM64] Ruffle pluginPolyfill ENABLED'
              );
          
              if (
                  typeof ruffle.polyfill ===
                  'function'
              ) {
                  ruffle.polyfill();
          
                  console.log(
                      '[Gunny ARM64] Ruffle polyfill ENABLED'
                  );
              }
          
              console.log(
                  '[Gunny ARM64] navigator.plugins:',
                  navigator.plugins.length
              );
          
              console.log(
                  '[Gunny ARM64] navigator.mimeTypes:',
                  navigator.mimeTypes.length
              );
          } catch (error) {
              console.error(
                  '[Gunny ARM64] Ruffle initialization failed:',
                  error && error.stack
                      ? error.stack
                      : error
              );
          }
          
          // The original game preload is loaded AFTER Ruffle.
          // If it exists, preserve it.
          try {
              if (fs.existsSync(originalPreload)) {
                  require(originalPreload);
          
                  console.log(
                      '[Gunny ARM64] Original game preload loaded'
                  );
              } else {
                  console.warn(
                      '[Gunny ARM64] Original game preload not found:',
                      originalPreload
                  );
              }
          } catch (error) {
              console.error(
                  '[Gunny ARM64] Original game preload failed:',
                  error && error.stack
                      ? error.stack
                      : error
              );
          }
          EOF

          node \
            --check \
            "$RES/preload-ruffle.js"

          echo "preload-ruffle.js syntax: OK"

      - name: Install Ruffle and patched app.asar into build app
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$ELECTRON_URL" \
            -o build/electron-arm64.zip

          rm -rf build/electron
          mkdir -p build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          ELECTRON_BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          file "$ELECTRON_BIN"
          lipo -info "$ELECTRON_BIN"

          if ! file "$ELECTRON_BIN" | grep -q "arm64"; then
            echo "ERROR: Electron is not ARM64."
            exit 1
          fi

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          ORIGINAL="$(cat build/original-app.txt)"
          SRC="$ORIGINAL/Contents/Resources"
          DST="build/Gunny PC ARM64.app/Contents/Resources"

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"

          ROOT="$(cat build/ruffle-root.txt)"

          rm -rf \
            "$DST/ruffle"

          mkdir -p \
            "$DST/ruffle"

          cp -R \
            "$ROOT"/. \
            "$DST/ruffle/"

          asar pack \
            build/source \
            "$DST/app.asar"

      - name: Fix packaged files
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          RES="$APP/Contents/Resources"

          # The previous step generated preload-ruffle.js in the
          # source app only. Recreate it in the final app with the
          # same contents, avoiding any dependency on that source path.
          ORIGINAL_PRELOAD="$(cat build/preload-relative.txt)"

          cat > "$RES/preload-ruffle.js" <<EOF
          'use strict';
          
          const fs = require('fs');
          const path = require('path');
          
          const resources = process.resourcesPath;
          const ruffleDir = path.join(resources, 'ruffle');
          const ruffleScript = path.join(ruffleDir, 'ruffle.js');
          const originalPreload = path.join(resources, 'app.asar', '$ORIGINAL_PRELOAD');
          
          try {
              const source = fs.readFileSync(ruffleScript, 'utf8');
          
              window.RufflePlayer = window.RufflePlayer || {};
              window.RufflePlayer.config = window.RufflePlayer.config || {};
              window.RufflePlayer.config.publicPath =
                  'file://' + ruffleDir.replace(/\\\\/g, '/') + '/';
              window.RufflePlayer.config.polyfills = true;
              window.RufflePlayer.config.favorFlash = false;
              window.RufflePlayer.config.allowNetworking = 'all';
          
              window.eval(source);
          
              const ruffle =
                  window.RufflePlayer &&
                  window.RufflePlayer.newest
                      ? window.RufflePlayer.newest()
                      : null;
          
              if (!ruffle) {
                  throw new Error('RufflePlayer.newest() unavailable');
              }
          
              if (typeof ruffle.pluginPolyfill !== 'function') {
                  throw new Error('pluginPolyfill() unavailable');
              }
          
              ruffle.pluginPolyfill();
          
              if (typeof ruffle.polyfill === 'function') {
                  ruffle.polyfill();
              }
          
              console.log('[Gunny ARM64] Ruffle initialized');
              console.log('[Gunny ARM64] plugins:', navigator.plugins.length);
              console.log('[Gunny ARM64] mimeTypes:', navigator.mimeTypes.length);
          } catch (error) {
              console.error(
                  '[Gunny ARM64] Ruffle initialization failed:',
                  error && error.stack ? error.stack : error
              );
          }
          
          try {
              if (fs.existsSync(originalPreload)) {
                  require(originalPreload);
              }
          } catch (error) {
              console.error(
                  '[Gunny ARM64] Original game preload failed:',
                  error && error.stack ? error.stack : error
              );
          }
          EOF

          node \
            --check \
            "$RES/preload-ruffle.js"

          rm -rf \
            "$RES/plugins"

          MAIN="$APP/Contents/MacOS/Electron"

          if [ -f "$MAIN" ]; then
            mv \
              "$MAIN" \
              "$APP/Contents/MacOS/Gunny PC"
          fi

          chmod +x \
            "$APP/Contents/MacOS/Gunny PC"

          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

      - name: Verify final app
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          MAIN="$APP/Contents/MacOS/Gunny PC"
          RES="$APP/Contents/Resources"

          echo "Main:"
          file "$MAIN"
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "arm64"; then
            echo "ERROR: final app is not ARM64."
            exit 1
          fi

          echo
          echo "Ruffle:"
          test -f "$RES/ruffle/ruffle.js"
          test -f "$RES/preload-ruffle.js"

          echo
          echo "Pepper Flash:"
          if find "$APP" \
            \( -iname "*PepperFlash*" -o -iname "*pepflash*" \) \
            -print \
            | grep -q .
          then
            echo "ERROR: Pepper Flash remains."
            exit 1
          fi

          echo "Pepper Flash removed."

          echo
          echo "Intel Mach-O scan:"
          find "$APP" \
            -type f \
            -exec sh -c '
              INFO="$(file "$1" 2>/dev/null || true)"
              case "$INFO" in
                *"Mach-O"*)
                  printf "%s\n" "$INFO"
                  ;;
              esac
            ' _ {} \; \
            > build/macho.txt

          if grep -Eiq "x86_64|i386" build/macho.txt; then
            echo "ERROR: Intel Mach-O remains:"
            grep -Ei "x86_64|i386" build/macho.txt
            exit 1
          fi

          echo "No Intel Mach-O detected."

      - name: Sign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          xattr -cr "$APP" || true

          find "$APP/Contents" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + \
            || true

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "release/Gunny-PC-ARM64-Ruffle.zip"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/dmg
          mkdir -p build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "release/Gunny-PC-ARM64-Ruffle.dmg"

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          MAIN="$APP/Contents/MacOS/Gunny PC"

          {
            echo "Gunny PC ARM64 + Ruffle"
            echo
            file "$MAIN"
            echo
            echo "Ruffle:"
            test -f \
              "$APP/Contents/Resources/ruffle/ruffle.js" \
              && echo "OK"
            echo
            echo "Ruffle preload:"
            test -f \
              "$APP/Contents/Resources/preload-ruffle.js" \
              && echo "OK"
            echo
            echo "Pepper Flash:"
            if find "$APP" \
              \( -iname "*PepperFlash*" -o -iname "*pepflash*" \) \
              | grep -q .
            then
              echo "FOUND"
            else
              echo "REMOVED"
            fi
          } > release/build-report.txt

          cat release/build-report.txt

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: release/Gunny-PC-ARM64-Ruffle.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: release/Gunny-PC-ARM64-Ruffle.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: release/build-report.txt
          if-no-files-found: error
          retention-days: 14
