name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"
  APP_NAME: "Gunny PC"

  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Gunny PC ARM64 + Ruffle

    runs-on: macos-14

    steps:


      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 02. SYSTEM INFO
      # ==========================================================

      - name: System information
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          sw_vers

          echo
          uname -a

          echo
          echo "Runner:"
          uname -m


      # ==========================================================
      # 03. INSTALL ASAR
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          npm install -g @electron/asar

          echo
          echo "Node:"
          node --version

          echo
          echo "asar:"
          asar --version

          echo
          echo "GitHub CLI:"
          gh --version


      # ==========================================================
      # 04. PREPARE
      # ==========================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            download \
            original \
            build \
            output

          mkdir -p \
            download \
            original \
            build \
            output


      # ==========================================================
      # 05. DOWNLOAD ORIGINAL GUNNY
      # ==========================================================

      - name: Download original Gunny
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$GUNNY_URL" \
            -o download/gunny-original.zip

          echo
          echo "Downloaded:"
          ls -lh download/gunny-original.zip

          echo
          file download/gunny-original.zip


      # ==========================================================
      # 06. VERIFY ZIP
      # ==========================================================

      - name: Verify Gunny archive
        shell: bash
        run: |
          set -euo pipefail

          if ! unzip -t download/gunny-original.zip >/dev/null; then
            echo "ERROR: Gunny archive is invalid."
            exit 1
          fi

          echo "Gunny ZIP: OK"


      # ==========================================================
      # 07. EXTRACT ORIGINAL
      # ==========================================================

      - name: Extract original Gunny
        shell: bash
        run: |
          set -euo pipefail

          unzip \
            -q \
            -o \
            download/gunny-original.zip \
            -d original

          rm -rf original/__MACOSX

          echo
          echo "Applications:"

          find original \
            -type d \
            -name "*.app" \
            -print


      # ==========================================================
      # 08. FIND GUNNY APP
      # ==========================================================

      - name: Locate Gunny PC.app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find original \
              -type d \
              -name "Gunny PC.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny PC.app not found."
            exit 1
          fi

          printf '%s\n' "$APP" \
            > build/original-app.txt

          echo
          echo "Original app:"
          cat build/original-app.txt


      # ==========================================================
      # 09. CHECK ORIGINAL ELECTRON
      # ==========================================================

      - name: Inspect original executable
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          echo "Original executable:"

          file \
            "$APP/Contents/MacOS/Gunny PC"


      # ==========================================================
      # 10. EXTRACT ORIGINAL ASAR
      # ==========================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          cp \
            "$ASAR" \
            build/app-original.asar

          rm -rf \
            build/gunny-source

          asar extract \
            build/app-original.asar \
            build/gunny-source

          echo
          echo "app.asar extracted."


      # ==========================================================
      # 11. FIND MAIN.JS
      # ==========================================================

      - name: Locate main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/gunny-source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.js not found."
            exit 1
          fi

          printf '%s\n' "$MAIN" \
            > build/main-path.txt

          cp \
            "$MAIN" \
            build/main-original.js

          echo
          echo "main.js:"
          cat build/main-path.txt


      # ==========================================================
      # 12. ANALYZE ORIGINAL MAIN.JS
      # ==========================================================

      - name: Analyze original main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          echo "=========================================="
          echo "FLASH / PRELOAD ANALYSIS"
          echo "=========================================="

          echo
          echo "Flash references:"

          grep -niE \
            "Flash path|PepperFlash|ppapi-flash|flashPath|flash_not_found" \
            "$MAIN" \
            | head -200 \
            || true

          echo
          echo "BrowserWindow / preload:"

          grep -niE \
            "BrowserWindow|webPreferences|preload" \
            "$MAIN" \
            | head -250 \
            || true


      # ==========================================================
      # 13. VERIFY ORIGINAL PRELOAD
      # ==========================================================

      - name: Verify original preload
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          PRELOAD="$APP/Contents/Resources/preload.js"

          if [ ! -f "$PRELOAD" ]; then
            echo "ERROR: Original Resources/preload.js not found."
            exit 1
          fi

          cp \
            "$PRELOAD" \
            build/preload-original.js

          echo
          echo "Original preload:"
          ls -lh build/preload-original.js

          node \
            --check \
            build/preload-original.js

          echo
          echo "Original preload syntax: OK"


      # ==========================================================
      # 14. DOWNLOAD RUFFLE
      # ==========================================================

      - name: Download Ruffle self-hosted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUFFLE ${RUFFLE_VERSION}"
          echo "=========================================="

          rm -f \
            build/ruffle-selfhosted.zip

          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*web-selfhosted.zip" \
            --output build/ruffle-selfhosted.zip

          echo
          echo "Ruffle archive:"
          ls -lh build/ruffle-selfhosted.zip

          echo
          file build/ruffle-selfhosted.zip

          echo
          echo "Testing archive:"

          unzip -t \
            build/ruffle-selfhosted.zip


      # ==========================================================
      # 15. EXTRACT RUFFLE
      # ==========================================================

      - name: Extract Ruffle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/ruffle

          mkdir -p \
            build/ruffle

          unzip \
            -q \
            -o \
            build/ruffle-selfhosted.zip \
            -d build/ruffle

          RUFFLE_JS="$(
            find build/ruffle \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$RUFFLE_JS" ]; then

            echo "ERROR: ruffle.js not found."

            find build/ruffle \
              -maxdepth 6 \
              -print \
              | sort

            exit 1

          fi

          RUFFLE_ROOT="$(
            dirname "$RUFFLE_JS"
          )"

          printf '%s\n' "$RUFFLE_ROOT" \
            > build/ruffle-root.txt

          echo
          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "ruffle.js:"
          ls -lh "$RUFFLE_JS"

          echo
          echo "WASM:"

          find "$RUFFLE_ROOT" \
            -type f \
            -name "*.wasm" \
            -print

          WASM_COUNT="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$WASM_COUNT" -eq 0 ]; then
            echo "ERROR: Ruffle WASM not found."
            exit 1
          fi

          echo
          echo "Ruffle package: OK"


      # ==========================================================
      # 16. DOWNLOAD ELECTRON ARM64
      # ==========================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          echo "=========================================="
          echo "ELECTRON ARM64"
          echo "=========================================="

          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$URL" \
            -o build/electron-arm64.zip

          echo
          ls -lh build/electron-arm64.zip


      # ==========================================================
      # 17. EXTRACT ELECTRON
      # ==========================================================

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/electron

          mkdir -p \
            build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          printf '%s\n' "$ELECTRON_APP" \
            > build/electron-app.txt

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          echo
          file "$BIN"

          echo
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "arm64"; then
            echo "ERROR: Electron binary is not ARM64."
            exit 1
          fi


      # ==========================================================
      # 18. PATCH MAIN.JS
      # ==========================================================

      - name: Patch main.js for Ruffle
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          main = Path(os.environ["MAIN"])

          s = main.read_text(
              encoding="utf-8-sig"
          )


          # ======================================================
          # REMOVE THE REAL PEPPER FLASH BLOCK
          #
          # This is the exact block present in the supplied Gunny
          # main.js:
          #
          #   // ── Flash path
          #   function findFlashPath() { ... }
          #   const flashPath = findFlashPath();
          #   ...
          #
          # Replace it with a harmless null value.
          # ======================================================

          start_marker = (
              "// ── Flash path"
          )

          end_marker = (
              "process.env.ELECTRON_DISABLE_SECURITY_WARNINGS"
          )

          start = s.find(
              start_marker
          )

          end = s.find(
              end_marker
          )

          if start == -1:
              raise SystemExit(
                  "ERROR: exact Flash path block was not found"
              )

          if end == -1:
              raise SystemExit(
                  "ERROR: Flash block end was not found"
              )

          replacement = r"""
          // ── Flash replacement: Ruffle ───────────────────────────
          // Pepper Flash / PPAPI has been removed for the ARM64 build.
          // Flash content is handled by Ruffle through preload.js.
          const flashPath = null;

          """

          s = (
              s[:start]
              + replacement
              + s[end:]
          )


          # ======================================================
          # REMOVE THE PEPPER FLASH mms.cfg CALL
          # ======================================================

          s = s.replace(
              "_deployFlashMmsCfg();",
              "// Pepper Flash mms.cfg disabled for Ruffle."
          )


          # ======================================================
          # REMOVE FLASH-NOT-FOUND TRACKING
          # ======================================================

          s = re.sub(
              r"^[ \t]*if\s*\(!flashPath\)\s*tracker\.track\(\s*['\"]flash_not_found['\"][^\n]*\n",
              "",
              s,
              flags=re.MULTILINE
          )


          # ======================================================
          # REMOVE THE OLD MAC FLASH WARNING
          #
          # This prevents the ARM64 build from saying that Flash is
          # missing after we intentionally removed Pepper Flash.
          # ======================================================

          warning_start = (
              "  // macOS: Flash warning"
          )

          warning_end = (
              "  // X\\u1eed l\\u00fd protocol URL"
          )

          ws = s.find(
              warning_start
          )

          if ws != -1:

              we = s.find(
                  warning_end,
                  ws
              )

              if we == -1:

                  raise SystemExit(
                      "ERROR: Flash warning end marker not found"
                  )

              s = (
                  s[:ws]
                  + s[we:]
              )


          # ======================================================
          # KEEP Chromium plugins ENABLED
          #
          # We do not disable Electron's plugin machinery because
          # Ruffle's pluginPolyfill emulates Flash plugin detection.
          # ======================================================

          s = re.sub(
              r"plugins\s*:\s*false",
              "plugins: true",
              s
          )


          # ======================================================
          # WRITE
          # ======================================================

          main.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "main.js patched successfully."
          )

          PY


          echo
          echo "Checking JavaScript syntax..."

          node \
            --check \
            "$MAIN"

          echo
          echo "main.js syntax: OK"


          echo
          echo "Checking PPAPI:"

          if grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN"
          then
            echo "ERROR: PPAPI switch still exists."
            exit 1
          else
            echo "PPAPI switches: REMOVED"
          fi


          echo
          echo "Checking PepperFlash path:"

          if grep -niE \
            "PepperFlashPlayer\\.plugin|pepflashplayer\\.dll" \
            "$MAIN"
          then
            echo "ERROR: Pepper Flash path still exists."
            exit 1
          else
            echo "Pepper Flash path: REMOVED"
          fi


      # ==========================================================
      # 19. CREATE RUFFLE PRELOAD
      # ==========================================================

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          cat > build/preload.js <<'EOF'
          'use strict';

          /*
           * Gunny PC ARM64 + Ruffle
           *
           * This wrapper replaces the original Gunny preload.
           *
           * Order:
           *
           *   1. Load Ruffle into MAIN WORLD.
           *   2. Run pluginPolyfill().
           *   3. Run Ruffle polyfill().
           *   4. Load original Gunny preload.
           *
           * Electron preload scripts execute before page scripts,
           * so this happens before Gunny's page JavaScript.
           */

          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const { webFrame } = require('electron');


          const resourcesPath =
            process.resourcesPath;


          const rufflePath =
            path.join(
              resourcesPath,
              'ruffle'
            );


          const ruffleJSPath =
            path.join(
              rufflePath,
              'ruffle.js'
            );


          const originalPreload =
            path.join(
              resourcesPath,
              'preload-gunny-original.js'
            );


          function loadRuffle() {

            try {

              if (
                !fs.existsSync(
                  ruffleJSPath
                )
              ) {

                console.error(
                  '[Ruffle] ruffle.js not found:',
                  ruffleJSPath
                );

                return false;
              }


              const ruffleSource =
                fs.readFileSync(
                  ruffleJSPath,
                  'utf8'
                );


              /*
               * Ruffle uses publicPath to find its WASM.
               *
               * pathToFileURL handles spaces and special
               * characters in the macOS application path.
               */

              const publicPath =
                pathToFileURL(
                  rufflePath + path.sep
                ).href;


              const config =
                JSON.stringify({

                  publicPath:
                    publicPath,

                  polyfills:
                    true,

                  favorFlash:
                    false,

                  allowScriptAccess:
                    true,

                  allowNetworking:
                    'all',

                  playerVersion:
                    31

                });


              /*
               * Execute in WORLD 0 = page/main world.
               *
               * This is important because contextIsolation=true
               * means normal preload globals are isolated from
               * Gunny's page.
               */

              const code =
                "(function() {" +
                "window.RufflePlayer = window.RufflePlayer || {};" +
                "window.RufflePlayer.config = Object.assign(" +
                "{}," +
                "window.RufflePlayer.config || {}," +
                config +
                ");" +
                "\n" +
                ruffleSource +
                "\n" +
                "var api = window.RufflePlayer && " +
                "window.RufflePlayer.newest && " +
                "window.RufflePlayer.newest();" +
                "if (api && typeof api.pluginPolyfill === 'function') {" +
                "api.pluginPolyfill();" +
                "console.log('[Ruffle] pluginPolyfill OK');" +
                "}" +
                "if (api && typeof api.polyfill === 'function') {" +
                "api.polyfill();" +
                "console.log('[Ruffle] polyfill OK');" +
                "}" +
                "console.log('[Ruffle] initialized:', " +
                "api ? api.version : 'unknown');" +
                "})();";


              let executionError = null;


              /*
               * executeJavaScript() runs in the page's main world.
               * The callback is invoked after execution.
               */

              webFrame.executeJavaScript(
                code,
                false,
                function (_result, error) {

                  if (error) {
                    executionError = error;

                    console.error(
                      '[Ruffle] execution error:',
                      error
                    );

                    return;
                  }

                  console.log(
                    '[Ruffle] main-world initialization complete'
                  );

                }
              );


              if (executionError) {
                return false;
              }


              return true;

            }
            catch (error) {

              console.error(
                '[Ruffle] initialization failed:',
                error
              );

              return false;

            }

          }


          /*
           * Ruffle MUST be initialized before the original Gunny
           * preload begins its Flash detection timer.
           */

          loadRuffle();


          /*
           * Preserve the original Gunny preload.
           *
           * It exposes window.gunny and sends flash-ready after
           * detecting <embed>/<object>. Ruffle's plugin polyfill
           * preserves that part of the launcher flow.
           */

          try {

            if (
              fs.existsSync(
                originalPreload
              )
            ) {

              require(
                originalPreload
              );

            }
            else {

              console.error(
                '[Gunny] original preload missing:',
                originalPreload
              );

            }

          }
          catch (error) {

            console.error(
              '[Gunny] original preload failed:',
              error
            );

          }
          EOF

          echo
          echo "Checking generated preload..."

          node \
            --check \
            build/preload.js

          echo
          echo "Ruffle preload syntax: OK"


      # ==========================================================
      # 20. REPACK ASAR
      # ==========================================================

      - name: Repack app.asar
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            build/app-arm64.asar

          asar pack \
            build/gunny-source \
            build/app-arm64.asar

          echo
          ls -lh \
            build/app-arm64.asar


      # ==========================================================
      # 21. CREATE ARM64 APP FROM ELECTRON
      # ==========================================================

      - name: Create ARM64 application
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          echo
          echo "Electron ARM64 application created."


      # ==========================================================
      # 22. COPY GUNNY RESOURCES
      # ==========================================================

      - name: Copy Gunny resources
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL_APP="$(
            cat build/original-app.txt
          )"

          SRC="$ORIGINAL_APP/Contents/Resources"

          DST="build/Gunny PC ARM64.app/Contents/Resources"

          echo "Copying Gunny Resources..."

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="default_app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"

          echo
          echo "Resources copied."


      # ==========================================================
      # 23. INSTALL PATCHED ASAR
      # ==========================================================

      - name: Install patched app.asar
        shell: bash
        run: |
          set -euo pipefail

          RESOURCES="build/Gunny PC ARM64.app/Contents/Resources"

          rm -f \
            "$RESOURCES/app.asar"

          rm -f \
            "$RESOURCES/default_app.asar"

          cp \
            build/app-arm64.asar \
            "$RESOURCES/app.asar"

          echo
          ls -lh \
            "$RESOURCES/app.asar"


      # ==========================================================
      # 24. INSTALL ORIGINAL PRELOAD AS BACKUP
      # ==========================================================

      - name: Install original preload backup
        shell: bash
        run: |
          set -euo pipefail

          RESOURCES="build/Gunny PC ARM64.app/Contents/Resources"

          if [ ! -f \
            "$RESOURCES/preload.js"
          ]; then

            echo "ERROR: Resources/preload.js missing."
            exit 1

          fi

          mv \
            "$RESOURCES/preload.js" \
            "$RESOURCES/preload-gunny-original.js"

          cp \
            build/preload.js \
            "$RESOURCES/preload.js"

          echo
          echo "New preload:"
          ls -lh \
            "$RESOURCES/preload.js"

          echo
          echo "Original preload backup:"
          ls -lh \
            "$RESOURCES/preload-gunny-original.js"

          node \
            --check \
            "$RESOURCES/preload.js"


      # ==========================================================
      # 25. INSTALL RUFFLE
      # ==========================================================

      - name: Install Ruffle runtime
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ROOT="$(
            cat build/ruffle-root.txt
          )"

          DEST="$APP/Contents/Resources/ruffle"

          rm -rf \
            "$DEST"

          mkdir -p \
            "$DEST"

          cp -R \
            "$ROOT"/. \
            "$DEST"/

          if [ ! -f \
            "$DEST/ruffle.js"
          ]; then

            echo "ERROR: ruffle.js not installed."
            exit 1

          fi

          WASM="$(
            find "$DEST" \
              -type f \
              -name "*.wasm" \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then

            echo "ERROR: Ruffle WASM not installed."
            exit 1

          fi

          echo
          echo "Ruffle installed."

          echo
          echo "ruffle.js:"
          ls -lh \
            "$DEST/ruffle.js"

          echo
          echo "WASM:"
          ls -lh \
            "$WASM"


      # ==========================================================
      # 26. REMOVE PEPPER FLASH
      # ==========================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLUGINS="$APP/Contents/Resources/plugins"

          rm -rf \
            "$PLUGINS"


          echo
          echo "Checking for Pepper Flash..."

          FOUND="$(
            find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*PepperFlashPlayer*" \
                -o \
                -iname "*pepflash*" \
              \) \
              -print
          )"


          if [ -n "$FOUND" ]; then

            echo
            echo "ERROR: Pepper Flash still exists:"
            echo "$FOUND"

            exit 1

          fi


          echo
          echo "Pepper Flash: ABSENT"


      # ==========================================================
      # 27. RENAME ELECTRON BINARY
      # ==========================================================

      - name: Rename Electron binary
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN_DIR="$APP/Contents/MacOS"

          if [ ! -f \
            "$BIN_DIR/Electron"
          ]; then

            echo "ERROR: Electron binary not found."

            ls -la \
              "$BIN_DIR"

            exit 1

          fi

          mv \
            "$BIN_DIR/Electron" \
            "$BIN_DIR/Gunny PC"

          chmod +x \
            "$BIN_DIR/Gunny PC"

          echo
          file \
            "$BIN_DIR/Gunny PC"

          echo
          lipo -info \
            "$BIN_DIR/Gunny PC"


      # ==========================================================
      # 28. UPDATE INFO.PLIST
      # ==========================================================

      - name: Update Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          echo
          plutil -p \
            "$PLIST"


      # ==========================================================
      # 29. VERIFY ARM64
      # ==========================================================

      - name: Verify ARM64
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS/Gunny PC"

          INFO="$(
            file "$BIN"
          )"

          echo "$INFO"

          if ! echo "$INFO" | grep -q "arm64"; then
            echo "ERROR: executable is not ARM64."
            exit 1
          fi

          if echo "$INFO" | grep -q "x86_64"; then
            echo "ERROR: x86_64 is present in main executable."
            exit 1
          fi

          echo
          echo "Main executable: ARM64 ONLY"


      # ==========================================================
      # 30. VERIFY FINAL ASAR
      # ==========================================================

      - name: Verify final ASAR
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY FINAL ASAR"
          echo "=========================================="

          APP="build/Gunny PC ARM64.app"
          ASAR="$APP/Contents/Resources/app.asar"
          SOURCE="build/final-source"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found:"
            echo "$ASAR"
            exit 1
          fi

          rm -rf \
            "$SOURCE"

          asar extract \
            "$ASAR" \
            "$SOURCE"

          MAIN="$(
            find "$SOURCE" \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: final main.js not found."
            exit 1
          fi

          echo
          echo "Final main.js:"
          echo "$MAIN"

          echo
          echo "Checking JavaScript syntax..."

          node \
            --check \
            "$MAIN"

          echo
          echo "JavaScript syntax: OK"

          echo
          echo "Checking PPAPI..."

          if grep -niE \
            'ppapi-flash-path|ppapi-flash-version' \
            "$MAIN"
          then
            echo "ERROR: PPAPI still present."
            exit 1
          else
            echo "PPAPI: ABSENT"
          fi


      # ==========================================================
      # 31. VERIFY RUFFLE
      # ==========================================================

      - name: Verify Ruffle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle"

          if [ ! -f \
            "$RUFFLE/ruffle.js"
          ]; then

            echo "ERROR: ruffle.js missing."
            exit 1

          fi

          WASM="$(
            find "$RUFFLE" \
              -type f \
              -name "*.wasm" \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then

            echo "ERROR: Ruffle WASM missing."
            exit 1

          fi

          echo
          echo "Ruffle:"
          echo "OK"

          echo
          echo "JS:"
          ls -lh \
            "$RUFFLE/ruffle.js"

          echo
          echo "WASM:"
          ls -lh \
            "$WASM"


      # ==========================================================
      # 32. VERIFY PRELOAD
      # ==========================================================

      - name: Verify preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PRELOAD="$APP/Contents/Resources/preload.js"

          ORIGINAL="$APP/Contents/Resources/preload-gunny-original.js"

          test -f \
            "$PRELOAD"

          test -f \
            "$ORIGINAL"

          node \
            --check \
            "$PRELOAD"

          node \
            --check \
            "$ORIGINAL"

          echo
          echo "Ruffle preload: OK"

          echo
          echo "Original Gunny preload: OK"

          echo
          echo "Ruffle references:"

          grep -nE \
            'Ruffle|pluginPolyfill|polyfill|ruffle.js' \
            "$PRELOAD" \
            | head -100


      # ==========================================================
      # 33. VERIFY NO PEPPER FLASH
      # ==========================================================

      - name: Final Pepper Flash scan
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          FOUND="$(
            find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*PepperFlashPlayer*" \
                -o \
                -iname "*pepflash*" \
              \) \
              -print
          )"

          if [ -n "$FOUND" ]; then

            echo "ERROR: Pepper Flash found:"
            echo "$FOUND"

            exit 1

          fi

          echo
          echo "Pepper Flash: ABSENT"


      # ==========================================================
      # 34. REMOVE QUARANTINE
      # ==========================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr \
            "build/Gunny PC ARM64.app" \
            || true


      # ==========================================================
      # 35. AD-HOC SIGN
      # ==========================================================

      - name: Ad-hoc code sign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ==========================================================
      # 36. BUILD REPORT
      # ==========================================================

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS/Gunny PC"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Architecture:"
            file "$BIN"

            echo
            echo "Ruffle:"
            if [ -f \
              "$APP/Contents/Resources/ruffle/ruffle.js"
            ]; then
              echo "OK"
            else
              echo "MISSING"
            fi

            echo
            echo "Ruffle WASM:"
            find \
              "$APP/Contents/Resources/ruffle" \
              -type f \
              -name "*.wasm" \
              -print

            echo
            echo "Pepper Flash:"
            if find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*pepflash*" \
              \) \
              | grep -q .; then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "PPAPI:"
            if grep -RniE \
              'ppapi-flash-path|ppapi-flash-version' \
              build/final-source \
              >/dev/null 2>&1; then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "Preload:"
            if [ -f \
              "$APP/Contents/Resources/preload.js"
            ]; then
              echo "OK"
            else
              echo "MISSING"
            fi

          } > \
            output/build-report.txt

          cat \
            output/build-report.txt


      # ==========================================================
      # 37. CREATE ZIP
      # ==========================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.zip

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "output/Gunny-PC-ARM64-Ruffle.zip"

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.zip


      # ==========================================================
      # 38. CREATE DMG
      # ==========================================================

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/dmg

          mkdir -p \
            build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.dmg

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            output/Gunny-PC-ARM64-Ruffle.dmg

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.dmg


      # ==========================================================
      # 39. UPLOAD ZIP
      # ==========================================================

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: output/Gunny-PC-ARM64-Ruffle.zip
          retention-days: 7


      # ==========================================================
      # 40. UPLOAD DMG
      # ==========================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: output/Gunny-PC-ARM64-Ruffle.dmg
          retention-days: 7


      # ==========================================================
      # 41. UPLOAD APP
      # ==========================================================

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-App
          path: build/Gunny PC ARM64.app/
          retention-days: 7


      # ==========================================================
      # 42. UPLOAD REPORT
      # ==========================================================

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: output/build-report.txt
          retention-days: 7
