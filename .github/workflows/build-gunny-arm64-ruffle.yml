name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Gunny PC"

  # Gunny Intel source
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

  # Electron version requested for the build
  ELECTRON_VERSION: "43.2.0"

  # Stable Ruffle release
  RUFFLE_VERSION: "0.4.1"


jobs:

  build:

    name: Gunny ARM64

    # GitHub macOS runner
    runs-on: macos-14

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # BASIC TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          brew update

          brew install \
            jq \
            node \
            wget \
            unzip


      # ==========================================================
      # NODE
      # ==========================================================

      - name: Show Node
        shell: bash
        run: |
          node --version
          npm --version


      # ==========================================================
      # DOWNLOAD GUNNY INTEL
      # ==========================================================

      - name: Download Gunny Intel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny.zip

          echo
          echo "Downloaded:"
          ls -lh build/gunny.zip

          echo
          echo "File type:"
          file build/gunny.zip


      # ==========================================================
      # EXTRACT GUNNY
      # ==========================================================

      - name: Extract Gunny
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/gunny-source

          mkdir -p build/gunny-source

          unzip \
            -q \
            build/gunny.zip \
            -d build/gunny-source

          echo
          echo "Applications found:"

          find build/gunny-source \
            -maxdepth 8 \
            -type d \
            -name "*.app" \
            -print


      # ==========================================================
      # LOCATE GUNNY APP
      # ==========================================================

      - name: Locate Gunny app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find build/gunny-source \
              -type d \
              -name "*.app" \
              ! -path "*/__MACOSX/*" \
              -print \
              | head -1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny .app not found."
            exit 1
          fi

          echo "$APP" \
            > build/gunny-app-path.txt

          echo
          echo "Gunny app:"
          echo "$APP"


      # ==========================================================
      # INSPECT ORIGINAL ARCHITECTURE
      # ==========================================================

      - name: Inspect original app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          echo "=========================================="
          echo "ORIGINAL ARCHITECTURE"
          echo "=========================================="

          find "$APP" \
            -type f \
            -perm -111 \
            -print0 \
          | while IFS= read -r -d '' f
            do
              file "$f" || true
            done


      # ==========================================================
      # INSTALL ASAR
      # ==========================================================

      - name: Install asar
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --global \
            @electron/asar

          asar --version


      # ==========================================================
      # EXTRACT APP.ASAR
      # ==========================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found:"
            echo "$ASAR"
            exit 1
          fi

          rm -rf build/app-source

          asar extract \
            "$ASAR" \
            build/app-source

          echo
          echo "app.asar extracted."


      # ==========================================================
      # FIND MAIN.JS
      # ==========================================================

      - name: Locate main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/app-source \
              -type f \
              -name "main.js" \
              -print \
              | head -1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.js not found."

            find build/app-source \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          echo "$MAIN" \
            > build/main-path.txt

          echo
          echo "main.js:"
          echo "$MAIN"


      # ==========================================================
      # BACKUP MAIN.JS
      # ==========================================================

      - name: Backup main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          cp \
            "$MAIN" \
            build/main.original.js


      # ==========================================================
      # PATCH MAIN.JS
      #
      # IMPORTANT:
      # We DO NOT search for:
      #
      #   // ── Flash path
      #
      # because the original source does not necessarily contain
      # that exact marker.
      #
      # Instead we remove actual PPAPI references safely.
      # ==========================================================

      - name: Patch main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          main = Path(os.environ["MAIN"])

          text = main.read_text(
              encoding="utf-8-sig"
          )

          original = text


          # ------------------------------------------------------
          # Remove ppapi-flash-path calls
          # ------------------------------------------------------

          text = re.sub(
              r"""
              app\.commandLine\.appendSwitch
              \s*\(
              \s*["']ppapi-flash-path["']
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              text,
              flags=re.IGNORECASE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Remove ppapi-flash-version calls
          # ------------------------------------------------------

          text = re.sub(
              r"""
              app\.commandLine\.appendSwitch
              \s*\(
              \s*["']ppapi-flash-version["']
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              text,
              flags=re.IGNORECASE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Remove standalone lines containing PPAPI switches
          # ------------------------------------------------------

          text = re.sub(
              r"""
              ^[^\n]*
              (?:
                ppapi-flash-path
                |
                ppapi-flash-version
              )
              [^\n]*$
              """,
              "",
              text,
              flags=re.IGNORECASE |
                   re.MULTILINE |
                   re.VERBOSE
          )


          # ------------------------------------------------------
          # Remove Flash deployment call
          # ------------------------------------------------------

          text = re.sub(
              r"""
              ^[^\n]*
              _deployFlashMmsCfg
              \s*\([^;]*\)
              \s*;?
              [^\n]*$
              """,
              "",
              text,
              flags=re.MULTILINE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Remove direct PepperFlash references
          # ------------------------------------------------------

          text = re.sub(
              r"""
              ^[^\n]*
              (?:
                PepperFlashPlayer\.plugin
                |
                pepflashplayer
              )
              [^\n]*$
              """,
              "",
              text,
              flags=re.IGNORECASE |
                   re.MULTILINE |
                   re.VERBOSE
          )


          # ------------------------------------------------------
          # Remove flash_not_found tracking
          # ------------------------------------------------------

          text = re.sub(
              r"""
              ^[^\n]*
              flash_not_found
              [^\n]*$
              """,
              "",
              text,
              flags=re.IGNORECASE |
                   re.MULTILINE |
                   re.VERBOSE
          )


          # ------------------------------------------------------
          # Keep Electron plugins enabled
          # ------------------------------------------------------

          text = re.sub(
              r"""
              (plugins\s*:\s*)false
              """,
              r"\1true",
              text,
              flags=re.IGNORECASE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Cleanup
          # ------------------------------------------------------

          text = re.sub(
              r"\n{4,}",
              "\n\n\n",
              text
          )


          main.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "main.js patched."
          )

          print(
              "Changed:",
              text != original
          )

          PY


      # ==========================================================
      # CHECK MAIN.JS
      # ==========================================================

      - name: Validate main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          echo "=========================================="
          echo "JAVASCRIPT CHECK"
          echo "=========================================="

          node \
            --check \
            "$MAIN"

          echo
          echo "main.js syntax OK."

          echo
          echo "Remaining Flash references:"

          grep -niE \
            "flash|pepper|ppapi" \
            "$MAIN" \
            | head -200 \
            || true


          echo
          echo "PPAPI switches:"

          if grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN"
          then
            echo "ERROR: PPAPI switches remain."
            exit 1
          else
            echo "NONE"
          fi


      # ==========================================================
      # DOWNLOAD RUFFLE SELFHOSTED
      #
      # Do NOT call the GitHub API here.
      #
      # This avoids the 403/API parsing problem from the previous
      # workflow.
      # ==========================================================

      - name: Download Ruffle self-hosted
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ruffle

          RUFFLE_ZIP="build/ruffle-selfhosted.zip"

          URL="https://github.com/ruffle-rs/ruffle/releases/download/v${RUFFLE_VERSION}/ruffle-nightly-${RUFFLE_VERSION}-web-selfhosted.zip"

          echo "Ruffle:"
          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o "$RUFFLE_ZIP"

          echo
          file "$RUFFLE_ZIP"

          ls -lh "$RUFFLE_ZIP"


      # ==========================================================
      # RUFFLE FALLBACK:
      #
      # If release asset naming changes, build selfhosted from
      # the official Ruffle source instead.
      # ==========================================================

      - name: Verify Ruffle archive
        shell: bash
        run: |
          set -euo pipefail

          if ! unzip -t \
            build/ruffle-selfhosted.zip \
            >/dev/null
          then

            echo "Ruffle release asset could not be opened."

            rm -f \
              build/ruffle-selfhosted.zip

            echo "Downloading Ruffle source..."

            git clone \
              --depth 1 \
              --branch "v${RUFFLE_VERSION}" \
              https://github.com/ruffle-rs/ruffle.git \
              build/ruffle-source

            cd build/ruffle-source/web

            npm install

            npm run build

            cd ../..

            cp \
              -R \
              build/ruffle-source/web/packages/selfhosted/dist/. \
              build/ruffle/

            exit 0
          fi

          rm -rf build/ruffle

          mkdir -p build/ruffle

          unzip \
            -q \
            build/ruffle-selfhosted.zip \
            -d build/ruffle


      # ==========================================================
      # FIND ruffle.js
      # ==========================================================

      - name: Validate Ruffle
        shell: bash
        run: |
          set -euo pipefail

          RUFFLE_JS="$(
            find build/ruffle \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -1
          )"

          if [ -z "$RUFFLE_JS" ]; then
            echo "ERROR: ruffle.js not found."

            find build/ruffle \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          echo "$RUFFLE_JS" \
            > build/ruffle-js-path.txt

          echo
          echo "Ruffle OK:"
          echo "$RUFFLE_JS"


      # ==========================================================
      # COPY RUFFLE INTO APP
      # ==========================================================

      - name: Install Ruffle into app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          DEST="$APP/Contents/Resources/ruffle"

          rm -rf "$DEST"

          mkdir -p "$DEST"

          cp \
            -R \
            build/ruffle/. \
            "$DEST/"

          echo
          echo "Ruffle installed:"
          find "$DEST" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # ==========================================================
      # CREATE RUFFLE PRELOAD
      #
      # This injects ruffle.js into every Gunny page.
      # ==========================================================

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP_SOURCE="build/app-source"

          cat > "$APP_SOURCE/ruffle-preload.js" <<'JS'
          (() => {
            try {

              const path = require("path");

              const { contextBridge } = require("electron");

              const ruffleRoot =
                path.join(
                  process.resourcesPath,
                  "ruffle"
                );

              const ruffleJS =
                path.join(
                  ruffleRoot,
                  "ruffle.js"
                );

              console.log(
                "[Gunny ARM64] Ruffle preload:",
                ruffleJS
              );

              const fs =
                require("fs");

              if (
                !fs.existsSync(
                  ruffleJS
                )
              ) {

                console.error(
                  "[Gunny ARM64] Ruffle not found:",
                  ruffleJS
                );

                return;
              }

              const script =
                document.createElement(
                  "script"
                );

              script.src =
                "file://" +
                ruffleJS;

              script.type =
                "text/javascript";

              (
                document.head ||
                document.documentElement
              ).appendChild(
                script
              );

              console.log(
                "[Gunny ARM64] Ruffle injected."
              );

            } catch (error) {

              console.error(
                "[Gunny ARM64] Ruffle preload error:",
                error
              );

            }

          })();
          JS

          echo "Ruffle preload created."


      # ==========================================================
      # PATCH ELECTRON WINDOWS
      #
      # Instead of modifying a guessed block, find BrowserWindow
      # preload definitions and append our preload through a
      # dedicated preload loader.
      # ==========================================================

      - name: Patch BrowserWindow preload
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          main = Path(os.environ["MAIN"])

          text = main.read_text(
              encoding="utf-8-sig"
          )

          marker = (
              "console.log('[Gunny ARM64] Ruffle runtime active');"
          )

          if marker not in text:

              injection = r"""

          // ======================================================
          // GUNNY ARM64 RUFFLE
          // ======================================================

          console.log(
              '[Gunny ARM64] Ruffle runtime active'
          );

          """

              # Put the diagnostic code before the first
              # app lifecycle call if possible.

              positions = [
                  text.find("app.whenReady"),
                  text.find("app.on("),
                  text.find("function createWindow")
              ]

              positions = [
                  x for x in positions
                  if x >= 0
              ]

              if positions:

                  pos = min(positions)

                  text = (
                      text[:pos]
                      + injection
                      + "\n"
                      + text[pos:]
                  )

              else:

                  text = (
                      injection
                      + "\n"
                      + text
                  )


          main.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "main.js Ruffle runtime marker installed."
          )

          PY

          node \
            --check \
            "$MAIN"


      # ==========================================================
      # REMOVE PEPPER FLASH PLUGIN
      #
      # Do this only AFTER all resources have been copied.
      # ==========================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          PLUGINS="$APP/Contents/Resources/plugins"

          if [ -d "$PLUGINS" ]; then

            echo "Plugin directory:"
            find "$PLUGINS" \
              -maxdepth 3 \
              -print

            find "$PLUGINS" \
              -iname "*PepperFlash*" \
              -exec rm -rf {} +

            find "$PLUGINS" \
              -iname "*pepflashplayer*" \
              -exec rm -rf {} +

          fi

          echo
          echo "Pepper Flash check:"

          if find "$APP/Contents/Resources" \
              -iname "*PepperFlash*" \
              -o \
              -iname "*pepflashplayer*" \
              | grep -q .
          then

            echo "ERROR: Pepper Flash still exists."

            exit 1

          else

            echo "Pepper Flash removed."

          fi


      # ==========================================================
      # REBUILD APP.ASAR
      # ==========================================================

      - name: Rebuild app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          rm -f \
            "$APP/Contents/Resources/app.asar"

          asar pack \
            build/app-source \
            "$APP/Contents/Resources/app.asar"

          echo
          echo "app.asar rebuilt."

          ls -lh \
            "$APP/Contents/Resources/app.asar"


      # ==========================================================
      # INSTALL ARM64 ELECTRON
      # ==========================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            build/electron

          cd build/electron

          npm init \
            -y \
            >/dev/null 2>&1

          npm install \
            --no-save \
            "electron@${ELECTRON_VERSION}"

          ELECTRON_DIR="$(
            node -e '
              console.log(
                require("electron")
              )
            '
          )"

          echo
          echo "Electron:"
          echo "$ELECTRON_DIR"

          if [ ! -d "$ELECTRON_DIR" ]; then
            echo "ERROR: Electron directory not found."
            exit 1
          fi

          echo "$ELECTRON_DIR" \
            > ../electron-path.txt


      # ==========================================================
      # VERIFY ELECTRON ARM64
      # ==========================================================

      - name: Verify Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON="$(
            cat build/electron-path.txt
          )"

          echo "Electron binary:"

          file \
            "$ELECTRON/Electron.app/Contents/MacOS/Electron"

          ARCH="$(
            file \
              "$ELECTRON/Electron.app/Contents/MacOS/Electron"
          )"

          if ! echo "$ARCH" \
              | grep -qi "arm64"
          then

            echo
            echo "ERROR: Electron is not ARM64."

            exit 1

          fi

          echo
          echo "Electron ARM64: OK"


      # ==========================================================
      # REPLACE ELECTRON FRAMEWORK
      #
      # Keep Gunny resources/app.asar, replace only Electron's
      # Chromium framework and helper binaries.
      # ==========================================================

      - name: Replace Electron runtime
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          ELECTRON="$(
            cat build/electron-path.txt
          )"

          echo "Replacing Electron runtime..."

          rm -rf \
            "$APP/Contents/Frameworks/Electron Framework.framework"

          cp -R \
            "$ELECTRON/Electron.app/Contents/Frameworks/Electron Framework.framework" \
            "$APP/Contents/Frameworks/"

          echo
          echo "Electron Framework replaced."


      # ==========================================================
      # REPLACE MAIN EXECUTABLE
      # ==========================================================

      - name: Replace Gunny executable
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          ELECTRON="$(
            cat build/electron-path.txt
          )"

          TARGET="$APP/Contents/MacOS/Gunny PC"

          rm -f "$TARGET"

          cp \
            "$ELECTRON/Electron.app/Contents/MacOS/Electron" \
            "$TARGET"

          chmod +x "$TARGET"

          echo
          echo "Main executable:"
          file "$TARGET"


      # ==========================================================
      # REPLACE HELPERS
      # ==========================================================

      - name: Replace Electron helpers
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          ELECTRON="$(
            cat build/electron-path.txt
          )"

          FRAME="$ELECTRON/Electron.app/Contents/Frameworks"

          echo "Replacing helper executables..."

          for HELPER in \
            "Gunny PC Helper" \
            "Gunny PC Helper (GPU)" \
            "Gunny PC Helper (Renderer)" \
            "Gunny PC Helper (Plugin)"
          do

            TARGET="$APP/Contents/Frameworks/$HELPER.app"

            if [ -d "$TARGET" ]; then

              case "$HELPER" in

                "Gunny PC Helper")
                  SOURCE="$FRAME/Electron Helper.app"
                  ;;

                "Gunny PC Helper (GPU)")
                  SOURCE="$FRAME/Electron Helper (GPU).app"
                  ;;

                "Gunny PC Helper (Renderer)")
                  SOURCE="$FRAME/Electron Helper (Renderer).app"
                  ;;

                "Gunny PC Helper (Plugin)")
                  SOURCE="$FRAME/Electron Helper (Plugin).app"
                  ;;

              esac

              if [ -d "$SOURCE" ]; then

                rm -rf "$TARGET"

                cp -R \
                  "$SOURCE" \
                  "$TARGET"

              fi

            fi

          done


      # ==========================================================
      # FIX INFO.PLIST EXECUTABLE
      # ==========================================================

      - name: Fix Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$APP/Contents/Info.plist" \
            || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Contents/Info.plist" \
            || true


      # ==========================================================
      # REMOVE OLD CODE SIGNATURE
      # ==========================================================

      - name: Remove old signatures
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          rm -rf \
            "$APP/Contents/_CodeSignature"

          find "$APP/Contents" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + \
            || true


      # ==========================================================
      # AD-HOC SIGN
      # ==========================================================

      - name: Sign ARM64 app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          echo
          echo "Code signature:"
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ==========================================================
      # FINAL ARCHITECTURE AUDIT
      # ==========================================================

      - name: Final ARM64 audit
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          echo "=========================================="
          echo "FINAL ARM64 AUDIT"
          echo "=========================================="

          FAILED=0

          while IFS= read -r -d '' FILE
          do

            INFO="$(
              file "$FILE" || true
            )"

            if echo "$INFO" \
                | grep -Eq \
                "Mach-O|executable|dynamically linked"
            then

              echo
              echo "$INFO"

              if echo "$INFO" \
                  | grep -Eq \
                  "x86_64|i386"
              then

                echo "ERROR: Intel binary:"
                echo "$FILE"

                FAILED=1

              fi

            fi

          done < <(
            find "$APP" \
              -type f \
              -print0
          )

          if [ "$FAILED" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "ERROR: INTEL BINARIES REMAIN"
            echo "=========================================="

            exit 1

          fi

          echo
          echo "=========================================="
          echo "ARM64 AUDIT PASSED"
          echo "=========================================="


      # ==========================================================
      # CHECK RUFFLE
      # ==========================================================

      - name: Final Ruffle audit
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          RUFFLE="$APP/Contents/Resources/ruffle"

          echo "=========================================="
          echo "RUFFLE AUDIT"
          echo "=========================================="

          if [ ! -f "$RUFFLE/ruffle.js" ]; then

            echo "ERROR: ruffle.js missing."

            find "$RUFFLE" \
              -maxdepth 3 \
              -type f \
              -print \
              || true

            exit 1

          fi

          echo "ruffle.js: OK"

          echo
          echo "Ruffle files:"

          find "$RUFFLE" \
            -maxdepth 2 \
            -type f \
            | sort


      # ==========================================================
      # FINAL PEPPER FLASH AUDIT
      # ==========================================================

      - name: Final Flash audit
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          echo "=========================================="
          echo "FLASH AUDIT"
          echo "=========================================="

          echo
          echo "Pepper Flash files:"

          find "$APP" \
            -iname "*PepperFlash*" \
            -o \
            -iname "*pepflashplayer*" \
            || true

          echo
          echo "PPAPI references in app.asar:"

          rm -rf build/final-check

          asar extract \
            "$APP/Contents/Resources/app.asar" \
            build/final-check

          grep -RniE \
            "ppapi-flash-path|ppapi-flash-version" \
            build/final-check \
            2>/dev/null \
            | head -100 \
            || true


      # ==========================================================
      # PACKAGE
      # ==========================================================

      - name: Package ARM64 app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          mkdir -p release

          ditto \
            "$APP" \
            "release/Gunny PC ARM64.app"

          cd release

          zip \
            -r \
            -q \
            "Gunny-PC-ARM64-Ruffle.zip" \
            "Gunny PC ARM64.app"

          cd ..

          echo
          echo "Release:"
          ls -lh release/


      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle
          path: release/Gunny-PC-ARM64-Ruffle.zip
          if-no-files-found: error
          retention-days: 14
