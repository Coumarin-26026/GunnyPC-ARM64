name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Gunny PC"
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

jobs:
  build:
    name: Gunny PC ARM64 + Ruffle
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @electron/asar

          echo "Node:"
          node --version

          echo "ASAR:"
          asar --version

          echo "GitHub CLI:"
          gh --version

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build release
          mkdir -p build release

      - name: Download Gunny
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny.zip

          file build/gunny.zip
          ls -lh build/gunny.zip

      - name: Extract Gunny
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/gunny

          unzip \
            -q \
            -o \
            build/gunny.zip \
            -d build/gunny

          rm -rf build/gunny/__MACOSX

          find build/gunny \
            -type d \
            -name "*.app" \
            -print

      - name: Locate Gunny app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find build/gunny \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny app not found."
            exit 1
          fi

          printf '%s\n' "$APP" > build/original-app.txt

          echo "Original app:"
          cat build/original-app.txt

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          rm -rf build/source
          asar extract "$ASAR" build/source

          echo "app.asar extracted."

      - name: Locate main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.js not found."
            exit 1
          fi

          printf '%s\n' "$MAIN" > build/main-path.txt

          echo "main.js:"
          cat build/main-path.txt

      - name: Locate original preload
        shell: bash
        run: |
          set -euo pipefail

          PRELOAD="$(
            find build/source \
              -type f \
              \( \
                -name "preload.js" \
                -o \
                -name "*preload*.js" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$PRELOAD" ]; then
            echo "ERROR: preload.js not found."
            exit 1
          fi

          REL="$(
            python3 - "$PRELOAD" <<'PY'
          from pathlib import Path
          import sys
          
          p = Path(sys.argv[1])
          root = Path("build/source")
          print(p.relative_to(root).as_posix())
          PY
          )"

          printf '%s\n' "$REL" > build/preload-relative.txt

          echo "Original preload:"
          cat build/preload-relative.txt

      - name: Download Ruffle self-hosted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf build/ruffle
          mkdir -p build/ruffle

          cd build/ruffle

          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*web*selfhosted*.zip" \
            --clobber

          ZIP="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Ruffle self-hosted ZIP not found."
            ls -lah
            exit 1
          fi

          mkdir -p extracted

          unzip \
            -q \
            -o \
            "$ZIP" \
            -d extracted

      - name: Validate Ruffle
        shell: bash
        run: |
          set -euo pipefail

          RUFFLE_JS="$(
            find build/ruffle/extracted \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$RUFFLE_JS" ]; then
            echo "ERROR: ruffle.js not found."
            find build/ruffle/extracted \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -300
            exit 1
          fi

          RUFFLE_ROOT="$(dirname "$RUFFLE_JS")"
          printf '%s\n' "$RUFFLE_ROOT" > build/ruffle-root.txt

          WASM="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then
            echo "ERROR: Ruffle WASM not found."
            exit 1
          fi

          echo "Ruffle root:"
          cat build/ruffle-root.txt

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o build/electron-arm64.zip

          file build/electron-arm64.zip

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          printf '%s\n' "$ELECTRON_APP" > build/electron-app.txt

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          file "$BIN"
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "arm64"; then
            echo "ERROR: Electron is not ARM64."
            exit 1
          fi

      - name: Create ARM64 app
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_APP="$(cat build/electron-app.txt)"

          rm -rf "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

      - name: Copy Gunny resources
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL="$(cat build/original-app.txt)"
          SRC="$ORIGINAL/Contents/Resources"
          DST="build/Gunny PC ARM64.app/Contents/Resources"

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"

            - name: Patch BrowserWindow for Ruffle
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"

          export MAIN

          echo "=========================================="
          echo "PATCH ELECTRON BrowserWindow"
          echo "=========================================="

          echo
          echo "main.js:"
          echo "$MAIN"

          echo
          echo "BrowserWindow references:"
          grep -niE \
            "BrowserWindow|BrowserWindow\s*\(" \
            "$MAIN" \
            | head -100 \
            || true

          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          
          main = Path(os.environ["MAIN"])
          
          source = main.read_text(
              encoding="utf-8-sig"
          )
          
          print(
              "main.js size:",
              len(source),
              "bytes"
          )
          
          # ---------------------------------------------------------
          # CASE 1:
          # BrowserWindow already has webPreferences
          # ---------------------------------------------------------
          
          if re.search(
              r"\bwebPreferences\s*:",
              source
          ):
          
              print(
                  "webPreferences already exists."
              )
          
              # Remove existing preload property.
              source = re.sub(
                  r"(?m)^[ \t]*preload\s*:[^\n]*,?[ \t]*\n?",
                  "",
                  source
              )
          
              # Remove existing plugins property.
              source = re.sub(
                  r"(?m)^[ \t]*plugins\s*:[^\n]*,?[ \t]*\n?",
                  "",
                  source
              )
          
              # Remove existing contextIsolation.
              source = re.sub(
                  r"(?m)^[ \t]*contextIsolation\s*:[^\n]*,?[ \t]*\n?",
                  "",
                  source
              )
          
              # Remove existing sandbox.
              source = re.sub(
                  r"(?m)^[ \t]*sandbox\s*:[^\n]*,?[ \t]*\n?",
                  "",
                  source
              )
          
              # Insert our settings immediately after
              # webPreferences: {
              source, count = re.subn(
                  r"(\bwebPreferences\s*:\s*\{)",
                  r"""\1
                      contextIsolation: false,
                      sandbox: false,
                      plugins: true,
                      preload: require('path').join(
                          process.resourcesPath,
                          'preload-ruffle.js'
                      ),""",
                  source,
                  count=1
              )
          
              if count != 1:
                  raise SystemExit(
                      "ERROR: Could not patch existing webPreferences."
                  )
          
              print(
                  "Existing webPreferences patched."
              )
          
          
          # ---------------------------------------------------------
          # CASE 2:
          # main.js has BrowserWindow but NO webPreferences
          # ---------------------------------------------------------
          
          else:
          
              print(
                  "webPreferences not present."
              )
          
              # Match:
              #
              # new BrowserWindow({
              #
              # or:
              #
              # new electron.BrowserWindow({
              #
              # or:
              #
              # new BrowserWindow (
              #
              pattern = re.compile(
                  r"new\s+(?:[\w$.]+\.)?BrowserWindow\s*\(\s*\{"
              )
          
              match = pattern.search(source)
          
              if not match:
                  print(
                      "ERROR: BrowserWindow constructor not found."
                  )
          
                  print(
                      "\nPossible Electron window constructors:"
                  )
          
                  for line_no, line in enumerate(
                      source.splitlines(),
                      1
                  ):
                      if "BrowserWindow" in line:
                          print(
                              f"{line_no}: {line[:500]}"
                          )
          
                  raise SystemExit(
                      "Cannot safely patch BrowserWindow."
                  )
          
              injection = """{
                  webPreferences: {
                      contextIsolation: false,
                      sandbox: false,
                      plugins: true,
                      preload: require('path').join(
                          process.resourcesPath,
                          'preload-ruffle.js'
                      )
                  },
          """
          
              start = match.start()
          
              # Replace only the opening `{`
              brace_pos = source.find(
                  "{",
                  start,
                  match.end()
              )
          
              if brace_pos == -1:
                  raise SystemExit(
                      "ERROR: BrowserWindow opening brace not found."
                  )
          
              source = (
                  source[:brace_pos]
                  + injection
                  + source[brace_pos + 1:]
              )
          
              print(
                  "Created new webPreferences object."
              )
          
          
          # ---------------------------------------------------------
          # WRITE
          # ---------------------------------------------------------
          
          main.write_text(
              source,
              encoding="utf-8"
          )
          
          print(
              "main.js patched successfully."
          )
          PY

          echo
          echo "=========================================="
          echo "JAVASCRIPT SYNTAX"
          echo "=========================================="

          node \
            --check \
            "$MAIN"

          echo
          echo "JavaScript syntax: OK"

          echo
          echo "=========================================="
          echo "VERIFY RUFFLE SETTINGS"
          echo "=========================================="

          grep -niE \
            "BrowserWindow|webPreferences|contextIsolation|sandbox|plugins|preload-ruffle" \
            "$MAIN" \
            | head -300 \
            || true

          echo
          echo "=========================================="
          echo "VERIFY preload-ruffle"
          echo "=========================================="

          if grep -q \
            "preload-ruffle.js" \
            "$MAIN"
          then
            echo "preload-ruffle.js: FOUND"
          else
            echo "ERROR: preload-ruffle.js was not inserted."
            exit 1
          fi

      - name: Install Ruffle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          RES="$APP/Contents/Resources"
          RUFFLE_ROOT="$(cat build/ruffle-root.txt)"

          rm -rf "$RES/ruffle"
          mkdir -p "$RES/ruffle"

          cp -R \
            "$RUFFLE_ROOT"/. \
            "$RES/ruffle/"

          test -f "$RES/ruffle/ruffle.js"

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          RES="$APP/Contents/Resources"
          ORIGINAL_PRELOAD="$(cat build/preload-relative.txt)"

          cat > "$RES/preload-ruffle.js" <<EOF
          'use strict';
          
          const fs = require('fs');
          const path = require('path');
          
          const resources = process.resourcesPath;
          
          const ruffleFile = path.join(
              resources,
              'ruffle',
              'ruffle.js'
          );
          
          const originalPreload = path.join(
              resources,
              'app.asar',
              '$ORIGINAL_PRELOAD'
          );
          
          console.log(
              '[Gunny ARM64] Ruffle preload starting'
          );
          
          function loadRuffle() {
              if (!fs.existsSync(ruffleFile)) {
                  throw new Error(
                      'ruffle.js not found: ' + ruffleFile
                  );
              }
          
              const source = fs.readFileSync(
                  ruffleFile,
                  'utf8'
              );
          
              window.RufflePlayer =
                  window.RufflePlayer || {};
          
              window.RufflePlayer.config =
                  window.RufflePlayer.config || {};
          
              window.RufflePlayer.config.polyfills = true;
              window.RufflePlayer.config.favorFlash = false;
              window.RufflePlayer.config.allowNetworking = 'all';
          
              const publicPath =
                  'file://' +
                  path.join(
                      resources,
                      'ruffle'
                  ).replace(
                      /\\\\/g,
                      '/'
                  ) +
                  '/';
          
              window.RufflePlayer.config.publicPath =
                  publicPath;
          
              window.eval(source);
          
              const ruffle =
                  window.RufflePlayer.newest();
          
              if (!ruffle) {
                  throw new Error(
                      'Ruffle newest() failed'
                  );
              }
          
              if (
                  typeof ruffle.pluginPolyfill !==
                  'function'
              ) {
                  throw new Error(
                      'pluginPolyfill() unavailable'
                  );
              }
          
              ruffle.pluginPolyfill();
          
              console.log(
                  '[Gunny ARM64] Ruffle pluginPolyfill ENABLED'
              );
          
              if (
                  typeof ruffle.polyfill ===
                  'function'
              ) {
                  ruffle.polyfill();
          
                  console.log(
                      '[Gunny ARM64] Ruffle polyfill ENABLED'
                  );
              }
          
              try {
                  console.log(
                      '[Gunny ARM64] plugins:',
                      navigator.plugins.length
                  );
          
                  console.log(
                      '[Gunny ARM64] mimeTypes:',
                      navigator.mimeTypes.length
                  );
              } catch (_) {}
          }
          
          try {
              loadRuffle();
          } catch (error) {
              console.error(
                  '[Gunny ARM64] Ruffle error:',
                  error
              );
          }
          
          try {
              if (fs.existsSync(originalPreload)) {
                  console.log(
                      '[Gunny ARM64] Loading original preload'
                  );
          
                  require(originalPreload);
              } else {
                  console.warn(
                      '[Gunny ARM64] Original preload not found:',
                      originalPreload
                  );
              }
          } catch (error) {
              console.error(
                  '[Gunny ARM64] Original preload error:',
                  error
              );
          }
          EOF

          node --check "$RES/preload-ruffle.js"

          echo "Ruffle preload: OK"

      - name: Rebuild app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          ASAR="$APP/Contents/Resources/app.asar"

          rm -f "$ASAR"

          asar pack \
            build/source \
            "$ASAR"

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          rm -rf \
            "$APP/Contents/Resources/plugins"

          if find "$APP" \
            \( \
              -iname "*PepperFlash*" \
              -o \
              -iname "*pepflashplayer*" \
            \) \
            -print \
            | grep -q .
          then
            echo "ERROR: Pepper Flash remains."
            exit 1
          fi

          echo "Pepper Flash: removed."

      - name: Rename Electron
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          BIN="$APP/Contents/MacOS"

          if [ ! -f "$BIN/Electron" ]; then
            echo "ERROR: Electron executable missing."
            exit 1
          fi

          rm -f "$BIN/Gunny PC"

          mv \
            "$BIN/Electron" \
            "$BIN/Gunny PC"

          chmod +x "$BIN/Gunny PC"

      - name: Update Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          plutil -p "$PLIST"

      - name: Remove quarantine
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr \
            "build/Gunny PC ARM64.app" \
            || true

      - name: Remove old signatures
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          rm -rf \
            "$APP/Contents/_CodeSignature"

          find "$APP/Contents" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + \
            || true

      - name: Verify ARM64
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          MAIN="$APP/Contents/MacOS/Gunny PC"

          file "$MAIN"
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "arm64"; then
            echo "ERROR: Main executable is not ARM64."
            exit 1
          fi

          if file "$MAIN" | grep -q "x86_64"; then
            echo "ERROR: x86_64 main executable."
            exit 1
          fi

          echo "ARM64: OK"

      - name: Final Mach-O audit
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          REPORT="build/macho-report.txt"

          rm -f "$REPORT"

          find "$APP" \
            -type f \
            -exec sh -c '
              INFO="$(file "$1" 2>/dev/null || true)"

              case "$INFO" in
                *"Mach-O"*)
                  printf "%s\n" "$INFO"
                  ;;
              esac
            ' _ {} \; \
            > "$REPORT"

          cat "$REPORT"

          echo
          echo "Checking x86_64..."

          if grep -Eiq "x86_64" "$REPORT"; then
            echo "ERROR: x86_64 binary remains."
            grep -Ei "x86_64" "$REPORT"
            exit 1
          fi

          echo "x86_64: NONE"

          echo
          echo "Checking i386..."

          if grep -Eiq "i386" "$REPORT"; then
            echo "ERROR: i386 binary remains."
            grep -Ei "i386" "$REPORT"
            exit 1
          fi

          echo "i386: NONE"

      - name: Verify final app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"
          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf build/final-source

          asar extract \
            "$ASAR" \
            build/final-source

          MAIN="$(
            find build/final-source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: final main.js missing."
            exit 1
          fi

          node --check "$MAIN"

          echo "Final main.js: OK"

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            release/Gunny-PC-ARM64-Ruffle.zip

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            release/Gunny-PC-ARM64-Ruffle.zip

          ls -lh \
            release/Gunny-PC-ARM64-Ruffle.zip

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            release/Gunny-PC-ARM64-Ruffle.dmg

          rm -rf build/dmg

          mkdir -p build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            release/Gunny-PC-ARM64-Ruffle.dmg

          ls -lh \
            release/Gunny-PC-ARM64-Ruffle.dmg

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: release/Gunny-PC-ARM64-Ruffle.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: release/Gunny-PC-ARM64-Ruffle.dmg
          if-no-files-found: error
          retention-days: 14
