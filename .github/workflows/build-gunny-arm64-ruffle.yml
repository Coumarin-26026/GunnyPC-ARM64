name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"
  APP_NAME: "Gunny PC"

  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Gunny ARM64 + Ruffle

    runs-on: macos-14

    steps:


      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 02. SYSTEM
      # ==========================================================

      - name: System information
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          sw_vers

          echo
          uname -a

          echo
          echo "Architecture:"
          uname -m


      # ==========================================================
      # 03. TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          brew install p7zip

          npm install -g @electron/asar

          echo
          echo "Node:"
          node --version

          echo
          echo "asar:"
          asar --version

          echo
          echo "gh:"
          gh --version


      # ==========================================================
      # 04. PREPARE
      # ==========================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            download \
            original \
            build \
            output

          mkdir -p \
            download \
            original \
            build \
            output


      # ==========================================================
      # 05. DOWNLOAD ORIGINAL GUNNY
      # ==========================================================

      - name: Download Gunny
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$GUNNY_URL" \
            -o download/gunny.zip

          echo
          ls -lh \
            download/gunny.zip

          echo
          file \
            download/gunny.zip


      # ==========================================================
      # 06. EXTRACT ORIGINAL
      # ==========================================================

      - name: Extract Gunny
        shell: bash
        run: |
          set -euo pipefail

          unzip \
            -q \
            -o \
            download/gunny.zip \
            -d original

          rm -rf \
            original/__MACOSX

          echo
          echo "Apps:"

          find original \
            -type d \
            -name "*.app" \
            -print


      # ==========================================================
      # 07. FIND APP
      # ==========================================================

      - name: Find Gunny app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find original \
              -type d \
              -name "Gunny PC.app" \
              -print \
              | head -1
          )"

          if [ -z "$APP" ]; then

            echo "ERROR: Gunny PC.app not found."

            find original \
              -type d \
              -name "*.app" \
              -print

            exit 1

          fi

          echo "$APP" \
            > build/original-app.txt

          echo
          echo "Gunny:"
          cat build/original-app.txt


      # ==========================================================
      # 08. INSPECT ORIGINAL
      # ==========================================================

      - name: Inspect original Gunny
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          echo "=========================================="
          echo "ORIGINAL GUNNY"
          echo "=========================================="

          echo
          echo "Main executable:"

          file \
            "$APP/Contents/MacOS/Gunny PC"

          echo
          echo "Resources:"

          find \
            "$APP/Contents/Resources" \
            -maxdepth 2 \
            -print \
            | sort \
            | head -300


      # ==========================================================
      # 09. EXTRACT ASAR
      # ==========================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then

            echo "ERROR: app.asar missing."

            exit 1

          fi

          cp \
            "$ASAR" \
            build/original.asar

          rm -rf \
            build/gunny-source

          asar extract \
            build/original.asar \
            build/gunny-source

          echo
          echo "ASAR extracted."


      # ==========================================================
      # 10. FIND MAIN.JS
      # ==========================================================

      - name: Find main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/gunny-source \
              -type f \
              -name "main.js" \
              -print \
              | head -1
          )"

          if [ -z "$MAIN" ]; then

            echo "ERROR: main.js not found."

            find build/gunny-source \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -500

            exit 1

          fi

          echo "$MAIN" \
            > build/main-path.txt

          cp \
            "$MAIN" \
            build/main-original.js

          echo
          echo "main.js:"
          cat build/main-path.txt


      # ==========================================================
      # 11. FIND PRELOADS
      # ==========================================================

      - name: Analyze preload files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PRELOAD ANALYSIS"
          echo "=========================================="

          echo
          echo "Files named preload:"

          find build/gunny-source \
            -type f \
            \( \
              -iname "*preload*.js" \
              -o \
              -iname "preload.js" \
            \) \
            -print \
            | sort

          echo
          echo "Preload references in main.js:"

          MAIN="$(
            cat build/main-path.txt
          )"

          grep -niE \
            "preload|webPreferences" \
            "$MAIN" \
            | head -200 \
            || true


      # ==========================================================
      # 12. ANALYZE FLASH
      # ==========================================================

      - name: Analyze Flash
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          echo "=========================================="
          echo "FLASH ANALYSIS"
          echo "=========================================="

          echo
          echo "Pepper Flash:"

          grep -niE \
            "PepperFlash|PepperFlashPlayer|pepflash" \
            "$MAIN" \
            | head -200 \
            || true

          echo
          echo "PPAPI:"

          grep -niE \
            "ppapi-flash|ppapi" \
            "$MAIN" \
            | head -200 \
            || true

          echo
          echo "plugins:"

          grep -niE \
            "plugins[[:space:]]*:" \
            "$MAIN" \
            | head -100 \
            || true

          echo
          echo "SharedObject:"

          grep -RniE \
            "SharedObject|SharedObjects" \
            build/gunny-source \
            --include="*.js" \
            | head -100 \
            || true


      # ==========================================================
      # 13. DOWNLOAD RUFFLE
      # ==========================================================

      - name: Download Ruffle self-hosted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUFFLE"
          echo "=========================================="

          rm -f \
            build/ruffle.zip

          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*web-selfhosted.zip" \
            --output build/ruffle.zip

          echo
          echo "Downloaded:"

          ls -lh \
            build/ruffle.zip

          echo
          echo "Testing archive:"

          unzip -t \
            build/ruffle.zip


      # ==========================================================
      # 14. EXTRACT RUFFLE
      # ==========================================================

      - name: Extract Ruffle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/ruffle

          mkdir -p \
            build/ruffle

          unzip \
            -q \
            -o \
            build/ruffle.zip \
            -d build/ruffle

          echo
          echo "Searching ruffle.js..."

          RUFFLE_JS="$(
            find build/ruffle \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -1
          )"

          if [ -z "$RUFFLE_JS" ]; then

            echo "ERROR: ruffle.js missing."

            find build/ruffle \
              -maxdepth 6 \
              -print \
              | sort

            exit 1

          fi

          RUFFLE_ROOT="$(
            dirname "$RUFFLE_JS"
          )"

          echo "$RUFFLE_ROOT" \
            > build/ruffle-root.txt

          echo
          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "ruffle.js:"
          ls -lh "$RUFFLE_JS"

          echo
          echo "WASM:"

          find "$RUFFLE_ROOT" \
            -type f \
            -name "*.wasm" \
            -print

          WASM_COUNT="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$WASM_COUNT" -eq 0 ]; then

            echo "ERROR: Ruffle WASM missing."

            exit 1

          fi


      # ==========================================================
      # 15. DOWNLOAD ELECTRON ARM64
      # ==========================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$URL" \
            -o build/electron.zip

          echo
          ls -lh \
            build/electron.zip


      # ==========================================================
      # 16. EXTRACT ELECTRON
      # ==========================================================

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/electron

          mkdir -p \
            build/electron

          unzip \
            -q \
            -o \
            build/electron.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -1
          )"

          if [ -z "$ELECTRON_APP" ]; then

            echo "ERROR: Electron.app missing."

            exit 1

          fi

          echo "$ELECTRON_APP" \
            > build/electron-app.txt

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          file "$BIN"

          echo
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "arm64"; then

            echo "ERROR: Electron is not ARM64."

            exit 1

          fi


      # ==========================================================
      # 17. COPY RUFFLE TO SOURCE
      # ==========================================================

      - name: Copy Ruffle
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(
            cat build/ruffle-root.txt
          )"

          rm -rf \
            build/gunny-source/ruffle

          mkdir -p \
            build/gunny-source/ruffle

          cp -R \
            "$ROOT"/. \
            build/gunny-source/ruffle/

          test -f \
            build/gunny-source/ruffle/ruffle.js


      # ==========================================================
      # 18. PATCH MAIN.JS
      # ==========================================================

      - name: Patch main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          main = Path(os.environ["MAIN"])

          s = main.read_text(
              encoding="utf-8-sig"
          )


          # ======================================================
          # REMOVE ONLY PPAPI SWITCH CALLS
          # ======================================================

          patterns = [

              r"""
              app\.commandLine\.appendSwitch
              \s*\(
              \s*['"]ppapi-flash-path['"]
              \s*,[\s\S]*?
              \);
              """,

              r"""
              app\.commandLine\.appendSwitch
              \s*\(
              \s*['"]ppapi-flash-version['"]
              \s*,[\s\S]*?
              \);
              """

          ]


          for pattern in patterns:

              s = re.sub(
                  pattern,
                  "\n",
                  s,
                  flags=
                    re.IGNORECASE |
                    re.VERBOSE
              )


          # ======================================================
          # REMOVE OLD FLASH-NOT-FOUND TRACKING
          # ======================================================

          s = re.sub(
              r"^[^\n]*flash_not_found[^\n]*$",
              "",
              s,
              flags=
                re.IGNORECASE |
                re.MULTILINE
          )


          # ======================================================
          # KEEP ELECTRON PLUGINS ENABLED
          # ======================================================

          s = re.sub(
              r"plugins\s*:\s*false",
              "plugins: true",
              s
          )


          main.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "main.js patched."
          )

          PY


          echo
          echo "JavaScript syntax:"

          node \
            --check \
            "$MAIN"


          echo
          echo "PPAPI references:"

          grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN" \
            || true


      # ==========================================================
      # 19. REPACK ASAR
      # ==========================================================

      - name: Repack app.asar
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            build/app-arm64.asar

          asar pack \
            build/gunny-source \
            build/app-arm64.asar

          ls -lh \
            build/app-arm64.asar


      # ==========================================================
      # 20. CREATE ARM64 APP
      # ==========================================================

      - name: Create ARM64 application
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"


      # ==========================================================
      # 21. COPY GUNNY RESOURCES
      # ==========================================================

      - name: Copy Gunny resources
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL="$(
            cat build/original-app.txt
          )"

          SRC="$ORIGINAL/Contents/Resources"

          DST="build/Gunny PC ARM64.app/Contents/Resources"

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="default_app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"


      # ==========================================================
      # 22. INSTALL ASAR
      # ==========================================================

      - name: Install patched ASAR
        shell: bash
        run: |
          set -euo pipefail

          RESOURCES="build/Gunny PC ARM64.app/Contents/Resources"

          rm -f \
            "$RESOURCES/app.asar"

          rm -f \
            "$RESOURCES/default_app.asar"

          cp \
            build/app-arm64.asar \
            "$RESOURCES/app.asar"


      # ==========================================================
      # 23. INSTALL RUFFLE
      # ==========================================================

      - name: Install Ruffle runtime
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ROOT="$(
            cat build/ruffle-root.txt
          )"

          DEST="$APP/Contents/Resources/ruffle"

          rm -rf \
            "$DEST"

          mkdir -p \
            "$DEST"

          cp -R \
            "$ROOT"/. \
            "$DEST"/

          test -f \
            "$DEST/ruffle.js"

          echo
          echo "Ruffle installed."

          find "$DEST" \
            -maxdepth 2 \
            -type f \
            | sort


      # ==========================================================
      # 24. FIND ORIGINAL PRELOAD
      # ==========================================================

      - name: Find original preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RESOURCES="$APP/Contents/Resources"

          echo "Resources preload candidates:"

          find "$RESOURCES" \
            -maxdepth 2 \
            -type f \
            \( \
              -name "preload.js" \
              -o \
              -iname "*preload*.js" \
            \) \
            -print \
            | sort

          PRELOAD="$(
            find "$RESOURCES" \
              -maxdepth 1 \
              -type f \
              -name "preload.js" \
              -print \
              | head -1
          )"

          if [ -n "$PRELOAD" ]; then

            mv \
              "$PRELOAD" \
              "$RESOURCES/preload-gunny-original.js"

            echo "$RESOURCES/preload-gunny-original.js" \
              > build/original-preload.txt

            echo
            echo "Original preload found."

          else

            echo
            echo "No Resources/preload.js found."

            touch \
              build/no-original-preload

          fi


      # ==========================================================
      # 25. CREATE RUFFLE PRELOAD
      # ==========================================================

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          cat > \
            build/ruffle-preload.js \
            <<'EOF'

          'use strict';

          const fs = require('fs');
          const path = require('path');


          const RUFFLE =
            path.join(
              process.resourcesPath,
              'ruffle'
            );


          const RUFFLE_JS =
            path.join(
              RUFFLE,
              'ruffle.js'
            );


          function injectRuffle() {

            try {

              if (
                !fs.existsSync(
                  RUFFLE_JS
                )
              ) {

                console.error(
                  '[Ruffle] Missing:',
                  RUFFLE_JS
                );

                return;

              }


              /*
               * Configure before loading Ruffle.
               */

              const config =
                document.createElement(
                  'script'
                );

              config.textContent = `

                window.RufflePlayer =
                  window.RufflePlayer || {};

                window.RufflePlayer.config =
                  Object.assign(
                    {},
                    window.RufflePlayer.config || {},
                    {

                      polyfills: true,

                      favorFlash: false,

                      allowScriptAccess: true,

                      allowNetworking: 'all',

                      publicPath:
                        'file://${RUFFLE.replace(/\\/g, '/').replace(/'/g, "\\'")}/'

                    }
                  );

              `;


              (
                document.head ||
                document.documentElement
              ).appendChild(
                config
              );

              config.remove();


              /*
               * Load Ruffle.
               *
               * The local file URL is used so Ruffle can locate
               * its WASM and supporting files.
               */

              const script =
                document.createElement(
                  'script'
                );

              script.src =
                'file://' +
                '${RUFFLE.replace(/\\/g, "/")}' +
                '/ruffle.js';

              script.async = false;


              script.onload =
                function () {

                  try {

                    const api =
                      window.RufflePlayer &&
                      window.RufflePlayer.newest &&
                      window.RufflePlayer.newest();


                    if (
                      api &&
                      typeof api.pluginPolyfill ===
                      'function'
                    ) {

                      api.pluginPolyfill();

                      console.log(
                        '[Ruffle] pluginPolyfill OK'
                      );

                    }


                    if (
                      api &&
                      typeof api.polyfill ===
                      'function'
                    ) {

                      api.polyfill();

                      console.log(
                        '[Ruffle] polyfill OK'
                      );

                    }

                  }

                  catch (error) {

                    console.error(
                      '[Ruffle] polyfill error:',
                      error
                    );

                  }

                };


              script.onerror =
                function (error) {

                  console.error(
                    '[Ruffle] load error:',
                    error
                  );

                };


              (
                document.head ||
                document.documentElement
              ).appendChild(
                script
              );

            }

            catch (error) {

              console.error(
                '[Ruffle] preload error:',
                error
              );

            }

          }


          /*
           * Electron preload runs after the document is created.
           */

          if (
            document.documentElement
          ) {

            injectRuffle();

          }

          else {

            document.addEventListener(
              'DOMContentLoaded',
              injectRuffle,
              {
                once: true
              }
            );

          }


          /*
           * Original Gunny preload.
           */

          try {

            const original =
              path.join(
                process.resourcesPath,
                'preload-gunny-original.js'
              );


            if (
              fs.existsSync(
                original
              )
            ) {

              require(
                original
              );

            }

          }

          catch (error) {

            console.error(
              '[Gunny] original preload error:',
              error
            );

          }

          EOF

          node --check \
            build/ruffle-preload.js

          echo
          echo "Ruffle preload syntax OK."


      # ==========================================================
      # 26. INSTALL PRELOAD
      # ==========================================================

      - name: Install Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RESOURCES="$APP/Contents/Resources"

          cp \
            build/ruffle-preload.js \
            "$RESOURCES/preload.js"

          node --check \
            "$RESOURCES/preload.js"

          echo
          echo "Installed:"
          ls -lh \
            "$RESOURCES/preload.js"


      # ==========================================================
      # 27. MAKE MAIN.JS USE OUR PRELOAD
      # ==========================================================

      - name: Patch preload path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path(os.environ["MAIN"])

          s = p.read_text(
              encoding="utf-8-sig"
          )

          original = s


          # ======================================================
          # Replace common preload expressions
          # ======================================================

          replacements = [

              (
                r"preload\s*:\s*path\.join\(\s*process\.resourcesPath\s*,\s*['\"]preload\.js['\"]\s*\)",
                "preload: path.join(process.resourcesPath, 'preload.js')"
              ),

              (
                r"preload\s*:\s*path\.join\(\s*__dirname\s*,\s*['\"]preload\.js['\"]\s*\)",
                "preload: path.join(process.resourcesPath, 'preload.js')"
              ),

              (
                r"preload\s*:\s*['\"][^'\"]*preload\.js['\"]",
                "preload: path.join(process.resourcesPath, 'preload.js')"
              )

          ]


          for pattern, replacement in replacements:

              s = re.sub(
                  pattern,
                  replacement,
                  s,
                  flags=re.IGNORECASE
              )


          p.write_text(
              s,
              encoding="utf-8"
          )


          if s != original:

              print(
                  "Preload path patched."
              )

          else:

              print(
                  "No preload path pattern changed."
              )

          PY


          node \
            --check \
            "$MAIN"


      # ==========================================================
      # 28. REMOVE PEPPER FLASH
      # ==========================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLUGINS="$APP/Contents/Resources/plugins"

          rm -rf \
            "$PLUGINS"


          echo
          echo "Pepper Flash scan:"

          FOUND="$(
            find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*PepperFlashPlayer*" \
                -o \
                -iname "*pepflash*" \
              \) \
              -print
          )"


          if [ -n "$FOUND" ]; then

            echo "$FOUND"

            echo
            echo "ERROR: Pepper Flash remains."

            exit 1

          fi


          echo
          echo "Pepper Flash: ABSENT"


      # ==========================================================
      # 29. RENAME ELECTRON
      # ==========================================================

      - name: Rename Electron
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS"

          if [ ! -f "$BIN/Electron" ]; then

            echo "ERROR: Electron binary missing."

            ls -la "$BIN"

            exit 1

          fi


          mv \
            "$BIN/Electron" \
            "$BIN/Gunny PC"


          chmod +x \
            "$BIN/Gunny PC"


          file \
            "$BIN/Gunny PC"

          echo

          lipo -info \
            "$BIN/Gunny PC"


      # ==========================================================
      # 30. PATCH INFO PLIST
      # ==========================================================

      - name: Patch Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"


          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true


          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true


          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true


          plutil -p \
            "$PLIST"


      # ==========================================================
      # 31. VERIFY ARM64
      # ==========================================================

      - name: Verify ARM64
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS/Gunny PC"

          INFO="$(
            file "$BIN"
          )"

          echo "$INFO"


          if ! echo "$INFO" | grep -q "arm64"; then

            echo
            echo "ERROR: ARM64 not detected."

            exit 1

          fi


          if echo "$INFO" | grep -q "x86_64"; then

            echo
            echo "ERROR: x86_64 detected."

            exit 1

          fi


          echo
          echo "ARM64 ONLY: OK"


      # ==========================================================
      # 32. VERIFY RUFFLE
      # ==========================================================

      - name: Verify Ruffle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle"

          test -f \
            "$RUFFLE/ruffle.js"


          WASM="$(
            find "$RUFFLE" \
              -type f \
              -name "*.wasm" \
              | head -1
          )"


          if [ -z "$WASM" ]; then

            echo "ERROR: Ruffle WASM missing."

            exit 1

          fi


          echo
          echo "Ruffle JS:"
          ls -lh \
            "$RUFFLE/ruffle.js"


          echo
          echo "Ruffle WASM:"
          ls -lh \
            "$WASM"


      # ==========================================================
      # 33. VERIFY PRELOAD
      # ==========================================================

      - name: Verify preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PRELOAD="$APP/Contents/Resources/preload.js"


          test -f \
            "$PRELOAD"


          node \
            --check \
            "$PRELOAD"


          echo
          echo "Ruffle preload OK."


          grep -nE \
            "Ruffle|ruffle.js|pluginPolyfill|polyfill" \
            "$PRELOAD" \
            | head -100


      # ==========================================================
      # 34. VERIFY ASAR
      # ==========================================================

      - name: Verify ASAR
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf \
            build/final-source

          asar extract \
            "$ASAR" \
            build/final-source


          MAIN="$(
            find build/final-source \
              -type f \
              -name "main.js" \
              -print \
              | head -1
          )


          node \
            --check \
            "$MAIN"


          echo
          echo "Remaining PPAPI references:"

          grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN" \
            || true


      # ==========================================================
      # 35. REMOVE QUARANTINE
      # ==========================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr \
            "build/Gunny PC ARM64.app" \
            || true


      # ==========================================================
      # 36. AD-HOC SIGN
      # ==========================================================

      - name: Sign application
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"


          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ==========================================================
      # 37. BUILD REPORT
      # ==========================================================

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS/Gunny PC"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Architecture:"
            file "$BIN"

            echo
            echo "Ruffle:"
            test -f \
              "$APP/Contents/Resources/ruffle/ruffle.js" \
              && echo "OK" \
              || echo "MISSING"

            echo
            echo "WASM:"
            find \
              "$APP/Contents/Resources/ruffle" \
              -type f \
              -name "*.wasm" \
              -print

            echo
            echo "Pepper Flash:"

            if find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*pepflash*" \
              \) \
              | grep -q .; then

              echo "FOUND"

            else

              echo "ABSENT"

            fi

            echo
            echo "Preload:"
            test -f \
              "$APP/Contents/Resources/preload.js" \
              && echo "OK" \
              || echo "MISSING"

          } > \
            output/build-report.txt


          cat \
            output/build-report.txt


      # ==========================================================
      # 38. ZIP
      # ==========================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.zip


          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "output/Gunny-PC-ARM64-Ruffle.zip"


          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.zip


      # ==========================================================
      # 39. DMG
      # ==========================================================

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/dmg

          mkdir -p \
            build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/


          rm -f \
            output/Gunny-PC-ARM64-Ruffle.dmg


          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            output/Gunny-PC-ARM64-Ruffle.dmg


          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.dmg


      # ==========================================================
      # 40. UPLOAD APP
      # ==========================================================

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-App
          path: build/Gunny PC ARM64.app/
          retention-days: 7


      # ==========================================================
      # 41. UPLOAD ZIP
      # ==========================================================

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: output/Gunny-PC-ARM64-Ruffle.zip
          retention-days: 7


      # ==========================================================
      # 42. UPLOAD DMG
      # ==========================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: output/Gunny-PC-ARM64-Ruffle.dmg
          retention-days: 7


      # ==========================================================
      # 43. UPLOAD REPORT
      # ==========================================================

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: output/build-report.txt
          retention-days: 7
