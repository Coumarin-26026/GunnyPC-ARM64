name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Gunny PC"
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"

  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Gunny PC ARM64 + Ruffle

    runs-on: macos-14

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 02. SYSTEM
      # ==========================================================

      - name: System information
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          sw_vers

          echo
          uname -a

          echo
          uname -m


      # ==========================================================
      # 03. INSTALL TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            p7zip

          npm install \
            --global \
            @electron/asar

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "asar:"
          asar --version


      # ==========================================================
      # 04. PREPARE
      # ==========================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build \
            release

          mkdir -p \
            build \
            release


      # ==========================================================
      # 05. DOWNLOAD GUNNY INTEL
      # ==========================================================

      - name: Download Gunny Intel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny.zip

          echo
          ls -lh \
            build/gunny.zip

          file \
            build/gunny.zip


      # ==========================================================
      # 06. EXTRACT GUNNY
      # ==========================================================

      - name: Extract Gunny
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/gunny

          mkdir -p \
            build/gunny

          unzip \
            -q \
            -o \
            build/gunny.zip \
            -d build/gunny

          rm -rf \
            build/gunny/__MACOSX

          echo
          echo "Applications:"

          find build/gunny \
            -type d \
            -name "*.app" \
            -print


      # ==========================================================
      # 07. LOCATE ORIGINAL APP
      # ==========================================================

      - name: Locate Gunny app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find build/gunny \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: .app not found."
            exit 1
          fi

          printf '%s\n' "$APP" \
            > build/original-app.txt

          echo
          echo "Original app:"
          cat build/original-app.txt


      # ==========================================================
      # 08. INSPECT ORIGINAL
      # ==========================================================

      - name: Inspect original Gunny
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          echo "=========================================="
          echo "ORIGINAL APP"
          echo "=========================================="

          echo
          echo "Main executable:"

          file \
            "$APP/Contents/MacOS/Gunny PC" \
            || true

          echo
          echo "Pepper Flash:"

          find "$APP/Contents/Resources" \
            \( \
              -iname "*PepperFlash*" \
              -o \
              -iname "*pepflash*" \
            \) \
            -print \
            || true


      # ==========================================================
      # 09. EXTRACT ASAR
      # ==========================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          rm -rf \
            build/source

          asar extract \
            "$ASAR" \
            build/source

          echo
          echo "app.asar extracted."


      # ==========================================================
      # 10. LOCATE MAIN.JS
      # ==========================================================

      - name: Locate main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.js not found."
            exit 1
          fi

          printf '%s\n' "$MAIN" \
            > build/main-path.txt

          cp \
            "$MAIN" \
            build/main.original.js

          echo
          echo "main.js:"
          cat build/main-path.txt


      # ==========================================================
      # 11. ANALYZE MAIN.JS
      # ==========================================================

      - name: Analyze Flash configuration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          echo "=========================================="
          echo "FLASH ANALYSIS"
          echo "=========================================="

          echo
          echo "Flash / PPAPI references:"

          grep -niE \
            "ppapi|pepperflash|pepflash|flash_not_found|flashPath|flash" \
            "$MAIN" \
            | head -300 \
            || true

          echo
          echo "BrowserWindow / preload references:"

          grep -niE \
            "BrowserWindow|webPreferences|preload" \
            "$MAIN" \
            | head -300 \
            || true


      # ==========================================================
      # 12. PATCH MAIN.JS
      #
      # NO hard-coded Unicode marker.
      # NO app.whenReady().
      # ==========================================================

      - name: Patch main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path(os.environ["MAIN"])

          s = p.read_text(
              encoding="utf-8-sig"
          )

          original = s


          # ------------------------------------------------------
          # Remove ppapi-flash-path appendSwitch()
          # ------------------------------------------------------

          s = re.sub(
              r"""
              [A-Za-z0-9_$.\[\]]+
              \.appendSwitch
              \s*\(
              \s*["']ppapi-flash-path["']
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              s,
              flags=re.IGNORECASE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Remove ppapi-flash-version appendSwitch()
          # ------------------------------------------------------

          s = re.sub(
              r"""
              [A-Za-z0-9_$.\[\]]+
              \.appendSwitch
              \s*\(
              \s*["']ppapi-flash-version["']
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              s,
              flags=re.IGNORECASE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Remove lines containing PPAPI switch names.
          # ------------------------------------------------------

          s = re.sub(
              r"""
              ^[^\n]*
              ppapi-flash-path
              [^\n]*$
              """,
              "",
              s,
              flags=re.IGNORECASE | re.MULTILINE | re.VERBOSE
          )

          s = re.sub(
              r"""
              ^[^\n]*
              ppapi-flash-version
              [^\n]*$
              """,
              "",
              s,
              flags=re.IGNORECASE | re.MULTILINE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Disable old Flash deployment call.
          # ------------------------------------------------------

          s = re.sub(
              r"""
              ^[^\n]*
              _deployFlashMmsCfg
              [^\n]*$
              """,
              "",
              s,
              flags=re.MULTILINE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Remove old Flash-not-found telemetry.
          # ------------------------------------------------------

          s = re.sub(
              r"""
              ^[^\n]*
              flash_not_found
              [^\n]*$
              """,
              "",
              s,
              flags=re.IGNORECASE | re.MULTILINE | re.VERBOSE
          )


          # ------------------------------------------------------
          # plugins must remain enabled.
          # ------------------------------------------------------

          s = re.sub(
              r"""
              (plugins\s*:\s*)false
              """,
              r"\1true",
              s,
              flags=re.IGNORECASE | re.VERBOSE
          )


          # ------------------------------------------------------
          # Cleanup.
          # ------------------------------------------------------

          s = re.sub(
              r"\n{4,}",
              "\n\n\n",
              s
          )


          p.write_text(
              s,
              encoding="utf-8"
          )


          print(
              "main.js patched."
          )

          print(
              "changed:",
              s != original
          )

          PY


          echo
          echo "JavaScript syntax:"

          node \
            --check \
            "$MAIN"


          echo
          echo "PPAPI check:"

          if grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN"
          then
            echo "ERROR: PPAPI remains."
            exit 1
          fi

          echo "PPAPI removed."


      # ==========================================================
      # 13. DOWNLOAD RUFFLE
      #
      # IMPORTANT:
      # Use gh release download with a wildcard.
      #
      # We DO NOT guess the actual asset filename.
      # ==========================================================

      - name: Download Ruffle self-hosted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUFFLE ${RUFFLE_VERSION}"
          echo "=========================================="

          rm -rf \
            build/ruffle

          mkdir -p \
            build/ruffle

          cd build/ruffle

          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*-web-selfhosted.zip" \
            --clobber

          ZIP="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*-web-selfhosted.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Ruffle self-hosted ZIP not found."
            ls -la
            exit 1
          fi

          echo
          echo "Ruffle archive:"
          echo "$ZIP"

          unzip \
            -q \
            -o \
            "$ZIP" \
            -d extracted

          echo
          echo "Extracted Ruffle files:"

          find extracted \
            -maxdepth 3 \
            -type f \
            | sort


      # ==========================================================
      # 14. LOCATE RUFFLE ROOT
      # ==========================================================

      - name: Validate Ruffle
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(
            find build/ruffle/extracted \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -n 1 \
              | xargs -I{} dirname "{}"
          )"

          if [ -z "$ROOT" ]; then
            echo "ERROR: ruffle.js not found."
            exit 1
          fi

          echo "$ROOT" \
            > build/ruffle-root.txt

          echo
          echo "Ruffle root:"
          cat build/ruffle-root.txt

          WASM="$(
            find "$ROOT" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then
            echo "ERROR: Ruffle WASM not found."
            exit 1
          fi

          echo
          echo "Ruffle JS:"
          ls -lh \
            "$ROOT/ruffle.js"

          echo
          echo "Ruffle WASM:"
          ls -lh \
            "$WASM"


      # ==========================================================
      # 15. DOWNLOAD ELECTRON ARM64
      # ==========================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          echo "=========================================="
          echo "ELECTRON ARM64"
          echo "=========================================="

          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o build/electron-arm64.zip

          echo
          ls -lh \
            build/electron-arm64.zip


      # ==========================================================
      # 16. EXTRACT ELECTRON
      # ==========================================================

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/electron

          mkdir -p \
            build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          printf '%s\n' "$ELECTRON_APP" \
            > build/electron-app.txt

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          echo
          file "$BIN"

          echo
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "arm64"; then
            echo "ERROR: Electron is not ARM64."
            exit 1
          fi


      # ==========================================================
      # 17. CREATE NEW ARM64 APP FROM ELECTRON
      #
      # This is safer than mixing random x64/arm64 Framework files.
      # ==========================================================

      - name: Create ARM64 app container
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          echo
          echo "Created:"
          ls -ld \
            "build/Gunny PC ARM64.app"


      # ==========================================================
      # 18. COPY GUNNY RESOURCES
      # ==========================================================

      - name: Copy Gunny Resources
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL="$(
            cat build/original-app.txt
          )"

          SRC="$ORIGINAL/Contents/Resources"

          DST="build/Gunny PC ARM64.app/Contents/Resources"

          echo "Copying Gunny Resources..."

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"

          echo
          echo "Gunny resources copied."


      # ==========================================================
      # 19. INSTALL PATCHED ASAR
      # ==========================================================

      - name: Install patched app.asar
        shell: bash
        run: |
          set -euo pipefail

          DST="build/Gunny PC ARM64.app/Contents/Resources"

          rm -f \
            "$DST/app.asar"

          asar pack \
            build/source \
            "$DST/app.asar"

          echo
          ls -lh \
            "$DST/app.asar"


      # ==========================================================
      # 20. INSTALL RUFFLE
      # ==========================================================

      - name: Install Ruffle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ROOT="$(
            cat build/ruffle-root.txt
          )"

          DEST="$APP/Contents/Resources/ruffle"

          rm -rf \
            "$DEST"

          mkdir -p \
            "$DEST"

          cp -R \
            "$ROOT"/. \
            "$DEST/"

          test -f \
            "$DEST/ruffle.js"

          echo
          echo "Ruffle installed."


      # ==========================================================
      # 21. BACKUP GUNNY PRELOAD
      # ==========================================================

      - name: Backup original preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RES="$APP/Contents/Resources"

          if [ ! -f \
            "$RES/preload.js"
          ]; then

            echo "WARNING: preload.js not found."

          else

            cp \
              "$RES/preload.js" \
              "$RES/preload-gunny-original.js"

          fi


      # ==========================================================
      # 22. CREATE RUFFLE PRELOAD
      #
      # Ruffle is loaded into the page's main world.
      # ==========================================================

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RES="$APP/Contents/Resources"

          cat > \
            "$RES/preload-ruffle.js" \
            <<'EOF'
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const { webFrame } = require('electron');
          const { pathToFileURL } = require('url');

          const resourcesPath =
            process.resourcesPath;

          const ruffleRoot =
            path.join(
              resourcesPath,
              'ruffle'
            );

          const ruffleJS =
            path.join(
              ruffleRoot,
              'ruffle.js'
            );

          const originalPreload =
            path.join(
              resourcesPath,
              'preload-gunny-original.js'
            );


          console.log(
            '[Gunny ARM64] preload started'
          );


          function startRuffle() {

            try {

              if (
                !fs.existsSync(
                  ruffleJS
                )
              ) {

                console.error(
                  '[Ruffle] Missing:',
                  ruffleJS
                );

                return;

              }


              const source =
                fs.readFileSync(
                  ruffleJS,
                  'utf8'
                );


              const publicPath =
                pathToFileURL(
                  ruffleRoot + path.sep
                ).href;


              const config =
                JSON.stringify({

                  publicPath:
                    publicPath,

                  polyfills:
                    true,

                  favorFlash:
                    false,

                  allowScriptAccess:
                    true,

                  allowNetworking:
                    'all'

                });


              const code =
                `
                (() => {

                  window.RufflePlayer =
                    window.RufflePlayer || {};

                  window.RufflePlayer.config =
                    Object.assign(
                      {},
                      window.RufflePlayer.config || {},
                      ${config}
                    );

                  ${source}

                  try {

                    const ruffle =
                      window.RufflePlayer &&
                      window.RufflePlayer.newest &&
                      window.RufflePlayer.newest();

                    if (
                      ruffle &&
                      typeof ruffle.pluginPolyfill ===
                      'function'
                    ) {

                      ruffle.pluginPolyfill();

                      console.log(
                        '[Ruffle] pluginPolyfill OK'
                      );

                    }

                    if (
                      ruffle &&
                      typeof ruffle.polyfill ===
                      'function'
                    ) {

                      ruffle.polyfill();

                      console.log(
                        '[Ruffle] polyfill OK'
                      );

                    }

                    console.log(
                      '[Ruffle] initialized'
                    );

                  }
                  catch (error) {

                    console.error(
                      '[Ruffle] API error:',
                      error
                    );

                  }

                })();
                `;


              webFrame.executeJavaScript(
                code,
                false
              ).then(
                () => {

                  console.log(
                    '[Ruffle] main-world initialization complete'
                  );

                }
              ).catch(
                (error) => {

                  console.error(
                    '[Ruffle] executeJavaScript failed:',
                    error
                  );

                }
              );

            }
            catch (error) {

              console.error(
                '[Ruffle] initialization failed:',
                error
              );

            }

          }


          startRuffle();


          /*
           * Preserve the original Gunny preload.
           */

          if (
            fs.existsSync(
              originalPreload
            )
          ) {

            try {

              require(
                originalPreload
              );

            }
            catch (error) {

              console.error(
                '[Gunny] original preload failed:',
                error
              );

            }

          }
          EOF

          node \
            --check \
            "$RES/preload-ruffle.js"

          echo
          echo "Ruffle preload syntax: OK"


      # ==========================================================
      # 23. PATCH PRELOAD PATH IN MAIN.JS
      #
      # We replace an existing preload value only when one exists.
      # We do NOT require app.whenReady().
      # ==========================================================

      - name: Patch preload path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path(
              os.environ["MAIN"]
          )

          s = p.read_text(
              encoding="utf-8-sig"
          )


          # ------------------------------------------------------
          # Replace common preload.js expressions.
          # ------------------------------------------------------

          patterns = [

              (
                  r"preload\s*:\s*path\.join\(\s*process\.resourcesPath\s*,\s*['\"]preload\.js['\"]\s*\)",
                  "preload: path.join(process.resourcesPath, 'preload-ruffle.js')"
              ),

              (
                  r"preload\s*:\s*path\.join\(\s*__dirname\s*,\s*['\"]preload\.js['\"]\s*\)",
                  "preload: path.join(process.resourcesPath, 'preload-ruffle.js')"
              ),

              (
                  r"preload\s*:\s*['\"][^'\"]*preload\.js['\"]",
                  "preload: path.join(process.resourcesPath, 'preload-ruffle.js')"
              )

          ]


          changed = False


          for pattern, replacement in patterns:

              new_s = re.sub(
                  pattern,
                  replacement,
                  s,
                  flags=re.IGNORECASE
              )

              if new_s != s:

                  changed = True
                  s = new_s


          p.write_text(
              s,
              encoding="utf-8"
          )


          print(
              "preload path changed:",
              changed
          )

          PY


          node \
            --check \
            "$MAIN"


      # ==========================================================
      # 24. REMOVE PEPPER FLASH
      # ==========================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLUGINS="$APP/Contents/Resources/plugins"

          rm -rf \
            "$PLUGINS"

          echo
          echo "Pepper Flash search:"

          if find "$APP" \
            \( \
              -iname "*PepperFlash*" \
              -o \
              -iname "*pepflash*" \
            \) \
            -print \
            | grep -q .
          then

            echo "ERROR: Pepper Flash still exists."

            exit 1

          fi

          echo "Pepper Flash: ABSENT"


      # ==========================================================
      # 25. RENAME ELECTRON EXECUTABLE
      # ==========================================================

      - name: Rename Electron executable
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS"

          mv \
            "$BIN/Electron" \
            "$BIN/Gunny PC"

          chmod +x \
            "$BIN/Gunny PC"


      # ==========================================================
      # 26. UPDATE INFO.PLIST
      # ==========================================================

      - name: Update Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          echo
          plutil -p \
            "$PLIST"


      # ==========================================================
      # 27. REMOVE QUARANTINE
      # ==========================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr \
            "build/Gunny PC ARM64.app" \
            || true


      # ==========================================================
      # 28. VERIFY MAIN ARM64
      # ==========================================================

      - name: Verify main ARM64
        shell: bash
        run: |
          set -euo pipefail

          BIN="build/Gunny PC ARM64.app/Contents/MacOS/Gunny PC"

          echo
          file "$BIN"

          if ! file "$BIN" \
            | grep -q "arm64"
          then

            echo "ERROR: Main executable is not ARM64."

            exit 1

          fi

          if file "$BIN" \
            | grep -q "x86_64"
          then

            echo "ERROR: x86_64 found."

            exit 1

          fi

          echo
          echo "Main executable: ARM64"


      # ==========================================================
      # 29. VERIFY RUFFLE
      # ==========================================================

      - name: Verify Ruffle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle"

          test -f \
            "$RUFFLE/ruffle.js"

          WASM="$(
            find "$RUFFLE" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then

            echo "ERROR: Ruffle WASM missing."

            exit 1

          fi

          echo
          echo "Ruffle:"
          echo "OK"

          echo
          echo "JS:"
          ls -lh \
            "$RUFFLE/ruffle.js"

          echo
          echo "WASM:"
          ls -lh \
            "$WASM"


      # ==========================================================
      # 30. VERIFY PRELOAD
      # ==========================================================

      - name: Verify preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PRELOAD="$APP/Contents/Resources/preload-ruffle.js"

          test -f \
            "$PRELOAD"

          node \
            --check \
            "$PRELOAD"

          echo
          echo "Ruffle preload: OK"


      # ==========================================================
      # 31. VERIFY FINAL ASAR
      # ==========================================================

      - name: Verify final app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf \
            build/final-source

          asar extract \
            "$ASAR" \
            build/final-source

          MAIN="$(
            find build/final-source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then

            echo "ERROR: final main.js not found."

            exit 1

          fi

          node \
            --check \
            "$MAIN"

          echo
          echo "Final main.js syntax: OK"

          echo
          echo "Final PPAPI references:"

          grep -RniE \
            "ppapi-flash-path|ppapi-flash-version" \
            build/final-source \
            2>/dev/null \
            | head -100 \
            || true


      # ==========================================================
      # 32. FINAL INTEL SCAN
      # ==========================================================

      - name: Final Intel scan
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "INTEL BINARY SCAN"
          echo "=========================================="

          FAILED=0

          while IFS= read -r -d '' FILE
          do

            INFO="$(
              file "$FILE" 2>/dev/null \
              || true
            )

            if echo "$INFO" \
              | grep -Eq \
                "Mach-O.*(x86_64|i386)|executable.*(x86_64|i386)"
            then

              echo
              echo "INTEL:"
              echo "$INFO"
              echo "$FILE"

              FAILED=1

            fi

          done < <(
            find "$APP" \
              -type f \
              -print0
          )


          if [ "$FAILED" -ne 0 ]; then

            echo
            echo "ERROR: Intel binaries remain."

            exit 1

          fi

          echo
          echo "No Intel binaries detected."


      # ==========================================================
      # 33. AD-HOC SIGN
      # ==========================================================

      - name: Sign application
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          rm -rf \
            "$APP/Contents/_CodeSignature"

          find "$APP/Contents" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + \
            || true

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ==========================================================
      # 34. PACKAGE ZIP
      # ==========================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            "release/Gunny-PC-ARM64-Ruffle.zip"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "release/Gunny-PC-ARM64-Ruffle.zip"

          echo
          ls -lh \
            "release/Gunny-PC-ARM64-Ruffle.zip"


      # ==========================================================
      # 35. CREATE DMG
      # ==========================================================

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            "release/Gunny-PC-ARM64-Ruffle.dmg"

          mkdir -p \
            build/dmg

          rm -rf \
            build/dmg/*

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "release/Gunny-PC-ARM64-Ruffle.dmg"

          echo
          ls -lh \
            "release/Gunny-PC-ARM64-Ruffle.dmg"


      # ==========================================================
      # 36. BUILD REPORT
      # ==========================================================

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS/Gunny PC"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Architecture:"
            file "$BIN"

            echo
            echo "Ruffle:"
            test -f \
              "$APP/Contents/Resources/ruffle/ruffle.js" \
              && echo "OK"

            echo
            echo "Ruffle WASM:"
            find \
              "$APP/Contents/Resources/ruffle" \
              -type f \
              -name "*.wasm" \
              -print

            echo
            echo "Pepper Flash:"
            if find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*pepflash*" \
              \) \
              | grep -q .
            then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "PPAPI:"
            if grep -RniE \
              "ppapi-flash-path|ppapi-flash-version" \
              build/final-source \
              >/dev/null 2>&1
            then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "Preload:"
            test -f \
              "$APP/Contents/Resources/preload-ruffle.js" \
              && echo "OK"

          } > \
            release/build-report.txt

          cat \
            release/build-report.txt


      # ==========================================================
      # 37. UPLOAD ZIP
      # ==========================================================

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: release/Gunny-PC-ARM64-Ruffle.zip
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # 38. UPLOAD DMG
      # ==========================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: release/Gunny-PC-ARM64-Ruffle.dmg
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # 39. UPLOAD REPORT
      # ==========================================================

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: release/build-report.txt
          if-no-files-found: error
          retention-days: 14
