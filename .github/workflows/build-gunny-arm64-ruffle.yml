name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Gunny PC"

  ELECTRON_VERSION: "43.2.0"

  RUFFLE_VERSION: "0.4.1"

  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Gunny PC ARM64 + Ruffle

    runs-on: macos-14

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 02. SYSTEM
      # ==========================================================

      - name: System information
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          sw_vers

          echo
          uname -a

          echo
          uname -m


      # ==========================================================
      # 03. INSTALL TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            p7zip

          npm install \
            --global \
            @electron/asar

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "asar:"
          asar --version

          echo
          echo "gh:"
          gh --version


      # ==========================================================
      # 04. CLEAN
      # ==========================================================

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build \
            release

          mkdir -p \
            build \
            release


      # ==========================================================
      # 05. DOWNLOAD GUNNY INTEL
      # ==========================================================

      - name: Download Gunny Intel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny.zip

          echo
          file build/gunny.zip

          echo
          ls -lh build/gunny.zip


      # ==========================================================
      # 06. EXTRACT GUNNY
      # ==========================================================

      - name: Extract Gunny
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            build/gunny

          unzip \
            -q \
            -o \
            build/gunny.zip \
            -d build/gunny

          rm -rf \
            build/gunny/__MACOSX

          echo
          echo "Applications:"

          find build/gunny \
            -type d \
            -name "*.app" \
            -print


      # ==========================================================
      # 07. LOCATE ORIGINAL APP
      # ==========================================================

      - name: Locate Gunny app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find build/gunny \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny .app not found."
            exit 1
          fi

          printf '%s\n' "$APP" \
            > build/original-app.txt

          echo
          echo "Original app:"
          cat build/original-app.txt


      # ==========================================================
      # 08. ORIGINAL ARCHITECTURE
      # ==========================================================

      - name: Inspect original architecture
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          echo "=========================================="
          echo "ORIGINAL ARCHITECTURE"
          echo "=========================================="

          find "$APP" \
            -type f \
            -exec file {} \; \
            | grep \
              -E \
              "Mach-O" \
            | head -200 \
            || true


      # ==========================================================
      # 09. EXTRACT APP.ASAR
      # ==========================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          rm -rf \
            build/source

          asar extract \
            "$ASAR" \
            build/source

          echo
          echo "app.asar extracted."


      # ==========================================================
      # 10. LOCATE MAIN.JS
      # ==========================================================

      - name: Locate main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.js not found."
            exit 1
          fi

          printf '%s\n' "$MAIN" \
            > build/main-path.txt

          cp \
            "$MAIN" \
            build/main.original.js

          echo
          echo "main.js:"
          cat build/main-path.txt


      # ==========================================================
      # 11. FIND ORIGINAL PRELOAD
      # ==========================================================

      - name: Locate original preload
        shell: bash
        run: |
          set -euo pipefail

          PRELOAD="$(
            find build/source \
              -type f \
              \( \
                -name "preload.js" \
                -o \
                -name "*preload*.js" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$PRELOAD" ]; then
            echo "ERROR: original preload not found."

            find build/source \
              -type f \
              | grep -i \
                "preload" \
              | head -100 \
              || true

            exit 1
          fi

          REL="$(
            python3 - "$PRELOAD" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          root = Path("build/source")

          print(
              p.relative_to(root).as_posix()
          )
          PY
          )"

          printf '%s\n' "$REL" \
            > build/preload-relative.txt

          echo
          echo "Original preload:"
          echo "$PRELOAD"

          echo
          echo "Relative path inside app.asar:"
          cat build/preload-relative.txt


      # ==========================================================
      # 12. ANALYZE GUNNY FLASH
      # ==========================================================

      - name: Analyze Gunny Flash detection
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          echo "=========================================="
          echo "FLASH REFERENCES"
          echo "=========================================="

          grep -RniE \
            "ppapi|pepperflash|pepflash|Shockwave|application/x-shockwave-flash|navigator\.plugins|navigator\.mimeTypes|flash_not_found|flashPath" \
            build/source \
            2>/dev/null \
            | head -500 \
            || true

          echo
          echo "=========================================="
          echo "BROWSERWINDOW / PRELOAD"
          echo "=========================================="

          grep -niE \
            "BrowserWindow|webPreferences|preload|contextIsolation|sandbox|plugins" \
            "$MAIN" \
            | head -500 \
            || true


      # ==========================================================
      # 13. DOWNLOAD RUFFLE SELF-HOSTED
      #
      # Do not guess the asset filename.
      # ==========================================================

      - name: Download Ruffle self-hosted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUFFLE ${RUFFLE_VERSION}"
          echo "=========================================="

          rm -rf \
            build/ruffle

          mkdir -p \
            build/ruffle

          cd build/ruffle

          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*-web-selfhosted.zip" \
            --clobber

          ZIP="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*-web-selfhosted.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Ruffle self-hosted package not found."

            echo
            echo "Available files:"
            ls -lah

            exit 1
          fi

          echo
          echo "Ruffle archive:"
          echo "$ZIP"

          mkdir -p \
            extracted

          unzip \
            -q \
            -o \
            "$ZIP" \
            -d extracted


      # ==========================================================
      # 14. LOCATE RUFFLE.JS
      # ==========================================================

      - name: Validate Ruffle
        shell: bash
        run: |
          set -euo pipefail

          RUFFLE_JS="$(
            find build/ruffle/extracted \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$RUFFLE_JS" ]; then
            echo "ERROR: ruffle.js not found."

            find build/ruffle/extracted \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          RUFFLE_ROOT="$(
            dirname "$RUFFLE_JS"
          )"

          printf '%s\n' "$RUFFLE_ROOT" \
            > build/ruffle-root.txt

          WASM="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then
            echo "ERROR: Ruffle WASM not found."
            exit 1
          fi

          echo
          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "ruffle.js:"
          ls -lh "$RUFFLE_JS"

          echo
          echo "WASM:"
          ls -lh "$WASM"


      # ==========================================================
      # 15. DOWNLOAD ELECTRON ARM64
      # ==========================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          echo "=========================================="
          echo "ELECTRON ARM64"
          echo "=========================================="

          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o build/electron-arm64.zip

          file \
            build/electron-arm64.zip

          ls -lh \
            build/electron-arm64.zip


      # ==========================================================
      # 16. EXTRACT ELECTRON
      # ==========================================================

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          printf '%s\n' "$ELECTRON_APP" \
            > build/electron-app.txt

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          echo
          file "$BIN"

          echo
          lipo -info "$BIN"

          if ! file "$BIN" \
            | grep -q "arm64"
          then
            echo "ERROR: Electron is not ARM64."
            exit 1
          fi


      # ==========================================================
      # 17. CREATE ARM64 APP
      # ==========================================================

      - name: Create ARM64 app
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"


      # ==========================================================
      # 18. COPY GUNNY RESOURCES
      # ==========================================================

      - name: Copy Gunny resources
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL="$(
            cat build/original-app.txt
          )"

          SRC="$ORIGINAL/Contents/Resources"

          DST="build/Gunny PC ARM64.app/Contents/Resources"

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"

          echo
          echo "Gunny resources copied."


      # ==========================================================
      # 19. PATCH MAIN.JS
      #
      # This is the important part:
      #
      # BrowserWindow
      #   contextIsolation = false
      #   sandbox = false
      #   plugins = true
      #   preload = preload-ruffle.js
      #
      # Ruffle therefore runs in the SAME world as Gunny.
      # ==========================================================

      - name: Patch BrowserWindow settings
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["MAIN"])

          s = p.read_text(
              encoding="utf-8-sig"
          )


          def find_matching_brace(text, start):
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              i = start

              while i < len(text):

                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                      i += 1
                      continue

                  if block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if quote:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == quote:
                          quote = None

                      i += 1
                      continue

                  if c in ("'", '"', "`"):
                      quote = c
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      block_comment = True
                      i += 2
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return i

                  i += 1

              return -1


          def remove_top_level_property(obj, name):
              """
              Remove a direct property from an object literal.
              Handles nested calls/objects and strings.
              """

              result = []
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False

              i = 0
              last = 0

              while i < len(obj):

                  c = obj[i]
                  n = obj[i + 1] if i + 1 < len(obj) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                      i += 1
                      continue

                  if block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if quote:
                      if escape:
                          escape = False

                      elif c == "\\":
                          escape = True

                      elif c == quote:
                          quote = None

                      i += 1
                      continue

                  if c in ("'", '"', "`"):
                      quote = c
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      block_comment = True
                      i += 2
                      continue

                  if c == "{":
                      depth += 1
                      i += 1
                      continue

                  if c == "}":
                      depth -= 1
                      i += 1
                      continue

                  if depth == 0:

                      m = re.match(
                          r"\b" + re.escape(name) + r"\s*:",
                          obj[i:]
                      )

                      if m:

                          start = i

                          j = i + m.end()

                          nested = 0
                          q = None
                          esc = False
                          lc = False
                          bc = False

                          while j < len(obj):

                              ch = obj[j]
                              nx = (
                                  obj[j + 1]
                                  if j + 1 < len(obj)
                                  else ""
                              )

                              if lc:
                                  if ch == "\n":
                                      lc = False

                                  j += 1
                                  continue

                              if bc:
                                  if ch == "*" and nx == "/":
                                      bc = False
                                      j += 2
                                      continue

                                  j += 1
                                  continue

                              if q:
                                  if esc:
                                      esc = False

                                  elif ch == "\\":
                                      esc = True

                                  elif ch == q:
                                      q = None

                                  j += 1
                                  continue

                              if ch in ("'", '"', "`"):
                                  q = ch
                                  j += 1
                                  continue

                              if ch == "/" and nx == "/":
                                  lc = True
                                  j += 2
                                  continue

                              if ch == "/" and nx == "*":
                                  bc = True
                                  j += 2
                                  continue

                              if ch in "({[":
                                  nested += 1

                              elif ch in ")}]":
                                  nested -= 1

                              elif ch == "," and nested == 0:
                                  j += 1
                                  break

                              j += 1

                          result.append(
                              obj[last:start]
                          )

                          last = j
                          i = j
                          continue

                  i += 1

              result.append(
                  obj[last:]
              )

              return "".join(result)


          marker = "webPreferences"

          positions = []
          offset = 0

          while True:

              idx = s.find(
                  marker,
                  offset
              )

              if idx == -1:
                  break

              brace = s.find(
                  "{",
                  idx
              )

              if brace == -1:
                  break

              end = find_matching_brace(
                  s,
                  brace
              )

              if end == -1:
                  break

              positions.append(
                  (brace, end)
              )

              offset = end + 1


          if not positions:

              raise SystemExit(
                  "ERROR: no webPreferences object found."
              )


          # Work backwards so offsets remain valid.

          for brace, end in reversed(positions):

              body = s[
                  brace + 1:
                  end
              ]

              body = remove_top_level_property(
                  body,
                  "preload"
              )

              body = remove_top_level_property(
                  body,
                  "plugins"
              )

              body = remove_top_level_property(
                  body,
                  "contextIsolation"
              )

              body = remove_top_level_property(
                  body,
                  "sandbox"
              )

              injection = r"""
                  contextIsolation: false,
                  sandbox: false,
                  plugins: true,
                  preload: require('path').join(
                      process.resourcesPath,
                      'preload-ruffle.js'
                  ),
          """

              body = injection + body

              s = (
                  s[:brace + 1]
                  + body
                  + s[end:]
              )


          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Patched webPreferences objects:",
              len(positions)
          )

          PY


          echo
          echo "JavaScript syntax:"

          node \
            --check \
            "$MAIN"

          echo
          echo "webPreferences after patch:"

          grep -niE \
            "webPreferences|contextIsolation|sandbox|plugins|preload" \
            "$MAIN" \
            | head -500


      # ==========================================================
      # 20. CREATE RUFFLE PRELOAD
      #
      # IMPORTANT:
      #
      # contextIsolation = false
      #
      # therefore this preload runs in the page's main world.
      #
      # pluginPolyfill() is called synchronously BEFORE the
      # original Gunny preload.
      # ==========================================================

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RES="$APP/Contents/Resources"

          RUFFLE_ROOT="$(
            cat build/ruffle-root.txt
          )"

          ORIGINAL_PRELOAD="$(
            cat build/preload-relative.txt
          )"

          mkdir -p \
            "$RES/ruffle"

          cp -R \
            "$RUFFLE_ROOT"/. \
            "$RES/ruffle/"

          cat > \
            "$RES/preload-ruffle.js" \
            <<'EOF'
          'use strict';

          const fs = require('fs');
          const path = require('path');

          const resources =
              process.resourcesPath;

          const ruffleFile =
              path.join(
                  resources,
                  'ruffle',
                  'ruffle.js'
              );

          const originalPreload =
              path.join(
                  resources,
                  'app.asar',
                  '__ORIGINAL_PRELOAD__'
              );


          console.log(
              '[Gunny ARM64] Ruffle preload starting'
          );

          console.log(
              '[Gunny ARM64] ruffle.js:',
              ruffleFile
          );


          function loadRuffle() {

              if (
                  !fs.existsSync(
                      ruffleFile
                  )
              ) {

                  throw new Error(
                      'ruffle.js not found: ' +
                      ruffleFile
                  );

              }


              const source =
                  fs.readFileSync(
                      ruffleFile,
                      'utf8'
                  );


              /*
               * Ruffle's self-hosted bundle is normally loaded
               * as a normal <script>. Because this preload is
               * deliberately running with contextIsolation=false,
               * window.eval() evaluates it in the page world.
               *
               * This must happen before Gunny performs its Flash
               * plugin detection.
               */

              window.RufflePlayer =
                  window.RufflePlayer || {};

              window.RufflePlayer.config =
                  window.RufflePlayer.config || {};


              window.RufflePlayer.config.polyfills =
                  true;


              window.RufflePlayer.config.favorFlash =
                  false;


              window.RufflePlayer.config.allowNetworking =
                  'all';


              const publicPath =
                  'file://' +
                  path.join(
                      resources,
                      'ruffle'
                  ).replace(
                      /\\/g,
                      '/'
                  ) +
                  '/';


              window.RufflePlayer.config.publicPath =
                  publicPath;


              /*
               * Execute the complete self-hosted Ruffle bundle
               * synchronously.
               */

              window.eval(
                  source
              );


              if (
                  !window.RufflePlayer
              ) {

                  throw new Error(
                      'RufflePlayer was not created'
                  );

              }


              const ruffle =
                  window.RufflePlayer.newest();


              if (
                  !ruffle
              ) {

                  throw new Error(
                      'Ruffle newest() returned nothing'
                  );

              }


              /*
               * THIS IS THE IMPORTANT CALL.
               *
               * Ruffle documentation explicitly says
               * pluginPolyfill() must run before any plugin
               * detection script.
               */

              if (
                  typeof ruffle.pluginPolyfill !==
                  'function'
              ) {

                  throw new Error(
                      'Ruffle pluginPolyfill() unavailable'
                  );

              }


              ruffle.pluginPolyfill();


              console.log(
                  '[Gunny ARM64] Ruffle pluginPolyfill ENABLED'
              );


              /*
               * Enable normal Flash <object>/<embed> conversion.
               */

              if (
                  typeof ruffle.polyfill ===
                  'function'
              ) {

                  ruffle.polyfill();

                  console.log(
                      '[Gunny ARM64] Ruffle polyfill ENABLED'
                  );

              }


              /*
               * Debug information.
               */

              try {

                  console.log(
                      '[Gunny ARM64] navigator.plugins:',
                      navigator.plugins.length
                  );

                  console.log(
                      '[Gunny ARM64] navigator.mimeTypes:',
                      navigator.mimeTypes.length
                  );

              } catch (_) {}

          }


          try {

              loadRuffle();

          } catch (error) {

              console.error(
                  '[Gunny ARM64] Ruffle initialization failed:',
                  error
              );

          }


          /*
           * ----------------------------------------------------------
           * Run the ORIGINAL Gunny preload AFTER Ruffle.
           * ----------------------------------------------------------
           */

          try {

              if (
                  fs.existsSync(
                      originalPreload
                  )
              ) {

                  console.log(
                      '[Gunny ARM64] Loading original preload:',
                      originalPreload
                  );

                  require(
                      originalPreload
                  );

              } else {

                  console.warn(
                      '[Gunny ARM64] Original preload not found:',
                      originalPreload
                  );

              }

          } catch (error) {

              console.error(
                  '[Gunny ARM64] Original preload failed:',
                  error
              );

          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "build/Gunny PC ARM64.app/Contents/Resources/preload-ruffle.js"
          )

          rel = Path(
              "build/preload-relative.txt"
          ).read_text().strip()

          s = p.read_text()

          s = s.replace(
              "__ORIGINAL_PRELOAD__",
              rel
          )

          p.write_text(
              s
          )

          print(
              "Original preload path:",
              rel
          )

          PY


          node \
            --check \
            "$RES/preload-ruffle.js"

          echo
          echo "Ruffle preload syntax: OK"


      # ==========================================================
      # 21. REBUILD APP.ASAR
      # ==========================================================

      - name: Rebuild app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ASAR="$APP/Contents/Resources/app.asar"

          rm -f \
            "$ASAR"

          asar pack \
            build/source \
            "$ASAR"

          echo
          ls -lh \
            "$ASAR"


      # ==========================================================
      # 22. INSTALL RUFFLE
      # ==========================================================

      - name: Install Ruffle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RES="$APP/Contents/Resources"

          ROOT="$(
            cat build/ruffle-root.txt
          )"

          rm -rf \
            "$RES/ruffle"

          mkdir -p \
            "$RES/ruffle"

          cp -R \
            "$ROOT"/. \
            "$RES/ruffle/"

          test -f \
            "$RES/ruffle/ruffle.js"

          echo
          echo "Ruffle installed."

          find "$RES/ruffle" \
            -maxdepth 2 \
            -type f \
            | sort


      # ==========================================================
      # 23. REMOVE PEPPER FLASH
      # ==========================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          rm -rf \
            "$APP/Contents/Resources/plugins"

          echo
          echo "Pepper Flash scan:"

          if find "$APP" \
            \( \
              -iname "*PepperFlash*" \
              -o \
              -iname "*pepflashplayer*" \
            \) \
            -print \
            | grep -q .
          then

            echo "ERROR: Pepper Flash remains."

            exit 1

          fi

          echo "Pepper Flash: REMOVED"


      # ==========================================================
      # 24. RENAME ELECTRON EXECUTABLE
      # ==========================================================

      - name: Rename Electron executable
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS"

          if [ ! -f \
            "$BIN/Electron"
          ]; then

            echo "ERROR: Electron executable missing."

            ls -lah "$BIN"

            exit 1

          fi

          rm -f \
            "$BIN/Gunny PC"

          mv \
            "$BIN/Electron" \
            "$BIN/Gunny PC"

          chmod +x \
            "$BIN/Gunny PC"


      # ==========================================================
      # 25. INFO.PLIST
      # ==========================================================

      - name: Update Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          echo
          plutil -p \
            "$PLIST"


      # ==========================================================
      # 26. REMOVE QUARANTINE
      # ==========================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr \
            "build/Gunny PC ARM64.app" \
            || true


      # ==========================================================
      # 27. REMOVE OLD SIGNATURE
      # ==========================================================

      - name: Remove old signatures
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          rm -rf \
            "$APP/Contents/_CodeSignature"

          find "$APP/Contents" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + \
            || true


      # ==========================================================
      # 28. ARM64 CHECK
      # ==========================================================

      - name: Verify ARM64
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          echo "=========================================="
          echo "MAIN EXECUTABLE"
          echo "=========================================="

          file "$MAIN"

          lipo -info "$MAIN"

          if ! file "$MAIN" \
            | grep -q "arm64"
          then

            echo "ERROR: Main executable is not ARM64."

            exit 1

          fi

          if file "$MAIN" \
            | grep -q "x86_64"
          then

            echo "ERROR: x86_64 main executable."

            exit 1

          fi

          echo
          echo "Main executable: ARM64"


      # ==========================================================
      # 29. MACH-O AUDIT
      # ==========================================================

      - name: Final Mach-O audit
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          REPORT="build/macho-report.txt"

          rm -f "$REPORT"

          find "$APP" \
            -type f \
            -exec sh -c '
              INFO="$(file "$1" 2>/dev/null || true)"

              case "$INFO" in
                *"Mach-O"*)
                  printf "%s\n" "$INFO"
                  ;;
              esac
            ' _ {} \; \
            > "$REPORT"

          echo "=========================================="
          echo "MACH-O FILES"
          echo "=========================================="

          cat "$REPORT"


          echo
          echo "=========================================="
          echo "x86_64"
          echo "=========================================="

          if grep -Eiq \
            "x86_64" \
            "$REPORT"
          then

            echo "ERROR: x86_64 remains."

            grep -Ei \
              "x86_64" \
              "$REPORT"

            exit 1

          fi

          echo "x86_64: NONE"


          echo
          echo "=========================================="
          echo "i386"
          echo "=========================================="

          if grep -Eiq \
            "i386" \
            "$REPORT"
          then

            echo "ERROR: i386 remains."

            grep -Ei \
              "i386" \
              "$REPORT"

            exit 1

          fi

          echo "i386: NONE"


      # ==========================================================
      # 30. FINAL RUFFLE AUDIT
      # ==========================================================

      - name: Final Ruffle audit
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RES="$APP/Contents/Resources"

          echo "=========================================="
          echo "RUFFLE"
          echo "=========================================="

          test -f \
            "$RES/ruffle/ruffle.js"

          WASM="$(
            find "$RES/ruffle" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then

            echo "ERROR: Ruffle WASM missing."

            exit 1

          fi

          echo
          echo "ruffle.js:"
          ls -lh \
            "$RES/ruffle/ruffle.js"

          echo
          echo "WASM:"
          ls -lh \
            "$WASM"

          echo
          echo "preload-ruffle.js:"
          ls -lh \
            "$RES/preload-ruffle.js"


      # ==========================================================
      # 31. VERIFY FINAL ASAR
      # ==========================================================

      - name: Verify final app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf \
            build/final-source

          asar extract \
            "$ASAR" \
            build/final-source

          MAIN="$(
            find build/final-source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then

            echo "ERROR: final main.js missing."

            exit 1

          fi

          node \
            --check \
            "$MAIN"

          echo
          echo "main.js syntax: OK"


          echo
          echo "PPAPI references:"

          grep -RniE \
            "ppapi-flash-path|ppapi-flash-version" \
            build/final-source \
            2>/dev/null \
            | head -100 \
            || true


      # ==========================================================
      # 32. SIGN
      # ==========================================================

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ==========================================================
      # 33. FINAL REPORT
      # ==========================================================

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Architecture:"
            file "$MAIN"

            echo
            echo "Ruffle:"
            test -f \
              "$APP/Contents/Resources/ruffle/ruffle.js" \
              && echo "OK"

            echo
            echo "Ruffle preload:"
            test -f \
              "$APP/Contents/Resources/preload-ruffle.js" \
              && echo "OK"

            echo
            echo "Pepper Flash:"
            if find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*pepflashplayer*" \
              \) \
              | grep -q .
            then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "PPAPI:"
            if grep -RniE \
              "ppapi-flash-path|ppapi-flash-version" \
              build/final-source \
              >/dev/null 2>&1
            then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "Original preload:"
            cat build/preload-relative.txt

          } > \
            release/build-report.txt

          cat \
            release/build-report.txt


      # ==========================================================
      # 34. ZIP
      # ==========================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            release/Gunny-PC-ARM64-Ruffle.zip

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            release/Gunny-PC-ARM64-Ruffle.zip

          echo
          ls -lh \
            release/Gunny-PC-ARM64-Ruffle.zip


      # ==========================================================
      # 35. DMG
      # ==========================================================

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            release/Gunny-PC-ARM64-Ruffle.dmg

          rm -rf \
            build/dmg

          mkdir -p \
            build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          hdiutil create \
            -volname \
            "Gunny PC ARM64 Ruffle" \
            -srcfolder \
            build/dmg \
            -ov \
            -format UDZO \
            release/Gunny-PC-ARM64-Ruffle.dmg

          echo
          ls -lh \
            release/Gunny-PC-ARM64-Ruffle.dmg


      # ==========================================================
      # 36. UPLOAD ZIP
      # ==========================================================

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: release/Gunny-PC-ARM64-Ruffle.zip
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # 37. UPLOAD DMG
      # ==========================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: release/Gunny-PC-ARM64-Ruffle.dmg
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # 38. UPLOAD REPORT
      # ==========================================================

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: release/build-report.txt
          if-no-files-found: error
          retention-days: 14
