name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Gunny PC"
  RUFFLE_VERSION: "0.4.1"
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

jobs:
  build:
    name: Build ARM64 from supplied Gunny app
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @electron/asar

          echo "node:"
          node --version

          echo "asar:"
          asar --version

          echo "gh:"
          gh --version

      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build release

          mkdir -p build
          mkdir -p release

      - name: Download supplied Gunny build
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny.zip

          file build/gunny.zip
          ls -lh build/gunny.zip

      - name: Extract supplied Gunny build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/input

          unzip \
            -q \
            -o \
            build/gunny.zip \
            -d build/input

          rm -rf build/input/__MACOSX

          APP="$(
            find build/input \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny .app not found."
            find build/input -maxdepth 4 -print | head -200
            exit 1
          fi

          printf '%s\n' "$APP" > build/input-app.txt

          echo "Input app:"
          cat build/input-app.txt

      - name: Verify supplied app is ARM64
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"
          MAIN="$APP/Contents/MacOS/Gunny PC"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: Gunny PC executable not found."
            find "$APP/Contents/MacOS" -maxdepth 2 -type f -print
            exit 1
          fi

          file "$MAIN"
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "arm64"; then
            echo "ERROR: supplied Gunny executable is not ARM64."
            exit 1
          fi

          if file "$MAIN" | grep -q "x86_64"; then
            echo "ERROR: supplied Gunny executable contains x86_64."
            exit 1
          fi

          echo "Supplied executable is ARM64."

      - name: Verify original Flash plugin
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"

          PLUGIN="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin"
          PLUGIN_BIN="$PLUGIN/Contents/MacOS/PepperFlashPlayer"

          echo "Expected plugin:"
          echo "$PLUGIN"

          if [ ! -f "$PLUGIN_BIN" ]; then
            echo "ERROR: bundled PepperFlashPlayer.plugin not found."
            find "$APP/Contents/Resources/plugins" \
              -maxdepth 5 \
              -print \
              2>/dev/null \
              || true
            exit 1
          fi

          file "$PLUGIN_BIN"

          echo
          echo "The supplied Pepper Flash is intentionally NOT used"
          echo "in the final ARM64 build because it is Intel-only."

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          rm -rf build/source

          asar extract \
            "$ASAR" \
            build/source

          echo "app.asar extracted."

      - name: Locate real Gunny main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            find build/source \
              -type f \
              -path "*/main.js" \
              -print \
              | while IFS= read -r f; do
                  if grep -q "findFlashPath" "$f" 2>/dev/null; then
                    echo "$f"
                    break
                  fi
                done
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: Gunny main.js with findFlashPath() was not found."

            grep -Rni \
              "findFlashPath\|ppapi-flash-path\|PepperFlashPlayer" \
              build/source \
              2>/dev/null \
              | head -300 \
              || true

            exit 1
          fi

          printf '%s\n' "$MAIN" > build/main-path.txt

          echo "Real Gunny main.js:"
          cat build/main-path.txt

      - name: Show exact Gunny Flash code
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"

          echo "=========================================="
          echo "FLASH PATH"
          echo "=========================================="

          grep -n \
            -A45 \
            -B5 \
            "function findFlashPath" \
            "$MAIN"

          echo
          echo "=========================================="
          echo "GAME WINDOW"
          echo "=========================================="

          grep -n \
            -A45 \
            -B5 \
            "function createGameWindow" \
            "$MAIN" \
            | head -120

      - name: Download Ruffle self-hosted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf build/ruffle

          mkdir -p build/ruffle

          cd build/ruffle

          echo "Ruffle release: v${RUFFLE_VERSION}"

          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*selfhosted*.zip" \
            --clobber

          ZIP="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Ruffle self-hosted ZIP not found."

            echo
            echo "Release assets:"
            gh release view \
              "v${RUFFLE_VERSION}" \
              --repo ruffle-rs/ruffle \
              --json assets \
              --jq '.assets[].name'

            exit 1
          fi

          echo "Ruffle archive:"
          echo "$ZIP"

          mkdir -p extracted

          unzip \
            -q \
            -o \
            "$ZIP" \
            -d extracted

      - name: Validate Ruffle package
        shell: bash
        run: |
          set -euo pipefail

          RUFFLE_JS="$(
            find build/ruffle/extracted \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$RUFFLE_JS" ]; then
            echo "ERROR: ruffle.js not found."

            find build/ruffle/extracted \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          RUFFLE_ROOT="$(dirname "$RUFFLE_JS")"

          printf '%s\n' "$RUFFLE_ROOT" > build/ruffle-root.txt

          WASM="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"

          if [ -z "$WASM" ]; then
            echo "ERROR: Ruffle WASM file not found."
            exit 1
          fi

          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "ruffle.js:"
          ls -lh "$RUFFLE_JS"

          echo
          echo "WASM:"
          ls -lh "$WASM"

      - name: Patch Gunny using its real main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"

          export MAIN

          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          
          main = Path(os.environ["MAIN"])
          
          source = main.read_text(
              encoding="utf-8-sig"
          )
          
          original = source
          
          
          # ==========================================================
          # 1. Disable Gunny's native Pepper Flash command-line setup.
          #
          # The supplied Gunny source really contains:
          #
          #   const flashPath = findFlashPath();
          #   if (flashPath) {
          #       app.commandLine.appendSwitch('ppapi-flash-path', ...)
          #       app.commandLine.appendSwitch('ppapi-flash-version', ...)
          #   }
          #
          # We replace that exact section.
          # ==========================================================
          
          flash_pattern = re.compile(
              r"""
              //\s*─\s*Flash\s+path.*?
              const\s+flashPath\s*=\s*findFlashPath\(\)\s*;
              \s*
              if\s*\(\s*flashPath\s*\)\s*\{
              .*?
              \}
              """,
              re.DOTALL | re.VERBOSE
          )
          
          flash_replacement = r"""
          // ── Flash replacement: Ruffle ───────────────────────────────
          // The original Pepper Flash / PPAPI path is disabled.
          // Flash content is handled by Ruffle in preload-ruffle.js.
          const flashPath = null;
          """
          
          source, count = flash_pattern.subn(
              flash_replacement,
              source,
              count=1
          )
          
          if count != 1:
              raise SystemExit(
                  "ERROR: real Gunny Flash path block was not found."
              )
          
          
          # ==========================================================
          # 2. Disable the original Flash mms.cfg deployment.
          # ==========================================================
          
          source = source.replace(
              "_deployFlashMmsCfg();",
              "// Pepper Flash mms.cfg deployment disabled for Ruffle."
          )
          
          
          # ==========================================================
          # 3. Remove Flash-not-found analytics.
          # ==========================================================
          
          source = re.sub(
              r"(?m)^[ \t]*if\s*\(\s*!flashPath\s*\).*flash_not_found.*\n?",
              "",
              source
          )
          
          
          # ==========================================================
          # 4. Remove the old macOS Flash warning.
          # ==========================================================
          
          warning_pattern = re.compile(
              r"""
              //\s*macOS:\s*Flash\s+warning
              .*?
              //\s*Xử\s+lý\s+protocol\s+URL
              """,
              re.DOTALL | re.VERBOSE
          )
          
          source, warning_count = warning_pattern.subn(
              "// Xử lý protocol URL",
              source,
              count=1
          )
          
          if warning_count == 0:
              print(
                  "WARNING: macOS Flash warning block not found."
              )
          
          
          # ==========================================================
          # 5. Patch the REAL createGameWindow() webPreferences.
          #
          # The supplied source contains exactly:
          #
          # webPreferences: {
          #   partition: 'persist:gunny-acc-' + _slot,
          #   plugins: true,
          #   nodeIntegration: false,
          #   contextIsolation: true,
          #   ...
          #   preload: app.isPackaged
          #     ? path.join(process.resourcesPath, 'preload.js')
          #     : path.join(__dirname, 'preload.js'),
          # },
          #
          # We keep the partition and security settings but replace
          # preload and turn off contextIsolation so Ruffle's page
          # polyfill is visible to the game page.
          # ==========================================================
          
          create_start = source.find(
              "function createGameWindow"
          )
          
          if create_start == -1:
              raise SystemExit(
                  "ERROR: createGameWindow() not found."
              )
          
          window_start = source.find(
              "const win = new BrowserWindow({",
              create_start
          )
          
          if window_start == -1:
              raise SystemExit(
                  "ERROR: real game BrowserWindow constructor not found."
              )
          
          prefs_start = source.find(
              "webPreferences: {",
              window_start
          )
          
          if prefs_start == -1:
              raise SystemExit(
                  "ERROR: game webPreferences block not found."
              )
          
          prefs_end = source.find(
              "preload:",
              prefs_start
          )
          
          if prefs_end == -1:
              raise SystemExit(
                  "ERROR: game preload property not found."
              )
          
          preload_end = source.find(
              "},",
              prefs_end
          )
          
          if preload_end == -1:
              raise SystemExit(
                  "ERROR: game preload property end not found."
              )
          
          old_preload_block = source[
              prefs_end:preload_end + 2
          ]
          
          new_preload_block = """preload: path.join(
                  process.resourcesPath,
                  'preload-ruffle.js'
                ),
          """
          
          source = (
              source[:prefs_end]
              + new_preload_block
              + source[preload_end + 2:]
          )
          
          # Only change contextIsolation in the game window.
          game_prefs = source[
              prefs_start:
              source.find(
                  "},",
                  prefs_start
              ) + 2
          ]
          
          game_prefs_new = re.sub(
              r"contextIsolation:\s*true",
              "contextIsolation: false",
              game_prefs,
              count=1
          )
          
          if game_prefs_new == game_prefs:
              raise SystemExit(
                  "ERROR: game contextIsolation=true was not found."
              )
          
          source = (
              source[:prefs_start]
              + game_prefs_new
              + source[
                  prefs_start + len(game_prefs):
              ]
          )
          
          
          # ==========================================================
          # 6. Keep plugins=true in the game window.
          #
          # Ruffle's JavaScript polyfill uses the browser plugin/mime
          # interfaces to emulate Flash detection.
          # ==========================================================
          
          # Do not globally rewrite other BrowserWindows.
          # Only the game window's existing plugins setting matters.
          
          game_prefs = source[
              prefs_start:
              source.find(
                  "},",
                  prefs_start
              ) + 2
          ]
          
          if not re.search(
              r"plugins:\s*true",
              game_prefs
          ):
              game_prefs = re.sub(
                  r"plugins:\s*false",
                  "plugins: true",
                  game_prefs,
                  count=1
              )
          
              source = (
                  source[:prefs_start]
                  + game_prefs
                  + source[
                      prefs_start + len(
                          source[
                              prefs_start:
                              source.find(
                                  "},",
                                  prefs_start
                              ) + 2
                          ]
                      ):
                  ]
              )
          
          
          # ==========================================================
          # 7. Save.
          # ==========================================================
          
          main.write_text(
              source,
              encoding="utf-8"
          )
          
          print(
              "Gunny main.js patched successfully."
          )
          
          print(
              "Flash block replacements:",
              count
          )
          
          print(
              "Flash warning replacements:",
              warning_count
          )
          
          print(
              "Original length:",
              len(original)
          )
          
          print(
              "Patched length:",
              len(source)
          )
          
          print(
              "Original preload block:",
              old_preload_block
          )
          PY

          echo
          echo "Checking JavaScript syntax..."

          node \
            --check \
            "$MAIN"

          echo "main.js syntax: OK"

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"
          RES="$APP/Contents/Resources"

          RUFFLE_ROOT="$(cat build/ruffle-root.txt)"

          rm -rf "$RES/ruffle"

          mkdir -p "$RES/ruffle"

          cp -R \
            "$RUFFLE_ROOT"/. \
            "$RES/ruffle/"

          test -f \
            "$RES/ruffle/ruffle.js"

          cat > "$RES/preload-ruffle.js" <<'EOF'
          'use strict';
          
          const fs = require('fs');
          const path = require('path');
          
          const resources = process.resourcesPath;
          
          const ruffleDirectory = path.join(
              resources,
              'ruffle'
          );
          
          const ruffleScript = path.join(
              ruffleDirectory,
              'ruffle.js'
          );
          
          console.log(
              '[Gunny ARM64] Ruffle preload starting'
          );
          
          function loadRuffle() {
              if (!fs.existsSync(ruffleScript)) {
                  throw new Error(
                      'Ruffle script not found: ' +
                      ruffleScript
                  );
              }
          
              /*
               * Ruffle self-hosted is normally loaded by:
               *
               *   <script src="ruffle.js"></script>
               *
               * The Gunny page is not modified, so the same script
               * is evaluated from the preload before the page runs.
               */
          
              const source = fs.readFileSync(
                  ruffleScript,
                  'utf8'
              );
          
              window.RufflePlayer =
                  window.RufflePlayer || {};
          
              window.RufflePlayer.config =
                  window.RufflePlayer.config || {};
          
              window.RufflePlayer.config.publicPath =
                  'file://' +
                  ruffleDirectory
                      .replace(/\\/g, '/') +
                  '/';
          
              window.RufflePlayer.config.polyfills =
                  true;
          
              window.RufflePlayer.config.favorFlash =
                  false;
          
              window.RufflePlayer.config.allowNetworking =
                  'all';
          
              window.eval(source);
          
              if (
                  !window.RufflePlayer ||
                  !window.RufflePlayer.newest
              ) {
                  throw new Error(
                      'RufflePlayer.newest() unavailable'
                  );
              }
          
              const ruffle =
                  window.RufflePlayer.newest();
          
              if (
                  ruffle &&
                  typeof ruffle.pluginPolyfill ===
                  'function'
              ) {
                  ruffle.pluginPolyfill();
          
                  console.log(
                      '[Gunny ARM64] Ruffle pluginPolyfill enabled'
                  );
              }
          
              if (
                  ruffle &&
                  typeof ruffle.polyfill ===
                  'function'
              ) {
                  ruffle.polyfill();
          
                  console.log(
                      '[Gunny ARM64] Ruffle polyfill enabled'
                  );
              }
          
              console.log(
                  '[Gunny ARM64] navigator.plugins:',
                  navigator.plugins.length
              );
          
              console.log(
                  '[Gunny ARM64] navigator.mimeTypes:',
                  navigator.mimeTypes.length
              );
          }
          
          try {
              loadRuffle();
          } catch (error) {
              console.error(
                  '[Gunny ARM64] Ruffle initialization failed:',
                  error && error.stack
                      ? error.stack
                      : error
              );
          }
          EOF

          node \
            --check \
            "$RES/preload-ruffle.js"

          echo "preload-ruffle.js syntax: OK"

      - name: Rebuild app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"

          ASAR="$APP/Contents/Resources/app.asar"

          rm -f "$ASAR"

          asar pack \
            build/source \
            "$ASAR"

          echo "app.asar rebuilt."

      - name: Remove Intel Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"

          rm -rf \
            "$APP/Contents/Resources/plugins"

          echo "Intel Pepper Flash removed."

      - name: Verify patched main.js
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf build/final-source

          asar extract \
            "$ASAR" \
            build/final-source

          MAIN="$(
            find build/final-source \
              -type f \
              -name "main.js" \
              -print \
              | while IFS= read -r f; do
                  if grep -q "const flashPath = null" "$f"; then
                    echo "$f"
                    break
                  fi
                done
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: patched main.js not found."
            exit 1
          fi

          node \
            --check \
            "$MAIN"

          echo "Final main.js syntax: OK"

          echo
          echo "Flash command-line switches remaining:"

          grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN" \
            || true

          echo
          echo "PepperFlash references remaining:"

          grep -niE \
            "PepperFlashPlayer|pepflashplayer" \
            "$MAIN" \
            || true

          echo
          echo "Ruffle preload reference:"

          grep -ni \
            "preload-ruffle.js" \
            "$MAIN"

      - name: Verify Ruffle files
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"

          test -f \
            "$APP/Contents/Resources/ruffle/ruffle.js"

          find \
            "$APP/Contents/Resources/ruffle" \
            -type f \
            -name "*.wasm" \
            -print \
            | head -20

          echo "Ruffle files: OK"

      - name: Final ARM64 audit
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"

          REPORT="build/macho-report.txt"

          rm -f "$REPORT"

          find "$APP" \
            -type f \
            -exec sh -c '
              INFO="$(file "$1" 2>/dev/null || true)"

              case "$INFO" in
                *"Mach-O"*)
                  printf "%s\n" "$INFO"
                  ;;
              esac
            ' _ {} \; \
            > "$REPORT"

          cat "$REPORT"

          echo
          echo "Checking x86_64..."

          if grep -Eiq "x86_64" "$REPORT"; then
            echo "ERROR: x86_64 Mach-O remains."
            grep -Ei "x86_64" "$REPORT"
            exit 1
          fi

          echo "x86_64: NONE"

          echo
          echo "Checking i386..."

          if grep -Eiq "i386" "$REPORT"; then
            echo "ERROR: i386 Mach-O remains."
            grep -Ei "i386" "$REPORT"
            exit 1
          fi

          echo "i386: NONE"

          echo
          echo "ARM64 audit: OK"

      - name: Update app name
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"
          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          plutil -p "$PLIST"

      - name: Remove quarantine and old signature
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"

          xattr -cr "$APP" || true

          rm -rf \
            "$APP/Contents/_CodeSignature"

          find "$APP/Contents" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + \
            || true

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

      - name: Rename final app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/input-app.txt)"

          FINAL="build/Gunny PC ARM64.app"

          rm -rf "$FINAL"

          mv \
            "$APP" \
            "$FINAL"

          printf '%s\n' "$FINAL" > build/final-app.txt

          echo "Final app:"
          cat build/final-app.txt

      - name: Final executable check
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/final-app.txt)"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          file "$MAIN"
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "arm64"; then
            echo "ERROR: final executable is not ARM64."
            exit 1
          fi

          if file "$MAIN" | grep -q "x86_64"; then
            echo "ERROR: final executable contains x86_64."
            exit 1
          fi

          echo "Final executable: ARM64"

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "release/Gunny-PC-ARM64-Ruffle.zip"

          ls -lh \
            "release/Gunny-PC-ARM64-Ruffle.zip"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/dmg

          mkdir -p build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "release/Gunny-PC-ARM64-Ruffle.dmg"

          ls -lh \
            "release/Gunny-PC-ARM64-Ruffle.dmg"

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/final-app.txt)"
          MAIN="$APP/Contents/MacOS/Gunny PC"

          {
            echo "Gunny PC ARM64 + Ruffle"
            echo
            echo "Ruffle: $RUFFLE_VERSION"
            echo
            echo "Main executable:"
            file "$MAIN"
            echo
            echo "Ruffle:"
            test -f \
              "$APP/Contents/Resources/ruffle/ruffle.js" \
              && echo "ruffle.js: OK"
            echo
            echo "Ruffle preload:"
            test -f \
              "$APP/Contents/Resources/preload-ruffle.js" \
              && echo "preload-ruffle.js: OK"
            echo
            echo "Pepper Flash:"
            if [ -d "$APP/Contents/Resources/plugins" ]; then
              echo "WARNING: plugins directory still exists."
            else
              echo "Intel Pepper Flash removed."
            fi
          } > release/build-report.txt

          cat release/build-report.txt

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: release/Gunny-PC-ARM64-Ruffle.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: release/Gunny-PC-ARM64-Ruffle.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: release/build-report.txt
          if-no-files-found: error
          retention-days: 14
