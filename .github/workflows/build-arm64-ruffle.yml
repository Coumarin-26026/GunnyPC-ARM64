name: Build Gunny PC ARM64 + Ruffle Self Hosted

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Gunny gốc dùng Electron cũ/x86_64.
  # Đây là runtime ARM64 mà chúng ta dùng để chạy launcher.
  ELECTRON_VERSION: "43.2.0"

  # Ruffle stable
  RUFFLE_VERSION: "0.4.1"

  APP_NAME: "Gunny PC"

  # Bản Gunny Intel từ Google Drive
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Gunny ARM64 + Ruffle Self Hosted

    runs-on: macos-14


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================

      - name: Install tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL TOOLS"
          echo "=========================================="

          brew install p7zip

          npm install -g @electron/asar

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "asar:"
          asar --version


      # ============================================================
      # 3. RUNNER
      # ============================================================

      - name: Show runner
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNER"
          echo "=========================================="

          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "macOS:"
          sw_vers


      # ============================================================
      # 4. DIRECTORIES
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf download
          rm -rf extracted
          rm -rf build
          rm -rf output

          mkdir -p download
          mkdir -p extracted
          mkdir -p build
          mkdir -p output


      # ============================================================
      # 5. DOWNLOAD GUNNY
      # ============================================================

      - name: Download Gunny Intel
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$GUNNY_URL" \
            -o download/gunny.zip

          echo
          ls -lh download/gunny.zip

          echo
          file download/gunny.zip

          echo
          unzip -t download/gunny.zip


      # ============================================================
      # 6. EXTRACT GUNNY
      # ============================================================

      - name: Extract Gunny
        shell: bash
        run: |
          set -e

          unzip \
            -q \
            -o \
            download/gunny.zip \
            -d extracted

          rm -rf extracted/__MACOSX

          echo "Applications:"

          find extracted \
            -type d \
            -name "*.app" \
            -print


      # ============================================================
      # 7. VERIFY APP
      # ============================================================

      - name: Verify Gunny
        shell: bash
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Gunny PC.app not found."
            exit 1
          fi

          if [ ! -f \
            "$APP/Contents/Resources/app.asar"
          ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          echo "Gunny found."

          echo
          echo "Main executable:"

          file \
            "$APP/Contents/MacOS/Gunny PC"


      # ============================================================
      # 8. BACKUP ORIGINAL ASAR
      # ============================================================

      - name: Backup app.asar
        shell: bash
        run: |
          set -e

          cp \
            "extracted/Gunny PC.app/Contents/Resources/app.asar" \
            "build/app-original.asar"

          ls -lh \
            build/app-original.asar


      # ============================================================
      # 9. EXTRACT ASAR
      # ============================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -e

          mkdir -p build/gunny-app

          asar extract \
            build/app-original.asar \
            build/gunny-app

          echo "Extracted."

          echo
          echo "Top level:"

          find build/gunny-app \
            -maxdepth 2 \
            -print \
            | sort \
            | head -200


      # ============================================================
      # 10. FIND MAIN.JS
      # ============================================================

      - name: Locate main.js
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          if [ ! -f "$MAIN" ]; then

            echo "main.js not found at expected path."

            MAIN_FOUND="$(
              find build/gunny-app \
                -type f \
                -name "main.js" \
                -print \
                | head -1
            )"

            if [ -z "$MAIN_FOUND" ]; then
              echo "ERROR: no main.js found."
              exit 1
            fi

            cp \
              "$MAIN_FOUND" \
              build/gunny-app/main.js

          fi

          echo "main.js:"
          ls -lh build/gunny-app/main.js


      # ============================================================
      # 11. BACKUP MAIN.JS
      # ============================================================

      - name: Backup main.js
        shell: bash
        run: |
          set -e

          cp \
            build/gunny-app/main.js \
            build/main.original.js


      # ============================================================
      # 12. SHOW ORIGINAL FLASH CODE
      # ============================================================

      - name: Analyze original Flash references
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          echo "=========================================="
          echo "ORIGINAL FLASH REFERENCES"
          echo "=========================================="

          grep -ni -E \
            "flash|pepper|ppapi|plugin" \
            "$MAIN" \
            | head -200 \
            || true


      # ============================================================
      # 13. DOWNLOAD ELECTRON ARM64
      # ============================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -e

          VERSION="$ELECTRON_VERSION"

          URL="https://github.com/electron/electron/releases/download/v${VERSION}/electron-v${VERSION}-darwin-arm64.zip"

          echo "=========================================="
          echo "ELECTRON ARM64"
          echo "=========================================="

          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            "$URL" \
            -o build/electron-arm64.zip

          ls -lh \
            build/electron-arm64.zip


      # ============================================================
      # 14. EXTRACT ELECTRON
      # ============================================================

      - name: Extract Electron
        shell: bash
        run: |
          set -e

          mkdir -p build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          echo "$ELECTRON_APP" \
            > build/electron-app.txt

          echo "Electron:"
          cat build/electron-app.txt


      # ============================================================
      # 15. VERIFY ELECTRON ARM64
      # ============================================================

      - name: Verify Electron ARM64
        shell: bash
        run: |
          set -e

          ELECTRON_APP="$(cat build/electron-app.txt)"

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          echo "=========================================="
          echo "ELECTRON ARCHITECTURE"
          echo "=========================================="

          file "$BIN"

          lipo -info "$BIN" || true

          if ! file "$BIN" | grep -q "arm64"; then
            echo "ERROR: Electron is not ARM64."
            exit 1
          fi


      # ============================================================
      # 16. DOWNLOAD RUFFLE SELF-HOSTED
      # ============================================================

      - name: Download Ruffle self-hosted
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUFFLE SELF HOSTED"
          echo "=========================================="

          mkdir -p build/ruffle

          cd build/ruffle

          npm pack \
            "@ruffle-rs/ruffle@${RUFFLE_VERSION}"

          RUFFLE_TGZ="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*.tgz" \
              -print \
              | head -1
          )"

          if [ -z "$RUFFLE_TGZ" ]; then
            echo "ERROR: Ruffle npm package not downloaded."
            exit 1
          fi

          mkdir -p package

          tar \
            -xzf \
            "$RUFFLE_TGZ" \
            -C package \
            --strip-components=1

          echo
          echo "Ruffle package:"

          find package \
            -maxdepth 3 \
            -type f \
            | sort


      # ============================================================
      # 17. LOCATE RUFFLE.JS
      # ============================================================

      - name: Verify Ruffle self-hosted
        shell: bash
        run: |
          set -e

          RUFFLE_JS="$(
            find build/ruffle/package \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -1
          )"

          if [ -z "$RUFFLE_JS" ]; then
            echo "ERROR: ruffle.js not found."
            exit 1
          fi

          RUFFLE_ROOT="$(dirname "$RUFFLE_JS")"

          echo "$RUFFLE_ROOT" \
            > build/ruffle-root.txt

          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "Ruffle files:"

          find "$RUFFLE_ROOT" \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 18. COPY RUFFLE INTO APP RESOURCES
      # ============================================================

      - name: Install Ruffle self-hosted
        shell: bash
        run: |
          set -e

          RUFFLE_ROOT="$(cat build/ruffle-root.txt)"

          mkdir -p \
            build/gunny-app/ruffle

          cp -R \
            "$RUFFLE_ROOT"/. \
            build/gunny-app/ruffle/

          echo "Ruffle installed in app resources."

          echo
          find build/gunny-app/ruffle \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 19. PATCH MAIN.JS
      # ============================================================

      - name: Patch main.js for Ruffle self-hosted
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("build/gunny-app/main.js")

          s = path.read_text(
              encoding="utf-8"
          )

          print(
              "Original main.js:",
              len(s),
              "bytes"
          )


          # ========================================================
          # 1. REMOVE ONLY PPAPI COMMAND-LINE SWITCHES
          # ========================================================

          patterns = [

              r'^[^\n]*ppapi-flash-path[^\n]*\n?',

              r'^[^\n]*ppapi-flash-version[^\n]*\n?',

          ]

          for pattern in patterns:

              s, count = re.subn(
                  pattern,
                  "",
                  s,
                  flags=re.IGNORECASE |
                       re.MULTILINE
              )

              if count:
                  print(
                      "Removed PPAPI lines:",
                      count
                  )


          # ========================================================
          # 2. DISABLE ELECTRON PLUGIN MODE
          # ========================================================

          s = re.sub(
              r'plugins\s*:\s*true',
              'plugins: false',
              s,
              flags=re.IGNORECASE
          )


          # ========================================================
          # 3. RUFFLE INJECTION FUNCTION
          # ========================================================

          ruffle_function = r'''

          // =========================================================
          // GUNNY ARM64 - RUFFLE SELF HOSTED
          // =========================================================

          const GUNNY_RUFFLE_URL =
            'file://' +
            process.resourcesPath.replace(/\\/g, '/') +
            '/ruffle/ruffle.js';


          async function injectRuffle(contents) {

            try {

              if (!contents || contents.isDestroyed()) {
                return;
              }

              const url =
                contents.getURL();

              console.log(
                '[Ruffle] page:',
                url
              );


              // ---------------------------------------------------
              // Inject ruffle.js directly into the page.
              // ---------------------------------------------------

              const result =
                await contents.executeJavaScript(
                  `(async () => {

                    if (
                      window.__GUNNY_RUFFLE_LOADED__
                    ) {
                      return 'already-loaded';
                    }

                    window.__GUNNY_RUFFLE_LOADED__ =
                      true;

                    const script =
                      document.createElement('script');

                    script.src =
                      ${JSON.stringify(
                        GUNNY_RUFFLE_URL
                      )};

                    script.onload = () => {

                      console.log(
                        '[Ruffle] ruffle.js loaded'
                      );

                    };

                    script.onerror = (e) => {

                      console.error(
                        '[Ruffle] ruffle.js failed',
                        e
                      );

                    };

                    (
                      document.head ||
                      document.documentElement
                    ).appendChild(script);

                    return 'injected';

                  })()`,
                  true
                );

              console.log(
                '[Ruffle] injection result:',
                result
              );


              // ---------------------------------------------------
              // Give Ruffle a moment to initialize.
              // Then ask it to polyfill existing Flash.
              // ---------------------------------------------------

              setTimeout(
                () => {

                  contents.executeJavaScript(
                    `(() => {

                      try {

                        if (
                          window.RufflePlayer
                        ) {

                          console.log(
                            '[Ruffle] player API available'
                          );

                        }

                        return true;

                      } catch (e) {

                        console.error(
                          '[Ruffle] API check failed',
                          e
                        );

                        return false;

                      }

                    })()`,
                    true
                  ).catch(() => {});

                },
                1000
              );

            } catch (error) {

              console.error(
                '[Ruffle] injection failed:',
                error &&
                error.stack
                  ? error.stack
                  : error
              );

            }

          }


          // =========================================================
          // INJECT INTO EVERY BROWSER WINDOW
          // =========================================================

          app.on(
            'browser-window-created',
            (_event, window) => {

              const contents =
                window.webContents;


              contents.on(
                'dom-ready',
                () => {

                  injectRuffle(
                    contents
                  );

                }
              );


              contents.on(
                'did-finish-load',
                () => {

                  injectRuffle(
                    contents
                  );

                }
              );

            }
          );


          // =========================================================
          // ALSO HANDLE WINDOWS CREATED BEFORE LISTENER
          // =========================================================

          function injectRuffleIntoAllWindows() {

            try {

              BrowserWindow
                .getAllWindows()
                .forEach(
                  (window) => {

                    injectRuffle(
                      window.webContents
                    );

                  }
                );

            } catch (error) {

              console.error(
                '[Ruffle] existing window injection failed:',
                error
              );

            }

          }

          '''


          # ========================================================
          # 4. INSERT FUNCTION BEFORE app.whenReady
          # ========================================================

          if (
              "async function injectRuffle(" not in s
          ):

              match = re.search(
                  r'app\.whenReady\(\)\.then\(',
                  s
              )

              if not match:

                  raise SystemExit(
                      "ERROR: app.whenReady() not found"
                  )

              s = (
                  s[:match.start()]
                  + ruffle_function
                  + "\n"
                  + s[match.start():]
              )


          # ========================================================
          # 5. INJECT AFTER app READY
          # ========================================================

          ready_pattern = (
              r'app\.whenReady\(\)\.then\(\s*'
              r'(?:async\s+)?function\s*\(\s*\)\s*\{'
          )

          match = re.search(
              ready_pattern,
              s
          )

          if match:

              insertion = (
                  "\n\n"
                  "  injectRuffleIntoAllWindows();\n"
              )

              pos = match.end()

              if (
                  "injectRuffleIntoAllWindows();"
                  not in s
              ):

                  s = (
                      s[:pos]
                      + insertion
                      + s[pos:]
                  )

                  print(
                      "Added existing-window Ruffle injection."
                  )

          else:

              arrow_pattern = (
                  r'app\.whenReady\(\)\.then\(\s*'
                  r'(?:async\s+)?\(\s*\)\s*=>\s*\{'
              )

              match = re.search(
                  arrow_pattern,
                  s
              )

              if match:

                  insertion = (
                      "\n\n"
                      "  injectRuffleIntoAllWindows();\n"
                  )

                  pos = match.end()

                  if (
                      "injectRuffleIntoAllWindows();"
                      not in s
                  ):

                      s = (
                          s[:pos]
                          + insertion
                          + s[pos:]
                      )

                      print(
                          "Added existing-window Ruffle injection."
                      )

              else:

                  print(
                      "WARNING:"
                      " Could not insert after app.whenReady."
                  )


          # ========================================================
          # 6. DISABLE OLD FLASH WARNING ONLY IF IT IS OBVIOUS
          # ========================================================

          # We deliberately do NOT delete arbitrary Flash code.
          # We only replace the specific warning call if the source
          # clearly contains a Flash-related showMessageBox.

          lines = s.splitlines()

          result = []

          for line in lines:

              lower = line.lower()

              if (
                  "showmessagebox" in lower
                  and (
                      "flash" in lower
                      or "pepper" in lower
                  )
              ):

                  print(
                      "Removed Flash warning line:"
                  )

                  print(line)

                  continue

              result.append(line)

          s = "\n".join(result) + "\n"


          # ========================================================
          # 7. SAVE
          # ========================================================

          path.write_text(
              s,
              encoding="utf-8"
          )

          print()
          print(
              "=========================================="
          )
          print(
              "Ruffle patch completed"
          )
          print(
              "New size:",
              len(s),
              "bytes"
          )
          print(
              "=========================================="
          )

          PY


      # ============================================================
      # 20. VERIFY JAVASCRIPT
      # ============================================================

      - name: Verify patched JavaScript
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          echo "=========================================="
          echo "RUFFLE REFERENCES"
          echo "=========================================="

          grep -ni -E \
            "Ruffle|ruffle|injectRuffle|ruffle.js" \
            "$MAIN" \
            | head -100 \
            || true

          echo
          echo "PPAPI references:"

          grep -ni -E \
            "ppapi-flash" \
            "$MAIN" \
            || true

          echo
          echo "Pepper references:"

          grep -ni -E \
            "PepperFlash" \
            "$MAIN" \
            || true

          echo
          echo "JavaScript syntax:"

          node \
            --check \
            "$MAIN"

          echo
          echo "JavaScript syntax OK."


      # ============================================================
      # 21. REPACK ASAR
      # ============================================================

      - name: Repack app.asar
        shell: bash
        run: |
          set -e

          asar pack \
            build/gunny-app \
            build/gunny-arm64.asar

          echo
          ls -lh \
            build/gunny-arm64.asar


      # ============================================================
      # 22. CREATE ARM64 ELECTRON APP
      # ============================================================

      - name: Create Gunny ARM64 app
        shell: bash
        run: |
          set -e

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          echo "Gunny ARM64 app created."


      # ============================================================
      # 23. INSTALL GUNNY ASAR
      # ============================================================

      - name: Install Gunny app.asar
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          RESOURCES="$APP/Contents/Resources"

          rm -f \
            "$RESOURCES/app.asar"

          rm -f \
            "$RESOURCES/default_app.asar"

          cp \
            build/gunny-arm64.asar \
            "$RESOURCES/app.asar"

          echo "Gunny app.asar installed."


      # ============================================================
      # 24. REMOVE PEPPER FLASH
      # ============================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          PLUGINS="$APP/Contents/Resources/plugins"

          if [ -d "$PLUGINS" ]; then

            echo "Removing:"
            echo "$PLUGINS"

            rm -rf \
              "$PLUGINS"

          fi

          echo
          echo "Pepper Flash search:"

          find "$APP" \
            -iname "*PepperFlash*" \
            -o -iname "*pepflash*" \
            || true


      # ============================================================
      # 25. RENAME ELECTRON EXECUTABLE
      # ============================================================

      - name: Rename Electron executable
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          BIN_DIR="$APP/Contents/MacOS"

          if [ ! -f "$BIN_DIR/Electron" ]; then

            echo "ERROR: Electron executable missing."

            ls -la "$BIN_DIR"

            exit 1

          fi

          mv \
            "$BIN_DIR/Electron" \
            "$BIN_DIR/Gunny PC"

          file \
            "$BIN_DIR/Gunny PC"


      # ============================================================
      # 26. UPDATE INFO.PLIST
      # ============================================================

      - name: Update Info.plist
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          echo
          plutil -p "$PLIST"


      # ============================================================
      # 27. VERIFY RUFFLE FILES
      # ============================================================

      - name: Verify Ruffle files in app
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle"

          if [ ! -f "$RUFFLE/ruffle.js" ]; then

            echo "ERROR: ruffle.js missing."

            find "$RUFFLE" \
              -maxdepth 3 \
              -print \
              || true

            exit 1

          fi

          echo "Ruffle self-hosted OK."

          echo
          find "$RUFFLE" \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 28. VERIFY APP.ASAR
      # ============================================================

      - name: Verify final app.asar
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf \
            build/final-asar-test

          asar extract \
            "$ASAR" \
            build/final-asar-test

          test -f \
            build/final-asar-test/main.js

          echo "Final app.asar OK."

          echo
          echo "Ruffle files inside ASAR:"

          find build/final-asar-test/ruffle \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # ============================================================
      # 29. REMOVE QUARANTINE
      # ============================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          xattr -cr \
            "$APP" \
            || true


      # ============================================================
      # 30. VERIFY MAIN ARM64
      # ============================================================

      - name: Verify main ARM64
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS/Gunny PC"

          echo "=========================================="
          echo "MAIN EXECUTABLE"
          echo "=========================================="

          file "$BIN"

          echo

          lipo -info "$BIN" \
            || true

          if ! file "$BIN" | grep -q "arm64"; then

            echo "ERROR: Gunny main executable is not ARM64."

            exit 1

          fi


      # ============================================================
      # 31. SCAN FRAMEWORKS
      # ============================================================

      - name: Scan final Mach-O files
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "MACH-O SCAN"
          echo "=========================================="

          ARM64=0
          X64=0

          while IFS= read -r -d '' FILE; do

            TYPE="$(file "$FILE")"

            if echo "$TYPE" | grep -q "Mach-O"; then

              echo "$TYPE"

              if echo "$TYPE" | grep -q "arm64"; then
                ARM64=$((ARM64 + 1))
              fi

              if echo "$TYPE" | grep -q "x86_64"; then
                X64=$((X64 + 1))
              fi

            fi

          done < <(
            find "$APP" \
              -type f \
              -print0
          )

          echo
          echo "ARM64 Mach-O:"
          echo "$ARM64"

          echo
          echo "x86_64 Mach-O:"
          echo "$X64"


      # ============================================================
      # 32. CHECK PEPPER FLASH IS ABSENT
      # ============================================================

      - name: Verify Pepper Flash is absent
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          FOUND="$(
            find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | head -20
          )"

          if [ -n "$FOUND" ]; then

            echo "ERROR: Pepper Flash still exists:"
            echo "$FOUND"

            exit 1

          fi

          echo "Pepper Flash: ABSENT"


      # ============================================================
      # 33. CODE SIGN
      # ============================================================

      - name: Code sign app
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ============================================================
      # 34. FINAL RUFFLE CHECK
      # ============================================================

      - name: Final Ruffle check
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle"

          test -f \
            "$RUFFLE/ruffle.js"

          echo "Ruffle self-hosted:"
          echo "OK"

          echo
          echo "ruffle.js:"
          ls -lh \
            "$RUFFLE/ruffle.js"

          echo
          echo "WASM files:"

          find "$RUFFLE" \
            -type f \
            -name "*.wasm" \
            -print \
            | while read -r FILE; do
                ls -lh "$FILE"
              done


      # ============================================================
      # 35. BUILD REPORT
      # ============================================================

      - name: Create build report
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          REPORT="output/build-report.txt"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE SELF HOSTED"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Runner:"
            uname -a

            echo
            echo "Main executable:"
            file \
              "$APP/Contents/MacOS/Gunny PC"

            echo
            echo "Main lipo:"
            lipo -info \
              "$APP/Contents/MacOS/Gunny PC" \
              2>&1 \
              || true

            echo
            echo "Ruffle:"
            if [ -f \
              "$APP/Contents/Resources/ruffle/ruffle.js"
            ]; then
              echo "INSTALLED"
            else
              echo "MISSING"
            fi

            echo
            echo "Ruffle WASM:"
            find \
              "$APP/Contents/Resources/ruffle" \
              -name "*.wasm" \
              -print \
              || true

            echo
            echo "Pepper Flash:"
            if find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | grep -q .; then
              echo "FOUND"
            else
              echo "REMOVED"
            fi

            echo
            echo "app.asar:"
            ls -lh \
              "$APP/Contents/Resources/app.asar"

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # 36. CREATE DMG
      # ============================================================

      - name: Create DMG
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          rm -rf \
            output/dmg

          mkdir -p \
            output/dmg

          cp -R \
            "$APP" \
            output/dmg/

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder output/dmg \
            -ov \
            -format UDZO \
            output/Gunny-PC-ARM64-Ruffle.dmg

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.dmg


      # ============================================================
      # 37. ZIP APP
      # ============================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -e

          cd build

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "Gunny PC ARM64.app" \
            "../output/Gunny-PC-ARM64-Ruffle.zip"

          cd ..

          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.zip


      # ============================================================
      # 38. UPLOAD APP
      # ============================================================

      - name: Upload ARM64 app
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-App
          path: build/Gunny PC ARM64.app/
          retention-days: 7


      # ============================================================
      # 39. UPLOAD DMG
      # ============================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: output/Gunny-PC-ARM64-Ruffle.dmg
          retention-days: 7


      # ============================================================
      # 40. UPLOAD ZIP
      # ============================================================

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: output/Gunny-PC-ARM64-Ruffle.zip
          retention-days: 7


      # ============================================================
      # 41. UPLOAD REPORT
      # ============================================================

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: output/build-report.txt
          retention-days: 7
