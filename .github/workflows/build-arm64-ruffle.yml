name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Electron có macOS ARM64 chính thức
  ELECTRON_VERSION: "43.2.0"

  # Ruffle stable
  RUFFLE_VERSION: "0.4.1"

  APP_NAME: "Gunny PC"

  # Bản Gunny Intel gốc
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Build Gunny PC ARM64 + Ruffle

    runs-on: macos-14


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL TOOLS"
          echo "=========================================="

          brew install p7zip

          npm install -g @electron/asar

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "asar:"
          asar --version || true


      # ============================================================
      # 3. RUNNER INFORMATION
      # ============================================================

      - name: Show runner information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNER"
          echo "=========================================="

          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "CPU:"
          sysctl -n machdep.cpu.brand_string || true

          echo
          echo "macOS:"
          sw_vers


      # ============================================================
      # 4. CREATE DIRECTORIES
      # ============================================================

      - name: Create build directories
        shell: bash
        run: |
          set -e

          rm -rf download
          rm -rf extracted
          rm -rf build
          rm -rf output

          mkdir -p download
          mkdir -p extracted
          mkdir -p build
          mkdir -p output

          echo "Build directories created."


      # ============================================================
      # 5. DOWNLOAD GUNNY INTEL
      # ============================================================

      - name: Download Gunny Intel build
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$GUNNY_URL" \
            -o download/gunny.zip

          echo
          echo "Downloaded file:"

          ls -lh download/gunny.zip

          echo
          echo "File type:"

          file download/gunny.zip

          echo
          echo "Testing ZIP:"

          unzip -t download/gunny.zip


      # ============================================================
      # 6. EXTRACT GUNNY
      # ============================================================

      - name: Extract Gunny
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACT GUNNY"
          echo "=========================================="

          unzip \
            -q \
            -o \
            download/gunny.zip \
            -d extracted

          rm -rf extracted/__MACOSX

          echo
          echo "Applications found:"

          find extracted \
            -type d \
            -name "*.app" \
            -print


      # ============================================================
      # 7. VERIFY GUNNY
      # ============================================================

      - name: Verify Gunny application
        shell: bash
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR:"
            echo "Gunny PC.app was not found."
            echo
            echo "Available files:"
            find extracted -maxdepth 4 -print
            exit 1
          fi

          if [ ! -f "$APP/Contents/Resources/app.asar" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          echo "Gunny application:"
          echo "$APP"

          echo
          echo "Main executable:"

          file \
            "$APP/Contents/MacOS/Gunny PC"

          echo
          echo "app.asar:"

          ls -lh \
            "$APP/Contents/Resources/app.asar"


      # ============================================================
      # 8. BACKUP ORIGINAL APP.ASAR
      # ============================================================

      - name: Backup original app.asar
        shell: bash
        run: |
          set -e

          cp \
            "extracted/Gunny PC.app/Contents/Resources/app.asar" \
            "build/app-original.asar"

          ls -lh build/app-original.asar


      # ============================================================
      # 9. EXTRACT APP.ASAR
      # ============================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -e

          mkdir -p build/gunny-app

          asar extract \
            "build/app-original.asar" \
            "build/gunny-app"

          echo "app.asar extracted."

          echo
          echo "Top-level files:"

          find build/gunny-app \
            -maxdepth 2 \
            -print \
            | sort \
            | head -300


      # ============================================================
      # 10. VERIFY MAIN.JS
      # ============================================================

      - name: Verify Gunny main.js
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: main.js not found."

            echo
            echo "Searching:"

            find build/gunny-app \
              -name "main.js" \
              -print

            exit 1
          fi

          echo "main.js found:"
          echo "$MAIN"

          echo
          echo "First 40 lines:"

          sed -n '1,40p' "$MAIN"


      # ============================================================
      # 11. BACKUP MAIN.JS
      # ============================================================

      - name: Backup main.js
        shell: bash
        run: |
          set -e

          cp \
            build/gunny-app/main.js \
            build/main.original.js

          echo "Original main.js backed up."


      # ============================================================
      # 12. ANALYZE ORIGINAL FLASH CONFIGURATION
      # ============================================================

      - name: Analyze original Flash configuration
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          echo "=========================================="
          echo "ORIGINAL FLASH REFERENCES"
          echo "=========================================="

          grep -n -E \
            "ppapi-flash|PepperFlash|flash-version|flashPath|plugins" \
            "$MAIN" \
            || true


      # ============================================================
      # 13. DOWNLOAD ELECTRON ARM64
      # ============================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -e

          VERSION="$ELECTRON_VERSION"

          URL="https://github.com/electron/electron/releases/download/v${VERSION}/electron-v${VERSION}-darwin-arm64.zip"

          echo "=========================================="
          echo "DOWNLOAD ELECTRON ARM64"
          echo "=========================================="

          echo "Version:"
          echo "$VERSION"

          echo
          echo "URL:"
          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 5 \
            "$URL" \
            -o build/electron-arm64.zip

          echo
          ls -lh build/electron-arm64.zip

          file build/electron-arm64.zip


      # ============================================================
      # 14. EXTRACT ELECTRON
      # ============================================================

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -e

          mkdir -p build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            find build/electron -maxdepth 5 -print
            exit 1
          fi

          echo "$ELECTRON_APP" \
            > build/electron-app.txt

          echo "Electron.app:"
          cat build/electron-app.txt


      # ============================================================
      # 15. VERIFY ELECTRON ARM64
      # ============================================================

      - name: Verify Electron ARM64
        shell: bash
        run: |
          set -e

          ELECTRON_APP="$(cat build/electron-app.txt)"

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          echo "=========================================="
          echo "ELECTRON ARCHITECTURE"
          echo "=========================================="

          file "$BIN"

          echo
          echo "Architecture:"

          lipo -info "$BIN" || true

          if ! file "$BIN" | grep -q "arm64"; then
            echo
            echo "ERROR: Electron is not ARM64."
            exit 1
          fi

          echo
          echo "Electron ARM64 confirmed."


      # ============================================================
      # 16. DOWNLOAD RUFFLE WEB EXTENSION
      # ============================================================

      - name: Download Ruffle web extension
        shell: bash
        run: |
          set -e

          VERSION="$RUFFLE_VERSION"

          URL="https://github.com/ruffle-rs/ruffle/releases/download/v${VERSION}/ruffle-${VERSION}-web-extension.zip"

          echo "=========================================="
          echo "DOWNLOAD RUFFLE"
          echo "=========================================="

          echo "Version:"
          echo "$VERSION"

          echo
          echo "URL:"
          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 5 \
            "$URL" \
            -o build/ruffle.zip

          echo
          ls -lh build/ruffle.zip

          file build/ruffle.zip


      # ============================================================
      # 17. EXTRACT RUFFLE
      # ============================================================

      - name: Extract Ruffle
        shell: bash
        run: |
          set -e

          rm -rf build/ruffle

          mkdir -p build/ruffle

          unzip \
            -q \
            -o \
            build/ruffle.zip \
            -d build/ruffle

          echo "Ruffle extracted."

          echo
          echo "Files:"

          find build/ruffle \
            -maxdepth 4 \
            -print \
            | sort


      # ============================================================
      # 18. LOCATE RUFFLE MANIFEST
      # ============================================================

      - name: Locate Ruffle extension
        shell: bash
        run: |
          set -e

          MANIFEST="$(
            find build/ruffle \
              -type f \
              -name "manifest.json" \
              -print \
              | head -1
          )"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: Ruffle manifest.json not found."

            find build/ruffle \
              -maxdepth 5 \
              -print

            exit 1
          fi

          RUFFLE_DIR="$(dirname "$MANIFEST")"

          echo "$RUFFLE_DIR" \
            > build/ruffle-path.txt

          echo "Ruffle directory:"
          cat build/ruffle-path.txt

          echo
          echo "Manifest:"

          cat "$MANIFEST"


      # ============================================================
      # 19. PATCH MAIN.JS
      # ============================================================

      - name: Patch Gunny main.js for Ruffle
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("build/gunny-app/main.js")

          source = path.read_text(encoding="utf-8")

          print("Original main.js size:", len(source))


          # ========================================================
          # A. REMOVE PPAPI FLASH COMMAND-LINE SWITCHES
          # ========================================================

          patterns = [

              r".*appendSwitch\(['\"]ppapi-flash-path['\"].*\n",

              r".*appendSwitch\(['\"]ppapi-flash-version['\"].*\n",

              r".*commandLine.*ppapi-flash-path.*\n",

              r".*commandLine.*ppapi-flash-version.*\n",

          ]

          for pattern in patterns:

              new_source, count = re.subn(
                  pattern,
                  "",
                  source,
                  flags=re.MULTILINE
              )

              if count:
                  print(
                      "Removed PPAPI line:",
                      count
                  )

              source = new_source


          # ========================================================
          # B. DISABLE BrowserWindow plugins OPTION
          # ========================================================

          source = source.replace(
              "plugins:                     true,",
              "plugins:                     false,"
          )

          source = source.replace(
              "plugins: true,",
              "plugins: false,"
          )


          # ========================================================
          # C. REMOVE FLASH PATH VARIABLE
          # ========================================================

          source = re.sub(
              r"^[ \t]*(const|let|var)[ \t]+flashPath[ \t]*=.*$",
              "const flashPath = null;",
              source,
              flags=re.MULTILINE
          )


          # ========================================================
          # D. REMOVE OLD FLASH-NOT-FOUND TRACKING
          # ========================================================

          source = re.sub(
              r"^[ \t]*if\s*\(\s*!flashPath\s*\).*flash_not_found.*$\n?",
              "",
              source,
              flags=re.MULTILINE
          )


          # ========================================================
          # E. INSERT RUFFLE LOADER
          # ========================================================

          ruffle_function = r'''

          // =========================================================
          // RUFFLE FLASH EMULATOR
          // =========================================================

          async function loadRuffleExtension() {

            if (!isMac) {
              return;
            }

            try {

              const rufflePath = path.join(
                process.resourcesPath,
                "ruffle-extension"
              );

              const manifestPath = path.join(
                rufflePath,
                "manifest.json"
              );

              console.log(
                "[Ruffle] path:",
                rufflePath
              );

              if (!fs.existsSync(manifestPath)) {

                console.error(
                  "[Ruffle] manifest.json not found:",
                  manifestPath
                );

                return false;
              }

              console.log(
                "[Ruffle] loading extension..."
              );

              const extension =
                await session.defaultSession.extensions.loadExtension(
                  rufflePath,
                  {
                    allowFileAccess: true
                  }
                );

              console.log(
                "[Ruffle] loaded:",
                extension.name,
                extension.version,
                extension.id
              );

              return true;

            } catch (error) {

              console.error(
                "[Ruffle] load failed:",
                error && error.stack
                  ? error.stack
                  : error
              );

              return false;
            }
          }

          '''


          # ========================================================
          # F. FIND app.whenReady()
          # ========================================================

          ready_patterns = [
              r"app\.whenReady\(\)\.then\(function\s*\(\)\s*\{",
              r"app\.whenReady\(\)\.then\(async\s+function\s*\(\)\s*\{",
              r"app\.whenReady\(\)\.then\(\(\)\s*=>\s*\{",
          ]

          ready_match = None

          for pattern in ready_patterns:

              match = re.search(
                  pattern,
                  source
              )

              if match:
                  ready_match = match
                  break


          if ready_match is None:

              raise SystemExit(
                  "ERROR: app.whenReady() was not found."
              )


          ready_start = ready_match.start()

          source = (
              source[:ready_start]
              + ruffle_function
              + "\n"
              + source[ready_start:]
          )


          # ========================================================
          # G. MODIFY STARTUP TO WAIT FOR RUFFLE
          # ========================================================

          source, count = re.subn(
              r"(app\.whenReady\(\)\.then\()function\s*\(\)\s*\{",
              r"\1async function () {\n\n  await loadRuffleExtension();\n",
              source,
              count=1
          )

          if count:

              print(
                  "Ruffle startup hook inserted."
              )

          else:

              source, count = re.subn(
                  r"(app\.whenReady\(\)\.then\()async\s+function\s*\(\)\s*\{",
                  r"\1async function () {\n\n  await loadRuffleExtension();\n",
                  source,
                  count=1
              )

              if count:
                  print(
                      "Ruffle startup hook inserted "
                      "into existing async handler."
                  )

              else:

                  source, count = re.subn(
                      r"(app\.whenReady\(\)\.then\()\(\)\s*=>\s*\{",
                      r"\1async () => {\n\n  await loadRuffleExtension();\n",
                      source,
                      count=1
                  )

                  if count:
                      print(
                          "Ruffle startup hook inserted "
                          "into arrow-function handler."
                      )


          # ========================================================
          # H. REMOVE DUPLICATE RUFFLE FUNCTION IF PATCHED TWICE
          # ========================================================

          occurrences = source.count(
              "async function loadRuffleExtension()"
          )

          if occurrences > 1:

              print(
                  "WARNING:",
                  occurrences,
                  "Ruffle loader functions found."
              )

              # Keep only the first occurrence.
              first = source.find(
                  "async function loadRuffleExtension()"
              )

              second = source.find(
                  "async function loadRuffleExtension()",
                  first + 1
              )

              if second != -1:

                  # Do not automatically delete arbitrary source.
                  print(
                      "Build stopped to avoid corrupting main.js."
                  )

                  raise SystemExit(
                      "main.js appears to have been patched more than once."
                  )


          # ========================================================
          # I. WRITE FILE
          # ========================================================

          path.write_text(
              source,
              encoding="utf-8"
          )

          print()
          print(
              "=========================================="
          )
          print(
              "main.js patched successfully"
          )
          print(
              "New size:",
              len(source)
          )
          print(
              "=========================================="
          )
          PY


      # ============================================================
      # 20. VERIFY PATCH
      # ============================================================

      - name: Verify main.js Ruffle patch
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          echo "=========================================="
          echo "PATCH VERIFICATION"
          echo "=========================================="

          echo
          echo "Ruffle references:"

          grep -n -E \
            "Ruffle|loadRuffleExtension|ruffle-extension" \
            "$MAIN" \
            || true

          echo
          echo "Pepper Flash references:"

          grep -n -E \
            "ppapi-flash|PepperFlash|Pepper Flash" \
            "$MAIN" \
            || true

          echo
          echo "plugins setting:"

          grep -n \
            "plugins:" \
            "$MAIN" \
            || true

          echo
          echo "app.whenReady:"

          grep -n \
            "app.whenReady" \
            "$MAIN" \
            || true


      # ============================================================
      # 21. CHECK JAVASCRIPT SYNTAX
      # ============================================================

      - name: Check main.js syntax
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          echo "=========================================="
          echo "JAVASCRIPT SYNTAX"
          echo "=========================================="

          node \
            --check \
            "$MAIN"

          echo
          echo "JavaScript syntax OK."


      # ============================================================
      # 22. REPACK APP.ASAR
      # ============================================================

      - name: Repack app.asar
        shell: bash
        run: |
          set -e

          rm -f \
            build/gunny-app.asar

          asar pack \
            build/gunny-app \
            build/gunny-app.asar

          echo
          ls -lh \
            build/gunny-app.asar


      # ============================================================
      # 23. CREATE GUNNY ARM64 APP
      # ============================================================

      - name: Create Gunny ARM64 application
        shell: bash
        run: |
          set -e

          ELECTRON_APP="$(cat build/electron-app.txt)"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          echo "Gunny ARM64 application created."


      # ============================================================
      # 24. INSTALL GUNNY APP.ASAR
      # ============================================================

      - name: Install Gunny app.asar
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          RESOURCES="$APP/Contents/Resources"

          rm -f \
            "$RESOURCES/app.asar"

          rm -f \
            "$RESOURCES/default_app.asar"

          cp \
            build/gunny-app.asar \
            "$RESOURCES/app.asar"

          echo "Gunny app.asar installed."


      # ============================================================
      # 25. INSTALL RUFFLE EXTENSION
      # ============================================================

      - name: Install Ruffle extension
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          RUFFLE_SOURCE="$(cat build/ruffle-path.txt)"

          RUFFLE_DEST="$APP/Contents/Resources/ruffle-extension"

          rm -rf \
            "$RUFFLE_DEST"

          mkdir -p \
            "$RUFFLE_DEST"

          cp -R \
            "$RUFFLE_SOURCE"/. \
            "$RUFFLE_DEST"/

          echo
          echo "Ruffle installed at:"
          echo "$RUFFLE_DEST"

          echo
          echo "Manifest:"

          test -f \
            "$RUFFLE_DEST/manifest.json"

          cat \
            "$RUFFLE_DEST/manifest.json"


      # ============================================================
      # 26. REMOVE PEPPER FLASH
      # ============================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          PLUGINS="$APP/Contents/Resources/plugins"

          if [ -d "$PLUGINS" ]; then

            echo "Removing old plugins directory:"

            echo "$PLUGINS"

            rm -rf \
              "$PLUGINS"

          fi

          echo
          echo "Checking for Pepper Flash:"

          if find "$APP" \
            -iname "*PepperFlash*" \
            -o -iname "*pepflash*" \
            | grep -q .; then

            echo "ERROR:"
            echo "Pepper Flash still exists."

            find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*"

            exit 1

          fi

          echo "Pepper Flash removed."


      # ============================================================
      # 27. RENAME ELECTRON EXECUTABLE
      # ============================================================

      - name: Rename Electron executable
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          BIN_DIR="$APP/Contents/MacOS"

          if [ ! -f "$BIN_DIR/Electron" ]; then

            echo "ERROR:"
            echo "Electron executable not found."

            ls -la "$BIN_DIR"

            exit 1

          fi

          mv \
            "$BIN_DIR/Electron" \
            "$BIN_DIR/Gunny PC"

          echo "Executable renamed."

          file \
            "$BIN_DIR/Gunny PC"


      # ============================================================
      # 28. UPDATE MAIN INFO.PLIST
      # ============================================================

      - name: Update main Info.plist
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"

          echo "Updating Info.plist..."

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          echo
          plutil -p "$PLIST"


      # ============================================================
      # 29. REMOVE QUARANTINE
      # ============================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          xattr -cr \
            "$APP" \
            || true


      # ============================================================
      # 30. VERIFY ALL IMPORTANT ARM64 BINARIES
      # ============================================================

      - name: Verify ARM64 binaries
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "ARM64 BINARY CHECK"
          echo "=========================================="

          MAIN="$APP/Contents/MacOS/Gunny PC"

          echo
          echo "Main:"
          file "$MAIN"

          echo
          echo "Electron Framework:"

          FRAMEWORK="$APP/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"

          if [ -f "$FRAMEWORK" ]; then

            file "$FRAMEWORK"

            lipo -info "$FRAMEWORK" \
              || true

          else

            echo "Electron Framework not found."

          fi

          echo
          echo "Helpers:"

          find "$APP/Contents/Frameworks" \
            -type f \
            -perm -111 \
            -print0 |
          while IFS= read -r -d '' FILE; do

            TYPE=$(file "$FILE")

            if echo "$TYPE" | grep -q "Mach-O"; then

              echo "$TYPE"

            fi

          done


      # ============================================================
      # 31. CHECK FOR UNWANTED X86_64
      # ============================================================

      - name: Detect Intel Mach-O binaries
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "INTEL BINARY SCAN"
          echo "=========================================="

          X64_COUNT=0
          ARM64_COUNT=0

          while IFS= read -r -d '' FILE; do

            TYPE=$(file "$FILE")

            if echo "$TYPE" | grep -q "Mach-O"; then

              if echo "$TYPE" | grep -q "x86_64"; then

                echo "x86_64:"
                echo "$FILE"
                echo "$TYPE"
                echo

                X64_COUNT=$((X64_COUNT + 1))

              fi

              if echo "$TYPE" | grep -q "arm64"; then

                ARM64_COUNT=$((ARM64_COUNT + 1))

              fi

            fi

          done < <(
            find "$APP" \
              -type f \
              -print0
          )

          echo
          echo "ARM64 Mach-O files:"
          echo "$ARM64_COUNT"

          echo
          echo "x86_64 Mach-O files:"
          echo "$X64_COUNT"

          echo
          echo "IMPORTANT:"
          echo "x86_64 may still appear in non-executable resources."
          echo "The main Electron runtime must be ARM64."


      # ============================================================
      # 32. VERIFY NO PEPPER FLASH
      # ============================================================

      - name: Verify Pepper Flash removal
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "PEPPER FLASH"
          echo "=========================================="

          FOUND="$(
            find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | head -20
          )"

          if [ -n "$FOUND" ]; then

            echo "ERROR: Pepper Flash found:"
            echo "$FOUND"

            exit 1

          fi

          echo "Pepper Flash: NOT PRESENT"


      # ============================================================
      # 33. VERIFY RUFFLE
      # ============================================================

      - name: Verify Ruffle installation
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle-extension"

          if [ ! -f "$RUFFLE/manifest.json" ]; then

            echo "ERROR:"
            echo "Ruffle manifest missing."

            exit 1

          fi

          echo "Ruffle installed."

          echo
          echo "Ruffle files:"

          find "$RUFFLE" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200


      # ============================================================
      # 34. VERIFY APP.ASAR
      # ============================================================

      - name: Verify final app.asar
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then

            echo "ERROR: app.asar missing."

            exit 1

          fi

          echo "Final app.asar:"
          ls -lh "$ASAR"

          echo
          echo "Testing final app.asar..."

          rm -rf build/final-asar-test

          asar extract \
            "$ASAR" \
            build/final-asar-test

          test -f \
            build/final-asar-test/main.js

          echo "Final app.asar OK."


      # ============================================================
      # 35. VERIFY FINAL JAVASCRIPT
      # ============================================================

      - name: Verify final main.js
        shell: bash
        run: |
          set -e

          MAIN="build/final-asar-test/main.js"

          echo "=========================================="
          echo "FINAL MAIN.JS"
          echo "=========================================="

          node \
            --check \
            "$MAIN"

          echo
          echo "Ruffle:"

          grep -n \
            -E \
            "loadRuffleExtension|ruffle-extension" \
            "$MAIN" \
            || true

          echo
          echo "Pepper Flash:"

          grep -n \
            -E \
            "ppapi-flash|PepperFlash" \
            "$MAIN" \
            || true


      # ============================================================
      # 36. AD-HOC CODE SIGN
      # ============================================================

      - name: Code sign ARM64 application
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "CODE SIGN"
          echo "=========================================="

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

          echo
          echo "Verifying signature..."

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ============================================================
      # 37. FINAL MAIN ARCHITECTURE
      # ============================================================

      - name: Final ARM64 verification
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS/Gunny PC"

          echo "=========================================="
          echo "FINAL ARCHITECTURE"
          echo "=========================================="

          file "$BIN"

          echo

          lipo -info "$BIN" || true

          if ! file "$BIN" | grep -q "arm64"; then

            echo "ERROR:"
            echo "Final Gunny executable is not ARM64."

            exit 1

          fi

          echo
          echo "SUCCESS:"
          echo "Gunny PC main executable is ARM64."


      # ============================================================
      # 38. CREATE DMG
      # ============================================================

      - name: Create DMG
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          rm -rf \
            output/dmg

          mkdir -p \
            output/dmg

          cp -R \
            "$APP" \
            output/dmg/

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.dmg

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder output/dmg \
            -ov \
            -format UDZO \
            output/Gunny-PC-ARM64-Ruffle.dmg

          echo
          echo "DMG created:"

          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.dmg


      # ============================================================
      # 39. BUILD REPORT
      # ============================================================

      - name: Create build report
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          REPORT="output/build-report.txt"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Runner:"
            uname -a

            echo
            echo "Runner architecture:"
            uname -m

            echo
            echo "Main executable:"
            file \
              "$APP/Contents/MacOS/Gunny PC"

            echo
            echo "Main executable lipo:"
            lipo -info \
              "$APP/Contents/MacOS/Gunny PC" \
              2>&1 \
              || true

            echo
            echo "Electron Framework:"
            file \
              "$APP/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" \
              2>/dev/null \
              || true

            echo
            echo "Ruffle:"
            if [ -f \
              "$APP/Contents/Resources/ruffle-extension/manifest.json"
            ]; then
              echo "INSTALLED"
            else
              echo "MISSING"
            fi

            echo
            echo "Pepper Flash:"
            if find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | grep -q .; then
              echo "FOUND"
            else
              echo "REMOVED"
            fi

            echo
            echo "app.asar:"
            ls -lh \
              "$APP/Contents/Resources/app.asar"

          } > "$REPORT"

          echo
          cat "$REPORT"


      # ============================================================
      # 40. UPLOAD APPLICATION
      # ============================================================

      - name: Upload ARM64 application
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-App
          path: build/Gunny PC ARM64.app/
          retention-days: 7


      # ============================================================
      # 41. UPLOAD DMG
      # ============================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: output/Gunny-PC-ARM64-Ruffle.dmg
          retention-days: 7


      # ============================================================
      # 42. UPLOAD REPORT
      # ============================================================

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: output/build-report.txt
          retention-days: 7
