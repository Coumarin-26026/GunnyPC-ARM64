name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"

  APP_NAME: "Gunny PC"

  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Gunny PC ARM64 + Ruffle Self-Hosted

    runs-on: macos-14


    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. INSTALL TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -e

          brew install p7zip

          npm install -g @electron/asar

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "asar:"
          asar --version


      # ==========================================================
      # 3. RUNNER
      # ==========================================================

      - name: Show runner
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUNNER"
          echo "=========================================="

          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "macOS:"
          sw_vers


      # ==========================================================
      # 4. PREPARE
      # ==========================================================

      - name: Prepare build directories
        shell: bash
        run: |
          set -e

          rm -rf \
            download \
            extracted \
            build \
            output

          mkdir -p \
            download \
            extracted \
            build \
            output


      # ==========================================================
      # 5. DOWNLOAD ORIGINAL GUNNY
      # ==========================================================

      - name: Download original Gunny
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$GUNNY_URL" \
            -o download/gunny.zip

          echo
          echo "Downloaded:"
          ls -lh download/gunny.zip

          echo
          echo "File type:"
          file download/gunny.zip

          echo
          echo "Testing ZIP:"

          unzip -t download/gunny.zip


      # ==========================================================
      # 6. EXTRACT ORIGINAL GUNNY
      # ==========================================================

      - name: Extract original Gunny
        shell: bash
        run: |
          set -e

          unzip \
            -q \
            -o \
            download/gunny.zip \
            -d extracted

          rm -rf \
            extracted/__MACOSX

          echo
          echo "Applications:"

          find extracted \
            -type d \
            -name "*.app" \
            -print


      # ==========================================================
      # 7. VERIFY GUNNY
      # ==========================================================

      - name: Verify original Gunny
        shell: bash
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Gunny PC.app not found."
            exit 1
          fi

          if [ ! -f \
            "$APP/Contents/Resources/app.asar"
          ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          echo "Gunny:"
          echo "$APP"

          echo
          echo "Original executable:"

          file \
            "$APP/Contents/MacOS/Gunny PC"


      # ==========================================================
      # 8. ORIGINAL ARCHITECTURE REPORT
      # ==========================================================

      - name: Analyze original architecture
        shell: bash
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          echo "=========================================="
          echo "ORIGINAL MACH-O FILES"
          echo "=========================================="

          while IFS= read -r -d '' FILE; do

            TYPE="$(file "$FILE")"

            if echo "$TYPE" | grep -q "Mach-O"; then
              echo "$TYPE"
            fi

          done < <(
            find "$APP" \
              -type f \
              -print0
          )


      # ==========================================================
      # 9. BACKUP ORIGINAL ASAR
      # ==========================================================

      - name: Backup original app.asar
        shell: bash
        run: |
          set -e

          cp \
            "extracted/Gunny PC.app/Contents/Resources/app.asar" \
            build/app-original.asar

          ls -lh \
            build/app-original.asar


      # ==========================================================
      # 10. EXTRACT ASAR
      # ==========================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -e

          mkdir -p \
            build/gunny-app

          asar extract \
            build/app-original.asar \
            build/gunny-app

          echo
          echo "Extracted app:"

          find build/gunny-app \
            -maxdepth 2 \
            -print \
            | sort \
            | head -300


      # ==========================================================
      # 11. VERIFY MAIN.JS
      # ==========================================================

      - name: Verify main.js
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          if [ ! -f "$MAIN" ]; then

            echo "main.js not found at:"
            echo "$MAIN"

            echo
            echo "Searching:"

            find build/gunny-app \
              -type f \
              -name "main.js" \
              -print

            exit 1
          fi

          echo "main.js:"
          echo "$MAIN"

          echo
          echo "Size:"
          wc -c "$MAIN"


      # ==========================================================
      # 12. BACKUP MAIN.JS
      # ==========================================================

      - name: Backup main.js
        shell: bash
        run: |
          set -e

          cp \
            build/gunny-app/main.js \
            build/main.original.js


      # ==========================================================
      # 13. SHOW ORIGINAL FLASH CODE
      # ==========================================================

      - name: Analyze original Flash code
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          echo "=========================================="
          echo "FLASH REFERENCES"
          echo "=========================================="

          grep -ni -E \
            "flash|pepper|ppapi|plugin" \
            "$MAIN" \
            | head -250 \
            || true


      # ==========================================================
      # 14. DOWNLOAD ELECTRON ARM64
      # ==========================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -e

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          echo "=========================================="
          echo "ELECTRON ARM64"
          echo "=========================================="

          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            "$URL" \
            -o build/electron-arm64.zip

          echo
          ls -lh \
            build/electron-arm64.zip


      # ==========================================================
      # 15. EXTRACT ELECTRON ARM64
      # ==========================================================

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -e

          mkdir -p \
            build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -1
          )"

          if [ -z "$ELECTRON_APP" ]; then

            echo "ERROR: Electron.app not found."

            find build/electron \
              -maxdepth 4 \
              -print

            exit 1
          fi

          echo "$ELECTRON_APP" \
            > build/electron-app.txt

          echo
          echo "Electron:"
          cat build/electron-app.txt


      # ==========================================================
      # 16. VERIFY ELECTRON ARM64
      # ==========================================================

      - name: Verify Electron ARM64
        shell: bash
        run: |
          set -e

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          echo "=========================================="
          echo "ELECTRON ARCHITECTURE"
          echo "=========================================="

          file "$BIN"

          echo
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "arm64"; then

            echo
            echo "ERROR: Electron is not ARM64."

            exit 1
          fi

          echo
          echo "Electron ARM64: OK"


      # ==========================================================
      # 17. DOWNLOAD RUFFLE SELF-HOSTED
      # ==========================================================

      - name: Download Ruffle self-hosted
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RUFFLE SELF-HOSTED"
          echo "=========================================="

          API="https://api.github.com/repos/ruffle-rs/ruffle/releases/tags/v${RUFFLE_VERSION}"

          echo "Release:"
          echo "$API"

          ASSET_URL="$(
            curl \
              --fail \
              --location \
              -H "Accept: application/vnd.github+json" \
              "$API" \
            | python3 <<'PY'
          import json
          import sys

          data = json.load(sys.stdin)

          candidates = []

          for asset in data.get("assets", []):

              name = asset.get("name", "")
              url = asset.get(
                  "browser_download_url",
                  ""
              )

              if (
                  "selfhosted" in name.lower()
                  and name.lower().endswith(".zip")
              ):
                  candidates.append(
                      (name, url)
                  )

          if not candidates:
              print(
                  "ERROR: no web-selfhosted ZIP found",
                  file=sys.stderr
              )

              print(
                  "Available assets:",
                  file=sys.stderr
              )

              for asset in data.get("assets", []):
                  print(
                      asset.get("name", ""),
                      file=sys.stderr
                  )

              sys.exit(1)

          print(candidates[0][1])
          PY
          )"

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: Ruffle URL is empty."
            exit 1
          fi

          echo
          echo "Ruffle asset:"
          echo "$ASSET_URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            "$ASSET_URL" \
            -o build/ruffle-selfhosted.zip

          echo
          ls -lh \
            build/ruffle-selfhosted.zip

          echo
          echo "Archive contents:"

          unzip -l \
            build/ruffle-selfhosted.zip \
            | head -150


      # ==========================================================
      # 18. EXTRACT RUFFLE
      # ==========================================================

      - name: Extract Ruffle self-hosted
        shell: bash
        run: |
          set -e

          rm -rf \
            build/ruffle

          mkdir -p \
            build/ruffle

          unzip \
            -q \
            -o \
            build/ruffle-selfhosted.zip \
            -d build/ruffle

          echo
          echo "Ruffle files:"

          find build/ruffle \
            -maxdepth 4 \
            -type f \
            | sort


      # ==========================================================
      # 19. FIND RUFFLE.JS
      # ==========================================================

      - name: Verify Ruffle files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY RUFFLE"
          echo "=========================================="

          RUFFLE_JS="$(
            find build/ruffle \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -1
          )"

          if [ -z "$RUFFLE_JS" ]; then

            echo
            echo "ERROR: ruffle.js missing."

            echo
            echo "ALL RUFFLE FILES:"

            find build/ruffle \
              -maxdepth 6 \
              -print \
              | sort

            exit 1
          fi

          RUFFLE_ROOT="$(
            dirname "$RUFFLE_JS"
          )"

          echo "$RUFFLE_ROOT" \
            > build/ruffle-root.txt

          echo
          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "ruffle.js:"
          ls -lh "$RUFFLE_JS"

          echo
          echo "WASM:"

          find "$RUFFLE_ROOT" \
            -type f \
            -name "*.wasm" \
            -print \
            | sort


      # ==========================================================
      # 20. COPY RUFFLE INTO APP SOURCE
      # ==========================================================

      - name: Install Ruffle into app source
        shell: bash
        run: |
          set -e

          RUFFLE_ROOT="$(
            cat build/ruffle-root.txt
          )"

          rm -rf \
            build/gunny-app/ruffle

          mkdir -p \
            build/gunny-app/ruffle

          cp -R \
            "$RUFFLE_ROOT"/. \
            build/gunny-app/ruffle/

          test -f \
            build/gunny-app/ruffle/ruffle.js

          echo "Ruffle installed."


      # ==========================================================
      # 21. PATCH MAIN.JS
      # ==========================================================

      - name: Patch main.js
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "build/gunny-app/main.js"
          )

          s = path.read_text(
              encoding="utf-8"
          )

          print(
              "Original size:",
              len(s)
          )


          # ======================================================
          # A. MAKE SURE ELECTRON protocol/net ARE IMPORTED
          # ======================================================

          electron_re = re.compile(
              r'const\s*\{\s*([^}]+)\s*\}'
              r'\s*=\s*require\([\'"]electron[\'"]\)'
          )

          match = electron_re.search(s)

          if match:

              names = [
                  x.strip()
                  for x in match.group(1).split(",")
                  if x.strip()
              ]

              for needed in [
                  "protocol",
                  "net"
              ]:

                  if needed not in names:
                      names.append(needed)

              replacement = (
                  "const { "
                  + ", ".join(names)
                  + " } = require('electron')"
              )

              s = (
                  s[:match.start()]
                  + replacement
                  + s[match.end():]
              )

          else:

              s = (
                  "const { protocol, net } = "
                  "require('electron');\n"
                  + s
              )


          # ======================================================
          # B. REMOVE PPAPI FLASH COMMAND LINE
          # ======================================================

          for pattern in [

              r'^[^\n]*ppapi-flash-path[^\n]*\n?',

              r'^[^\n]*ppapi-flash-version[^\n]*\n?',

          ]:

              s, count = re.subn(
                  pattern,
                  "",
                  s,
                  flags=re.IGNORECASE |
                       re.MULTILINE
              )

              if count:
                  print(
                      "Removed PPAPI lines:",
                      count
                  )


          # ======================================================
          # C. DISABLE OLD CHROMIUM PLUGINS
          # ======================================================

          s = re.sub(
              r'plugins\s*:\s*true',
              'plugins: false',
              s,
              flags=re.IGNORECASE
          )


          # ======================================================
          # D. REMOVE KNOWN GUNNY FLASH WARNING BLOCK
          # ======================================================

          start_marker = (
              "// macOS: Flash warning"
          )

          end_marker = (
              "// Xử lý protocol URL"
          )

          start = s.find(
              start_marker
          )

          if start != -1:

              end = s.find(
                  end_marker,
                  start
              )

              if end != -1:

                  s = (
                      s[:start]
                      + end_marker
                      + s[
                          end
                          + len(end_marker):
                      ]
                  )

                  print(
                      "Removed Gunny Flash warning block."
                  )

              else:

                  print(
                      "WARNING:"
                      " Flash warning end marker"
                      " not found."
                  )


          # ======================================================
          # E. REMOVE FLASH-NOT-FOUND TELEMETRY
          # ======================================================

          s = re.sub(
              r'^[^\n]*flash_not_found[^\n]*\n?',
              "",
              s,
              flags=re.IGNORECASE |
                   re.MULTILINE
          )


          # ======================================================
          # F. REGISTER PRIVILEGED RUFFLE SCHEME
          # ======================================================

          scheme_code = r'''
          // ========================================================
          // GUNNY RUFFLE CUSTOM SCHEME
          // ========================================================

          if (
            protocol &&
            protocol.registerSchemesAsPrivileged
          ) {

            protocol.registerSchemesAsPrivileged([
              {
                scheme: 'gunnyruffle',
                privileges: {
                  standard: true,
                  secure: true,
                  supportFetchAPI: true,
                  bypassCSP: true
                }
              }
            ]);

          }

          '''

          if (
              "gunnyruffle"
              not in s
          ):

              ready = re.search(
                  r'app\.whenReady\(\)\.then\(',
                  s
              )

              if ready:

                  s = (
                      s[:ready.start()]
                      + scheme_code
                      + "\n"
                      + s[ready.start():]
                  )

              else:

                  raise SystemExit(
                      "ERROR:"
                      " app.whenReady() not found."
                  )


          # ======================================================
          # G. RUFFLE BOOTSTRAP
          # ======================================================

          ruffle_code = r'''
          // ========================================================
          // GUNNY ARM64 - RUFFLE SELF HOSTED
          // ========================================================

          const GUNNY_RUFFLE_SCHEME =
            'gunnyruffle://bundle/';

          function registerGunnyRuffleProtocol() {

            try {

              const fsLocal =
                require('fs');

              const pathLocal =
                require('path');

              const ruffleRoot =
                pathLocal.join(
                  process.resourcesPath,
                  'ruffle'
                );

              protocol.handle(
                'gunnyruffle',
                async (request) => {

                  try {

                    const url =
                      new URL(
                        request.url
                      );

                    let relative =
                      decodeURIComponent(
                        url.pathname
                      );

                    relative =
                      relative.replace(
                        /^\/+/,
                        ''
                      );

                    if (
                      !relative ||
                      relative.includes('..')
                    ) {

                      return new Response(
                        'Bad Ruffle path',
                        {
                          status: 400
                        }
                      );

                    }

                    const filePath =
                      pathLocal.resolve(
                        ruffleRoot,
                        relative
                      );

                    const relativeCheck =
                      pathLocal.relative(
                        ruffleRoot,
                        filePath
                      );

                    if (
                      relativeCheck.startsWith('..') ||
                      pathLocal.isAbsolute(
                        relativeCheck
                      )
                    ) {

                      return new Response(
                        'Forbidden',
                        {
                          status: 403
                        }
                      );

                    }

                    if (
                      !fsLocal.existsSync(
                        filePath
                      )
                    ) {

                      console.error(
                        '[Ruffle] missing:',
                        filePath
                      );

                      return new Response(
                        'Not found',
                        {
                          status: 404
                        }
                      );

                    }

                    const data =
                      fsLocal.readFileSync(
                        filePath
                      );

                    let mime =
                      'application/octet-stream';

                    if (
                      filePath.endsWith(
                        '.js'
                      )
                    ) {

                      mime =
                        'text/javascript; charset=utf-8';

                    } else if (
                      filePath.endsWith(
                        '.wasm'
                      )
                    ) {

                      mime =
                        'application/wasm';

                    } else if (
                      filePath.endsWith(
                        '.css'
                      )
                    ) {

                      mime =
                        'text/css; charset=utf-8';

                    } else if (
                      filePath.endsWith(
                        '.json'
                      )
                    ) {

                      mime =
                        'application/json';

                    }

                    return new Response(
                      data,
                      {
                        status: 200,
                        headers: {
                          'Content-Type': mime,
                          'Cache-Control':
                            'no-cache'
                        }
                      }
                    );

                  } catch (error) {

                    console.error(
                      '[Ruffle] protocol error:',
                      error
                    );

                    return new Response(
                      'Ruffle protocol error',
                      {
                        status: 500
                      }
                    );

                  }

                }
              );

              console.log(
                '[Ruffle] protocol registered:',
                ruffleRoot
              );

            } catch (error) {

              console.error(
                '[Ruffle] protocol registration failed:',
                error
              );

            }

          }


          const GUNNY_RUFFLE_BOOTSTRAP = `
          (() => {

            try {

              if (
                window.__GUNNY_RUFFLE_LOADED__
              ) {

                return;

              }

              window.__GUNNY_RUFFLE_LOADED__ =
                true;


              window.RufflePlayer =
                window.RufflePlayer ||
                {};


              window.RufflePlayer.config =
                window.RufflePlayer.config ||
                {};


              window.RufflePlayer.config.publicPath =
                '${GUNNY_RUFFLE_SCHEME}';


              window.RufflePlayer.config.polyfills =
                true;


              window.RufflePlayer.config.allowScriptAccess =
                true;


              const script =
                document.createElement(
                  'script'
                );


              script.src =
                '${GUNNY_RUFFLE_SCHEME}ruffle.js';


              script.async = false;


              script.onload = () => {

                console.log(
                  '[Ruffle] ruffle.js loaded'
                );

              };


              script.onerror = (event) => {

                console.error(
                  '[Ruffle] ruffle.js failed',
                  event
                );

              };


              (
                document.head ||
                document.documentElement
              ).appendChild(
                script
              );

            } catch (error) {

              console.error(
                '[Ruffle] bootstrap failed:',
                error
              );

            }

          })();
          `;


          function installGunnyRuffle(
            window
          ) {

            try {

              if (
                !window ||
                window.isDestroyed()
              ) {

                return;

              }

              const contents =
                window.webContents;


              contents.addScriptToEvaluateOnNewDocument(
                GUNNY_RUFFLE_BOOTSTRAP
              );


              contents.on(
                'dom-ready',
                () => {

                  contents
                    .executeJavaScript(
                      GUNNY_RUFFLE_BOOTSTRAP,
                      false
                    )
                    .catch(
                      () => {}
                    );

                }
              );


              contents.on(
                'did-finish-load',
                () => {

                  contents
                    .executeJavaScript(
                      GUNNY_RUFFLE_BOOTSTRAP,
                      false
                    )
                    .catch(
                      () => {}
                    );

                }
              );


              console.log(
                '[Ruffle] installed on window'
              );

            } catch (error) {

              console.error(
                '[Ruffle] window install failed:',
                error
              );

            }

          }


          app.on(
            'browser-window-created',
            (_event, window) => {

              installGunnyRuffle(
                window
              );

            }
          );


          app.on(
            'web-contents-created',
            (_event, contents) => {

              contents.on(
                'did-create-window',
                (_event, childWindow) => {

                  installGunnyRuffle(
                    childWindow
                  );

                }
              );

            }
          );

          '''


          # ======================================================
          # H. INSERT RUFFLE FUNCTIONS
          # ======================================================

          if (
              "GUNNY_RUFFLE_BOOTSTRAP"
              not in s
          ):

              ready = re.search(
                  r'app\.whenReady\(\)\.then\(',
                  s
              )

              if not ready:

                  raise SystemExit(
                      "ERROR:"
                      " app.whenReady() not found."
                  )

              s = (
                  s[:ready.start()]
                  + ruffle_code
                  + "\n"
                  + s[ready.start():]
              )


          # ======================================================
          # I. REGISTER PROTOCOL AFTER READY
          # ======================================================

          ready_pattern = re.compile(
              r'(app\.whenReady\(\)\.then\(\s*'
              r'(?:async\s+)?function\s*\(\s*\)\s*\{)'
          )

          match = ready_pattern.search(
              s
          )

          if match:

              insertion = (
                  "\n\n"
                  "  registerGunnyRuffleProtocol();"
                  "\n"
              )

              if (
                  "registerGunnyRuffleProtocol();"
                  not in s
              ):

                  s = (
                      s[:match.end()]
                      + insertion
                      + s[match.end():]
                  )


          else:

              arrow_pattern = re.compile(
                  r'(app\.whenReady\(\)\.then\(\s*'
                  r'(?:async\s+)?\(\s*\)\s*=>\s*\{)'
              )

              match = arrow_pattern.search(
                  s
              )

              if match:

                  insertion = (
                      "\n\n"
                      "  registerGunnyRuffleProtocol();"
                      "\n"
                  )

                  if (
                      "registerGunnyRuffleProtocol();"
                      not in s
                  ):

                      s = (
                          s[:match.end()]
                          + insertion
                          + s[match.end():]
                      )

              else:

                  print(
                      "WARNING:"
                      " could not insert protocol"
                      " registration."
                  )


          # ======================================================
          # J. WRITE
          # ======================================================

          path.write_text(
              s,
              encoding="utf-8"
          )

          print()
          print(
              "=========================================="
          )
          print(
              "PATCH COMPLETE"
          )
          print(
              "=========================================="
          )

          PY


      # ==========================================================
      # 22. CHECK JAVASCRIPT
      # ==========================================================

      - name: Check patched main.js
        shell: bash
        run: |
          set -e

          MAIN="build/gunny-app/main.js"

          echo "=========================================="
          echo "PATCH CHECK"
          echo "=========================================="

          node \
            --check \
            "$MAIN"

          echo
          echo "JavaScript syntax: OK"

          echo
          echo "Ruffle references:"

          grep -ni -E \
            "gunnyruffle|RufflePlayer|ruffle.js|GUNNY_RUFFLE" \
            "$MAIN" \
            | head -100 \
            || true

          echo
          echo "PPAPI references:"

          grep -ni -E \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN" \
            || true


      # ==========================================================
      # 23. CHECK RUFFLE SOURCE
      # ==========================================================

      - name: Verify Ruffle source
        shell: bash
        run: |
          set -e

          test -f \
            build/gunny-app/ruffle/ruffle.js

          WASM_COUNT="$(
            find build/gunny-app/ruffle \
              -type f \
              -name "*.wasm" \
              | wc -l \
              | tr -d ' '
          )"

          echo "ruffle.js: OK"

          echo
          echo "WASM files:"
          echo "$WASM_COUNT"

          if [ "$WASM_COUNT" -eq 0 ]; then

            echo "ERROR: no Ruffle WASM file."

            exit 1

          fi


      # ==========================================================
      # 24. REPACK ASAR
      # ==========================================================

      - name: Repack app.asar
        shell: bash
        run: |
          set -e

          asar pack \
            build/gunny-app \
            build/gunny-arm64.asar

          echo
          ls -lh \
            build/gunny-arm64.asar


      # ==========================================================
      # 25. CREATE APP FROM ELECTRON ARM64
      # ==========================================================

      - name: Create Gunny ARM64 app
        shell: bash
        run: |
          set -e

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          echo "ARM64 Electron app copied."


      # ==========================================================
      # 26. INSTALL ASAR
      # ==========================================================

      - name: Install Gunny app.asar
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          RESOURCES="$APP/Contents/Resources"

          rm -f \
            "$RESOURCES/app.asar"

          rm -f \
            "$RESOURCES/default_app.asar"

          cp \
            build/gunny-arm64.asar \
            "$RESOURCES/app.asar"

          echo "app.asar installed."


      # ==========================================================
      # 27. REMOVE PEPPER FLASH
      # ==========================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          PLUGINS="$APP/Contents/Resources/plugins"

          if [ -d "$PLUGINS" ]; then

            echo "Removing old plugins:"
            echo "$PLUGINS"

            rm -rf "$PLUGINS"

          fi

          echo
          echo "Pepper Flash search:"

          FOUND="$(
            find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | head -50
          )"

          if [ -n "$FOUND" ]; then

            echo "$FOUND"

            echo
            echo "ERROR:"
            echo "Pepper Flash still exists."

            exit 1

          fi

          echo "Pepper Flash: removed."


      # ==========================================================
      # 28. INSTALL RUFFLE OUTSIDE ASAR
      # ==========================================================

      - name: Install Ruffle runtime
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          DEST="$APP/Contents/Resources/ruffle"

          rm -rf \
            "$DEST"

          mkdir -p \
            "$DEST"

          RUFFLE_ROOT="$(
            cat build/ruffle-root.txt
          )"

          cp -R \
            "$RUFFLE_ROOT"/. \
            "$DEST"/

          echo
          echo "Ruffle installed:"

          find "$DEST" \
            -maxdepth 2 \
            -type f \
            | sort

          echo
          echo "Checking:"

          test -f \
            "$DEST/ruffle.js"

          echo "ruffle.js: OK"


      # ==========================================================
      # 29. RENAME MAIN ELECTRON EXECUTABLE
      # ==========================================================

      - name: Rename Electron executable
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          BIN_DIR="$APP/Contents/MacOS"

          if [ ! -f \
            "$BIN_DIR/Electron"
          ]; then

            echo "ERROR: Electron executable not found."

            ls -la "$BIN_DIR"

            exit 1

          fi

          mv \
            "$BIN_DIR/Electron" \
            "$BIN_DIR/Gunny PC"

          chmod +x \
            "$BIN_DIR/Gunny PC"

          echo
          file \
            "$BIN_DIR/Gunny PC"

          echo
          lipo -info \
            "$BIN_DIR/Gunny PC"


      # ==========================================================
      # 30. UPDATE INFO.PLIST
      # ==========================================================

      - name: Update Info.plist
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          echo
          plutil -p \
            "$PLIST"


      # ==========================================================
      # 31. VERIFY FINAL ASAR
      # ==========================================================

      - name: Verify final app.asar
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf \
            build/final-asar

          asar extract \
            "$ASAR" \
            build/final-asar

          test -f \
            build/final-asar/main.js

          echo "Final app.asar: OK"

          echo
          echo "Final Ruffle source in ASAR:"

          find build/final-asar/ruffle \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # ==========================================================
      # 32. VERIFY RUFFLE OUTSIDE ASAR
      # ==========================================================

      - name: Verify final Ruffle runtime
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle"

          echo "=========================================="
          echo "FINAL RUFFLE"
          echo "=========================================="

          test -f \
            "$RUFFLE/ruffle.js"

          echo
          echo "ruffle.js:"
          ls -lh \
            "$RUFFLE/ruffle.js"

          echo
          echo "WASM:"

          find "$RUFFLE" \
            -type f \
            -name "*.wasm" \
            -exec ls -lh {} \;


      # ==========================================================
      # 33. VERIFY ARM64 MAIN
      # ==========================================================

      - name: Verify main ARM64
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          echo "=========================================="
          echo "MAIN ARM64"
          echo "=========================================="

          file "$MAIN"

          echo
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "arm64"; then

            echo "ERROR:"
            echo "Main executable is not ARM64."

            exit 1

          fi

          echo
          echo "Main executable: ARM64"


      # ==========================================================
      # 34. SCAN ALL MACH-O
      # ==========================================================

      - name: Scan final architectures
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          ARM64_COUNT=0
          X64_COUNT=0

          echo "=========================================="
          echo "FINAL MACH-O SCAN"
          echo "=========================================="

          while IFS= read -r -d '' FILE; do

            TYPE="$(file "$FILE")"

            if echo "$TYPE" | grep -q "Mach-O"; then

              echo "$TYPE"

              if echo "$TYPE" | grep -q "arm64"; then
                ARM64_COUNT=$((ARM64_COUNT + 1))
              fi

              if echo "$TYPE" | grep -q "x86_64"; then
                X64_COUNT=$((X64_COUNT + 1))
              fi

            fi

          done < <(
            find "$APP" \
              -type f \
              -print0
          )

          echo
          echo "=========================================="
          echo "SUMMARY"
          echo "=========================================="

          echo "ARM64 Mach-O:"
          echo "$ARM64_COUNT"

          echo
          echo "x86_64 Mach-O:"
          echo "$X64_COUNT"

          if [ "$X64_COUNT" -gt 0 ]; then

            echo
            echo "WARNING:"
            echo "Intel binaries were found."

            echo
            echo "Intel files:"

            find "$APP" \
              -type f \
              -print0 |
            while IFS= read -r -d '' FILE; do

              TYPE="$(file "$FILE")"

              if echo "$TYPE" | grep -q "x86_64"; then
                echo "$TYPE"
              fi

            done

          fi


      # ==========================================================
      # 35. CHECK NO PEPPER FLASH
      # ==========================================================

      - name: Final Pepper Flash check
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          FOUND="$(
            find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | head -50
          )"

          if [ -n "$FOUND" ]; then

            echo "ERROR: Pepper Flash found:"
            echo "$FOUND"

            exit 1

          fi

          echo "Pepper Flash: ABSENT"


      # ==========================================================
      # 36. CHECK RUFFLE CODE
      # ==========================================================

      - name: Final JavaScript check
        shell: bash
        run: |
          set -e

          MAIN="build/final-asar/main.js"

          node \
            --check \
            "$MAIN"

          echo "JavaScript syntax: OK"

          echo
          echo "Ruffle bootstrap:"

          grep -ni -E \
            "gunnyruffle|RufflePlayer|ruffle.js" \
            "$MAIN" \
            | head -100 \
            || true


      # ==========================================================
      # 37. REMOVE QUARANTINE
      # ==========================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          xattr -cr \
            "$APP" \
            || true


      # ==========================================================
      # 38. AD-HOC SIGN
      # ==========================================================

      - name: Code sign
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "CODE SIGN"
          echo "=========================================="

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

          echo
          echo "Verify:"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ==========================================================
      # 39. FINAL SIGNATURE / ARCHITECTURE
      # ==========================================================

      - name: Final verification
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          echo "=========================================="
          echo "FINAL BUILD"
          echo "=========================================="

          echo
          echo "Application:"
          echo "$APP"

          echo
          echo "Executable:"
          file "$MAIN"

          echo
          echo "Architecture:"
          lipo -info "$MAIN"

          echo
          echo "Ruffle:"
          test -f \
            "$APP/Contents/Resources/ruffle/ruffle.js"

          echo "Ruffle OK"

          echo
          echo "Pepper Flash:"
          if find "$APP" \
            -iname "*PepperFlash*" \
            -o -iname "*pepflash*" \
            | grep -q .; then

            echo "FOUND"

          else

            echo "ABSENT"

          fi


      # ==========================================================
      # 40. BUILD REPORT
      # ==========================================================

      - name: Create build report
        shell: bash
        run: |
          set -e

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          REPORT="output/build-report.txt"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Runner:"
            uname -a

            echo
            echo "Main:"
            file "$MAIN"

            echo
            echo "Lipo:"
            lipo -info "$MAIN" 2>&1 || true

            echo
            echo "Ruffle:"
            if [ -f \
              "$APP/Contents/Resources/ruffle/ruffle.js"
            ]; then
              echo "INSTALLED"
            else
              echo "MISSING"
            fi

            echo
            echo "WASM:"
            find \
              "$APP/Contents/Resources/ruffle" \
              -type f \
              -name "*.wasm" \
              -print

            echo
            echo "Pepper Flash:"
            if find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | grep -q .; then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "x86_64 Mach-O count:"

            COUNT=0

            while IFS= read -r -d '' FILE; do

              TYPE="$(file "$FILE")"

              if echo "$TYPE" | grep -q "x86_64"; then
                COUNT=$((COUNT + 1))
              fi

            done < <(
              find "$APP" \
                -type f \
                -print0
            )

            echo "$COUNT"

          } > "$REPORT"

          echo
          cat "$REPORT"


      # ==========================================================
      # 41. CREATE ZIP
      # ==========================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -e

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.zip

          cd build

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "Gunny PC ARM64.app" \
            "../output/Gunny-PC-ARM64-Ruffle.zip"

          cd ..

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.zip


      # ==========================================================
      # 42. CREATE DMG
      # ==========================================================

      - name: Create DMG
        shell: bash
        run: |
          set -e

          rm -rf \
            output/dmg

          mkdir -p \
            output/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            output/dmg/

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.dmg

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder output/dmg \
            -ov \
            -format UDZO \
            output/Gunny-PC-ARM64-Ruffle.dmg

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.dmg


      # ==========================================================
      # 43. UPLOAD APP
      # ==========================================================

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-App
          path: build/Gunny PC ARM64.app/
          retention-days: 7


      # ==========================================================
      # 44. UPLOAD ZIP
      # ==========================================================

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: output/Gunny-PC-ARM64-Ruffle.zip
          retention-days: 7


      # ==========================================================
      # 45. UPLOAD DMG
      # ==========================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: output/Gunny-PC-ARM64-Ruffle.dmg
          retention-days: 7


      # ==========================================================
      # 46. UPLOAD REPORT
      # ==========================================================

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: output/build-report.txt
          retention-days: 7
