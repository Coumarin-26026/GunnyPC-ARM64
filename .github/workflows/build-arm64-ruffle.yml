name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"

  APP_NAME: "Gunny PC"

  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Gunny PC ARM64 + Ruffle

    runs-on: macos-14


    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. NODE
      # ==========================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ==========================================================
      # 3. INSTALL TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          brew install p7zip

          npm install -g @electron/asar

          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "asar:"
          asar --version

          echo
          echo "jq:"
          jq --version


      # ==========================================================
      # 4. RUNNER
      # ==========================================================

      - name: Show runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUNNER"
          echo "=========================================="

          uname -a

          echo
          sw_vers

          echo
          uname -m


      # ==========================================================
      # 5. PREPARE
      # ==========================================================

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            download \
            original \
            build \
            output

          mkdir -p \
            download \
            original \
            build \
            output


      # ==========================================================
      # 6. DOWNLOAD ORIGINAL GUNNY
      # ==========================================================

      - name: Download original Gunny
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD ORIGINAL GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$GUNNY_URL" \
            -o download/gunny-original.zip

          echo
          ls -lh \
            download/gunny-original.zip

          echo
          file \
            download/gunny-original.zip


      # ==========================================================
      # 7. EXTRACT ORIGINAL GUNNY
      # ==========================================================

      - name: Extract original Gunny
        shell: bash
        run: |
          set -euo pipefail

          unzip \
            -q \
            -o \
            download/gunny-original.zip \
            -d original

          rm -rf \
            original/__MACOSX

          echo
          echo "Applications:"

          find original \
            -type d \
            -name "*.app" \
            -print


      # ==========================================================
      # 8. FIND GUNNY APP
      # ==========================================================

      - name: Locate Gunny app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find original \
              -type d \
              -name "Gunny PC.app" \
              -print \
              | head -1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny PC.app not found."
            exit 1
          fi

          echo "$APP" \
            > build/original-app.txt

          echo
          echo "Original app:"
          cat build/original-app.txt


      # ==========================================================
      # 9. VERIFY ORIGINAL ASAR
      # ==========================================================

      - name: Verify original app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/original-app.txt
          )"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          cp \
            "$ASAR" \
            build/app-original.asar

          echo
          echo "app.asar:"
          ls -lh \
            build/app-original.asar

          echo
          echo "Original executable:"
          file \
            "$APP/Contents/MacOS/Gunny PC"


      # ==========================================================
      # 10. EXTRACT ASAR
      # ==========================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/gunny-source

          asar extract \
            build/app-original.asar \
            build/gunny-source

          echo
          echo "Extracted."

          find build/gunny-source \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -250


      # ==========================================================
      # 11. VERIFY MAIN.JS
      # ==========================================================

      - name: Verify main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="build/gunny-source/main.js"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: main.js not found."
            exit 1
          fi

          cp \
            "$MAIN" \
            build/main-original.js

          echo "$MAIN" \
            > build/main-path.txt

          echo
          echo "main.js:"
          ls -lh "$MAIN"

          echo
          echo "Flash references:"
          grep -niE \
            "PepperFlash|ppapi-flash|findFlashPath|SharedObject|Shockwave" \
            "$MAIN" \
            | head -250 \
            || true


      # ==========================================================
      # 12. DOWNLOAD RUFFLE RELEASE JSON
      # ==========================================================

      - name: Download Ruffle release metadata
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/ruffle-rs/ruffle/releases/tags/v${RUFFLE_VERSION}"

          echo "=========================================="
          echo "RUFFLE RELEASE"
          echo "=========================================="

          echo "$API"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" \
            -o build/ruffle-release.json

          echo
          jq -r '
            "tag: \(.tag_name)",
            "name: \(.name)",
            "assets: \(.assets | length)"
          ' \
            build/ruffle-release.json


      # ==========================================================
      # 13. FIND RUFFLE SELF-HOSTED ZIP
      # ==========================================================

      - name: Find Ruffle self-hosted
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUFFLE ASSETS"
          echo "=========================================="

          jq -r \
            '.assets[].name' \
            build/ruffle-release.json

          echo
          echo "Searching web-selfhosted ZIP..."

          URL="$(
            jq -r '
              .assets[]
              | select(
                  .name
                  | ascii_downcase
                  | test("web-selfhosted\\.zip$")
                )
              | .browser_download_url
            ' \
            build/ruffle-release.json \
            | head -1
          )"

          if [ -z "$URL" ]; then

            echo
            echo "ERROR: web-selfhosted ZIP not found."

            echo
            echo "Possible selfhosted assets:"

            jq -r '
              .assets[]
              | select(
                  .name
                  | ascii_downcase
                  | contains("selfhosted")
                )
              | .name
            ' \
            build/ruffle-release.json

            exit 1
          fi

          echo "$URL" \
            > build/ruffle-url.txt

          echo
          echo "Ruffle URL:"
          cat build/ruffle-url.txt


      # ==========================================================
      # 14. DOWNLOAD RUFFLE
      # ==========================================================

      - name: Download Ruffle
        shell: bash
        run: |
          set -euo pipefail

          URL="$(
            cat build/ruffle-url.txt
          )"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1200 \
            "$URL" \
            -o build/ruffle-selfhosted.zip

          echo
          ls -lh \
            build/ruffle-selfhosted.zip

          echo
          file \
            build/ruffle-selfhosted.zip

          unzip -t \
            build/ruffle-selfhosted.zip


      # ==========================================================
      # 15. EXTRACT RUFFLE
      # ==========================================================

      - name: Extract Ruffle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/ruffle

          mkdir -p \
            build/ruffle

          unzip \
            -q \
            -o \
            build/ruffle-selfhosted.zip \
            -d build/ruffle

          RUFFLE_JS="$(
            find build/ruffle \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -1
          )"

          if [ -z "$RUFFLE_JS" ]; then

            echo "ERROR: ruffle.js missing."

            find build/ruffle \
              -maxdepth 7 \
              -print \
              | sort

            exit 1
          fi

          RUFFLE_ROOT="$(
            dirname "$RUFFLE_JS"
          )"

          echo "$RUFFLE_ROOT" \
            > build/ruffle-root.txt

          echo
          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "Ruffle files:"

          find "$RUFFLE_ROOT" \
            -maxdepth 2 \
            -type f \
            | sort

          echo
          echo "WASM:"

          find "$RUFFLE_ROOT" \
            -type f \
            -name "*.wasm" \
            -print


      # ==========================================================
      # 16. DOWNLOAD ELECTRON ARM64
      # ==========================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          echo "=========================================="
          echo "ELECTRON ARM64"
          echo "=========================================="

          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$URL" \
            -o build/electron-arm64.zip

          ls -lh \
            build/electron-arm64.zip


      # ==========================================================
      # 17. EXTRACT ELECTRON
      # ==========================================================

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/electron

          mkdir -p \
            build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          echo "$ELECTRON_APP" \
            > build/electron-app.txt

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          echo
          file "$BIN"

          echo
          lipo -info "$BIN"


      # ==========================================================
      # 18. INSTALL RUFFLE INTO SOURCE
      # ==========================================================

      - name: Install Ruffle source
        shell: bash
        run: |
          set -euo pipefail

          RUFFLE_ROOT="$(
            cat build/ruffle-root.txt
          )"

          rm -rf \
            build/gunny-source/ruffle

          mkdir -p \
            build/gunny-source/ruffle

          cp -R \
            "$RUFFLE_ROOT"/. \
            build/gunny-source/ruffle/

          test -f \
            build/gunny-source/ruffle/ruffle.js

          echo "Ruffle installed into app source."


      # ==========================================================
      # 19. PATCH MAIN.JS
      # ==========================================================

      - name: Patch main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          main = Path(os.environ["MAIN"])

          s = main.read_text(
              encoding="utf-8-sig"
          )

          # ------------------------------------------------------
          # Electron import
          # ------------------------------------------------------

          old_import = """  globalShortcut, dialog, nativeImage, session, shell, ipcMain,
          """

          new_import = """  globalShortcut, dialog, nativeImage, session, shell, ipcMain, protocol,
          """

          if old_import in s:
              s = s.replace(
                  old_import,
                  new_import,
                  1
              )
          elif "ipcMain, protocol" not in s:
              raise SystemExit(
                  "Electron import marker not found"
              )


          # ------------------------------------------------------
          # Privileged Ruffle scheme
          # MUST be before app.ready
          # ------------------------------------------------------

          scheme_marker = (
              "const isMac = process.platform === 'darwin';"
          )

          scheme_code = r"""

          // ========================================================
          // RUFFLE CUSTOM SCHEME
          // ========================================================

          protocol.registerSchemesAsPrivileged([
            {
              scheme: 'gunnyruffle',

              privileges: {
                standard: true,
                secure: true,
                bypassCSP: true,
                corsEnabled: true,
                supportFetchAPI: true,
                stream: true
              }
            }
          ]);

          """

          if "scheme: 'gunnyruffle'" not in s:

              if scheme_marker not in s:
                  raise SystemExit(
                      "isMac marker not found"
                  )

              s = s.replace(
                  scheme_marker,
                  scheme_marker
                  + scheme_code,
                  1
              )


          # ------------------------------------------------------
          # REMOVE PEPPER FLASH / PPAPI BLOCK
          # ------------------------------------------------------

          start_marker = (
              "// ── Flash path"
          )

          end_marker = (
              "process.env.ELECTRON_DISABLE_SECURITY_WARNINGS"
          )

          start = s.find(
              start_marker
          )

          end = s.find(
              end_marker
          )

          if start == -1:
              raise SystemExit(
                  "Flash path block not found"
              )

          if end == -1:
              raise SystemExit(
                  "Flash block end not found"
              )

          replacement = r"""
          // ========================================================
          // PEPPER FLASH REMOVED
          // ARM64 build uses Ruffle self-hosted.
          // ========================================================

          """

          s = (
              s[:start]
              + replacement
              + s[end:]
          )


          # ------------------------------------------------------
          # Disable old Pepper Flash mms.cfg deployment
          # ------------------------------------------------------

          s = s.replace(
              "_deployFlashMmsCfg();",
              "// Pepper Flash mms.cfg disabled for Ruffle build.",
              1
          )


          # ------------------------------------------------------
          # Ruffle protocol function
          # ------------------------------------------------------

          marker = (
              "function _nextAccSlot() {"
          )

          protocol_function = r'''

          // ========================================================
          // RUFFLE FILE PROTOCOL
          // ========================================================

          function _registerRuffleProtocolForSession(ses) {

            if (
              !ses ||
              ses.__gunnyRuffleRegistered
            ) {

              return;

            }


            const root =
              path.join(
                process.resourcesPath,
                'ruffle'
              );


            function mimeType(file) {

              const lower =
                file.toLowerCase();


              if (
                lower.endsWith('.js')
              ) {

                return 'text/javascript; charset=utf-8';

              }


              if (
                lower.endsWith('.wasm')
              ) {

                return 'application/wasm';

              }


              if (
                lower.endsWith('.css')
              ) {

                return 'text/css; charset=utf-8';

              }


              if (
                lower.endsWith('.json') ||
                lower.endsWith('.map')
              ) {

                return 'application/json';

              }


              if (
                lower.endsWith('.svg')
              ) {

                return 'image/svg+xml';

              }


              if (
                lower.endsWith('.png')
              ) {

                return 'image/png';

              }


              if (
                lower.endsWith('.woff2')
              ) {

                return 'font/woff2';

              }


              if (
                lower.endsWith('.woff')
              ) {

                return 'font/woff';

              }


              return 'application/octet-stream';

            }


            function resolveFile(
              requestUrl
            ) {

              try {

                const parsed =
                  new URL(
                    requestUrl
                  );


                let relative =
                  decodeURIComponent(
                    parsed.pathname || ''
                  );


                relative =
                  relative.replace(
                    /^\/+/,
                    ''
                  );


                if (
                  !relative ||
                  relative.includes('..') ||
                  relative.includes('\\\\')
                ) {

                  return null;

                }


                const file =
                  path.resolve(
                    root,
                    relative
                  );


                const check =
                  path.relative(
                    root,
                    file
                  );


                if (
                  check.startsWith('..') ||
                  path.isAbsolute(check)
                ) {

                  return null;

                }


                return file;

              }

              catch (e) {

                return null;

              }

            }


            if (
              ses.protocol &&
              typeof ses.protocol.registerBufferProtocol === 'function'
            ) {

              ses.protocol.registerBufferProtocol(
                'gunnyruffle',
                function (
                  request,
                  callback
                ) {

                  try {

                    const file =
                      resolveFile(
                        request.url
                      );


                    if (
                      !file ||
                      !fs.existsSync(file) ||
                      !fs.statSync(file).isFile()
                    ) {

                      callback({
                        statusCode: 404,
                        mimeType: 'text/plain',
                        data: Buffer.from(
                          'Not Found'
                        )
                      });

                      return;

                    }


                    callback({

                      mimeType:
                        mimeType(file),

                      data:
                        fs.readFileSync(
                          file
                        )

                    });

                  }

                  catch (error) {

                    console.error(
                      '[Ruffle] protocol error:',
                      error
                    );


                    callback({

                      statusCode: 500,

                      mimeType:
                        'text/plain',

                      data:
                        Buffer.from(
                          'Ruffle protocol error'
                        )

                    });

                  }

                }
              );

            }

            else if (
              ses.protocol &&
              typeof ses.protocol.handle === 'function'
            ) {

              ses.protocol.handle(
                'gunnyruffle',
                function (request) {

                  try {

                    const file =
                      resolveFile(
                        request.url
                      );


                    if (
                      !file ||
                      !fs.existsSync(file) ||
                      !fs.statSync(file).isFile()
                    ) {

                      return new Response(
                        'Not Found',
                        {
                          status: 404
                        }
                      );

                    }


                    return new Response(

                      fs.readFileSync(
                        file
                      ),

                      {
                        status: 200,

                        headers: {

                          'Content-Type':
                            mimeType(file),

                          'Cache-Control':
                            'no-cache'

                        }

                      }

                    );

                  }

                  catch (error) {

                    console.error(
                      '[Ruffle] protocol error:',
                      error
                    );


                    return new Response(
                      'Ruffle protocol error',
                      {
                        status: 500
                      }
                    );

                  }

                }
              );

            }

            else {

              throw new Error(
                'Electron protocol API unavailable'
              );

            }


            ses.__gunnyRuffleRegistered =
              true;


            console.log(
              '[Ruffle] protocol registered'
            );

          }


          '''

          if (
              "_registerRuffleProtocolForSession"
              not in s
          ):

              if marker not in s:
                  raise SystemExit(
                      "_nextAccSlot marker not found"
                  )

              s = s.replace(
                  marker,
                  protocol_function
                  + marker,
                  1
              )


          # ------------------------------------------------------
          # Register protocol for Gunny's per-account session
          # ------------------------------------------------------

          old_partition = """  var _slot = _nextAccSlot();
          _preparePartition(_slot);"""

          new_partition = """  var _slot = _nextAccSlot();
          _preparePartition(_slot);

          _registerRuffleProtocolForSession(
            session.fromPartition(
              'persist:gunny-acc-' + _slot
            )
          );"""

          if old_partition not in s:

              raise SystemExit(
                  "Gunny partition marker not found"
              )

          s = s.replace(
              old_partition,
              new_partition,
              1
          )


          # ------------------------------------------------------
          # Keep plugins=true.
          # Ruffle pluginPolyfill handles Flash detection.
          # ------------------------------------------------------

          s = s.replace(
              "plugins:                     false,",
              "plugins:                     true,"
          )


          # ------------------------------------------------------
          # Remove any explicit PPAPI switches left behind
          # ------------------------------------------------------

          s = re.sub(
              r'^[^\n]*ppapi-flash-path[^\n]*\n?',
              '',
              s,
              flags=re.IGNORECASE |
                   re.MULTILINE
          )

          s = re.sub(
              r'^[^\n]*ppapi-flash-version[^\n]*\n?',
              '',
              s,
              flags=re.IGNORECASE |
                   re.MULTILINE
          )


          # ------------------------------------------------------
          # Save
          # ------------------------------------------------------

          main.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "main.js patched successfully."
          )

          PY


      # ==========================================================
      # 20. CREATE RUFFLE PRELOAD WRAPPER
      # ==========================================================

      - name: Create Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP_SOURCE="build/gunny-source"

          cat > "$APP_SOURCE/preload-ruffle-wrapper.js" <<'EOF'
          'use strict';

          /*
           * Gunny PC ARM64
           * Ruffle preload wrapper
           *
           * IMPORTANT:
           * Ruffle is loaded during Electron's document-start event.
           * pluginPolyfill() is called before Gunny page scripts.
           */

          const fs = require('fs');
          const path = require('path');

          const RUFFLE_JS =
            path.join(
              __dirname,
              'ruffle',
              'ruffle.js'
            );


          let ruffleSource = '';

          try {

            ruffleSource =
              fs.readFileSync(
                RUFFLE_JS,
                'utf8'
              );

          }

          catch (error) {

            console.error(
              '[Ruffle] Cannot read ruffle.js:',
              error
            );

          }


          function injectInline(code) {

            const script =
              document.createElement(
                'script'
              );

            script.textContent =
              code;

            document.documentElement.appendChild(
              script
            );

            script.remove();

          }


          process.once(
            'document-start',
            function () {

              try {

                /*
                 * Configure Ruffle BEFORE loading ruffle.js.
                 */

                injectInline(`

                  window.RufflePlayer =
                    window.RufflePlayer ||
                    {};

                  window.RufflePlayer.config =
                    Object.assign(
                      {},
                      window.RufflePlayer.config || {},
                      {

                        publicPath:
                          'gunnyruffle://bundle/',

                        polyfills:
                          true,

                        favorFlash:
                          false,

                        allowScriptAccess:
                          true,

                        allowNetworking:
                          'all',

                        playerRuntime:
                          'flashPlayer',

                        playerVersion:
                          31,

                        compatibilityRules:
                          true,

                        backgroundExecutionMode:
                          'mainThread'

                      }
                    );

                `);


                /*
                 * Execute the complete self-hosted Ruffle
                 * JavaScript synchronously as an inline script.
                 */

                if (
                  ruffleSource
                ) {

                  injectInline(
                    ruffleSource
                  );

                }


                /*
                 * Explicitly enable both:
                 *
                 * 1. pluginPolyfill()
                 * 2. normal <object>/<embed> polyfill
                 */

                injectInline(`

                  try {

                    const ruffle =
                      window.RufflePlayer &&
                      window.RufflePlayer.newest &&
                      window.RufflePlayer.newest();


                    if (
                      ruffle
                    ) {

                      if (
                        typeof ruffle.pluginPolyfill ===
                        'function'
                      ) {

                        ruffle.pluginPolyfill();

                      }


                      if (
                        typeof ruffle.polyfill ===
                        'function'
                      ) {

                        ruffle.polyfill();

                      }


                      console.log(
                        '[Ruffle] pluginPolyfill OK'
                      );

                    }

                    else {

                      console.error(
                        '[Ruffle] newest() returned null'
                      );

                    }

                  }

                  catch (error) {

                    console.error(
                      '[Ruffle] polyfill failed:',
                      error
                    );

                  }

                `);


                console.log(
                  '[Ruffle] document-start bootstrap complete'
                );

              }

              catch (error) {

                console.error(
                  '[Ruffle] document-start failed:',
                  error
                );

              }

            }
          );


          /*
           * Run the original Gunny preload AFTER the Ruffle hook
           * has been registered.
           */

          try {

            require(
              './preload-gunny-original.js'
            );

          }

          catch (error) {

            console.error(
              '[Gunny] original preload failed:',
              error
            );

          }
          EOF

          echo
          echo "Ruffle preload wrapper:"
          node --check \
            "$APP_SOURCE/preload-ruffle-wrapper.js"


      # ==========================================================
      # 21. REPACK ASAR
      # ==========================================================

      - name: Repack app.asar
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            build/app-arm64.asar

          asar pack \
            build/gunny-source \
            build/app-arm64.asar

          echo
          ls -lh \
            build/app-arm64.asar


      # ==========================================================
      # 22. CREATE ARM64 APP
      # ==========================================================

      - name: Create ARM64 app
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          echo "Electron ARM64 copied."


      # ==========================================================
      # 23. COPY ORIGINAL RESOURCES
      # ==========================================================

      - name: Copy Gunny resources
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL_APP="$(
            cat build/original-app.txt
          )"

          SRC="$ORIGINAL_APP/Contents/Resources"

          DST="build/Gunny PC ARM64.app/Contents/Resources"

          echo "Original Resources:"
          echo "$SRC"

          echo
          echo "Destination:"
          echo "$DST"

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="default_app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"

          echo
          echo "Gunny resources copied."


      # ==========================================================
      # 24. INSTALL NEW ASAR
      # ==========================================================

      - name: Install patched app.asar
        shell: bash
        run: |
          set -euo pipefail

          RESOURCES="build/Gunny PC ARM64.app/Contents/Resources"

          rm -f \
            "$RESOURCES/app.asar"

          rm -f \
            "$RESOURCES/default_app.asar"

          cp \
            build/app-arm64.asar \
            "$RESOURCES/app.asar"

          echo
          ls -lh \
            "$RESOURCES/app.asar"


      # ==========================================================
      # 25. INSTALL RUFFLE
      # ==========================================================

      - name: Install Ruffle runtime
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          DEST="$APP/Contents/Resources/ruffle"

          RUFFLE_ROOT="$(
            cat build/ruffle-root.txt
          )"

          rm -rf \
            "$DEST"

          mkdir -p \
            "$DEST"

          cp -R \
            "$RUFFLE_ROOT"/. \
            "$DEST"/

          test -f \
            "$DEST/ruffle.js"

          WASM_COUNT="$(
            find "$DEST" \
              -type f \
              -name "*.wasm" \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$WASM_COUNT" -eq 0 ]; then

            echo "ERROR: Ruffle WASM missing."

            exit 1

          fi

          echo
          echo "Ruffle installed."
          echo "WASM files: $WASM_COUNT"


      # ==========================================================
      # 26. INSTALL PRELOAD WRAPPER
      # ==========================================================

      - name: Install Ruffle preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RESOURCES="$APP/Contents/Resources"

          if [ ! -f \
            "$RESOURCES/preload.js"
          ]; then

            echo "ERROR: Original preload.js not found."

            echo
            echo "Resources:"

            find "$RESOURCES" \
              -maxdepth 1 \
              -type f \
              -print

            exit 1

          fi

          mv \
            "$RESOURCES/preload.js" \
            "$RESOURCES/preload-gunny-original.js"

          cp \
            build/gunny-source/preload-ruffle-wrapper.js \
            "$RESOURCES/preload.js"

          echo
          echo "Original:"
          ls -lh \
            "$RESOURCES/preload-gunny-original.js"

          echo
          echo "Wrapper:"
          ls -lh \
            "$RESOURCES/preload.js"


      # ==========================================================
      # 27. REMOVE PEPPER FLASH
      # ==========================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLUGINS="$APP/Contents/Resources/plugins"

          rm -rf \
            "$PLUGINS"

          echo
          echo "Searching Pepper Flash:"

          FOUND="$(
            find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*pepflash*" \
              \) \
              -print
          )"

          if [ -n "$FOUND" ]; then

            echo
            echo "ERROR: Pepper Flash still exists:"
            echo "$FOUND"

            exit 1

          fi

          echo
          echo "Pepper Flash: ABSENT"


      # ==========================================================
      # 28. VERIFY PATCHED ASAR
      # ==========================================================

      - name: Verify patched ASAR
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/final-source

          asar extract \
            build/app-arm64.asar \
            build/final-source

          MAIN="build/final-source/main.js"

          echo "Checking JavaScript..."

          node \
            --check \
            "$MAIN"

          echo
          echo "JavaScript syntax: OK"

          echo
          echo "Ruffle symbols:"

          grep -n \
            "gunnyruffle" \
            "$MAIN" \
            | head -50

          grep -n \
            "_registerRuffleProtocolForSession" \
            "$MAIN"

          echo
          echo "PPAPI references:"

          if grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN"; then

            echo "ERROR: PPAPI reference remains."

            exit 1

          fi

          echo
          echo "PPAPI: REMOVED"


      # ==========================================================
      # 29. VERIFY PRELOAD
      # ==========================================================

      - name: Verify preload
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PRELOAD="$APP/Contents/Resources/preload.js"

          test -f \
            "$PRELOAD"

          node \
            --check \
            "$PRELOAD"

          echo
          echo "Preload syntax: OK"

          echo
          grep -n \
            "pluginPolyfill" \
            "$PRELOAD"

          grep -n \
            "document-start" \
            "$PRELOAD"


      # ==========================================================
      # 30. VERIFY RUFFLE
      # ==========================================================

      - name: Verify Ruffle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle"

          echo "ruffle.js:"
          ls -lh \
            "$RUFFLE/ruffle.js"

          echo
          echo "WASM:"

          find "$RUFFLE" \
            -type f \
            -name "*.wasm" \
            -exec ls -lh {} \;


      # ==========================================================
      # 31. RENAME ELECTRON EXECUTABLE
      # ==========================================================

      - name: Rename Electron executable
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN_DIR="$APP/Contents/MacOS"

          if [ ! -f \
            "$BIN_DIR/Electron"
          ]; then

            echo "ERROR: Electron executable missing."

            ls -la "$BIN_DIR"

            exit 1

          fi

          mv \
            "$BIN_DIR/Electron" \
            "$BIN_DIR/Gunny PC"

          chmod +x \
            "$BIN_DIR/Gunny PC"

          echo
          file \
            "$BIN_DIR/Gunny PC"

          echo
          lipo -info \
            "$BIN_DIR/Gunny PC"


      # ==========================================================
      # 32. UPDATE INFO.PLIST
      # ==========================================================

      - name: Update Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          echo
          plutil -p \
            "$PLIST"


      # ==========================================================
      # 33. FINAL ARM64 SCAN
      # ==========================================================

      - name: Verify ARM64
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "ARM64 VERIFICATION"
          echo "=========================================="

          echo
          echo "Main executable:"

          file \
            "$APP/Contents/MacOS/Gunny PC"

          echo
          lipo -info \
            "$APP/Contents/MacOS/Gunny PC"

          if ! file \
            "$APP/Contents/MacOS/Gunny PC" \
            | grep -q "arm64"; then

            echo
            echo "ERROR: Main executable is not ARM64."

            exit 1

          fi

          echo
          echo "ARM64: OK"


      # ==========================================================
      # 34. CHECK FOR INTEL MAIN BINARY
      # ==========================================================

      - name: Check main binary architecture
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RESULT="$(
            file \
              "$APP/Contents/MacOS/Gunny PC"
          )"

          echo "$RESULT"

          if echo "$RESULT" | grep -q "x86_64"; then

            echo
            echo "ERROR: x86_64 found in main executable."

            exit 1

          fi

          echo
          echo "Main executable is ARM64-only."


      # ==========================================================
      # 35. REMOVE QUARANTINE
      # ==========================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr \
            "build/Gunny PC ARM64.app" \
            || true


      # ==========================================================
      # 36. AD-HOC SIGN
      # ==========================================================

      - name: Ad-hoc code sign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

          echo
          echo "Signature verification:"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ==========================================================
      # 37. CREATE ZIP
      # ==========================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.zip

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "output/Gunny-PC-ARM64-Ruffle.zip"

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.zip


      # ==========================================================
      # 38. CREATE DMG
      # ==========================================================

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/dmg

          mkdir -p \
            build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.dmg

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            output/Gunny-PC-ARM64-Ruffle.dmg

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.dmg


      # ==========================================================
      # 39. BUILD REPORT
      # ==========================================================

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Main:"
            file "$APP/Contents/MacOS/Gunny PC"

            echo
            echo "Architecture:"
            lipo -info "$APP/Contents/MacOS/Gunny PC"

            echo
            echo "Ruffle:"
            if [ -f \
              "$APP/Contents/Resources/ruffle/ruffle.js"
            ]; then
              echo "OK"
            else
              echo "MISSING"
            fi

            echo
            echo "Ruffle WASM:"
            find \
              "$APP/Contents/Resources/ruffle" \
              -name "*.wasm" \
              -print

            echo
            echo "Pepper Flash:"
            if find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*pepflash*" \
              \) \
              | grep -q .; then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "PPAPI:"
            if grep -RniE \
              "ppapi-flash-path|ppapi-flash-version" \
              build/final-source/main.js \
              >/dev/null 2>&1; then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

          } > \
            output/build-report.txt

          cat \
            output/build-report.txt


      # ==========================================================
      # 40. UPLOAD APP
      # ==========================================================

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-App
          path: build/Gunny PC ARM64.app/
          retention-days: 7


      # ==========================================================
      # 41. UPLOAD ZIP
      # ==========================================================

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: output/Gunny-PC-ARM64-Ruffle.zip
          retention-days: 7


      # ==========================================================
      # 42. UPLOAD DMG
      # ==========================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: output/Gunny-PC-ARM64-Ruffle.dmg
          retention-days: 7


      # ==========================================================
      # 43. UPLOAD REPORT
      # ==========================================================

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: output/build-report.txt
          retention-days: 7
