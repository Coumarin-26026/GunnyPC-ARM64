name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"

  APP_NAME: "Gunny PC"

  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"


jobs:

  build:

    name: Gunny PC ARM64 + Ruffle

    runs-on: macos-14


    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. INSTALL TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL TOOLS"
          echo "=========================================="

          brew install p7zip

          npm install -g @electron/asar

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "asar:"
          asar --version

          echo
          echo "jq:"
          jq --version


      # ==========================================================
      # 3. RUNNER
      # ==========================================================

      - name: Show runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUNNER"
          echo "=========================================="

          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "macOS:"
          sw_vers


      # ==========================================================
      # 4. PREPARE
      # ==========================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            download \
            extracted \
            build \
            output

          mkdir -p \
            download \
            extracted \
            build \
            output


      # ==========================================================
      # 5. DOWNLOAD GUNNY
      # ==========================================================

      - name: Download original Gunny
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD GUNNY"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$GUNNY_URL" \
            -o download/gunny.zip

          echo
          echo "Gunny archive:"
          ls -lh download/gunny.zip

          echo
          echo "File type:"
          file download/gunny.zip

          echo
          echo "Testing archive:"

          unzip -t download/gunny.zip


      # ==========================================================
      # 6. EXTRACT GUNNY
      # ==========================================================

      - name: Extract Gunny
        shell: bash
        run: |
          set -euo pipefail

          unzip \
            -q \
            -o \
            download/gunny.zip \
            -d extracted

          rm -rf \
            extracted/__MACOSX

          echo
          echo "Applications:"

          find extracted \
            -type d \
            -name "*.app" \
            -print


      # ==========================================================
      # 7. FIND GUNNY APP
      # ==========================================================

      - name: Locate Gunny app
        shell: bash
        run: |
          set -euo pipefail

          GUNNY_APP="$(
            find extracted \
              -type d \
              -name "Gunny PC.app" \
              -print \
              | head -1
          )"

          if [ -z "$GUNNY_APP" ]; then
            echo "ERROR: Gunny PC.app not found."
            exit 1
          fi

          echo "$GUNNY_APP" \
            > build/gunny-app-path.txt

          echo
          echo "Gunny:"
          cat build/gunny-app-path.txt


      # ==========================================================
      # 8. VERIFY ORIGINAL GUNNY
      # ==========================================================

      - name: Verify original Gunny
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          ASAR="$APP/Contents/Resources/app.asar"

          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi

          echo "Original executable:"

          file \
            "$APP/Contents/MacOS/Gunny PC"

          echo
          echo "Original app.asar:"

          ls -lh "$ASAR"


      # ==========================================================
      # 9. BACKUP ORIGINAL ASAR
      # ==========================================================

      - name: Backup original app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            cat build/gunny-app-path.txt
          )"

          cp \
            "$APP/Contents/Resources/app.asar" \
            build/app-original.asar

          ls -lh \
            build/app-original.asar


      # ==========================================================
      # 10. EXTRACT ASAR
      # ==========================================================

      - name: Extract app.asar
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            build/gunny-source

          asar extract \
            build/app-original.asar \
            build/gunny-source

          echo
          echo "Extracted files:"

          find build/gunny-source \
            -maxdepth 2 \
            -print \
            | sort \
            | head -300


      # ==========================================================
      # 11. LOCATE MAIN.JS
      # ==========================================================

      - name: Locate main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="build/gunny-source/main.js"

          if [ ! -f "$MAIN" ]; then

            MAIN="$(
              find build/gunny-source \
                -type f \
                -name "main.js" \
                -print \
                | head -1
            )"

          fi

          if [ -z "$MAIN" ] || [ ! -f "$MAIN" ]; then

            echo "ERROR: main.js not found."

            find build/gunny-source \
              -type f \
              -name "*.js" \
              -print \
              | head -200

            exit 1

          fi

          echo "$MAIN" \
            > build/main-path.txt

          echo
          echo "main.js:"
          cat build/main-path.txt


      # ==========================================================
      # 12. BACKUP MAIN.JS
      # ==========================================================

      - name: Backup main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          cp \
            "$MAIN" \
            build/main-original.js


      # ==========================================================
      # 13. ANALYZE ORIGINAL FLASH REFERENCES
      # ==========================================================

      - name: Analyze original Flash references
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          echo "=========================================="
          echo "ORIGINAL FLASH REFERENCES"
          echo "=========================================="

          grep -ni -E \
            "flash|pepper|ppapi|plugin" \
            "$MAIN" \
            | head -250 \
            || true


      # ==========================================================
      # 14. DOWNLOAD ELECTRON ARM64
      # ==========================================================

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ELECTRON ARM64"
          echo "=========================================="

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1200 \
            "$URL" \
            -o build/electron-arm64.zip

          ls -lh \
            build/electron-arm64.zip


      # ==========================================================
      # 15. EXTRACT ELECTRON
      # ==========================================================

      - name: Extract Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -1
          )"

          if [ -z "$ELECTRON_APP" ]; then

            echo "ERROR: Electron.app not found."

            find build/electron \
              -maxdepth 4 \
              -print

            exit 1

          fi

          echo "$ELECTRON_APP" \
            > build/electron-app.txt

          echo
          echo "Electron:"
          cat build/electron-app.txt


      # ==========================================================
      # 16. VERIFY ELECTRON ARM64
      # ==========================================================

      - name: Verify Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          echo "=========================================="
          echo "ELECTRON ARCHITECTURE"
          echo "=========================================="

          file "$BIN"

          echo
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "arm64"; then

            echo "ERROR: Electron is not ARM64."

            exit 1

          fi

          echo
          echo "Electron ARM64: OK"


      # ==========================================================
      # 17. DOWNLOAD RUFFLE RELEASE JSON
      # ==========================================================

      - name: Download Ruffle release metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUFFLE ${RUFFLE_VERSION}"
          echo "=========================================="

          API="https://api.github.com/repos/ruffle-rs/ruffle/releases/tags/v${RUFFLE_VERSION}"

          echo
          echo "API:"
          echo "$API"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" \
            -o build/ruffle-release.json

          echo
          echo "Release metadata:"

          ls -lh \
            build/ruffle-release.json

          echo
          jq -r '
            "tag = \(.tag_name)",
            "name = \(.name)",
            "assets = \(.assets | length)"
          ' build/ruffle-release.json


      # ==========================================================
      # 18. FIND RUFFLE SELF-HOSTED ASSET
      # ==========================================================

      - name: Find Ruffle self-hosted asset
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIND RUFFLE SELF-HOSTED"
          echo "=========================================="

          echo
          echo "Available assets:"

          jq -r \
            '.assets[].name' \
            build/ruffle-release.json

          echo
          echo "Searching self-hosted ZIP..."

          ASSET_URL="$(
            jq -r '
              .assets[]
              | select(
                  .name
                  | ascii_downcase
                  | test("web-selfhosted\\.zip$")
                )
              | .browser_download_url
            ' build/ruffle-release.json \
            | head -1
          )"

          if [ -z "$ASSET_URL" ]; then

            echo
            echo "ERROR:"
            echo "No web-selfhosted ZIP found."

            echo
            echo "Assets containing selfhosted:"

            jq -r '
              .assets[]
              | select(
                  .name
                  | ascii_downcase
                  | contains("selfhosted")
                )
              | .name
            ' build/ruffle-release.json

            exit 1

          fi

          echo "$ASSET_URL" \
            > build/ruffle-url.txt

          echo
          echo "FOUND:"
          cat build/ruffle-url.txt


      # ==========================================================
      # 19. DOWNLOAD RUFFLE
      # ==========================================================

      - name: Download Ruffle self-hosted
        shell: bash
        run: |
          set -euo pipefail

          ASSET_URL="$(
            cat build/ruffle-url.txt
          )"

          echo "=========================================="
          echo "DOWNLOAD RUFFLE"
          echo "=========================================="

          echo
          echo "$ASSET_URL"

          rm -f \
            build/ruffle-selfhosted.zip

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1200 \
            "$ASSET_URL" \
            -o build/ruffle-selfhosted.zip

          echo
          echo "Downloaded:"

          ls -lh \
            build/ruffle-selfhosted.zip

          echo
          echo "File type:"

          file \
            build/ruffle-selfhosted.zip


      # ==========================================================
      # 20. VERIFY RUFFLE ZIP
      # ==========================================================

      - name: Verify Ruffle archive
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUFFLE ARCHIVE"
          echo "=========================================="

          unzip -t \
            build/ruffle-selfhosted.zip

          echo
          echo "Archive contents:"

          unzip -l \
            build/ruffle-selfhosted.zip \
            | head -200


      # ==========================================================
      # 21. EXTRACT RUFFLE
      # ==========================================================

      - name: Extract Ruffle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build/ruffle

          mkdir -p \
            build/ruffle

          unzip \
            -q \
            -o \
            build/ruffle-selfhosted.zip \
            -d build/ruffle

          echo
          echo "Ruffle extracted."

          find build/ruffle \
            -maxdepth 4 \
            -type f \
            | sort


      # ==========================================================
      # 22. FIND RUFFLE.JS
      # ==========================================================

      - name: Verify Ruffle self-hosted
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY RUFFLE"
          echo "=========================================="

          RUFFLE_JS="$(
            find build/ruffle \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -1
          )"

          if [ -z "$RUFFLE_JS" ]; then

            echo
            echo "ERROR: ruffle.js missing."

            echo
            echo "Complete directory tree:"

            find build/ruffle \
              -maxdepth 7 \
              -print \
              | sort

            exit 1

          fi

          RUFFLE_ROOT="$(
            dirname "$RUFFLE_JS"
          )"

          echo "$RUFFLE_ROOT" \
            > build/ruffle-root.txt

          echo
          echo "Ruffle root:"
          cat build/ruffle-root.txt

          echo
          echo "ruffle.js:"
          ls -lh "$RUFFLE_JS"

          echo
          echo "WASM files:"

          find "$RUFFLE_ROOT" \
            -type f \
            -name "*.wasm" \
            -exec ls -lh {} \;

          WASM_COUNT="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "WASM count:"
          echo "$WASM_COUNT"

          if [ "$WASM_COUNT" -eq 0 ]; then

            echo "ERROR: No WASM file found."

            exit 1

          fi

          echo
          echo "Ruffle self-hosted: OK"


      # ==========================================================
      # 23. INSTALL RUFFLE INTO APP SOURCE
      # ==========================================================

      - name: Install Ruffle into app source
        shell: bash
        run: |
          set -euo pipefail

          RUFFLE_ROOT="$(
            cat build/ruffle-root.txt
          )"

          rm -rf \
            build/gunny-source/ruffle

          mkdir -p \
            build/gunny-source/ruffle

          cp -R \
            "$RUFFLE_ROOT"/. \
            build/gunny-source/ruffle/

          test -f \
            build/gunny-source/ruffle/ruffle.js

          echo
          echo "Ruffle source installed."


      # ==========================================================
      # 24. PATCH MAIN.JS
      # ==========================================================

      - name: Patch main.js for Ruffle
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          export MAIN

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          main = Path(os.environ["MAIN"])

          s = main.read_text(
              encoding="utf-8"
          )

          print(
              "Original main.js size:",
              len(s)
          )


          # ======================================================
          # 1. REMOVE PPAPI COMMAND LINE OPTIONS
          # ======================================================

          patterns = [

              r'^[^\n]*ppapi-flash-path[^\n]*\n?',

              r'^[^\n]*ppapi-flash-version[^\n]*\n?',

          ]

          for pattern in patterns:

              s, count = re.subn(
                  pattern,
                  "",
                  s,
                  flags=re.IGNORECASE |
                       re.MULTILINE
              )

              if count:
                  print(
                      "Removed PPAPI references:",
                      count
                  )


          # ======================================================
          # 2. DISABLE ELECTRON PLUGINS OPTION
          # ======================================================

          s = re.sub(
              r'plugins\s*:\s*true',
              'plugins: false',
              s,
              flags=re.IGNORECASE
          )


          # ======================================================
          # 3. REMOVE OLD FLASH WARNING BLOCK
          # ======================================================

          start_marker = (
              "// macOS: Flash warning"
          )

          end_marker = (
              "// Xử lý protocol URL"
          )

          start = s.find(
              start_marker
          )

          if start != -1:

              end = s.find(
                  end_marker,
                  start
              )

              if end != -1:

                  s = (
                      s[:start]
                      + s[
                          end:
                      ]
                  )

                  print(
                      "Removed old Flash warning block."
                  )


          # ======================================================
          # 4. REMOVE flash_not_found TRACKING
          # ======================================================

          s = re.sub(
              r'^[^\n]*flash_not_found[^\n]*\n?',
              "",
              s,
              flags=re.IGNORECASE |
                   re.MULTILINE
          )


          # ======================================================
          # 5. ELECTRON IMPORT
          # ======================================================

          electron_import = re.compile(
              r'const\s*\{\s*([^}]+)\s*\}'
              r'\s*=\s*require\([\'"]electron[\'"]\)'
          )

          match = electron_import.search(s)

          if match:

              names = [
                  x.strip()
                  for x in
                  match.group(1).split(",")
                  if x.strip()
              ]

              for required in [
                  "protocol",
                  "net"
              ]:

                  if required not in names:
                      names.append(required)

              replacement = (
                  "const { "
                  + ", ".join(names)
                  + " } = require('electron')"
              )

              s = (
                  s[:match.start()]
                  + replacement
                  + s[match.end():]
              )

          else:

              s = (
                  "const { protocol, net } = "
                  "require('electron');\n"
                  + s
              )


          # ======================================================
          # 6. PRIVILEGED CUSTOM PROTOCOL
          #
          # IMPORTANT:
          # This is inserted BEFORE app.whenReady().
          # ======================================================

          privileged_code = r'''

          // ========================================================
          // GUNNY RUFFLE PROTOCOL
          // ========================================================

          if (
            protocol &&
            protocol.registerSchemesAsPrivileged
          ) {

            protocol.registerSchemesAsPrivileged([
              {
                scheme: 'gunnyruffle',

                privileges: {
                  standard: true,
                  secure: true,
                  supportFetchAPI: true,
                  corsEnabled: true,
                  stream: true
                }

              }
            ]);

          }

          '''

          if (
              "scheme: 'gunnyruffle'"
              not in s
          ):

              ready = re.search(
                  r'app\.whenReady\(\)\.then\(',
                  s
              )

              if not ready:

                  raise SystemExit(
                      "ERROR: app.whenReady() not found."
                  )

              s = (
                  s[:ready.start()]
                  + privileged_code
                  + "\n"
                  + s[ready.start():]
              )


          # ======================================================
          # 7. RUFFLE RUNTIME
          # ======================================================

          ruffle_code = r'''

          // ========================================================
          // GUNNY PC ARM64 - RUFFLE SELF HOSTED
          // ========================================================

          const GUNNY_RUFFLE_SCHEME =
            'gunnyruffle://bundle/';


          function registerGunnyRuffleProtocol() {

            try {

              const fsLocal =
                require('fs');

              const pathLocal =
                require('path');

              const ruffleRoot =
                pathLocal.join(
                  process.resourcesPath,
                  'ruffle'
                );


              protocol.handle(
                'gunnyruffle',
                async (request) => {

                  try {

                    const url =
                      new URL(
                        request.url
                      );

                    let relative =
                      decodeURIComponent(
                        url.pathname
                      );

                    relative =
                      relative.replace(
                        /^\/+/,
                        ''
                      );


                    if (
                      !relative ||
                      relative.includes('..')
                    ) {

                      return new Response(
                        'Bad path',
                        {
                          status: 400
                        }
                      );

                    }


                    const filePath =
                      pathLocal.resolve(
                        ruffleRoot,
                        relative
                      );


                    const relativeCheck =
                      pathLocal.relative(
                        ruffleRoot,
                        filePath
                      );


                    if (
                      relativeCheck.startsWith('..') ||
                      pathLocal.isAbsolute(
                        relativeCheck
                      )
                    ) {

                      return new Response(
                        'Forbidden',
                        {
                          status: 403
                        }
                      );

                    }


                    if (
                      !fsLocal.existsSync(
                        filePath
                      )
                    ) {

                      console.error(
                        '[Ruffle] file not found:',
                        filePath
                      );

                      return new Response(
                        'Not Found',
                        {
                          status: 404
                        }
                      );

                    }


                    let mime =
                      'application/octet-stream';


                    if (
                      filePath.endsWith('.js')
                    ) {

                      mime =
                        'text/javascript; charset=utf-8';

                    }


                    else if (
                      filePath.endsWith('.wasm')
                    ) {

                      mime =
                        'application/wasm';

                    }


                    else if (
                      filePath.endsWith('.css')
                    ) {

                      mime =
                        'text/css; charset=utf-8';

                    }


                    else if (
                      filePath.endsWith('.json')
                    ) {

                      mime =
                        'application/json';

                    }


                    const data =
                      fsLocal.readFileSync(
                        filePath
                      );


                    return new Response(
                      data,
                      {
                        status: 200,

                        headers: {
                          'Content-Type':
                            mime,

                          'Cache-Control':
                            'no-cache'
                        }
                      }
                    );


                  }

                  catch (error) {

                    console.error(
                      '[Ruffle] protocol error:',
                      error
                    );

                    return new Response(
                      'Ruffle protocol error',
                      {
                        status: 500
                      }
                    );

                  }

                }
              );


              console.log(
                '[Ruffle] protocol registered:',
                ruffleRoot
              );


            }

            catch (error) {

              console.error(
                '[Ruffle] protocol registration failed:',
                error
              );

            }

          }


          const GUNNY_RUFFLE_BOOTSTRAP = `

          (() => {

            try {

              if (
                window.__GUNNY_RUFFLE_LOADED__
              ) {

                return;

              }


              window.__GUNNY_RUFFLE_LOADED__ =
                true;


              window.RufflePlayer =
                window.RufflePlayer ||
                {};


              window.RufflePlayer.config =
                window.RufflePlayer.config ||
                {};


              window.RufflePlayer.config.publicPath =
                '${GUNNY_RUFFLE_SCHEME}';


              window.RufflePlayer.config.polyfills =
                true;


              window.RufflePlayer.config.allowScriptAccess =
                true;


              const script =
                document.createElement(
                  'script'
                );


              script.src =
                '${GUNNY_RUFFLE_SCHEME}ruffle.js';


              script.async = false;


              script.onload = () => {

                console.log(
                  '[Ruffle] ruffle.js loaded'
                );

              };


              script.onerror = (event) => {

                console.error(
                  '[Ruffle] ruffle.js failed:',
                  event
                );

              };


              (
                document.head ||
                document.documentElement
              ).appendChild(
                script
              );


            }

            catch (error) {

              console.error(
                '[Ruffle] bootstrap error:',
                error
              );

            }

          })();

          `;


          function installGunnyRuffle(
            window
          ) {

            try {

              if (
                !window ||
                window.isDestroyed()
              ) {

                return;

              }


              const contents =
                window.webContents;


              contents.addScriptToEvaluateOnNewDocument(
                GUNNY_RUFFLE_BOOTSTRAP
              );


              contents.on(
                'dom-ready',
                () => {

                  contents
                    .executeJavaScript(
                      GUNNY_RUFFLE_BOOTSTRAP,
                      false
                    )
                    .catch(
                      () => {}
                    );

                }
              );


              contents.on(
                'did-finish-load',
                () => {

                  contents
                    .executeJavaScript(
                      GUNNY_RUFFLE_BOOTSTRAP,
                      false
                    )
                    .catch(
                      () => {}
                    );

                }
              );


              console.log(
                '[Ruffle] installed on window'
              );


            }

            catch (error) {

              console.error(
                '[Ruffle] window install failed:',
                error
              );

            }

          }


          // --------------------------------------------------------
          // Every BrowserWindow
          // --------------------------------------------------------

          app.on(
            'browser-window-created',
            (_event, window) => {

              installGunnyRuffle(
                window
              );

            }
          );


          // --------------------------------------------------------
          // Child windows
          // --------------------------------------------------------

          app.on(
            'web-contents-created',
            (_event, contents) => {

              contents.on(
                'did-create-window',
                (_event, childWindow) => {

                  installGunnyRuffle(
                    childWindow
                  );

                }
              );

            }
          );

          '''


          if (
              "GUNNY_RUFFLE_BOOTSTRAP"
              not in s
          ):

              ready = re.search(
                  r'app\.whenReady\(\)\.then\(',
                  s
              )

              if not ready:

                  raise SystemExit(
                      "ERROR: app.whenReady() not found."
                  )

              s = (
                  s[:ready.start()]
                  + ruffle_code
                  + "\n"
                  + s[ready.start():]
              )


          # ======================================================
          # 8. REGISTER PROTOCOL AFTER READY
          # ======================================================

          if (
              "registerGunnyRuffleProtocol();"
              not in s
          ):

              patterns = [

                  re.compile(
                      r'(app\.whenReady\(\)\.then\(\s*'
                      r'(?:async\s+)?function\s*\(\s*\)\s*\{)'
                  ),

                  re.compile(
                      r'(app\.whenReady\(\)\.then\(\s*'
                      r'(?:async\s+)?\(\s*\)\s*=>\s*\{)'
                  )

              ]


              inserted = False


              for pattern in patterns:

                  match = pattern.search(s)

                  if match:

                      s = (
                          s[:match.end()]
                          + "\n\n"
                          + "  registerGunnyRuffleProtocol();"
                          + "\n"
                          + s[match.end():]
                      )

                      inserted = True

                      print(
                          "Ruffle protocol startup inserted."
                      )

                      break


              if not inserted:

                  print(
                      "WARNING:"
                      " could not locate app.whenReady body."
                  )


          # ======================================================
          # 9. SAVE
          # ======================================================

          main.write_text(
              s,
              encoding="utf-8"
          )

          print()
          print(
              "=========================================="
          )
          print(
              "MAIN.JS PATCH COMPLETE"
          )
          print(
              "=========================================="
          )

          print(
              "New size:",
              len(s)
          )

          PY


      # ==========================================================
      # 25. VERIFY PATCH
      # ==========================================================

      - name: Verify patched main.js
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(
            cat build/main-path.txt
          )"

          echo "=========================================="
          echo "VERIFY MAIN.JS"
          echo "=========================================="

          node \
            --check \
            "$MAIN"

          echo
          echo "JavaScript syntax: OK"

          echo
          echo "Ruffle references:"

          grep -ni -E \
            "gunnyruffle|RufflePlayer|ruffle.js|GUNNY_RUFFLE" \
            "$MAIN" \
            | head -150 \
            || true

          echo
          echo "PPAPI references:"

          grep -ni -E \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN" \
            || true


      # ==========================================================
      # 26. REPACK ASAR
      # ==========================================================

      - name: Repack app.asar
        shell: bash
        run: |
          set -euo pipefail

          asar pack \
            build/gunny-source \
            build/gunny-arm64.asar

          echo
          echo "New app.asar:"
          ls -lh \
            build/gunny-arm64.asar


      # ==========================================================
      # 27. CREATE ARM64 APP
      # ==========================================================

      - name: Create Gunny ARM64 app
        shell: bash
        run: |
          set -euo pipefail

          ELECTRON_APP="$(
            cat build/electron-app.txt
          )"

          rm -rf \
            "build/Gunny PC ARM64.app"

          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"

          echo "Electron ARM64 copied."


      # ==========================================================
      # 28. INSTALL ASAR
      # ==========================================================

      - name: Install Gunny app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RESOURCES="$APP/Contents/Resources"

          rm -f \
            "$RESOURCES/app.asar"

          rm -f \
            "$RESOURCES/default_app.asar"

          cp \
            build/gunny-arm64.asar \
            "$RESOURCES/app.asar"

          echo "app.asar installed."


      # ==========================================================
      # 29. INSTALL RUFFLE OUTSIDE ASAR
      # ==========================================================

      - name: Install Ruffle runtime
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          DEST="$APP/Contents/Resources/ruffle"

          RUFFLE_ROOT="$(
            cat build/ruffle-root.txt
          )"

          rm -rf \
            "$DEST"

          mkdir -p \
            "$DEST"

          cp -R \
            "$RUFFLE_ROOT"/. \
            "$DEST"/

          echo
          echo "Ruffle runtime:"

          find "$DEST" \
            -maxdepth 2 \
            -type f \
            | sort

          echo
          echo "Checking ruffle.js:"

          test -f \
            "$DEST/ruffle.js"

          echo "OK"


      # ==========================================================
      # 30. REMOVE PEPPER FLASH
      # ==========================================================

      - name: Remove Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLUGINS="$APP/Contents/Resources/plugins"

          if [ -d "$PLUGINS" ]; then

            echo "Removing old plugins:"

            rm -rf \
              "$PLUGINS"

          fi

          echo
          echo "Checking Pepper Flash..."

          FOUND="$(
            find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | head -50
          )"

          if [ -n "$FOUND" ]; then

            echo
            echo "ERROR:"
            echo "$FOUND"

            exit 1

          fi

          echo
          echo "Pepper Flash: ABSENT"


      # ==========================================================
      # 31. RENAME ELECTRON EXECUTABLE
      # ==========================================================

      - name: Rename Electron executable
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN_DIR="$APP/Contents/MacOS"

          if [ ! -f \
            "$BIN_DIR/Electron"
          ]; then

            echo "ERROR: Electron executable missing."

            ls -la "$BIN_DIR"

            exit 1

          fi

          mv \
            "$BIN_DIR/Electron" \
            "$BIN_DIR/Gunny PC"

          chmod +x \
            "$BIN_DIR/Gunny PC"

          echo
          file \
            "$BIN_DIR/Gunny PC"

          echo
          lipo -info \
            "$BIN_DIR/Gunny PC"


      # ==========================================================
      # 32. UPDATE INFO.PLIST
      # ==========================================================

      - name: Update Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          echo
          plutil -p \
            "$PLIST"


      # ==========================================================
      # 33. VERIFY FINAL ASAR
      # ==========================================================

      - name: Verify final app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ASAR="$APP/Contents/Resources/app.asar"

          rm -rf \
            build/final-asar

          asar extract \
            "$ASAR" \
            build/final-asar

          test -f \
            build/final-asar/main.js

          echo "Final app.asar: OK"

          echo
          echo "Ruffle inside ASAR:"

          find build/final-asar/ruffle \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # ==========================================================
      # 34. VERIFY RUFFLE RUNTIME
      # ==========================================================

      - name: Verify final Ruffle
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          RUFFLE="$APP/Contents/Resources/ruffle"

          echo "=========================================="
          echo "FINAL RUFFLE"
          echo "=========================================="

          test -f \
            "$RUFFLE/ruffle.js"

          echo
          echo "ruffle.js:"

          ls -lh \
            "$RUFFLE/ruffle.js"

          echo
          echo "WASM:"

          find "$RUFFLE" \
            -type f \
            -name "*.wasm" \
            -exec ls -lh {} \;


      # ==========================================================
      # 35. VERIFY MAIN ARM64
      # ==========================================================

      - name: Verify main ARM64
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          echo "=========================================="
          echo "MAIN ARM64"
          echo "=========================================="

          file "$MAIN"

          echo
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "arm64"; then

            echo
            echo "ERROR:"
            echo "Main executable is not ARM64."

            exit 1

          fi

          echo
          echo "ARM64: OK"


      # ==========================================================
      # 36. SCAN MACH-O
      # ==========================================================

      - name: Scan final Mach-O files
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          ARM64_COUNT=0
          X64_COUNT=0

          echo "=========================================="
          echo "FINAL MACH-O SCAN"
          echo "=========================================="

          while IFS= read -r -d '' FILE; do

            TYPE="$(
              file "$FILE"
            )"

            if echo "$TYPE" | grep -q "Mach-O"; then

              echo "$TYPE"

              if echo "$TYPE" | grep -q "arm64"; then
                ARM64_COUNT=$((ARM64_COUNT + 1))
              fi

              if echo "$TYPE" | grep -q "x86_64"; then
                X64_COUNT=$((X64_COUNT + 1))
              fi

            fi

          done < <(
            find "$APP" \
              -type f \
              -print0
          )

          echo
          echo "=========================================="
          echo "SUMMARY"
          echo "=========================================="

          echo "ARM64:"
          echo "$ARM64_COUNT"

          echo
          echo "x86_64:"
          echo "$X64_COUNT"


      # ==========================================================
      # 37. REMOVE QUARANTINE
      # ==========================================================

      - name: Remove quarantine
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          xattr -cr \
            "$APP" \
            || true


      # ==========================================================
      # 38. AD-HOC SIGN
      # ==========================================================

      - name: Code sign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          echo "=========================================="
          echo "CODE SIGN"
          echo "=========================================="

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP"

          echo
          echo "Verifying signature..."

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"


      # ==========================================================
      # 39. FINAL CHECK
      # ==========================================================

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          RUFFLE="$APP/Contents/Resources/ruffle"

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          echo
          echo "APP:"
          echo "$APP"

          echo
          echo "MAIN:"
          file "$MAIN"

          echo
          echo "ARCH:"
          lipo -info "$MAIN"

          echo
          echo "RUFFLE:"
          test -f \
            "$RUFFLE/ruffle.js"

          echo "ruffle.js OK"

          echo
          echo "PEPPER FLASH:"

          if find "$APP" \
            -iname "*PepperFlash*" \
            -o -iname "*pepflash*" \
            | grep -q .; then

            echo "FOUND"

            exit 1

          else

            echo "ABSENT"

          fi


      # ==========================================================
      # 40. BUILD REPORT
      # ==========================================================

      - name: Create build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          REPORT="output/build-report.txt"

          {
            echo "=========================================="
            echo "GUNNY PC ARM64 + RUFFLE"
            echo "=========================================="

            echo
            echo "Electron:"
            echo "$ELECTRON_VERSION"

            echo
            echo "Ruffle:"
            echo "$RUFFLE_VERSION"

            echo
            echo "Runner:"
            uname -a

            echo
            echo "Main executable:"
            file "$MAIN"

            echo
            echo "Main architecture:"
            lipo -info "$MAIN" 2>&1 || true

            echo
            echo "Ruffle:"
            if [ -f \
              "$APP/Contents/Resources/ruffle/ruffle.js"
            ]; then
              echo "INSTALLED"
            else
              echo "MISSING"
            fi

            echo
            echo "Ruffle WASM:"
            find \
              "$APP/Contents/Resources/ruffle" \
              -type f \
              -name "*.wasm" \
              -print

            echo
            echo "Pepper Flash:"
            if find "$APP" \
              -iname "*PepperFlash*" \
              -o -iname "*pepflash*" \
              | grep -q .; then
              echo "FOUND"
            else
              echo "ABSENT"
            fi

            echo
            echo "x86_64 Mach-O count:"

            COUNT=0

            while IFS= read -r -d '' FILE; do

              TYPE="$(
                file "$FILE"
              )"

              if echo "$TYPE" | grep -q "x86_64"; then
                COUNT=$((COUNT + 1))
              fi

            done < <(
              find "$APP" \
                -type f \
                -print0
            )

            echo "$COUNT"

          } > "$REPORT"

          echo
          cat "$REPORT"


      # ==========================================================
      # 41. CREATE ZIP
      # ==========================================================

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.zip

          cd build

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "Gunny PC ARM64.app" \
            "../output/Gunny-PC-ARM64-Ruffle.zip"

          cd ..

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.zip


      # ==========================================================
      # 42. CREATE DMG
      # ==========================================================

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            output/dmg

          mkdir -p \
            output/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            output/dmg/

          rm -f \
            output/Gunny-PC-ARM64-Ruffle.dmg

          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder output/dmg \
            -ov \
            -format UDZO \
            output/Gunny-PC-ARM64-Ruffle.dmg

          echo
          ls -lh \
            output/Gunny-PC-ARM64-Ruffle.dmg


      # ==========================================================
      # 43. UPLOAD APP
      # ==========================================================

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-App
          path: build/Gunny PC ARM64.app/
          retention-days: 7


      # ==========================================================
      # 44. UPLOAD ZIP
      # ==========================================================

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: output/Gunny-PC-ARM64-Ruffle.zip
          retention-days: 7


      # ==========================================================
      # 45. UPLOAD DMG
      # ==========================================================

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: output/Gunny-PC-ARM64-Ruffle.dmg
          retention-days: 7


      # ==========================================================
      # 46. UPLOAD REPORT
      # ==========================================================

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: output/build-report.txt
          retention-days: 7
