name: Analyze Gunny PC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Gunny on macOS
    runs-on: macos-14

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Install tools
      # ============================================================

      - name: Install tools
        run: |
          set -e

          brew install p7zip

          npm install -g @electron/asar

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "asar:"
          asar --version || true


      # ============================================================
      # 3. Runner information
      # ============================================================

      - name: Show runner information
        run: |
          echo "========================================"
          echo "RUNNER"
          echo "========================================"

          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "CPU:"
          sysctl -n machdep.cpu.brand_string || true

          echo
          echo "Node architecture:"
          node -p "process.arch"


      # ============================================================
      # 4. Create directories
      # ============================================================

      - name: Create directories
        run: |
          rm -rf download extracted analysis

          mkdir -p download
          mkdir -p extracted
          mkdir -p analysis


      # ============================================================
      # 5. Download original Gunny
      # ============================================================

      - name: Download Gunny from Google Drive
        run: |
          set -e

          URL="https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            "$URL" \
            -o download/gunny.zip

          echo
          echo "===== FILE ====="

          ls -lh download/gunny.zip

          file download/gunny.zip

          echo
          echo "===== ZIP TEST ====="

          unzip -t download/gunny.zip


      # ============================================================
      # 6. Extract ZIP
      # ============================================================

      - name: Extract Gunny
        run: |
          set -e

          unzip \
            -q \
            -o \
            download/gunny.zip \
            -d extracted

          rm -rf extracted/__MACOSX

          echo "===== EXTRACTED ====="

          find extracted \
            -maxdepth 3 \
            -print \
            | sort


      # ============================================================
      # 7. Locate application
      # ============================================================

      - name: Locate Gunny PC.app
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Gunny PC.app not found"
            exit 1
          fi

          echo "Found:"
          echo "$APP"


      # ============================================================
      # 8. Analyze main application architecture
      # ============================================================

      - name: Analyze application architecture
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          echo "========================================"
          echo "APPLICATION ARCHITECTURE"
          echo "========================================"

          find "$APP" \
            -type f \
            -print0 |
          while IFS= read -r -d '' FILE; do

            TYPE=$(file "$FILE")

            case "$TYPE" in
              *"Mach-O"*)
                echo
                echo "$FILE"
                echo "$TYPE"
                ;;
            esac

          done


      # ============================================================
      # 9. Analyze main Electron executable
      # ============================================================

      - name: Analyze main executable
        run: |
          set -e

          BIN="extracted/Gunny PC.app/Contents/MacOS/Gunny PC"

          echo "========================================"
          echo "MAIN EXECUTABLE"
          echo "========================================"

          file "$BIN"

          echo

          lipo -info "$BIN" || true


      # ============================================================
      # 10. Find Electron
      # ============================================================

      - name: Find Electron
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          echo "========================================"
          echo "ELECTRON"
          echo "========================================"

          find "$APP/Contents/Frameworks" \
            -name "Electron Framework.framework" \
            -print


      # ============================================================
      # 11. Detect Electron version
      # ============================================================

      - name: Detect Electron version
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          PLIST="$APP/Contents/Frameworks/Electron Framework.framework/Versions/A/Resources/Info.plist"

          echo "========================================"
          echo "ELECTRON VERSION"
          echo "========================================"

          if [ -f "$PLIST" ]; then

            echo "Electron Info.plist:"
            plutil -p "$PLIST"

            echo
            echo "Electron version:"

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST" \
              2>/dev/null \
              || true

            echo
            echo "Electron build:"

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$PLIST" \
              2>/dev/null \
              || true

          else
            echo "Electron Info.plist not found"
          fi


      # ============================================================
      # 12. Find app.asar
      # ============================================================

      - name: Find app.asar
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          echo "========================================"
          echo "APP.ASAR"
          echo "========================================"

          find "$APP" \
            -name "app.asar" \
            -print

          ls -lh \
            "$APP/Contents/Resources/app.asar"


      # ============================================================
      # 13. Extract app.asar
      # ============================================================

      - name: Extract app.asar
        run: |
          set -e

          mkdir -p analysis/app

          asar extract \
            "extracted/Gunny PC.app/Contents/Resources/app.asar" \
            analysis/app

          echo "app.asar extracted."


      # ============================================================
      # 14. Read package.json
      # ============================================================

      - name: Read package.json
        run: |
          set -e

          PACKAGE="analysis/app/package.json"

          echo "========================================"
          echo "PACKAGE.JSON"
          echo "========================================"

          if [ -f "$PACKAGE" ]; then
            cat "$PACKAGE"
          else
            echo "package.json not found"
          fi


      # ============================================================
      # 15. Search Electron dependencies
      # ============================================================

      - name: Search Electron dependencies
        run: |
          echo "========================================"
          echo "ELECTRON DEPENDENCIES"
          echo "========================================"

          grep -Rni \
            -E \
            '"electron"|"electron-builder"|"electron-updater"' \
            analysis/app \
            --include="package.json" \
            2>/dev/null \
            || true


      # ============================================================
      # 16. Locate Pepper Flash
      # ============================================================

      - name: Locate Pepper Flash
        run: |
          set -e

          APP="extracted/Gunny PC.app"

          echo "========================================"
          echo "PEPPER FLASH"
          echo "========================================"

          find "$APP" \
            -iname "*PepperFlash*" \
            -print

          echo
          echo "===== PLUGIN DIRECTORY ====="

          find \
            "$APP/Contents/Resources/plugins" \
            -maxdepth 5 \
            -print \
            2>/dev/null \
            || true


      # ============================================================
      # 17. Analyze Pepper Flash architecture
      # ============================================================

      - name: Analyze Pepper Flash architecture
        run: |
          set -e

          FLASH="extracted/Gunny PC.app/Contents/Resources/plugins/PepperFlashPlayer.plugin"

          echo "========================================"
          echo "PEPPER FLASH ARCHITECTURE"
          echo "========================================"

          if [ ! -d "$FLASH" ]; then
            echo "Pepper Flash plugin not found"
            exit 0
          fi

          echo
          echo "Plugin structure:"

          find "$FLASH" \
            -maxdepth 5 \
            -print


          echo
          echo "Mach-O binaries:"

          find "$FLASH" \
            -type f \
            -print0 |
          while IFS= read -r -d '' FILE; do

            TYPE=$(file "$FILE")

            case "$TYPE" in
              *"Mach-O"*)

                echo
                echo "----------------------------------------"
                echo "$FILE"
                echo "$TYPE"

                lipo -info "$FILE" \
                  2>/dev/null \
                  || true

                ;;
            esac

          done


      # ============================================================
      # 18. Read Pepper Flash manifest
      # ============================================================

      - name: Read Pepper Flash metadata
        run: |
          set -e

          FLASH="extracted/Gunny PC.app/Contents/Resources/plugins/PepperFlashPlayer.plugin"

          echo "========================================"
          echo "PEPPER FLASH METADATA"
          echo "========================================"

          find "$FLASH" \
            -type f \
            \( \
              -name "manifest.json" \
              -o -name "*.plist" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            echo
            echo "----------------------------------------"
            echo "$FILE"

            if [[ "$FILE" == *.plist ]]; then
              plutil -p "$FILE" \
                2>/dev/null \
                || true
            else
              cat "$FILE" \
                2>/dev/null \
                || true
            fi

          done


      # ============================================================
      # 19. Find native modules
      # ============================================================

      - name: Find native modules
        run: |
          echo "========================================"
          echo "NATIVE MODULES"
          echo "========================================"

          find analysis/app \
            -type f \
            \( \
              -name "*.node" \
              -o -name "*.dylib" \
            \) \
            -print \
            | sort


      # ============================================================
      # 20. Search Flash configuration in source
      # ============================================================

      - name: Search Flash configuration
        run: |
          echo "========================================"
          echo "FLASH CONFIGURATION"
          echo "========================================"

          grep -Rni \
            -E \
            'ppapi-flash|PepperFlash|flash-version|plugins' \
            analysis/app \
            2>/dev/null \
            | head -500 \
            || true


      # ============================================================
      # 21. Search game URL
      # ============================================================

      - name: Search game URLs
        run: |
          echo "========================================"
          echo "GAME URL / SERVER"
          echo "========================================"

          grep -Rni \
            -E \
            'https?://|wss?://|idgunny|zing.vn|server|api|game' \
            analysis/app \
            --exclude-dir=node_modules \
            2>/dev/null \
            | head -500 \
            || true


      # ============================================================
      # 22. Create report
      # ============================================================

      - name: Create final report
        run: |
          set -e

          REPORT="analysis/report.txt"

          APP="extracted/Gunny PC.app"

          {

            echo "========================================"
            echo "GUNNY PC M1 ANALYSIS"
            echo "========================================"

            echo
            echo "===== RUNNER ====="

            uname -a
            echo "Architecture: $(uname -m)"
            echo "Node architecture: $(node -p 'process.arch')"

            echo
            echo "===== MAIN APP ====="

            file \
              "$APP/Contents/MacOS/Gunny PC"

            lipo -info \
              "$APP/Contents/MacOS/Gunny PC" \
              2>/dev/null \
              || true

            echo
            echo "===== ELECTRON ====="

            PLIST="$APP/Contents/Frameworks/Electron Framework.framework/Versions/A/Resources/Info.plist"

            if [ -f "$PLIST" ]; then

              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleShortVersionString" \
                "$PLIST" \
                2>/dev/null \
                || true

              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleVersion" \
                "$PLIST" \
                2>/dev/null \
                || true

            fi

            echo
            echo "===== PACKAGE.JSON ====="

            cat analysis/app/package.json \
              2>/dev/null \
              || true

            echo
            echo "===== PEPPER FLASH ====="

            FLASH="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin"

            if [ -d "$FLASH" ]; then

              find "$FLASH" \
                -type f \
                -print0 |
              while IFS= read -r -d '' FILE; do

                TYPE=$(file "$FILE")

                case "$TYPE" in
                  *"Mach-O"*)
                    echo "$TYPE"
                    lipo -info "$FILE" \
                      2>/dev/null \
                      || true
                    ;;
                esac

              done

            else

              echo "Pepper Flash not found."

            fi

            echo
            echo "===== NATIVE MODULES ====="

            find analysis/app \
              -type f \
              \( \
                -name "*.node" \
                -o -name "*.dylib" \
              \) \
              -print

            echo
            echo "===== FLASH CONFIGURATION ====="

            grep -Rni \
              -E \
              'ppapi-flash|PepperFlash|flash-version|plugins' \
              analysis/app \
              2>/dev/null \
              | head -500 \
              || true

          } > "$REPORT"

          echo
          echo "========================================"
          echo "FINAL REPORT"
          echo "========================================"

          cat "$REPORT"


      # ============================================================
      # 23. Upload report
      # ============================================================

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gunny-m1-analysis
          path: analysis/report.txt
          retention-days: 7


      # ============================================================
      # 24. Upload extracted app.asar
      # ============================================================

      - name: Upload app.asar
        uses: actions/upload-artifact@v4
        with:
          name: gunny-app-asar
          path: analysis/app/
          retention-days: 7
