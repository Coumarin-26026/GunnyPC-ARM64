name: Build Gunny PC ARM64 Ruffle HostBridge
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  APP_NAME: Gunny PC
  ELECTRON_VERSION: 43.2.0
  RUFFLE_VERSION: 0.4.1
  GUNNY_URL: https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b
jobs:
  build:
    name: Build ARM64
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install tools
      shell: bash
      run: 'set -euo pipefail

        npm install --global @electron/asar

        node --version

        asar --version'
    - name: Download and extract Gunny Intel
      shell: bash
      run: "set -euo pipefail\nrm -rf build release\nmkdir -p build/original release\n\
        curl --fail --location --retry 10 --retry-delay 5 \\\n  --connect-timeout\
        \ 30 --max-time 1800 -A \"Mozilla/5.0\" \\\n  \"$GUNNY_URL\" -o build/gunny-intel.zip\n\
        unzip -q -o build/gunny-intel.zip -d build/original\nrm -rf build/original/__MACOSX\n\
        APP=\"$(find build/original -type d -name \"*.app\" -print | head -n 1)\"\n\
        [ -n \"$APP\" ] || { echo \"ERROR: Gunny app not found.\"; exit 1; }\nprintf\
        \ '%s\\n' \"$APP\" > build/original-app.txt\nasar extract \"$APP/Contents/Resources/app.asar\"\
        \ build/source"
    - name: Auto-detect Gunny entrypoints
      shell: bash
      run: "\nset -euo pipefail\n\npython3 <<'PY'\nfrom pathlib import Path\nimport\
        \ json\nimport re\n\nroot = Path(\"build/source\").resolve()\nreport = {\n\
        \    \"main_candidates\": [],\n    \"preload_candidates\": [],\n    \"browser_windows\"\
        : [],\n    \"selected_main\": None,\n    \"selected_preload\": None,\n}\n\n\
        def read_text(path):\n    try:\n        return path.read_text(encoding=\"\
        utf-8-sig\", errors=\"ignore\")\n    except Exception:\n        return \"\"\
        \n\ndef score_main(path, text):\n    terms = {\n        \"BrowserWindow\"\
        : 20,\n        \"PepperFlashPlayer\": 30,\n        \"findFlashPath\": 30,\n\
        \        \"ppapi-flash-path\": 30,\n        \"ppapi-flash-version\": 20,\n\
        \        \"app.whenReady\": 10,\n        \"ipcMain\": 8,\n        \"session\"\
        : 5,\n    }\n    score = 0\n    hits = []\n    low = text.lower()\n    for\
        \ term, weight in terms.items():\n        if term.lower() in low:\n      \
        \      score += weight\n            hits.append(term)\n    return score, hits\n\
        \ndef balanced_block(text, start):\n    brace = text.find(\"{\", start)\n\
        \    if brace < 0:\n        return None\n\n    depth = 0\n    quote = None\n\
        \    escape = False\n\n    for i in range(brace, len(text)):\n        c =\
        \ text[i]\n\n        if quote:\n            if escape:\n                escape\
        \ = False\n            elif c == \"\\\\\":\n                escape = True\n\
        \            elif c == quote:\n                quote = None\n            continue\n\
        \n        if c in (\"'\", '\"', \"`\"):\n            quote = c\n         \
        \   continue\n\n        if c == \"{\":\n            depth += 1\n        elif\
        \ c == \"}\":\n            depth -= 1\n            if depth == 0:\n      \
        \          return text[start:i + 1]\n\n    return None\n\n# ----------------------------\n\
        # Find main.js automatically.\n# ----------------------------\nfor file in\
        \ sorted(root.rglob(\"main.js\")):\n    text = read_text(file)\n    if not\
        \ text:\n        continue\n\n    score, hits = score_main(file, text)\n\n\
        \    if score > 0:\n        report[\"main_candidates\"].append({\n       \
        \     \"path\": str(file),\n            \"score\": score,\n            \"\
        hits\": hits,\n        })\n\nif not report[\"main_candidates\"]:\n    # Second\
        \ pass: allow another JS file to be used as Electron entrypoint.\n    for\
        \ file in sorted(root.rglob(\"*.js\")):\n        text = read_text(file)\n\
        \        if not text:\n            continue\n\n        score, hits = score_main(file,\
        \ text)\n\n        if score >= 30:\n            report[\"main_candidates\"\
        ].append({\n                \"path\": str(file),\n                \"score\"\
        : score,\n                \"hits\": hits,\n            })\n\nif not report[\"\
        main_candidates\"]:\n    raise SystemExit(\n        \"AUTO-DETECT FAILED:\
        \ no Electron main/entry JS candidate found.\"\n    )\n\nreport[\"main_candidates\"\
        ].sort(\n    key=lambda x: (-x[\"score\"], x[\"path\"])\n)\n\nmain = Path(\n\
        \    report[\"main_candidates\"][0][\"path\"]\n)\n\nmain_text = read_text(main)\n\
        report[\"selected_main\"] = str(main)\n\n# ----------------------------\n\
        # Analyze every BrowserWindow.\n# ----------------------------\nbrowser_re\
        \ = re.compile(\n    r\"\\bnew\\s+(?:[\\w$.]+\\.)?BrowserWindow\\s*\\(\",\n\
        \    re.I\n)\n\nfor index, match in enumerate(\n    browser_re.finditer(main_text),\n\
        \    1\n):\n    block = balanced_block(\n        main_text,\n        match.start()\n\
        \    )\n\n    if not block:\n        continue\n\n    context = main_text[\n\
        \        max(0, match.start() - 2500):\n        min(len(main_text), match.start()\
        \ + len(block) + 4000)\n    ]\n\n    low = (block + \"\\n\" + context).lower()\n\
        \n    score = 0\n    hits = []\n\n    positive = {\n        \"pepperflashplayer\"\
        : 40,\n        \"findflashpath\": 40,\n        \"ppapi-flash-path\": 40,\n\
        \        \"ppapi-flash-version\": 30,\n        \"application/x-shockwave-flash\"\
        : 35,\n        \".swf\": 20,\n        \"plugins: true\": 20,\n        \"plugins:true\"\
        : 20,\n        \"webpreferences\": 10,\n        \"preload\": 15,\n       \
        \ \"loadurl\": 12,\n        \"loadfile\": 10,\n        \"gn.zing.vn\": 20,\n\
        \        \"flash\": 20,\n        \"game\": 8,\n        \"session\": 5,\n \
        \   }\n\n    negative = {\n        \"preload-dialog\": -25,\n        \"preload-bottom-bar\"\
        : -25,\n        \"preload-title-bar\": -25,\n        \"dialog\": -15,\n  \
        \      \"bottom-bar\": -15,\n        \"title-bar\": -15,\n        \"devtools\"\
        : -20,\n        \"settings\": -10,\n    }\n\n    for term, weight in positive.items():\n\
        \        if term in low:\n            score += weight\n            hits.append(\"\
        +\" + term)\n\n    for term, weight in negative.items():\n        if term\
        \ in low:\n            score += weight\n            hits.append(str(weight)\
        \ + \":\" + term)\n\n    report[\"browser_windows\"].append({\n        \"\
        index\": index,\n        \"score\": score,\n        \"hits\": hits,\n    \
        \    \"source_excerpt\": block[:12000],\n    })\n\n# ----------------------------\n\
        # Preload candidates.\n# ----------------------------\nfiles_by_name = {}\n\
        for file in root.rglob(\"*.js\"):\n    files_by_name.setdefault(\n       \
        \ file.name,\n        []\n    ).append(file)\n\n# First, files whose names\
        \ contain \"preload\".\npreload_named = [\n    f for f in root.rglob(\"*.js\"\
        )\n    if \"preload\" in f.name.lower()\n]\n\n# Also use quoted JS names in\
        \ BrowserWindow blocks.\nname_matches = []\n\nfor item in report[\"browser_windows\"\
        ]:\n    for name in re.findall(\n        r\"\"\"['\"]([^'\"]+\\.js)['\"]\"\
        \"\",\n        item[\"source_excerpt\"],\n        flags=re.I\n    ):\n   \
        \     name_matches.append(\n            Path(name).name\n        )\n\nresolved\
        \ = []\n\nfor name in name_matches:\n    for file in files_by_name.get(name,\
        \ []):\n        if file not in resolved:\n            resolved.append(file)\n\
        \ncandidate_pool = resolved or preload_named\n\n# Last-resort source scoring.\n\
        if not candidate_pool:\n    for file in root.rglob(\"*.js\"):\n        if\
        \ file == main:\n            continue\n\n        text = read_text(file)\n\
        \        low = text.lower()\n        score = 0\n\n        if \"preload\" in\
        \ file.name.lower():\n            score += 100\n\n        for term in (\n\
        \            \"contextbridge\",\n            \"ipcrenderer\",\n          \
        \  \"webframe\",\n            \"electronapi\",\n            \"setflashfocus\"\
        ,\n            \"flash-ready\",\n            \"webcontents\",\n        ):\n\
        \            if term in low:\n                score += 8\n\n        if score\
        \ > 0:\n            candidate_pool.append(file)\n\n# Final fallback: do not\
        \ fail the entire build.\n# Preserve a real Gunny JS file so the build can\
        \ continue, but record it.\nif not candidate_pool:\n    all_js = [\n     \
        \   f for f in root.rglob(\"*.js\")\n        if f != main\n    ]\n\n    if\
        \ all_js:\n        candidate_pool = [sorted(all_js)[0]]\n    else:\n     \
        \   candidate_pool = [main]\n\ndef preload_score(file):\n    name = file.name.lower()\n\
        \    text = read_text(file).lower()\n\n    score = 0\n\n    if \"preload\"\
        \ in name:\n        score += 100\n    if \"game\" in name:\n        score\
        \ += 40\n    if \"flash\" in text:\n        score += 15\n    if \"contextbridge\"\
        \ in text:\n        score += 10\n    if \"ipcrenderer\" in text:\n       \
        \ score += 10\n    if \"webframe\" in text:\n        score += 5\n\n    if\
        \ \"dialog\" in name:\n        score -= 100\n    if \"bottom-bar\" in name:\n\
        \        score -= 100\n    if \"title-bar\" in name:\n        score -= 100\n\
        \n    return (-score, str(file))\n\ncandidate_pool = sorted(\n    set(candidate_pool),\n\
        \    key=preload_score\n)\n\npreload = candidate_pool[0]\n\nreport[\"selected_preload\"\
        ] = str(preload)\n\n# Write artifacts for diagnostics; never stop the build\
        \ just because\n# automatic classification is uncertain.\nPath(\n    \"build/autodetect-report.json\"\
        \n).write_text(\n    json.dumps(\n        report,\n        indent=2,\n   \
        \     ensure_ascii=False\n    ),\n    encoding=\"utf-8\"\n)\n\nPath(\n   \
        \ \"build/main-path.txt\"\n).write_text(\n    str(main) + \"\\n\",\n    encoding=\"\
        utf-8\"\n)\n\nPath(\n    \"build/preload-relative.txt\"\n).write_text(\n \
        \   preload.relative_to(root).as_posix() + \"\\n\",\n    encoding=\"utf-8\"\
        \n)\n\nprint(\"AUTO-DETECT RESULT\")\nprint(\"==================\")\nprint(\"\
        MAIN:\", main)\nprint(\"PRELOAD:\", preload.relative_to(root))\nprint()\n\
        print(\"BrowserWindow candidates:\")\nfor item in report[\"browser_windows\"\
        ]:\n    print(\n        f\"  #{item['index']} score={item['score']} \"\n \
        \       f\"hits={','.join(item['hits'][:20])}\"\n    )\n\nprint()\nprint(\"\
        Preload candidates:\")\nfor file in candidate_pool[:50]:\n    print(\" \"\
        , file.relative_to(root))\n\nprint()\nprint(\"Automatic detection completed.\"\
        )\nPY\n\necho\necho \"MAIN:\"\ncat build/main-path.txt\n\necho\necho \"PRELOAD:\"\
        \ncat build/preload-relative.txt\n\necho\necho \"AUTODETECT REPORT:\"\nls\
        \ -lh build/autodetect-report.json\n"
    - name: Create Gunny host bridge
      shell: bash
      run: 'set -euo pipefail

        mkdir -p build/bridge

        echo 
        | base64 --decode > build/bridge/gunny-host.js

        node --check build/bridge/gunny-host.js

        wc -l build/bridge/gunny-host.js'
    - name: Download Ruffle self-hosted
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "\nset -euo pipefail\n\nrm -rf build/ruffle\nmkdir -p build/ruffle\ncd\
        \ build/ruffle\n\necho \"Downloading Ruffle ${RUFFLE_VERSION}...\"\n\ngh release\
        \ download \\\n  \"v${RUFFLE_VERSION}\" \\\n  --repo ruffle-rs/ruffle \\\n\
        \  --pattern \"*web*selfhosted*.zip\" \\\n  --clobber\n\nZIP=\"$(\n  find\
        \ . \\\n    -maxdepth 1 \\\n    -type f \\\n    -name \"*.zip\" \\\n    -print\
        \ \\\n    | head -n 1\n)\"\n\nif [ -z \"$ZIP\" ]; then\n  echo \"ERROR: Ruffle\
        \ self-hosted ZIP not found.\"\n  gh release view \\\n    \"v${RUFFLE_VERSION}\"\
        \ \\\n    --repo ruffle-rs/ruffle \\\n    --json assets \\\n    --jq '.assets[].name'\n\
        \  exit 1\nfi\n\nrm -rf extracted\nmkdir -p extracted\n\nunzip \\\n  -q \\\
        \n  -o \\\n  \"$ZIP\" \\\n  -d extracted\n\nRUFFLE_JS=\"$(\n  find extracted\
        \ \\\n    -type f \\\n    -name \"ruffle.js\" \\\n    -print \\\n    | head\
        \ -n 1\n)\"\n\nif [ -z \"$RUFFLE_JS\" ]; then\n  echo \"ERROR: ruffle.js not\
        \ found.\"\n  echo \"Extracted tree:\"\n  find extracted -maxdepth 5 -print\
        \ | head -2000\n  exit 1\nfi\n\nRUFFLE_ROOT=\"$(dirname \"$RUFFLE_JS\")\"\n\
        DEST=\"$GITHUB_WORKSPACE/build/ruffle-runtime\"\n\nrm -rf \"$DEST\"\nmkdir\
        \ -p \"$DEST\"\n\ncp -R \\\n  \"$RUFFLE_ROOT\"/. \\\n  \"$DEST\"/\n\ntest\
        \ -f \"$DEST/ruffle.js\"\n\nprintf '%s\\n' \"$DEST\" \\\n  > \"$GITHUB_WORKSPACE/build/ruffle-root.txt\"\
        \n\necho \"Ruffle runtime:\"\ncat \"$GITHUB_WORKSPACE/build/ruffle-root.txt\"\
        \nfind \"$DEST\" -maxdepth 3 -type f -print | head -1000\n"
    - name: Auto-patch game BrowserWindow
      shell: bash
      run: "\nset -euo pipefail\n\nMAIN=\"$(cat build/main-path.txt)\"\n\npython3\
        \ <<'PY'\nfrom pathlib import Path\nimport json\nimport re\n\nmain = Path(\n\
        \    Path(\"build/main-path.txt\").read_text().strip()\n)\n\nreport = json.loads(\n\
        \    Path(\"build/autodetect-report.json\").read_text()\n)\n\ntext = main.read_text(\n\
        \    encoding=\"utf-8-sig\"\n)\n\nwindows = report.get(\n    \"browser_windows\"\
        ,\n    []\n)\n\nif not windows:\n    print(\n        \"WARNING: no BrowserWindow\
        \ report; \"\n        \"falling back to generic safe patch.\"\n    )\n   \
        \ selected = None\nelse:\n    selected = sorted(\n        windows,\n     \
        \   key=lambda x: (\n            -x[\"score\"],\n            x[\"index\"]\n\
        \        )\n    )[0]\n\nif selected is not None and selected[\"score\"] >=\
        \ 25:\n    # Identify the BrowserWindow by source excerpt.\n    excerpt =\
        \ selected[\"source_excerpt\"]\n    start = text.find(excerpt)\n\n    if start\
        \ < 0:\n        # Use a distinctive first chunk rather than exact entire block.\n\
        \        fingerprint = excerpt[:500]\n\n        start = text.find(\n     \
        \       fingerprint\n        )\n\n    if start < 0:\n        print(\n    \
        \        \"WARNING: selected BrowserWindow block \"\n            \"could not\
        \ be located exactly.\"\n        )\n        selected = None\n\nif selected\
        \ is not None:\n    excerpt = selected[\"source_excerpt\"]\n\n    start =\
        \ text.find(\n        excerpt\n    )\n\n    if start < 0:\n        start =\
        \ text.find(\n            excerpt[:500]\n        )\n\n    if start < 0:\n\
        \        selected = None\n\nif selected is not None:\n    # Find the real\
        \ object start before the source excerpt.\n    constructor = text.rfind(\n\
        \        \"new BrowserWindow\",\n        0,\n        start + 1\n    )\n\n\
        \    if constructor < 0:\n        selected = None\n\nif selected is not None:\n\
        \    brace = text.find(\n        \"{\",\n        constructor\n    )\n\n  \
        \  if brace < 0:\n        selected = None\n\nif selected is not None:\n  \
        \  depth = 0\n    quote = None\n    escape = False\n    end = -1\n\n    for\
        \ i in range(\n        brace,\n        len(text)\n    ):\n        c = text[i]\n\
        \n        if quote:\n            if escape:\n                escape = False\n\
        \            elif c == \"\\\\\":\n                escape = True\n        \
        \    elif c == quote:\n                quote = None\n            continue\n\
        \n        if c in (\"'\", '\"', \"`\"):\n            quote = c\n         \
        \   continue\n\n        if c == \"{\":\n            depth += 1\n\n       \
        \ elif c == \"}\":\n            depth -= 1\n\n            if depth == 0:\n\
        \                end = i + 1\n                break\n\n    if end < 0:\n \
        \       selected = None\n\nif selected is not None:\n    window = text[\n\
        \        constructor:end\n    ]\n\n    # Keep contextIsolation untouched.\n\
        \    # Sandbox is disabled only in the selected game/Flash window.\n    if\
        \ re.search(\n        r\"\\bsandbox\\s*:\\s*true\",\n        window,\n   \
        \     re.I\n    ):\n        window = re.sub(\n            r\"(\\bsandbox\\\
        s*:\\s*)true\",\n            r\"\\1false\",\n            window,\n       \
        \     count=1\n        )\n    elif not re.search(\n        r\"\\bsandbox\\\
        s*:\",\n        window,\n        re.I\n    ):\n        window, count = re.subn(\n\
        \            r\"(webPreferences\\s*:\\s*\\{)\",\n            r\"\\1\\n   \
        \     sandbox: false,\",\n            window,\n            count=1\n     \
        \   )\n\n        if count != 1:\n            selected = None\n\n    if selected\
        \ is not None:\n        window = re.sub(\n            r\"(\\bplugins\\s*:\\\
        s*)false\",\n            r\"\\1true\",\n            window,\n            count=1\n\
        \        )\n\n        replacement = \"\"\"preload: path.join(\n        process.resourcesPath,\n\
        \        'preload-ruffle.js'\n      ),\"\"\"\n\n        patterns = [\n   \
        \         re.compile(\n                r\"\"\"preload\\s*:\\s*app\\.isPackaged\\\
        s*\\?\\s*path\\.join\\([\\s\\S]*?\\)\\s*:\\s*path\\.join\\([\\s\\S]*?\\)\\\
        s*,?\"\"\",\n                re.I\n            ),\n            re.compile(\n\
        \                r\"\"\"preload\\s*:\\s*path\\.join\\([\\s\\S]*?\\)\\s*,?\"\
        \"\",\n                re.I\n            ),\n            re.compile(\n   \
        \             r\"\"\"preload\\s*:\\s*[^,\\n}]+\\s*,?\"\"\",\n            \
        \    re.I\n            ),\n        ]\n\n        changed = False\n\n      \
        \  for pattern in patterns:\n            window, count = pattern.subn(\n \
        \               replacement,\n                window,\n                count=1\n\
        \            )\n\n            if count == 1:\n                changed = True\n\
        \                break\n\n        if changed:\n            text = (\n    \
        \            text[:constructor]\n                + window\n              \
        \  + text[end:]\n            )\n\n            print(\n                \"Patched\
        \ highest-scoring BrowserWindow \"\n                \"for Ruffle.\"\n    \
        \        )\n        else:\n            selected = None\n\n# If automatic targeting\
        \ was uncertain, do NOT fail the build.\n# We still remove PPAPI launch switches\
        \ and leave the original window intact.\nif selected is None:\n    print(\n\
        \        \"WARNING: Could not safely replace game preload.\"\n    )\n    print(\n\
        \        \"Continuing with native PPAPI disabled only.\"\n    )\n\n# Always\
        \ remove native Pepper Flash launch switches.\nfor pattern in [\n    r\"\"\
        \"[A-Za-z0-9_$.\\[\\]]+\\.appendSwitch\\s*\\(\\s*['\"]ppapi-flash-path['\"\
        ]\\s*,[\\s\\S]*?\\)\\s*;\"\"\",\n    r\"\"\"[A-Za-z0-9_$.\\[\\]]+\\.appendSwitch\\\
        s*\\(\\s*['\"]ppapi-flash-version['\"]\\s*,[\\s\\S]*?\\)\\s*;\"\"\",\n]:\n\
        \    text = re.sub(\n        pattern,\n        \"\",\n        text,\n    \
        \    flags=re.I\n    )\n\n# Disable the concrete flashPath assignment if present.\n\
        text = re.sub(\n    r\"(\\bconst\\s+flashPath\\s*=\\s*)findFlashPath\\s*\\\
        (\\s*\\)\\s*;\",\n    r\"\\1null;\",\n    text,\n    count=1\n)\n\n# Remove\
        \ mms.cfg deployment call if present.\ntext = re.sub(\n    r\"(?m)^[ \\t]*_deployFlashMmsCfg\\\
        s*\\([^;]*\\)\\s*;[^\\n]*\\n?\",\n    \"\",\n    text\n)\n\nmain.write_text(\n\
        \    text,\n    encoding=\"utf-8\"\n)\n\nprint(\"PPAPI neutralization completed.\"\
        )\nPY\n\nnode \\\n  --check \\\n  \"$MAIN\"\n"
    - name: Automatic patch diagnostics
      shell: bash
      run: "\nset -euo pipefail\n\necho \"=== MAIN ===\"\ncat build/main-path.txt\n\
        \necho\necho \"=== PRELOAD ===\"\ncat build/preload-relative.txt\n\necho\n\
        echo \"=== AUTODETECT ===\"\ncat build/autodetect-report.json | head -1000\n\
        \necho\necho \"=== REMAINING PPAPI REFERENCES ===\"\ngrep -niE \\\n  \"ppapi-flash-path|ppapi-flash-version|findFlashPath|PepperFlashPlayer\"\
        \ \\\n  \"$(cat build/main-path.txt)\" \\\n  | head -300 \\\n  || true\n\n\
        echo\necho \"Automatic patch stage completed.\"\n"
    - name: Repack app.asar
      shell: bash
      run: 'set -euo pipefail

        APP="$(cat build/original-app.txt)"

        ASAR="$APP/Contents/Resources/app.asar"

        rm -f "$ASAR"

        asar pack build/source "$ASAR"'
    - name: Download Electron ARM64
      shell: bash
      run: "set -euo pipefail\nURL=\"https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip\"\
        \n\ncurl --fail --location --retry 10 --retry-delay 5 \\\n  --connect-timeout\
        \ 30 --max-time 1800 -A \"Mozilla/5.0\" \\\n  \"$URL\" -o build/electron-arm64.zip\n\
        \nmkdir -p build/electron\nunzip -q -o build/electron-arm64.zip -d build/electron\n\
        \nELECTRON_APP=\"$(find build/electron -type d -name \"Electron.app\" -print\
        \ | head -n 1)\"\n[ -n \"$ELECTRON_APP\" ] || { echo \"ERROR: Electron.app\
        \ not found.\"; exit 1; }\n\nprintf '%s\\n' \"$ELECTRON_APP\" > build/electron-app.txt\n\
        file \"$ELECTRON_APP/Contents/MacOS/Electron\"\nlipo -info \"$ELECTRON_APP/Contents/MacOS/Electron\""
    - name: Assemble ARM64 app
      shell: bash
      run: 'set -euo pipefail

        ORIGINAL="$(cat build/original-app.txt)"

        ELECTRON_APP="$(cat build/electron-app.txt)"

        FINAL="build/Gunny PC ARM64.app"


        rm -rf "$FINAL"

        cp -R "$ELECTRON_APP" "$FINAL"


        SRC="$ORIGINAL/Contents/Resources"

        DST="$FINAL/Contents/Resources"


        rsync -a --exclude="app.asar" "$SRC/" "$DST/"

        cp "$SRC/app.asar" "$DST/app.asar"'
    - name: Install Ruffle and Gunny bridge
      shell: bash
      run: "\nset -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\nRES=\"$APP/Contents/Resources\"\
        \n\nRUFFLE_ROOT=\"$(cat build/ruffle-root.txt)\"\nPRELOAD_REL=\"$(cat build/preload-relative.txt)\"\
        \n\ntest -d \"$RUFFLE_ROOT\"\ntest -f \"$RUFFLE_ROOT/ruffle.js\"\n\nrm -rf\
        \ \"$RES/ruffle\"\nmkdir -p \"$RES/ruffle\"\n\ncp -R \\\n  \"$RUFFLE_ROOT\"\
        /. \\\n  \"$RES/ruffle\"/\n\ntest -f \"$RES/ruffle/ruffle.js\"\n\ncp \\\n\
        \  build/bridge/gunny-host.js \\\n  \"$RES/gunny-host.js\"\n\nnode \\\n  --check\
        \ \\\n  \"$RES/gunny-host.js\"\n\ncat > \"$RES/preload-ruffle.js\" <<EOF\n\
        'use strict';\n\nconst fs = require('fs');\nconst path = require('path');\n\
        const { webFrame } = require('electron');\n\nconst resources = process.resourcesPath;\n\
        \nconst ruffleFile = path.join(\n  resources,\n  'ruffle',\n  'ruffle.js'\n\
        );\n\nconst bridgeFile = path.join(\n  resources,\n  'gunny-host.js'\n);\n\
        \nconst originalPreload = path.join(\n  resources,\n  'app.asar',\n  '$PRELOAD_REL'\n\
        );\n\nif (!fs.existsSync(ruffleFile)) {\n  throw new Error(\n    'Ruffle runtime\
        \ missing: ' + ruffleFile\n  );\n}\n\nif (!fs.existsSync(bridgeFile)) {\n\
        \  throw new Error(\n    'Gunny host bridge missing: ' + bridgeFile\n  );\n\
        }\n\nconst ruffleSource = fs.readFileSync(\n  ruffleFile,\n  'utf8'\n);\n\n\
        const bridgeSource = fs.readFileSync(\n  bridgeFile,\n  'utf8'\n);\n\nconst\
        \ publicPath =\n  'file://' +\n  path.join(\n    resources,\n    'ruffle'\n\
        \  ).replace(\n    /\\\\\\\\/g,\n    '/'\n  ) +\n  '/';\n\nconst code = [\n\
        \  '(function(){',\n  'try {',\n  'window.RufflePlayer = window.RufflePlayer\
        \ || {};',\n  'window.RufflePlayer.config = window.RufflePlayer.config ||\
        \ {};',\n  'window.RufflePlayer.config.publicPath = ' +\n    JSON.stringify(publicPath)\
        \ + ';',\n  'window.RufflePlayer.config.allowNetworking = \"all\";',\n  'window.RufflePlayer.config.allowScriptAccess\
        \ = \"always\";',\n  'window.RufflePlayer.config.polyfills = true;',\n  ruffleSource,\n\
        \  'const r = window.RufflePlayer && ' +\n    'typeof window.RufflePlayer.newest\
        \ === \"function\" ' +\n    '? window.RufflePlayer.newest() : null;',\n  'if\
        \ (!r) throw new Error(\"Ruffle newest() unavailable\");',\n  'if (typeof\
        \ r.pluginPolyfill === \"function\") r.pluginPolyfill();',\n  'if (typeof\
        \ r.polyfill === \"function\") r.polyfill();',\n  bridgeSource,\n  'console.log(\"\
        [Gunny ARM64] Ruffle + host bridge ready\");',\n  '} catch (error) {',\n \
        \ 'console.error(\"[Gunny ARM64] bootstrap failed:\", error);',\n  '}',\n\
        \  '})();'\n].join('\\n');\n\nwebFrame.executeJavaScript(\n  code,\n  false\n\
        ).catch((error) => {\n  console.error(\n    '[Gunny ARM64] bootstrap failed:',\n\
        \    error\n  );\n});\n\ntry {\n  require(originalPreload);\n  console.log(\n\
        \    '[Gunny ARM64] original Gunny preload loaded'\n  );\n} catch (error)\
        \ {\n  console.error(\n    '[Gunny ARM64] original preload failed:',\n   \
        \ error\n  );\n}\nEOF\n\nnode \\\n  --check \\\n  \"$RES/preload-ruffle.js\"\
        \n"
    - name: Rename Electron
      shell: bash
      run: "set -euo pipefail\nAPP=\"build/Gunny PC ARM64.app\"\nBIN=\"$APP/Contents/MacOS\"\
        \n\nmv \"$BIN/Electron\" \"$BIN/Gunny PC\"\nchmod +x \"$BIN/Gunny PC\"\n\n\
        /usr/libexec/PlistBuddy \\\n  -c \"Set :CFBundleExecutable Gunny PC\" \\\n\
        \  \"$APP/Contents/Info.plist\" \\\n  2>/dev/null || true"
    - name: Verify ARM64 package
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\nBIN=\"$APP/Contents/MacOS/Gunny\
        \ PC\"\nRES=\"$APP/Contents/Resources\"\n\nfile \"$BIN\"\nlipo -info \"$BIN\"\
        \n\nfile \"$BIN\" | grep -q \"arm64\"\n\ntest -f \"$RES/ruffle/ruffle.js\"\
        \ntest -f \"$RES/gunny-host.js\"\nnode --check \"$RES/gunny-host.js\"\n\n\
        test -f \"$RES/preload-ruffle.js\"\nnode --check \"$RES/preload-ruffle.js\"\
        \n\nrm -rf build/final-source\nasar extract \"$RES/app.asar\" build/final-source\n\
        \nFINAL_MAIN=\"$(find build/final-source -type f -name \"main.js\" -print\
        \ | head -n 1)\"\nnode --check \"$FINAL_MAIN\"\n\necho \"=== preload reference\
        \ ===\"\ngrep -n \"preload-ruffle.js\" \"$FINAL_MAIN\" || true\n\necho \"\
        === PPAPI references ===\"\ngrep -RniE \\\n  \"ppapi-flash-path|ppapi-flash-version\"\
        \ \\\n  build/final-source \\\n  2>/dev/null \\\n  | head -100 || true"
    - name: Sign and package
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\n\nxattr -cr \"\
        $APP\" 2>/dev/null || true\nrm -rf \"$APP/Contents/_CodeSignature\"\n\ncodesign\
        \ --deep --force --verbose --sign - \"$APP\"\ncodesign --verify --deep --strict\
        \ --verbose=2 \"$APP\"\n\nmkdir -p release\n\nditto \\\n  -c \\\n  -k \\\n\
        \  --sequesterRsrc \\\n  --keepParent \\\n  \"$APP\" \\\n  release/Gunny-PC-ARM64-Ruffle-HostBridge.zip\n\
        \nls -lh release/Gunny-PC-ARM64-Ruffle-HostBridge.zip"
    - name: Upload ARM64 build
      uses: actions/upload-artifact@v4
      with:
        name: Gunny-PC-ARM64-Ruffle-HostBridge
        path: release/Gunny-PC-ARM64-Ruffle-HostBridge.zip
        if-no-files-found: error
        retention-days: 14
