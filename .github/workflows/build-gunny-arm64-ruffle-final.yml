name: Build Gunny PC ARM64 + Ruffle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Gunny PC"
  ELECTRON_VERSION: "43.2.0"
  RUFFLE_VERSION: "0.4.1"
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

jobs:
  build:
    name: Build Gunny PC ARM64 + Ruffle
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          
          set -euo pipefail
          
          npm install --global @electron/asar
          
          echo "Node:"
          node --version
          
          echo
          echo "ASAR:"
          asar --version
          
          echo
          echo "GitHub CLI:"
          gh --version

      - name: Prepare
        shell: bash
        run: |
          
          set -euo pipefail
          
          rm -rf build release
          mkdir -p build release

      - name: Download original Gunny Intel
        shell: bash
        run: |
          
          set -euo pipefail
          
          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny-intel.zip
          
          file build/gunny-intel.zip
          ls -lh build/gunny-intel.zip

      - name: Extract original Gunny
        shell: bash
        run: |
          
          set -euo pipefail
          
          mkdir -p build/original
          
          unzip \
            -q \
            -o \
            build/gunny-intel.zip \
            -d build/original
          
          rm -rf build/original/__MACOSX
          
          APP="$(
            find build/original \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"
          
          if [ -z "$APP" ]; then
            echo "ERROR: Gunny .app not found."
            exit 1
          fi
          
          printf '%s\n' "$APP" > build/original-app.txt
          
          echo "Original app:"
          cat build/original-app.txt

      - name: Verify original Intel build
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="$(cat build/original-app.txt)"
          MAIN="$APP/Contents/MacOS/Gunny PC"
          
          if [ ! -f "$MAIN" ]; then
            echo "ERROR: original Gunny executable not found."
            exit 1
          fi
          
          file "$MAIN"
          
          echo
          lipo -info "$MAIN"
          
          if ! file "$MAIN" | grep -q "x86_64"; then
            echo "ERROR: Google Drive source is not x86_64."
            exit 1
          fi
          
          echo "Original Intel build: OK"

      - name: Verify original Gunny preload
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="$(cat build/original-app.txt)"
          PRELOAD="$APP/Contents/Resources/preload.js"
          
          if [ ! -f "$PRELOAD" ]; then
            echo "ERROR: original Resources/preload.js not found."
            exit 1
          fi
          
          node --check "$PRELOAD"
          
          echo "Original preload: OK"

      - name: Verify original Pepper Flash
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="$(cat build/original-app.txt)"
          PEPPER="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer"
          
          if [ ! -f "$PEPPER" ]; then
            echo "ERROR: bundled PepperFlashPlayer.plugin not found."
            exit 1
          fi
          
          file "$PEPPER"
          lipo -info "$PEPPER" || true
          
          echo "Pepper Flash verified as source-only."

      - name: Extract original app.asar
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="$(cat build/original-app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"
          
          if [ ! -f "$ASAR" ]; then
            echo "ERROR: app.asar not found."
            exit 1
          fi
          
          rm -rf build/source
          asar extract "$ASAR" build/source
          
          echo "app.asar extracted."

      - name: Locate Gunny main.js
        shell: bash
        run: |
          
          set -euo pipefail
          
          MAIN="$(
            find build/source \
              -type f \
              -name "main.js" \
              -print \
              | while IFS= read -r f; do
                  if grep -q "findFlashPath" "$f" 2>/dev/null; then
                    echo "$f"
                    break
                  fi
                done
          )"
          
          if [ -z "$MAIN" ]; then
            echo "ERROR: Gunny main.js with findFlashPath() not found."
            exit 1
          fi
          
          printf '%s\n' "$MAIN" > build/main-path.txt
          
          echo "Gunny main.js:"
          cat build/main-path.txt

      - name: Show original game window
        shell: bash
        run: |
          
          set -euo pipefail
          
          MAIN="$(cat build/main-path.txt)"
          
          grep -n \
            -A90 \
            -B10 \
            "function createGameWindow" \
            "$MAIN" \
            | head -180

      - name: Download Ruffle self-hosted
        shell: bash
        run: |
          
          set -euo pipefail
          
          rm -rf build/ruffle
          mkdir -p build/ruffle
          
          cd build/ruffle
          
          gh release download \
            "v${RUFFLE_VERSION}" \
            --repo ruffle-rs/ruffle \
            --pattern "*web*selfhosted*.zip" \
            --clobber
          
          ZIP="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print \
              | head -n 1
          )"
          
          if [ -z "$ZIP" ]; then
            echo "ERROR: Ruffle self-hosted asset not found."
            gh release view \
              "v${RUFFLE_VERSION}" \
              --repo ruffle-rs/ruffle \
              --json assets \
              --jq '.assets[].name'
            exit 1
          fi
          
          mkdir -p extracted
          
          unzip \
            -q \
            -o \
            "$ZIP" \
            -d extracted

      - name: Validate Ruffle
        shell: bash
        run: |
          
          set -euo pipefail
          
          RUFFLE_JS="$(
            find build/ruffle/extracted \
              -type f \
              -name "ruffle.js" \
              -print \
              | head -n 1
          )"
          
          if [ -z "$RUFFLE_JS" ]; then
            echo "ERROR: ruffle.js not found."
            find build/ruffle/extracted \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -300
            exit 1
          fi
          
          RUFFLE_ROOT="$(dirname "$RUFFLE_JS")"
          
          printf '%s\n' "$RUFFLE_ROOT" > build/ruffle-root.txt
          
          WASM="$(
            find "$RUFFLE_ROOT" \
              -type f \
              -name "*.wasm" \
              -print \
              | head -n 1
          )"
          
          if [ -z "$WASM" ]; then
            echo "ERROR: Ruffle WASM not found."
            exit 1
          fi
          
          ls -lh "$RUFFLE_JS"
          ls -lh "$WASM"

      - name: Patch Gunny main.js
        shell: bash
        run: |
          
          set -euo pipefail
          
          MAIN="$(cat build/main-path.txt)"
          export MAIN
          
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          
          main = Path(os.environ["MAIN"])
          
          source = main.read_text(
              encoding="utf-8-sig"
          )
          
          original = source
          
          
          # Disable bundled Pepper Flash selection.
          source, flash_count = re.subn(
              r"(\bconst\s+flashPath\s*=\s*)findFlashPath\s*\(\s*\)\s*;",
              r"\1null;",
              source,
              count=1,
          )
          
          if flash_count != 1:
              raise SystemExit(
                  "ERROR: const flashPath = findFlashPath(); not found."
              )
          
          
          # Remove native PPAPI switches.
          source = re.sub(
              r"""
              [A-Za-z0-9_$.\[\]]+
              \.appendSwitch
              \s*\(
              \s*['"]ppapi-flash-path['"]
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              source,
              flags=re.IGNORECASE | re.VERBOSE,
          )
          
          source = re.sub(
              r"""
              [A-Za-z0-9_$.\[\]]+
              \.appendSwitch
              \s*\(
              \s*['"]ppapi-flash-version['"]
              \s*,[\s\S]*?
              \)
              \s*;
              """,
              "",
              source,
              flags=re.IGNORECASE | re.VERBOSE,
          )
          
          
          # Disable old Flash deployment/telemetry.
          source = re.sub(
              r"(?m)^[ \t]*_deployFlashMmsCfg\s*\([^;]*\)\s*;[^\n]*\n?",
              "",
              source,
          )
          
          source = re.sub(
              r"(?m)^[^\n]*flash_not_found[^\n]*\n?",
              "",
              source,
          )
          
          
          # Locate ONLY createGameWindow().
          start = source.find("function createGameWindow")
          
          if start == -1:
              raise SystemExit(
                  "ERROR: createGameWindow() not found."
              )
          
          next_function = re.search(
              r"(?m)^(?:function|async\s+function|const\s+\w+\s*=|let\s+\w+\s*=|var\s+\w+\s*=)",
              source[start + 20:],
          )
          
          if next_function:
              end = (
                  start
                  + 20
                  + next_function.start()
              )
          else:
              end = len(source)
          
          game = source[start:end]
          
          if "new BrowserWindow" not in game:
              raise SystemExit(
                  "ERROR: BrowserWindow not found inside createGameWindow()."
              )
          
          
          # Keep contextIsolation TRUE for Gunny's real contextBridge preload.
          game = re.sub(
              r"(\bcontextIsolation\s*:\s*)false",
              r"\1true",
              game,
              count=1,
          )
          
          # Disable only the game renderer sandbox so the custom preload
          # has the full Node environment needed by fs/path/webFrame.
          if re.search(r"\bsandbox\s*:", game):
              game = re.sub(
                  r"(\bsandbox\s*:\s*)true",
                  r"\1false",
                  game,
                  count=1,
              )
          else:
              game, inserted = re.subn(
                  r"(webPreferences\s*:\s*\{)",
                  r"\1\n      sandbox: false,",
                  game,
                  count=1,
              )
          
              if inserted != 1:
                  raise SystemExit(
                      "ERROR: game webPreferences block not found."
                  )
          
          
          # Keep Chromium plugins enabled.
          game = re.sub(
              r"(\bplugins\s*:\s*)false",
              r"\1true",
              game,
              count=1,
          )
          
          
          # Replace the exact packaged/dev preload expression.
          old_preload = (
              "preload: app.isPackaged\n"
              "        ? path.join(process.resourcesPath, 'preload.js')\n"
              "        : path.join(__dirname, 'preload.js'),"
          )
          
          new_preload = (
              "preload: path.join(\n"
              "        process.resourcesPath,\n"
              "        'preload-ruffle.js'\n"
              "      ),"
          )
          
          if old_preload in game:
              game = game.replace(
                  old_preload,
                  new_preload,
                  1,
              )
              preload_count = 1
          else:
              preload_pattern = re.compile(
                  r"""
                  \bpreload\s*:\s*
                  app\.isPackaged
                  \s*\?\s*
                  path\.join\(
                      [\s\S]*?
                  \)
                  \s*:\s*
                  path\.join\(
                      [\s\S]*?
                  \)
                  \s*,?
                  """,
                  re.IGNORECASE | re.VERBOSE,
              )
          
              game, preload_count = preload_pattern.subn(
                  new_preload,
                  game,
                  count=1,
              )
          
          if preload_count != 1:
              raise SystemExit(
                  "ERROR: original Gunny game preload expression not found."
              )
          
          
          source = (
              source[:start]
              + game
              + source[end:]
          )
          
          main.write_text(
              source,
              encoding="utf-8",
          )
          
          print("main.js patched successfully.")
          print("flashPath replaced:", flash_count)
          print("game preload replaced:", preload_count)
          print("original bytes:", len(original))
          print("patched bytes:", len(source))
          PY
          
          echo
          echo "Checking main.js syntax..."
          
          node \
            --check \
            "$MAIN"
          
          echo "main.js syntax: OK"
          
          echo
          echo "Patched game window:"
          
          grep -n \
            -A40 \
            -B8 \
            "function createGameWindow" \
            "$MAIN" \
            | head -140
          
          echo
          echo "PPAPI switches remaining:"
          
          grep -niE \
            "ppapi-flash-path|ppapi-flash-version" \
            "$MAIN" \
            || true

      - name: Create Ruffle preload
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="$(cat build/original-app.txt)"
          RES="$APP/Contents/Resources"
          
          ROOT="$(cat build/ruffle-root.txt)"
          
          if [ ! -f "$RES/preload.js" ]; then
            echo "ERROR: original Gunny preload.js missing."
            exit 1
          fi
          
          rm -rf "$RES/ruffle"
          
          mkdir -p "$RES/ruffle"
          
          cp -R \
            "$ROOT"/. \
            "$RES/ruffle"
          
          cat > "$RES/preload-ruffle.js" <<'EOF'
          'use strict';
          
          const fs = require('fs');
          const path = require('path');
          const { webFrame } = require('electron');
          
          const resources = process.resourcesPath;
          
          const ruffleDir = path.join(
              resources,
              'ruffle'
          );
          
          const ruffleScript = path.join(
              ruffleDir,
              'ruffle.js'
          );
          
          const originalPreload = path.join(
              resources,
              'preload.js'
          );
          
          console.log(
              '[Gunny ARM64] Ruffle preload starting'
          );
          
          if (!fs.existsSync(ruffleScript)) {
              throw new Error(
                  'ruffle.js not found: ' + ruffleScript
              );
          }
          
          if (!fs.existsSync(originalPreload)) {
              throw new Error(
                  'original Gunny preload.js not found: ' +
                  originalPreload
              );
          }
          
          const ruffleSource =
              fs.readFileSync(
                  ruffleScript,
                  'utf8'
              );
          
          const publicPath =
              'file://' +
              ruffleDir.replace(
                  /\\/g,
                  '/'
              ) +
              '/';
          
          /*
           * webFrame.executeJavaScript() evaluates code in the
           * page's Main World. Electron documents the callback as
           * being called after execution, synchronously when the
           * frame is not suspended.
           *
           * We use this instead of contextBridge.executeInMainWorld()
           * because the target Gunny version is Electron 43.2.0 and
           * we need the Ruffle polyfill in the actual page world.
           */
          
          const bootstrap = `
          (function () {
              try {
                  window.RufflePlayer =
                      window.RufflePlayer || {};
          
                  window.RufflePlayer.config =
                      window.RufflePlayer.config || {};
          
                  window.RufflePlayer.config.publicPath =
                      ${JSON.stringify(publicPath)};
          
                  window.RufflePlayer.config.polyfills = true;
                  window.RufflePlayer.config.favorFlash = false;
                  window.RufflePlayer.config.allowNetworking = 'all';
          
                  ${ruffleSource}
          
                  const ruffle =
                      window.RufflePlayer &&
                      typeof window.RufflePlayer.newest === 'function'
                          ? window.RufflePlayer.newest()
                          : null;
          
                  if (!ruffle) {
                      throw new Error(
                          'RufflePlayer.newest() unavailable'
                      );
                  }
          
                  if (
                      typeof ruffle.pluginPolyfill !==
                      'function'
                  ) {
                      throw new Error(
                          'Ruffle pluginPolyfill() unavailable'
                      );
                  }
          
                  ruffle.pluginPolyfill();
          
                  if (
                      typeof ruffle.polyfill ===
                      'function'
                  ) {
                      ruffle.polyfill();
                  }
          
                  console.log(
                      '[Gunny ARM64] Ruffle pluginPolyfill ENABLED'
                  );
          
                  console.log(
                      '[Gunny ARM64] Ruffle plugins:',
                      navigator.plugins.length
                  );
          
                  console.log(
                      '[Gunny ARM64] Ruffle mimeTypes:',
                      navigator.mimeTypes.length
                  );
          
              } catch (error) {
                  console.error(
                      '[Gunny ARM64] Ruffle main-world initialization failed:',
                      error && error.stack
                          ? error.stack
                          : error
                  );
              }
          })();
          `;
          
          webFrame.executeJavaScript(
              bootstrap,
              false,
              function (result, error) {
                  if (error) {
                      console.error(
                          '[Gunny ARM64] Ruffle executeJavaScript error:',
                          error
                      );
                  }
              }
          );
          
          /*
           * Load the original Gunny preload in the SAME isolated
           * preload context.
           *
           * This preserves:
           *   window.gunny
           *   toolbar-action IPC
           *   mute-state IPC
           *   flash-ready polling
           */
          
          console.log(
              '[Gunny ARM64] Loading original Gunny preload:',
              originalPreload
          );
          
          require(
              originalPreload
          );
          
          console.log(
              '[Gunny ARM64] Original Gunny preload loaded'
          );
          EOF
          
          node \
            --check \
            "$RES/preload-ruffle.js"
          
          echo
          echo "preload-ruffle.js syntax: OK"
          
          echo
          echo "Original preload:"
          ls -lh "$RES/preload.js"
          
          echo
          echo "Ruffle:"
          ls -lh "$RES/ruffle/ruffle.js"

      - name: Rebuild patched app.asar
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="$(cat build/original-app.txt)"
          ASAR="$APP/Contents/Resources/app.asar"
          
          rm -f "$ASAR"
          
          asar pack \
            build/source \
            "$ASAR"
          
          echo "Patched app.asar rebuilt."

      - name: Download Electron ARM64
        shell: bash
        run: |
          
          set -euo pipefail
          
          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"
          
          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o build/electron-arm64.zip
          
          rm -rf build/electron
          
          mkdir -p build/electron
          
          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron
          
          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -n 1
          )"
          
          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi
          
          printf '%s\n' "$ELECTRON_APP" > build/electron-app.txt
          
          BIN="$ELECTRON_APP/Contents/MacOS/Electron"
          
          file "$BIN"
          
          echo
          lipo -info "$BIN"
          
          if ! file "$BIN" | grep -q "arm64"; then
            echo "ERROR: Electron is not ARM64."
            exit 1
          fi

      - name: Assemble final ARM64 app
        shell: bash
        run: |
          
          set -euo pipefail
          
          ORIGINAL="$(cat build/original-app.txt)"
          ELECTRON_APP="$(cat build/electron-app.txt)"
          
          rm -rf "build/Gunny PC ARM64.app"
          
          cp -R \
            "$ELECTRON_APP" \
            "build/Gunny PC ARM64.app"
          
          SRC="$ORIGINAL/Contents/Resources"
          DST="build/Gunny PC ARM64.app/Contents/Resources"
          
          # Copy Gunny resources except app.asar and Intel plugins.
          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"
          
          # Copy patched app.asar.
          cp \
            "$SRC/app.asar" \
            "$DST/app.asar"
          
          # Explicitly copy the original Gunny preload.
          cp \
            "$SRC/preload.js" \
            "$DST/preload.js"
          
          # Copy the Ruffle preload.
          cp \
            "$SRC/preload-ruffle.js" \
            "$DST/preload-ruffle.js"
          
          # Copy Ruffle files.
          ROOT="$(cat build/ruffle-root.txt)"
          
          rm -rf \
            "$DST/ruffle"
          
          mkdir -p \
            "$DST/ruffle"
          
          cp -R \
            "$ROOT"/. \
            "$DST/ruffle/"
          
          echo
          echo "Final resources:"
          ls -lh \
            "$DST/app.asar" \
            "$DST/preload.js" \
            "$DST/preload-ruffle.js" \
            "$DST/ruffle/ruffle.js"

      - name: Remove Intel Pepper Flash
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          
          rm -rf \
            "$APP/Contents/Resources/plugins"
          
          if find "$APP" \
            \( \
              -iname "*PepperFlash*" \
              -o \
              -iname "*pepflash*" \
            \) \
            -print \
            | grep -q .
          then
            echo "ERROR: Pepper Flash remains."
            exit 1
          fi
          
          echo "Pepper Flash: removed."

      - name: Rename Electron executable
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          BIN="$APP/Contents/MacOS"
          
          if [ ! -f "$BIN/Electron" ]; then
            echo "ERROR: Electron executable not found."
            exit 1
          fi
          
          mv \
            "$BIN/Electron" \
            "$BIN/Gunny PC"
          
          chmod +x \
            "$BIN/Gunny PC"

      - name: Update Info.plist
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          PLIST="$APP/Contents/Info.plist"
          
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST"
          
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true
          
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true
          
          plutil -p "$PLIST"

      - name: Verify final contents
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          MAIN="$APP/Contents/MacOS/Gunny PC"
          RES="$APP/Contents/Resources"
          
          echo "=========================================="
          echo "MAIN ARCHITECTURE"
          echo "=========================================="
          
          file "$MAIN"
          
          echo
          lipo -info "$MAIN"
          
          if ! file "$MAIN" | grep -q "arm64"; then
            echo "ERROR: final executable is not ARM64."
            exit 1
          fi
          
          echo
          echo "Required files:"
          
          test -f "$RES/app.asar"
          test -f "$RES/preload.js"
          test -f "$RES/preload-ruffle.js"
          test -f "$RES/ruffle/ruffle.js"
          
          echo "All required files exist."
          
          echo
          echo "Pepper Flash scan:"
          
          if find "$APP" \
            \( \
              -iname "*PepperFlash*" \
              -o \
              -iname "*pepflash*" \
            \) \
            -print \
            | grep -q .
          then
            echo "ERROR: Pepper Flash remains."
            exit 1
          fi
          
          echo "No Pepper Flash."

      - name: Verify final app.asar
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          ASAR="$APP/Contents/Resources/app.asar"
          
          rm -rf build/final-source
          
          asar extract \
            "$ASAR" \
            build/final-source
          
          MAIN="$(
            find build/final-source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"
          
          if [ -z "$MAIN" ]; then
            echo "ERROR: final main.js not found."
            exit 1
          fi
          
          node \
            --check \
            "$MAIN"
          
          echo "Final main.js syntax: OK"
          
          echo
          echo "Game preload reference:"
          grep -n \
            -A40 \
            "function createGameWindow" \
            "$MAIN" \
            | head -120
          
          echo
          echo "PPAPI references:"
          grep -RniE \
            "ppapi-flash-path|ppapi-flash-version" \
            build/final-source \
            2>/dev/null \
            | head -50 \
            || true

      - name: Smoke-test startup and preloads
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          BIN="$APP/Contents/MacOS/Gunny PC"
          LOG="build/runtime-smoke.log"
          
          rm -f "$LOG"
          
          "$BIN" \
            --enable-logging=stderr \
            --v=1 \
            > "$LOG" \
            2>&1 &
          
          PID=$!
          
          sleep 12
          
          kill "$PID" \
            2>/dev/null \
            || true
          
          echo "Critical runtime messages:"
          
          grep -niE \
            "Unable to load preload|module not found|contextBridge|Ruffle|pluginPolyfill|SyntaxError|ReferenceError|TypeError" \
            "$LOG" \
            | head -300 \
            || true
          
          cp \
            "$LOG" \
            release/runtime-smoke.log

      - name: Remove quarantine and old signatures
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          
          xattr -cr \
            "$APP" \
            || true
          
          rm -rf \
            "$APP/Contents/_CodeSignature"
          
          find "$APP/Contents" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + \
            || true

      - name: Verify no Intel Mach-O
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          REPORT="build/macho-report.txt"
          
          find "$APP" \
            -type f \
            -exec sh -c '
              INFO="$(file "$1" 2>/dev/null || true)"
          
              case "$INFO" in
                *"Mach-O"*)
                  printf "%s\n" "$INFO"
                  ;;
              esac
            ' _ {} \; \
            > "$REPORT"
          
          cat "$REPORT"
          
          echo
          echo "Intel scan:"
          
          if grep -Eiq \
            "x86_64|i386" \
            "$REPORT"
          then
            echo "ERROR: Intel Mach-O remains."
            grep -Ei \
              "x86_64|i386" \
              "$REPORT"
            exit 1
          fi
          
          echo "No Intel Mach-O detected."

      - name: Ad-hoc sign
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          
          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"
          
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

      - name: Create ZIP
        shell: bash
        run: |
          
          set -euo pipefail
          
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "release/Gunny-PC-ARM64-Ruffle.zip"
          
          ls -lh \
            "release/Gunny-PC-ARM64-Ruffle.zip"

      - name: Create DMG
        shell: bash
        run: |
          
          set -euo pipefail
          
          rm -rf build/dmg
          mkdir -p build/dmg
          
          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/
          
          hdiutil create \
            -volname "Gunny PC ARM64 Ruffle" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "release/Gunny-PC-ARM64-Ruffle.dmg"
          
          ls -lh \
            "release/Gunny-PC-ARM64-Ruffle.dmg"

      - name: Build report
        shell: bash
        run: |
          
          set -euo pipefail
          
          APP="build/Gunny PC ARM64.app"
          MAIN="$APP/Contents/MacOS/Gunny PC"
          
          {
            echo "Gunny PC ARM64 + Ruffle"
            echo
            echo "Electron: $ELECTRON_VERSION"
            echo "Ruffle: $RUFFLE_VERSION"
            echo
            echo "Architecture:"
            file "$MAIN"
            echo
            echo "Ruffle:"
            test -f \
              "$APP/Contents/Resources/ruffle/ruffle.js" \
              && echo "ruffle.js: OK"
            test -f \
              "$APP/Contents/Resources/preload-ruffle.js" \
              && echo "preload-ruffle.js: OK"
            echo
            echo "Original Gunny preload:"
            test -f \
              "$APP/Contents/Resources/preload.js" \
              && echo "preload.js: OK"
            echo
            echo "Pepper Flash:"
            if find "$APP" \
              \( \
                -iname "*PepperFlash*" \
                -o \
                -iname "*pepflash*" \
              \) \
              | grep -q .
            then
              echo "FOUND"
            else
              echo "REMOVED"
            fi
          } > release/build-report.txt
          
          cat release/build-report.txt

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-ZIP
          path: release/Gunny-PC-ARM64-Ruffle.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-DMG
          path: release/Gunny-PC-ARM64-Ruffle.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload runtime log
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Runtime-Log
          path: release/runtime-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Ruffle-Report
          path: release/build-report.txt
          if-no-files-found: error
          retention-days: 14
