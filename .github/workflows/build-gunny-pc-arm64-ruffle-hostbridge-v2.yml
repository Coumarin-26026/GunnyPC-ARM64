name: Build Gunny PC ARM64 Ruffle
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  APP_NAME: Gunny PC
  ELECTRON_VERSION: 43.2.0
  RUFFLE_VERSION: 0.4.1
  GUNNY_URL: https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b
jobs:
  build:
    name: Build ARM64 with Ruffle Host Bridge
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install asar
      shell: bash
      run: 'set -euo pipefail

        npm install --global @electron/asar

        node --version

        asar --version'
    - name: Download Gunny Intel
      shell: bash
      run: "set -euo pipefail\nrm -rf build release\nmkdir -p build/original release\n\
        curl --fail --location --retry 10 --retry-delay 5 \\\n  --connect-timeout\
        \ 30 --max-time 1800 -A \"Mozilla/5.0\" \\\n  \"$GUNNY_URL\" -o build/gunny-intel.zip\n\
        unzip -q -o build/gunny-intel.zip -d build/original\nrm -rf build/original/__MACOSX\n\
        \nAPP=\"$(\n  find build/original -type d -name \"*.app\" -print | head -n\
        \ 1\n)\"\n\n[ -n \"$APP\" ] || { echo \"ERROR: Gunny app not found.\"; exit\
        \ 1; }\n\nprintf '%s\\n' \"$APP\" > build/original-app.txt\nasar extract \"\
        $APP/Contents/Resources/app.asar\" build/source"
    - name: Locate main.js and preload
      shell: bash
      run: "set -euo pipefail\n\nMAIN=\"$(\n  find build/source -type f -name \"main.js\"\
        \ -print | head -n 1\n)\"\n[ -n \"$MAIN\" ] || { echo \"ERROR: main.js not\
        \ found.\"; exit 1; }\n\nprintf '%s\\n' \"$MAIN\" > build/main-path.txt\n\n\
        PRELOAD=\"$(\n  find build/source -type f -name \"*.js\" -print |\n  while\
        \ IFS= read -r FILE; do\n    case \"$FILE\" in */main.js) continue;; esac\n\
        \    if grep -qE \"contextBridge|ipcRenderer|flash-ready|setFlashFocus\" \"\
        $FILE\" 2>/dev/null; then\n      echo \"$FILE\"\n      break\n    fi\n  done\n\
        )\"\n\n[ -n \"$PRELOAD\" ] || { echo \"ERROR: preload not found.\"; exit 1;\
        \ }\n\npython3 - \"$PRELOAD\" > build/preload-relative.txt <<'PY'\nfrom pathlib\
        \ import Path\nimport sys\nroot = Path(\"build/source\").resolve()\nfile =\
        \ Path(sys.argv[1]).resolve()\nprint(file.relative_to(root).as_posix())\n\
        PY\n\necho \"MAIN:\"\ncat build/main-path.txt\necho \"PRELOAD:\"\ncat build/preload-relative.txt"
    - name: Import Gunny Host Bridge
      shell: bash
      run: "set -euo pipefail\n\nSRC=\"gunny-ruffle-host-bridge/gunny-host.js\"\n\
        [ -f \"$SRC\" ] || {\n  echo \"ERROR: $SRC not found.\"\n  exit 1\n}\n\nmkdir\
        \ -p build/bridge\ncp \"$SRC\" build/bridge/gunny-host.js\nnode --check build/bridge/gunny-host.js"
    - name: Download Ruffle
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\nrm -rf build/ruffle\nmkdir -p build/ruffle\ncd build/ruffle\n\
        \ngh release download \"v${RUFFLE_VERSION}\" \\\n  --repo ruffle-rs/ruffle\
        \ \\\n  --pattern \"*web*selfhosted*.zip\" \\\n  --clobber\n\nZIP=\"$(find\
        \ . -maxdepth 1 -type f -name \"*.zip\" -print | head -n 1)\"\n[ -n \"$ZIP\"\
        \ ] || { echo \"ERROR: Ruffle asset not found.\"; exit 1; }\n\nmkdir extracted\n\
        unzip -q -o \"$ZIP\" -d extracted\n\nRUFFLE_JS=\"$(\n  find extracted -type\
        \ f -name \"ruffle.js\" -print | head -n 1\n)\"\n[ -n \"$RUFFLE_JS\" ] ||\
        \ { echo \"ERROR: ruffle.js not found.\"; exit 1; }\n\nprintf '%s\\n' \"$(dirname\
        \ \"$RUFFLE_JS\")\" > \"$GITHUB_WORKSPACE/build/ruffle-root.txt\""
    - name: Patch main.js
      shell: bash
      run: "set -euo pipefail\n\nMAIN=\"$(cat build/main-path.txt)\"\n\ncat > build/patch_main.py\
        \ <<'PY'\nimport re\nimport sys\nfrom pathlib import Path\n\npath = Path(sys.argv[1])\n\
        text = path.read_text(encoding=\"utf-8-sig\")\n\nfor pattern in [\n    r\"\
        \"\"[A-Za-z0-9_$.\\[\\]]+\\.appendSwitch\\s*\\(\\s*['\"]ppapi-flash-path['\"\
        ]\\s*,[\\s\\S]*?\\)\\s*;\"\"\",\n    r\"\"\"[A-Za-z0-9_$.\\[\\]]+\\.appendSwitch\\\
        s*\\(\\s*['\"]ppapi-flash-version['\"]\\s*,[\\s\\S]*?\\)\\s*;\"\"\",\n]:\n\
        \    text = re.sub(pattern, \"\", text, flags=re.I)\n\ntext = re.sub(\n  \
        \  r\"(\\bconst\\s+flashPath\\s*=\\s*)findFlashPath\\s*\\(\\s*\\)\\s*;\",\n\
        \    r\"\\1null;\",\n    text,\n    count=1,\n)\n\ntext = re.sub(\n    r\"\
        (?m)^[ \\t]*_deployFlashMmsCfg\\s*\\([^;]*\\)\\s*;[^\\n]*\\n?\",\n    \"\"\
        ,\n    text,\n)\n\nanchor = text.find(\"Default.aspx\")\nif anchor < 0:\n\
        \    raise SystemExit(\"ERROR: Default.aspx anchor not found.\")\n\nstart\
        \ = text.rfind(\"new BrowserWindow\", 0, anchor)\nif start < 0:\n    raise\
        \ SystemExit(\"ERROR: game BrowserWindow not found.\")\n\nbrace = text.find(\"\
        {\", start)\nif brace < 0:\n    raise SystemExit(\"ERROR: BrowserWindow options\
        \ not found.\")\n\ndepth = 0\nquote = None\nescape = False\nend = -1\n\nfor\
        \ i in range(brace, len(text)):\n    c = text[i]\n\n    if quote:\n      \
        \  if escape:\n            escape = False\n        elif c == \"\\\\\":\n \
        \           escape = True\n        elif c == quote:\n            quote = None\n\
        \        continue\n\n    if c in (\"'\", '\"') or c == chr(96):\n        quote\
        \ = c\n        continue\n\n    if c == \"{\":\n        depth += 1\n    elif\
        \ c == \"}\":\n        depth -= 1\n        if depth == 0:\n            end\
        \ = i + 1\n            break\n\nif end < 0:\n    raise SystemExit(\"ERROR:\
        \ BrowserWindow object not balanced.\")\n\nwindow = text[start:end]\n\nif\
        \ re.search(r\"\\bsandbox\\s*:\\s*true\", window):\n    window = re.sub(\n\
        \        r\"(\\bsandbox\\s*:\\s*)true\",\n        r\"\\1false\",\n       \
        \ window,\n        count=1,\n    )\nelif not re.search(r\"\\bsandbox\\s*:\"\
        , window):\n    window, count = re.subn(\n        r\"(webPreferences\\s*:\\\
        s*\\{)\",\n        r\"\\1\\n        sandbox: false,\",\n        window,\n\
        \        count=1,\n    )\n    if count != 1:\n        raise SystemExit(\"\
        ERROR: webPreferences not found.\")\n\nwindow = re.sub(\n    r\"(\\bplugins\\\
        s*:\\s*)false\",\n    r\"\\1true\",\n    window,\n    count=1,\n)\n\npreload_patterns\
        \ = [\n    re.compile(\n        r\"\"\"preload\\s*:\\s*app\\.isPackaged\\\
        s*\\?\\s*path\\.join\\([\\s\\S]*?\\)\\s*:\\s*path\\.join\\([\\s\\S]*?\\)\\\
        s*,?\"\"\",\n        re.I,\n    ),\n    re.compile(\n        r\"\"\"preload\\\
        s*:\\s*path\\.join\\([\\s\\S]*?\\)\\s*,?\"\"\",\n        re.I,\n    ),\n]\n\
        \nreplacement = \"\"\"preload: path.join(\n        process.resourcesPath,\n\
        \        'preload-ruffle.js'\n      ),\"\"\"\n\nreplaced = False\nfor pattern\
        \ in preload_patterns:\n    window, count = pattern.subn(replacement, window,\
        \ count=1)\n    if count == 1:\n        replaced = True\n        break\n\n\
        if not replaced:\n    raise SystemExit(\"ERROR: game preload expression not\
        \ found.\")\n\npath.write_text(\n    text[:start] + window + text[end:],\n\
        \    encoding=\"utf-8\",\n)\nPY\n\npython3 build/patch_main.py \"$MAIN\"\n\
        node --check \"$MAIN\""
    - name: Repack app.asar
      shell: bash
      run: 'set -euo pipefail


        APP="$(cat build/original-app.txt)"

        ASAR="$APP/Contents/Resources/app.asar"


        rm -f "$ASAR"

        asar pack build/source "$ASAR"

        test -f "$ASAR"'
    - name: Download Electron ARM64
      shell: bash
      run: "set -euo pipefail\n\nURL=\"https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip\"\
        \n\ncurl --fail --location --retry 10 --retry-delay 5 \\\n  --connect-timeout\
        \ 30 --max-time 1800 -A \"Mozilla/5.0\" \\\n  \"$URL\" -o build/electron-arm64.zip\n\
        \nmkdir -p build/electron\nunzip -q -o build/electron-arm64.zip -d build/electron\n\
        \nELECTRON_APP=\"$(\n  find build/electron -type d -name \"Electron.app\"\
        \ -print | head -n 1\n)\"\n\n[ -n \"$ELECTRON_APP\" ] || { echo \"ERROR: Electron.app\
        \ not found.\"; exit 1; }\n\nprintf '%s\\n' \"$ELECTRON_APP\" > build/electron-app.txt\n\
        \nfile \"$ELECTRON_APP/Contents/MacOS/Electron\"\nlipo -info \"$ELECTRON_APP/Contents/MacOS/Electron\""
    - name: Assemble ARM64 app
      shell: bash
      run: 'set -euo pipefail


        ORIGINAL="$(cat build/original-app.txt)"

        ELECTRON_APP="$(cat build/electron-app.txt)"

        FINAL="build/Gunny PC ARM64.app"


        rm -rf "$FINAL"

        cp -R "$ELECTRON_APP" "$FINAL"


        SRC="$ORIGINAL/Contents/Resources"

        DST="$FINAL/Contents/Resources"


        rsync -a --exclude="app.asar" "$SRC/" "$DST/"

        cp "$SRC/app.asar" "$DST/app.asar"


        test -f "$DST/app.asar"'
    - name: Install Ruffle and create preload
      shell: bash
      run: "        set -euo pipefail\n\n        APP=\"build/Gunny PC ARM64.app\"\n\
        \        RES=\"$APP/Contents/Resources\"\n        RUFFLE_ROOT=\"$(cat build/ruffle-root.txt)\"\
        \n        PRELOAD_REL=\"$(cat build/preload-relative.txt)\"\n\n        rm\
        \ -rf \"$RES/ruffle\"\n        mkdir -p \"$RES/ruffle\"\n\n        cp -R \"\
        $RUFFLE_ROOT\"/. \"$RES/ruffle/\"\n        cp build/bridge/gunny-host.js \"\
        $RES/gunny-host.js\"\n\n        test -f \"$RES/ruffle/ruffle.js\"\n      \
        \  node --check \"$RES/gunny-host.js\"\n\n        cat > \"$RES/preload-ruffle.js\"\
        \ <<EOF\n'use strict';\n\nconst fs = require('fs');\nconst path = require('path');\n\
        const { webFrame } = require('electron');\n\nconst resources = process.resourcesPath;\n\
        const ruffleFile = path.join(resources, 'ruffle', 'ruffle.js');\nconst bridgeFile\
        \ = path.join(resources, 'gunny-host.js');\nconst originalPreload = path.join(\n\
        \  resources,\n  'app.asar',\n  '$PRELOAD_REL'\n);\n\nif (!fs.existsSync(ruffleFile))\
        \ {\n  throw new Error('Ruffle runtime missing: ' + ruffleFile);\n}\n\nif\
        \ (!fs.existsSync(bridgeFile)) {\n  throw new Error('Gunny host bridge missing:\
        \ ' + bridgeFile);\n}\n\nconst ruffleSource = fs.readFileSync(ruffleFile,\
        \ 'utf8');\nconst bridgeSource = fs.readFileSync(bridgeFile, 'utf8');\n\n\
        const publicPath =\n  'file://' +\n  path.join(resources, 'ruffle').replace(/\\\
        \\\\\\/g, '/') +\n  '/';\n\nconst code = [\n  '(function(){',\n  'try {',\n\
        \  'window.RufflePlayer = window.RufflePlayer || {};',\n  'window.RufflePlayer.config\
        \ = window.RufflePlayer.config || {};',\n  'window.RufflePlayer.config.publicPath\
        \ = ' + JSON.stringify(publicPath) + ';',\n  'window.RufflePlayer.config.allowNetworking\
        \ = \"all\";',\n  'window.RufflePlayer.config.allowScriptAccess = \"always\"\
        ;',\n  'window.RufflePlayer.config.polyfills = true;',\n  ruffleSource,\n\
        \  'const r = window.RufflePlayer.newest();',\n  'if (r && typeof r.pluginPolyfill\
        \ === \"function\") r.pluginPolyfill();',\n  'if (r && typeof r.polyfill ===\
        \ \"function\") r.polyfill();',\n  bridgeSource,\n  'console.log(\"[Gunny\
        \ ARM64] Ruffle + host bridge ready\");',\n  '} catch (e) {',\n  'console.error(\"\
        [Gunny ARM64] bootstrap failed:\", e);',\n  '}',\n  '})();'\n].join('\\\\\
        n');\n\nwebFrame.executeJavaScript(code, false).catch((error) => {\n  console.error('[Gunny\
        \ ARM64] bootstrap failed:', error);\n});\n\ntry {\n  require(originalPreload);\n\
        \  console.log('[Gunny ARM64] original Gunny preload loaded');\n} catch (error)\
        \ {\n  console.error('[Gunny ARM64] original preload failed:', error);\n}\n\
        EOF\n\n        node --check \"$RES/preload-ruffle.js\""
    - name: Rename Electron and verify
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\nBIN=\"$APP/Contents/MacOS\"\
        \nRES=\"$APP/Contents/Resources\"\n\nmv \"$BIN/Electron\" \"$BIN/Gunny PC\"\
        \nchmod +x \"$BIN/Gunny PC\"\n\n/usr/libexec/PlistBuddy \\\n  -c \"Set :CFBundleExecutable\
        \ Gunny PC\" \\\n  \"$APP/Contents/Info.plist\" \\\n  2>/dev/null || true\n\
        \necho \"=== ARM64 ===\"\nfile \"$BIN/Gunny PC\"\nlipo -info \"$BIN/Gunny\
        \ PC\"\n\nfile \"$BIN/Gunny PC\" | grep -q \"arm64\"\n\necho \"=== Ruffle\
        \ ===\"\ntest -f \"$RES/ruffle/ruffle.js\"\n\necho \"=== Host bridge ===\"\
        \ntest -f \"$RES/gunny-host.js\"\nnode --check \"$RES/gunny-host.js\"\n\n\
        echo \"=== Preload ===\"\ntest -f \"$RES/preload-ruffle.js\"\nnode --check\
        \ \"$RES/preload-ruffle.js\"\n\necho \"=== app.asar ===\"\nrm -rf build/final-source\n\
        asar extract \"$RES/app.asar\" build/final-source\n\nFINAL_MAIN=\"$(\n  find\
        \ build/final-source -type f -name \"main.js\" -print | head -n 1\n)\"\n\n\
        node --check \"$FINAL_MAIN\"\n\necho \"=== PPAPI references ===\"\ngrep -RniE\
        \ \\\n  \"ppapi-flash-path|ppapi-flash-version\" \\\n  build/final-source\
        \ \\\n  2>/dev/null \\\n  | head -100 || true"
    - name: Sign and package
      shell: bash
      run: "set -euo pipefail\n\nAPP=\"build/Gunny PC ARM64.app\"\n\nxattr -cr \"\
        $APP\" 2>/dev/null || true\nrm -rf \"$APP/Contents/_CodeSignature\"\n\ncodesign\
        \ --deep --force --verbose --sign - \"$APP\"\n\ncodesign \\\n  --verify \\\
        \n  --deep \\\n  --strict \\\n  --verbose=2 \\\n  \"$APP\"\n\nmkdir -p release\n\
        \nditto \\\n  -c \\\n  -k \\\n  --sequesterRsrc \\\n  --keepParent \\\n  \"\
        $APP\" \\\n  release/Gunny-PC-ARM64-Ruffle-HostBridge.zip\n\nls -lh release/Gunny-PC-ARM64-Ruffle-HostBridge.zip"
    - name: Upload ARM64 build
      uses: actions/upload-artifact@v4
      with:
        name: Gunny-PC-ARM64-Ruffle-HostBridge
        path: release/Gunny-PC-ARM64-Ruffle-HostBridge.zip
        if-no-files-found: error
        retention-days: 14
