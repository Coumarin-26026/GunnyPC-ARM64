name: Deep Analyze Gunny Loading.swf
'on':
  workflow_dispatch:
    inputs:
      loading_swf_url:
        description: Optional public/direct URL to Loading.swf. Leave empty when Loading.swf
          is committed at ./Loading.swf.
        required: false
        default: https://res737.gn.zing.vn/flash/Loading.swf
permissions:
  contents: read
jobs:
  analyze-loading-swf:
    name: Decompile Loading.swf and map Flash bridge
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Java and FFDec
      shell: bash
      run: "set -euo pipefail\n\nbrew install --quiet openjdk@21 || true\n\nJAVA_HOME=\"\
        $(\n  /usr/libexec/java_home \\\n    -v 21 \\\n    2>/dev/null \\\n    ||\
        \ true\n)\"\n\nif [ -z \"$JAVA_HOME\" ]; then\n  echo \"ERROR: Java 21 not\
        \ found.\"\n  exit 1\nfi\n\necho \"JAVA_HOME=$JAVA_HOME\" >> \"$GITHUB_ENV\"\
        \nexport JAVA_HOME\n\n\"$JAVA_HOME/bin/java\" -version\n\nFFDEC_VERSION=\"\
        26.2.1\"\nFFDEC_URL=\"https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version${FFDEC_VERSION}/ffdec_${FFDEC_VERSION}.zip\"\
        \n\nmkdir -p tools\n\ncurl \\\n  --fail \\\n  --location \\\n  --retry 10\
        \ \\\n  --retry-delay 3 \\\n  --connect-timeout 30 \\\n  --max-time 600 \\\
        \n  -A \"Mozilla/5.0\" \\\n  \"$FFDEC_URL\" \\\n  -o tools/ffdec.zip\n\nmkdir\
        \ -p tools/ffdec\n\nunzip \\\n  -q \\\n  -o \\\n  tools/ffdec.zip \\\n  -d\
        \ tools/ffdec\n\nFFDEC_JAR=\"$(\n  find tools/ffdec \\\n    -type f \\\n \
        \   -name \"ffdec.jar\" \\\n    -print \\\n    | head -n 1\n)\"\n\nif [ -z\
        \ \"$FFDEC_JAR\" ]; then\n  echo \"ERROR: ffdec.jar not found.\"\n  exit 1\n\
        fi\n\nprintf '%s\\n' \"$FFDEC_JAR\" > tools/ffdec-jar.txt"
    - name: Prepare Loading.swf
      shell: bash
      run: "\nset -euo pipefail\n\nrm -rf analysis\n\nmkdir -p \\\n  analysis/input\
        \ \\\n  analysis/export \\\n  analysis/reports \\\n  analysis/strings \\\n\
        \  analysis/as3\n\nSOURCE=\"\"\n\nfor CANDIDATE in \\\n  \"$GITHUB_WORKSPACE/Loading.swf\"\
        \ \\\n  \"$GITHUB_WORKSPACE/assets/Loading.swf\" \\\n  \"$GITHUB_WORKSPACE/analysis/input/Loading.swf\"\
        \ndo\n  if [ -f \"$CANDIDATE\" ]; then\n    SOURCE=\"$CANDIDATE\"\n    break\n\
        \  fi\ndone\n\nif [ -z \"$SOURCE\" ] && [ -n \"${LOADING_SWF_URL:-}\" ]; then\n\
        \  echo \"Downloading Loading.swf:\"\n  echo \"$LOADING_SWF_URL\"\n\n  curl\
        \ \\\n    --fail \\\n    --location \\\n    --retry 8 \\\n    --retry-delay\
        \ 3 \\\n    --connect-timeout 30 \\\n    --max-time 900 \\\n    -A \"Mozilla/5.0\"\
        \ \\\n    \"$LOADING_SWF_URL\" \\\n    -o analysis/input/Loading.swf\nfi\n\
        \nif [ -n \"$SOURCE\" ] && [ \"$SOURCE\" != \"analysis/input/Loading.swf\"\
        \ ]; then\n  cp \"$SOURCE\" analysis/input/Loading.swf\nfi\n\nif [ ! -f analysis/input/Loading.swf\
        \ ]; then\n  echo\n  echo \"ERROR: Loading.swf could not be obtained.\"\n\
        \  echo \"Commit Loading.swf to the repository or provide loading_swf_url.\"\
        \n  exit 1\nfi\n\nFILETYPE=\"$(file analysis/input/Loading.swf)\"\nSIZE=\"\
        $(stat -f \"%z\" analysis/input/Loading.swf)\"\n\nif [ \"$SIZE\" -le 0 ];\
        \ then\n  echo \"ERROR: Loading.swf is empty.\"\n  exit 1\nfi\n\necho\necho\
        \ \"Loading.swf:\"\necho \"  size: $SIZE bytes\"\necho \"  type: $FILETYPE\"\
        \n\nHEADER=\"$(xxd -l 3 -p analysis/input/Loading.swf)\"\n\ncase \"$HEADER\"\
        \ in\n  465753)\n    echo \"FWS header detected.\"\n    ;;\n  435753)\n  \
        \  echo \"CWS header detected.\"\n    ;;\n  5a5753)\n    echo \"ZWS header\
        \ detected.\"\n    ;;\n  *)\n    echo \"ERROR: Not a recognized SWF header.\"\
        \n    echo \"Header: $HEADER\"\n    exit 1\n    ;;\nesac\n\necho\necho \"\
        SHA256:\"\nshasum -a 256 analysis/input/Loading.swf\n\nls -lh analysis/input/Loading.swf\n"
      env:
        LOADING_SWF_URL: ${{ inputs.loading_swf_url }}
    - name: Decompile Loading.swf
      shell: bash
      run: "set -euo pipefail\n\nFFDEC_JAR=\"$(cat tools/ffdec-jar.txt)\"\n\njava\
        \ \\\n  -jar \\\n  \"$FFDEC_JAR\" \\\n  -export \\\n  script \\\n  analysis/export\
        \ \\\n  analysis/input/Loading.swf\n\nfind analysis/export \\\n  -type f \\\
        \n  -print \\\n  | sort \\\n  | head -5000"
    - name: Inventory classes and methods
      shell: bash
      run: "set -euo pipefail\n\npython3 <<'PY'\nfrom pathlib import Path\nimport\
        \ re\nimport json\n\nroot = Path(\"analysis/export\")\n\npatterns = {\n  \
        \  \"ExternalInterface\": r\"\\bExternalInterface\\b\",\n    \"addCallback\"\
        : r\"\\baddCallback\\b\",\n    \"URLLoader\": r\"\\bURLLoader\\b\",\n    \"\
        URLRequest\": r\"\\bURLRequest\\b\",\n    \"URLVariables\": r\"\\bURLVariables\\\
        b\",\n    \"SharedObject\": r\"\\bSharedObject\\b\",\n    \"LocalConnection\"\
        : r\"\\bLocalConnection\\b\",\n    \"LoadInterfaceManager\": r\"\\bLoadInterfaceManager\\\
        b\",\n    \"LoadResourceManager\": r\"\\bLoadResourceManager\\b\",\n    \"\
        LoaderManager\": r\"\\bLoaderManager\\b\",\n    \"VersionUpdateManager\":\
        \ r\"\\bVersionUpdateManager\\b\",\n    \"setFlashLoadExternal\": r\"\\bsetFlashLoadExternal\\\
        b\",\n    \"setFlashLoadWeb\": r\"\\bsetFlashLoadWeb\\b\",\n    \"flashGotoAndPlay\"\
        : r\"\\bflashGotoAndPlay\\b\",\n    \"createLogin\": r\"\\bcreateLogin\\b\"\
        ,\n    \"loadConfig\": r\"\\bloadConfig\\b\",\n    \"LoginSelectList\": r\"\
        \\bLoginSelectList\\b\",\n    \"startGameLoad\": r\"\\bstartGameLoad\\b\"\
        ,\n    \"onLoadGameComplete\": r\"\\bonLoadGameComplete\\b\",\n    \"onLunchGame\"\
        : r\"\\bonLunchGame\\b\",\n}\n\nresult = {}\n\nfor name, pattern in patterns.items():\n\
        \    hits = []\n\n    for file in root.rglob(\"*\"):\n        if not file.is_file():\n\
        \            continue\n\n        try:\n            text = file.read_text(\n\
        \                encoding=\"utf-8\",\n                errors=\"ignore\"\n\
        \            )\n        except Exception:\n            continue\n\n      \
        \  for line_no, line in enumerate(\n            text.splitlines(),\n     \
        \       1\n        ):\n            if re.search(\n                pattern,\n\
        \                line,\n                flags=re.IGNORECASE\n            ):\n\
        \                hits.append(\n                    {\n                   \
        \     \"file\": str(file),\n                        \"line\": line_no,\n \
        \                       \"text\": line.strip()\n                    }\n  \
        \              )\n\n    result[name] = hits[:2000]\n\nPath(\n    \"analysis/reports/class-method-inventory.json\"\
        \n).write_text(\n    json.dumps(\n        result,\n        indent=2,\n   \
        \     ensure_ascii=False\n    ),\n    encoding=\"utf-8\"\n)\n\nprint(\n  \
        \  json.dumps(\n        result,\n        indent=2,\n        ensure_ascii=False\n\
        \    )[:50000]\n)\nPY"
    - name: Extract ExternalInterface bridge
      shell: bash
      run: "set -euo pipefail\n\n{\n  echo \"=== ExternalInterface / callbacks ===\"\
        \n\n  grep -RniE \\\n    \"ExternalInterface|addCallback|ExternalInterface\\\
        .call|ExternalInterface\\.available\" \\\n    analysis/export \\\n    2>/dev/null\
        \ \\\n    | head -15000 \\\n    || true\n\n  echo\n  echo \"=== Gunny bridge\
        \ names ===\"\n\n  grep -RniE \\\n    \"setFlashFocus|setFlashLoadExternal|setFlashLoadWeb|SetFlashLoadExternal|SetFlashLoadWeb|flashGotoAndPlay|__flashGotoAndPlay|__flashGotoAndPlayHandler\"\
        \ \\\n    analysis/export \\\n    2>/dev/null \\\n    | head -15000 \\\n \
        \   || true\n\n  echo\n  echo \"=== Login/config bridge ===\"\n\n  grep -RniE\
        \ \\\n    \"createLogin|loadConfig|loginDevice|checkLoginType|__loginComplte|__onConfigLoadComplete|__onErrorHandle|LoginSelectList|__onloadSelectListComplete|__onloadSelectListError\"\
        \ \\\n    analysis/export \\\n    2>/dev/null \\\n    | head -15000 \\\n \
        \   || true\n\n} > analysis/reports/externalinterface-map.txt\n\ncat analysis/reports/externalinterface-map.txt"
    - name: Extract network and loader behavior
      shell: bash
      run: "set -euo pipefail\n\n{\n  echo \"=== URL/network APIs ===\"\n\n  grep\
        \ -RniE \\\n    \"URLLoader|URLRequest|URLVariables|sendToURL|navigateToURL|load\\\
        (\" \\\n    analysis/export \\\n    2>/dev/null \\\n    | head -15000 \\\n\
        \    || true\n\n  echo\n  echo \"=== endpoints/resources ===\"\n\n  grep -RniE\
        \ \\\n    \"LoginSelectList\\.ashx|config14\\.xml|config\\.xml|RESOURCE_SITE|FLASHSITE|BACKUP_FLASHSITE|\\\
        .swf|\\\\.xml\" \\\n    analysis/export \\\n    2>/dev/null \\\n    | head\
        \ -15000 \\\n    || true\n\n  echo\n  echo \"=== resource loader classes ===\"\
        \n\n  grep -RniE \\\n    \"LoadResourceManager|LoadInterfaceManager|LoaderManager|BaseLoader|QueueLoader|CodeLoader|CodeModuleLoader|ModuleLoader|DisplayLoader|MornUIDataLoader|VersionUpdateManager\"\
        \ \\\n    analysis/export \\\n    2>/dev/null \\\n    | head -15000 \\\n \
        \   || true\n\n} > analysis/reports/network-loader-map.txt\n\ncat analysis/reports/network-loader-map.txt"
    - name: Extract FlashVars and loaderInfo
      shell: bash
      run: "set -euo pipefail\n\n{\n  echo \"=== loaderInfo / parameters ===\"\n\n\
        \  grep -RniE \\\n    \"loaderInfo|parameters|FlashVars|flashvars|_configURL|configURL|loginDevice|user|key|isGuest|desktopType|server|sid|svid\"\
        \ \\\n    analysis/export \\\n    2>/dev/null \\\n    | head -15000 \\\n \
        \   || true\n\n  echo\n  echo \"=== game transition ===\"\n\n  grep -RniE\
        \ \\\n    \"startLoadFromLoadingUrl|getMainLoadingLoader|getGameLoader|startGameLoad|__onLoadGameComplete|__onLunchGame|lunchGame\"\
        \ \\\n    analysis/export \\\n    2>/dev/null \\\n    | head -15000 \\\n \
        \   || true\n\n} > analysis/reports/flashvars-and-transition-map.txt\n\ncat\
        \ analysis/reports/flashvars-and-transition-map.txt"
    - name: Extract relevant ActionScript source
      shell: bash
      run: "set -euo pipefail\n\nfind analysis/export \\\n  -type f \\\n  \\( \\\n\
        \    -name \"*.as\" \\\n    -o \\\n    -name \"*.pcode\" \\\n    -o \\\n \
        \   -name \"*.xml\" \\\n  \\) \\\n  -print \\\n  | sort \\\n  > analysis/as3/source-files.txt\n\
        \nwhile IFS= read -r FILE; do\n  [ -z \"$FILE\" ] && continue\n\n  if grep\
        \ -qiE \\\n    \"ExternalInterface|URLLoader|URLRequest|setFlash|flashGoto|createLogin|loadConfig|LoginSelectList|startGameLoad|onLoadGameComplete|onLunchGame|LoadInterfaceManager|LoadResourceManager|VersionUpdateManager\"\
        \ \\\n    \"$FILE\" \\\n    2>/dev/null\n  then\n\n    NAME=\"$(\n      basename\
        \ \"$FILE\" |\n        tr '/ ' '__'\n    )\"\n\n    cp \\\n      \"$FILE\"\
        \ \\\n      \"analysis/as3/$NAME\"\n\n    echo \"$FILE\"\n  fi\ndone < analysis/as3/source-files.txt\
        \ \\\n  > analysis/reports/relevant-as3-files.txt\n\necho \"Relevant AS3:\"\
        \ncat analysis/reports/relevant-as3-files.txt"
    - name: Extract SWF strings
      shell: bash
      run: "set -euo pipefail\n\nstrings \\\n  -a \\\n  -n 4 \\\n  analysis/input/Loading.swf\
        \ \\\n  > analysis/strings/all.txt\n\ngrep -iE \\\n  \"ExternalInterface|setFlashFocus|setFlashLoadExternal|setFlashLoadWeb|flashGotoAndPlay|createLogin|loadConfig|LoginSelectList|config14|startGameLoad|__onLoadGameComplete|__onLunchGame|URLLoader|URLRequest|FlashVars|SharedObject|LocalConnection|http|https|\\\
        .swf|\\.xml\" \\\n  analysis/strings/all.txt \\\n  | sort -u \\\n  > analysis/reports/flash-strings.txt\
        \ \\\n  || true\n\ncat analysis/reports/flash-strings.txt"
    - name: Build bridge specification
      shell: bash
      run: "set -euo pipefail\n\n{\n  echo \"# Gunny Loading.swf Bridge Specification\"\
        \n  echo\n  echo \"## ExternalInterface\"\n  cat analysis/reports/externalinterface-map.txt\
        \ || true\n  echo\n  echo \"## Network and loader\"\n  cat analysis/reports/network-loader-map.txt\
        \ || true\n  echo\n  echo \"## FlashVars and game transition\"\n  cat analysis/reports/flashvars-and-transition-map.txt\
        \ || true\n  echo\n  echo \"## Relevant AS3 files\"\n  cat analysis/reports/relevant-as3-files.txt\
        \ || true\n  echo\n  echo \"## Strings\"\n  cat analysis/reports/flash-strings.txt\
        \ || true\n  echo\n  echo \"## Class inventory\"\n  cat analysis/reports/class-method-inventory.json\
        \ || true\n} > analysis/reports/GUNNY-LOADING-SWF-BRIDGE-SPEC.md\n\ncat analysis/reports/GUNNY-LOADING-SWF-BRIDGE-SPEC.md"
    - name: Package result
      shell: bash
      run: "set -euo pipefail\n\nmkdir -p analysis/package\n\ncp -R analysis/reports\
        \ analysis/package/\ncp -R analysis/as3 analysis/package/\ncp -R analysis/strings\
        \ analysis/package/\n\ncp \\\n  analysis/input/Loading.swf \\\n  analysis/package/\n\
        \n(\n  cd analysis/package\n\n  zip \\\n    -qr \\\n    ../../gunny-loading-swf-deep-analysis.zip\
        \ \\\n    .\n)\n\nls -lh gunny-loading-swf-deep-analysis.zip"
    - name: Upload analysis
      uses: actions/upload-artifact@v4
      with:
        name: Gunny-Loading-SWF-Deep-Analysis
        path: gunny-loading-swf-deep-analysis.zip
        if-no-files-found: error
        retention-days: 14
