name: Build Gunny ARM64 + Original Pepper Flash

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_VERSION: "43.2.0"
  GUNNY_URL: "https://drive.usercontent.google.com/download?id=1eSeWTP8rvlvrnMyjyNtbBYFVWl_d0xdQ&export=download&confirm=t&uuid=054c88aa-b0e6-46f4-b363-1aae1fcffb2b"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @electron/asar

          node --version
          asar --version
          gh --version

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build release

          mkdir -p build
          mkdir -p release

      - name: Download original Gunny Intel
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$GUNNY_URL" \
            -o build/gunny-intel.zip

          file build/gunny-intel.zip
          ls -lh build/gunny-intel.zip

      - name: Extract original Gunny
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/original

          unzip \
            -q \
            -o \
            build/gunny-intel.zip \
            -d build/original

          rm -rf build/original/__MACOSX

          APP="$(
            find build/original \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: Gunny .app not found."
            exit 1
          fi

          printf '%s\n' "$APP" > build/original-app.txt

          cat build/original-app.txt

      - name: Inspect original Intel app and Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          PEPPER="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer"

          echo "Main:"
          file "$MAIN"
          lipo -info "$MAIN"

          echo
          echo "Pepper Flash:"
          file "$PEPPER"
          lipo -info "$PEPPER" || true

          if ! file "$MAIN" | grep -q "x86_64"; then
            echo "ERROR: input is not x86_64 Gunny."
            exit 1
          fi

          if [ ! -f "$PEPPER" ]; then
            echo "ERROR: PepperFlashPlayer.plugin missing."
            exit 1
          fi

      - name: Extract Gunny app.asar
        shell: bash
        run: |
          set -euo pipefail

          APP="$(cat build/original-app.txt)"

          rm -rf build/source

          asar extract \
            "$APP/Contents/Resources/app.asar" \
            build/source

          MAIN="$(
            find build/source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.js not found."
            exit 1
          fi

          printf '%s\n' "$MAIN" > build/main-path.txt

          node \
            --check \
            "$MAIN"

      - name: Inspect original Flash configuration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$(cat build/main-path.txt)"

          echo "Flash configuration:"
          grep -niE \
            "findFlashPath|ppapi-flash-path|ppapi-flash-version|PepperFlashPlayer" \
            "$MAIN" \
            | head -300 \
            || true

      - name: Download Electron ARM64
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-arm64.zip"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o build/electron-arm64.zip

          mkdir -p build/electron

          unzip \
            -q \
            -o \
            build/electron-arm64.zip \
            -d build/electron

          ELECTRON_APP="$(
            find build/electron \
              -type d \
              -name "Electron.app" \
              -print \
              | head -n 1
          )"

          if [ -z "$ELECTRON_APP" ]; then
            echo "ERROR: Electron.app not found."
            exit 1
          fi

          printf '%s\n' "$ELECTRON_APP" > build/electron-app.txt

          BIN="$ELECTRON_APP/Contents/MacOS/Electron"

          file "$BIN"
          lipo -info "$BIN"

          if ! file "$BIN" | grep -q "arm64"; then
            echo "ERROR: Electron is not ARM64."
            exit 1
          fi

      - name: Assemble ARM64 app and KEEP Intel Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL="$(cat build/original-app.txt)"
          ELECTRON_APP="$(cat build/electron-app.txt)"

          FINAL="build/Gunny PC ARM64.app"

          rm -rf "$FINAL"

          cp -R \
            "$ELECTRON_APP" \
            "$FINAL"

          SRC="$ORIGINAL/Contents/Resources"
          DST="$FINAL/Contents/Resources"

          rsync \
            -a \
            --exclude="app.asar" \
            --exclude="plugins" \
            "$SRC/" \
            "$DST/"

          cp \
            "$SRC/app.asar" \
            "$DST/app.asar"

          mkdir -p \
            "$DST/plugins"

          cp -R \
            "$SRC/plugins/PepperFlashPlayer.plugin" \
            "$DST/plugins/PepperFlashPlayer.plugin"

          echo "Original Intel Pepper Flash copied."

      - name: Rename Electron and update Info.plist
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS"
          PLIST="$APP/Contents/Info.plist"

          mv \
            "$BIN/Electron" \
            "$BIN/Gunny PC"

          chmod +x \
            "$BIN/Gunny PC"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable Gunny PC" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Gunny PC" \
            "$PLIST" \
            2>/dev/null \
            || true

      - name: Verify final ARM64 main + Intel Pepper Flash
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          PEPPER="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer"

          echo "=========================================="
          echo "FINAL MAIN"
          echo "=========================================="

          file "$MAIN"

          echo
          lipo -info "$MAIN"

          if ! file "$MAIN" | grep -q "arm64"; then
            echo "ERROR: final main is not ARM64."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "PEPPER FLASH"
          echo "=========================================="

          file "$PEPPER"

          echo
          lipo -info "$PEPPER" || true

          if ! file "$PEPPER" | grep -Eq "x86_64|i386"; then
            echo "ERROR: expected Intel Pepper Flash."
            exit 1
          fi

          echo
          echo "ARM64 main + Intel Pepper Flash: READY"

      - name: Verify original PPAPI switches are still present
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          rm -rf build/final-source

          asar extract \
            "$APP/Contents/Resources/app.asar" \
            build/final-source

          MAIN="$(
            find build/final-source \
              -type f \
              -name "main.js" \
              -print \
              | head -n 1
          )"

          node \
            --check \
            "$MAIN"

          echo "PPAPI configuration in final app:"
          grep -niE \
            "findFlashPath|ppapi-flash-path|ppapi-flash-version|PepperFlashPlayer" \
            "$MAIN" \
            | head -300 \
            || true

      - name: Remove quarantine
        shell: bash
        run: |
          set -euo pipefail

          xattr -cr \
            "build/Gunny PC ARM64.app" \
            || true

      - name: Ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          codesign \
            --deep \
            --force \
            --verbose \
            --sign - \
            "$APP"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

      - name: Runtime diagnostic
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          BIN="$APP/Contents/MacOS/Gunny PC"

          LOG="release/runtime-diagnostic.log"

          rm -f "$LOG"

          "$BIN" \
            --enable-logging=stderr \
            --v=1 \
            > "$LOG" \
            2>&1 &

          PID=$!

          sleep 15

          kill "$PID" \
            2>/dev/null \
            || true

          echo "=========================================="
          echo "PLUGIN / PPAPI / FLASH LOG"
          echo "=========================================="

          grep -niE \
            "pepper|ppapi|plugin|flash|x86_64|arm64|load" \
            "$LOG" \
            | head -500 \
            || true

          echo
          echo "=========================================="
          echo "PRELOAD / JS ERRORS"
          echo "=========================================="

          grep -niE \
            "preload|SyntaxError|ReferenceError|TypeError|module not found" \
            "$LOG" \
            | head -300 \
            || true

          echo
          echo "Full log:"
          echo "$LOG"

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "build/Gunny PC ARM64.app" \
            "release/Gunny-PC-ARM64-with-Intel-PepperFlash.zip"

          ls -lh \
            "release/Gunny-PC-ARM64-with-Intel-PepperFlash.zip"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/dmg

          mkdir -p build/dmg

          cp -R \
            "build/Gunny PC ARM64.app" \
            build/dmg/

          hdiutil create \
            -volname "Gunny PC ARM64 Intel Pepper Flash Test" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "release/Gunny-PC-ARM64-with-Intel-PepperFlash.dmg"

          ls -lh \
            "release/Gunny-PC-ARM64-with-Intel-PepperFlash.dmg"

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Gunny PC ARM64.app"

          MAIN="$APP/Contents/MacOS/Gunny PC"

          PEPPER="$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin/Contents/MacOS/PepperFlashPlayer"

          {
            echo "Gunny ARM64 + original Intel Pepper Flash"
            echo
            echo "Electron: $ELECTRON_VERSION"
            echo
            echo "Main:"
            file "$MAIN"
            lipo -info "$MAIN"
            echo
            echo "Pepper Flash:"
            file "$PEPPER"
            lipo -info "$PEPPER" || true
            echo
            echo "Plugin path:"
            echo "$APP/Contents/Resources/plugins/PepperFlashPlayer.plugin"
            echo
            echo "This is a diagnostic build."
            echo "The Intel Pepper Flash is intentionally preserved."
          } > release/build-report.txt

          cat release/build-report.txt

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-with-Intel-PepperFlash-ZIP
          path: release/Gunny-PC-ARM64-with-Intel-PepperFlash.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-with-Intel-PepperFlash-DMG
          path: release/Gunny-PC-ARM64-with-Intel-PepperFlash.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload runtime log
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Intel-PepperFlash-Runtime
          path: release/runtime-diagnostic.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Gunny-PC-ARM64-Intel-PepperFlash-Report
          path: release/build-report.txt
          if-no-files-found: error
          retention-days: 14
